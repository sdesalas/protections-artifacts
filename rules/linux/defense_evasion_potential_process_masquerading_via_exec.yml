id: e6669bc3-cb75-4fb3-91e0-ddaa06dd59b2_1.0.23
type: security-rule
attributes:
  description: |
    This rule detects process masquerading through the use of the `exec` command. The `exec` command can be used in
    conjunction with the `-a` flag to change the name of the process in the process table. This technique is used by malware
    to hide the true identity of a process from security tools and analysts.
  rule_id: e6669bc3-cb75-4fb3-91e0-ddaa06dd59b2
  license: Elastic License v2
  name: Potential Process Masquerading via Exec
  os_list:
    - linux
  version: "1.0.23"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.parent.executable != null and\nprocess.name in (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\") and\nprocess.args == \"-c\" and process.command_line : \"* exec -a *\" and not (\n  process.executable like (\"/nix/store/*\", \"/tmp/newroot/*\") or\n  process.parent.executable in (\n    \"/opt/warpdotdev/warp-terminal/warp\", \"/opt/sp/serverpilot/stats/bin/sp-stats\", \"/bin/bcompare\", \"/bin/su\",\n    \"/usr/NX/bin/nxnode.bin\", \"/usr/bin/gnome-shell\", \"/var/lib/dpkg/info/udev.postinst\", \"/usr/bin/bcompare\", \n    \"/usr/bin/su\", \"/usr/bin/claude-bin\"\n  ) or\n  process.parent.executable like (\n    \"/home/*/.local/share/claude/*\", \"/home/*/.local/bin/klaude\", \"/usr/local/*/claude-bin\",\n    \"/home/*/.claude/remote/ccd-cli/*\", \"/home/*/.claude/remote/ccd-cli\", \"/claude-cli/versions/*\",\n    \"/usr/scratch/*/git/*/atl/src/aitools/claude/claude-bin\", \"/opt/forticlient/epctrl\",\n    \"/root/.claude/remote/ccd-cli/*\", \"/root/.local/share/claude/versions/*\", \"/mnt/fast/*/.local/share/claude/versions/*\",\n    \"/opt/warpdotdev/warp-terminal/warp (deleted)\", \"/opt/local/share/claude/versions/*\",\n    \"/usr/share/cursor/cursor\", \"/home/*/.grok/downloads/grok*linux-x86_64\", \"/home/*/.codex/*/bin/codex\"\n  ) or\n  process.parent.args == \"claude\" or\n  process.parent.name == \"claude\" or\n  process.command_line like (\n    \"*/tmp/fzf-args*\", \"/opt/sp/serverpilot/*\", \"*/opt/forticlientems/*\", \"*WarpTerminal*\", \"/bin/bash -c exec -a bash*\",\n    \"/bin/bash -c exec -a sp-agent /opt/sp/serverpilot/agent/bin/sp-agent\", \"\"\"bash -c exec -a \"$0\" \"$@\" reboot /usr/sbin/reboot.no-molly-guard\"\"\",\n    \"bash -c exec -a auto_upgrade_fcems /opt/forticlientemstmp/upgradeworker_linux_amd64 -config ./goEMS.conf\",\n    \"bash -c exec -a cubin_gpu_pool_worker sleep *\", \"bash -c exec -a chroma sleep 7200\",\n    \"bash -c exec -a 'oes-mfa-agent' /usr/bin/node* --enable-source-maps /opt/novell/oes-mfa-agent/app/mfa-agent/main\",\n    \"bash -c exec -a auto_upgrade_fcems /opt/forticlientemstmp/emsworkers_linux_amd64 -worker_name=upgrade -config ./goEMS.conf\",\n    \"/bin/bash -c exec -a /usr/bin/heidisql /usr/share/heidisql/heidisql  > /dev/null 2>&1 /usr/bin/heidisql\",\n    \"/usr/bin/bash -c exec -a ems:uninstall /opt/forticlient/epctrl uninstall\",\n    \"bash -c exec -a \\\"apt-get update\\\" /var/cache/apt/cdroms.list\",\n    \"/bin/bash -c exec -a nvsm_apis_mosquitto /usr/sbin/mosquitto -c /etc/nvsm/nvsm-mqtt.config\",\n    \"*SNAPSHOT_FILE=/home/*/.claude/shell-snapshots/snapshot*\",\n    \"*codex-linux-sandbox*sandbox-shell*/.codex/*\", \n    \"*exec -a rg*/.local/share/claude/versions/*\", \n    \"*exec -a *$login_shell*\"\n  ) or\n  process.working_directory in (\"/opt/novell/umc/apps/umc-server\", \"/opt/novell/umc/apps/oes-rest\", \"/usr/share/epoptes-client\") or \n  process.args in (\n    \"exec -a sp-monitor /opt/sp/serverpilot/monitor/bin/monitor\",\n    \"exec -a sp-stats /opt/sp/serverpilot/stats/bin/sp-stats\",\n    \"/usr/bin/bcompare\", \"/usr/lib64/beyondcompare/BCompare\",\n    \"exec -a codex-linux-sandbox \\\"$@\\\"\"\n  ) or\n  process.parent.command_line == \"runc init\" or\n  process.command_line == \"\"\"bash -c exec -a \"$0\" \"$@\" shutdown /usr/sbin/shutdown.no-molly-guard -r now\"\"\" or\n  (process.command_line == \"bash -c exec -a '[sleep router failover]' sleep 1\" and process.parent.command_line == \"/bin/bash /init.sh\") or\n  process.parent.command_line like \"*/.claude/shell-snapshots/snapshot-*\" or\n  (process.parent.executable like \"/opt/micromamba/bin/python3*\" and process.parent.args == \"-m\" and process.parent.args == \"pytest\")\n)\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1564
          name: Hide Artifacts
          reference: "https://attack.mitre.org/techniques/T1564/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
