id: af4a2ea7-391f-4fc2-8ccf-946f412c023b_1.0.3
type: security-rule
attributes:
  description: |
    This rule detects when a process executes a file descriptor in the proc (temporary) file system via a LoLBin. This
    activity indicates an active attempt to execute a fileless payload and should be considered highly abnormal or
    suspicious. This activity can occur when the memfd syscall is utilized to create a memory resident file, like a payload,
    and then uses it to execute a process via a command and control channel via a LoLBin, resulting in an exec event.
  rule_id: af4a2ea7-391f-4fc2-8ccf-946f412c023b
  license: Elastic License v2
  name: Potential Fileless Execution via Memory File Descriptor by LoLBin
  os_list:
    - linux
  reference:
    - "https://man7.org/linux/man-pages/man2/memfd_create.2.html"
  version: "1.0.3"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.interactive == true and (\n  process.name in (\n    \"bash\", \"dash\", \"sh\", \"tcsh\", \"tclsh\", \"wish\", \"csh\", \"zsh\", \"ksh\", \"fish\", \"mksh\",\n    \"busybox\", \"pwsh\", \"node\", \"nodejs\", \"deno\", \"bun\", \"base64\", \"rscript\", \"escript\",\n    \"r\", \"julia\", \"mono\", \"dotnet\", \"dotnet-ef\", \"groovy\", \"kotlin\", \"scala\", \"erlang\",\n    \"ocaml\", \"ocamlopt\", \"ld.so\", \"ld-linux-x86-64.so.2\", \"awk\", \"gawk\", \"mawk\", \"nawk\",\n    \"env\", \"timeout\", \"nice\", \"stdbuf\", \"setsid\", \"setarch\", \"unshare\", \"nsenter\", \"flock\",\n    \"nohup\", \"runuser\", \"sudo\", \"snap\", \"snap-confine\", \"snap-exec\", \"erlexec\", \"beam.smp\",\n    \"java\", \"javaw\"\n  ) or\n  process.name like (\"python*\", \"perl*\", \"ruby*\", \"lua*\", \"php*\", \"qemu-*-static\")\n) and\nprocess.args regex \"\"\"/proc/(self|[0-9]{1,7})/fd/[0-9]{1,7}\"\"\" and\nnot (\n  process.command_line in (\"ln -f -s /proc/1/fd/2 /docker.stderr\", \"ln -f -s /proc/1/fd/1 /docker.stdout\") or\n  process.parent.command_line like \"*/home/*/.claude/shell-snapshots/snapshot-*\" or\n  process.parent.executable like (\n    \"/opt/omni/bin/drim/linux-amd64/coolie\", \"/bin/k3s\", \"/sbin/upstart\", \"/opt/hrt/hrtpylon-*/bin/python3.*\",\n    \"/data/k3s/*/bin/k3s\", \"/var/lib/docker/overlay2/*/bin/k3s\", \"/var/lib/rancher/k3s/*/bin/k3s\",\n    \"/usr/libexec/apptainer/bin/starter\"\n  ) or\n  process.executable like \"/home/*/core3/plz-out/bin/third_party/python3/cpython/usr/python3*/bin/python3.*\" or\n  (\n    process.parent.executable == \"/sbin/apk\" and\n    process.parent.args in (\"add\", \"del\", \"upgrade\")\n  ) or\n  (\n    process.parent.executable == \"/sbin/init\" and\n    process.name == \"sh\" and\n    process.args == \"-e\"\n  ) or\n  (\n    process.name == \"busybox\" and\n    process.command_line == \"tee -a /proc/1/fd/1\"\n  ) or\n  (\n    process.executable == \"/bin/busybox\" and\n    process.args == \"sh\" and\n    process.args in (\"/usr/bin\", \"/usr/sbin\")\n  ) \n)\n"
  min_endpoint_version: "9.1.4"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1106
          name: Native API
          reference: "https://attack.mitre.org/techniques/T1106/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
          subtechnique:
            - id: T1055.009
              name: Proc Memory
              reference: "https://attack.mitre.org/techniques/T1055/009/"
        - id: T1620
          name: Reflective Code Loading
          reference: "https://attack.mitre.org/techniques/T1620/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "9.1.4"
