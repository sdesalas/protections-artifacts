id: a3a3b49c-c135-4959-8a1b-33392bb60991_1.0.13
type: security-rule
attributes:
  description: |
    This rule monitors for suspicious Ruby command executions by detecting the start of a Ruby process with a command line
    argument that contains keywords commonly used by attackers to execute malicious code. These command line arguments
    include operations to execute code, create subprocesses, and encode or decode data.
  rule_id: a3a3b49c-c135-4959-8a1b-33392bb60991
  license: Elastic License v2
  name: Suspicious Ruby Command Execution
  os_list:
    - linux
  version: "1.0.13"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.parent.executable != null and\nprocess.executable like~ (\"/bin/ruby*\", \"/usr/bin/ruby*\", \"/usr/local/bin/ruby*\") and\nprocess.args like \"-e*\" and process.command_line like~ (\n  \"*system(*\", \"*exec(*\", \"*IO.popen(*\", \"*Open3.popen3(*\", \"*spawn(*\", \"*eval(*\", \"*load(*\",\n  \"*Marshal.load(*\", \"*Fiddle.dlopen(*\", \"*Fiddle::Function.new(*\", \"*base64*\", \"*zlib*\", \n  \"*net/http*\", \"*socket*\", \"*open-uri*\", \"*pack(*\", \"*unpack(*\"\n) and\nnot (\n  process.working_directory like~ (\"/etc/puppet/rack\", \"/builds/*\", \"/var/tmp/portage/*\") or\n  process.command_line like (\"*rails_env*\", \"*pid*Process.spawn*ssh*StrictHostKeyChecking*ServerAliveInterval*ServerAliveCountMax*\", \"*security-agent.webpros.host*\") or\n  process.command_line == \"ruby -e require \\\"yaml\\\"; YAML.safe_load(File.read(\\\".gitlab-ci.yml\\\"), aliases: true)\" or\n  process.parent.args like \"/home/*/.vscode-server/cli/servers/Stable-*\" or\n  process.parent.command_line in (\"emacs --daemon\", \"runc init\") or\n  process.parent.name in (\"emacs-gtk\", \"mmonit\", \"make\") or\n  (process.name == \"ruby\" and process.parent.name == \"ruby\") or\n  process.parent.executable in (\"/opt/gitlab/embedded/bin/gitaly\", \"/usr/bin/runc\") or\n  process.parent.executable like \"/home/*/bin/claude*\"\n)\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.15.0"
