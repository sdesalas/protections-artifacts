id: "452d6452-a8ec-4cae-9720-567fb44d93b7_1.0.10"
type: security-rule
attributes:
  description: |
    This rule identifies when a decoded payload is piped to an interpreter. Malware authors may attempt to evade detection
    by encoding and obfuscating their payload.
  rule_id: "452d6452-a8ec-4cae-9720-567fb44d93b7"
  license: Elastic License v2
  name: Decoded Payload Piped to Interpreter
  os_list:
    - linux
  version: "1.0.10"
  query: "sequence by process.parent.entity_id, process.working_directory with maxspan=1s\n  [process where event.type == \"start\" and event.action == \"exec\" and (\n    (\n      process.name in (\"base64\", \"basez\", \"base64plain\", \"base64url\", \"base64mime\", \"base64pem\", \"basenc\", \"base32\", \"base16\") and\n      process.command_line like~ (\"* -d*\", \"* --decode*\")\n    ) or\n    (\n      process.name == \"openssl\" and\n      process.args == \"enc\" and process.args in (\"-d\", \"-base64\", \"-a\", \"-A\")\n    ) or\n    (\n      process.name like \"python*\" and (\n        (process.args == \"base64\" and process.args in (\"-d\", \"-u\", \"-t\")) or\n        (process.args == \"-c\" and process.args like \"*base64*\" and process.command_line like~ \"*b64decode*\")\n      )\n    ) or\n    (\n      process.name like \"perl*\" and\n      process.command_line like~ \"*decode_base64*\"\n    ) or\n    (\n      process.name like \"ruby*\" and\n      process.args == \"-e\" and\n      process.command_line like~ \"*Base64.decode64*\"\n    ) or\n    (\n      process.name like~ \"java*\" and\n      process.command_line like~ \"*base64*decode(*\"\n    ) or\n    (\n      process.name like~ \"lua*\" and\n      process.command_line like~ (\"*mime.decode(*base64*\", \"*mime.unb64(*\")\n    ) or\n    (\n      process.name in (\"node\", \"deno\") and\n      (\n        process.command_line like~ (\"*atob(*\", \"*eval(*\") or\n        (\n          process.command_line like~ \"*buffer.from*\" and\n          process.command_line like~ \"*base64*\"\n        )\n      )\n    ) or\n    (\n      process.name == \"pwsh\" and\n      process.command_line like~ (\n        \"* -e *\", \"* -en *\", \"* -enc *\", \"* -enco *\", \"* -encod *\", \"* -encode *\", \"* -encoded *\",\n        \"* -encodedcommand *\", \"*frombase64string*\"\n      )\n    ) or\n    (\n      process.name in (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\", \"busybox\") and\n      process.command_line like~ (\"*base64 -d*\", \"*base64 --decode*\")\n    )\n  ) and\n  not (\n    process.parent.command_line like \"*DAAAAAtAAAAOQAAAF0AAAArAAAAJAAAACAAAABdAAAAXQAAACAAAAAmAAAAJgAAACAAAABbAAAAIAAAACIAAAAkAAAAcwAAAGkAAABnAAAAbgAAAGEAAAB0AAAAdQAAAHIAAABlAAAAIgAAACAAAAAtAAAAZQAAAHEAAAAgAAAAMgAAADAAAAAwAAAAMgAAADAAAAA5AAAAIAAAAF0AAAA7AAAAIAAAAHQAAABoAAAAZQAAAG4AAAA*\" or\n    process.command_line like \"/bin/bash -c base64 -d <<< IwAAAC*\" or\n    (\n      process.parent.executable like \"/var/lib/amazon/ssm/i-*/document/orchestration/*_script.sh\" and\n      process.working_directory == \"/usr/bin\" and\n      process.command_line == \"base64 --decode\"\n    ) or\n    (\n      process.working_directory like \"/var/snap/amazon-ssm-agent/*\" and\n      process.parent.args like \"/var/lib/amazon/ssm/*/document/orchestration/*/_script.sh\" and\n      process.name == \"base64\"\n    ) or\n    process.working_directory in (\"/opt/SolarWinds/Agent/bin/Plugins/ADMProbe\", \"/root/control-center-packaging\") or\n    process.parent.executable in (\"/usr/share/windsurf/windsurf\", \"/usr/share/cursor/cursor\", \"/usr/share/devin-desktop/devin-desktop\") or\n    process.parent.command_line like (\"claude\", \"*__CURSOR_SANDBOX_ENV_RESTORE*\") or\n    (\n      process.command_line like~ (\"*eval*1337*SendConductor*\", \"*eval*KITTY_SSH_KITTEN_DATA_DIR*\") and\n      process.parent.name in (\"sshd\", \"sshd-session\")\n    ) or\n    process.command_line like \"/bin/bash -c base64 -d <<< IwAAACAAAABHAAAAZQAAAHQAAAAgAAAAdAAAAGg*\" or\n    (\n      process.parent.command_line like (\n        \"/bin/bash -c base64 -d <<< IwAAACAAAABHAAAAZQAAAHQAAAAgAAAAdAAAAGg*\",\n        \"/bin/bash -c base64 -d <<< IwAAACEAAAAvAAAAYgAAAGkAAABuAAAAL*\"\n      ) and\n      process.command_line == \"base64 -d\"\n    ) or\n    (process.working_directory like \"/home/u.*\" and process.parent.command_line like \"bash -lc printf %s*\") or \n    (process.working_directory == \"/opt/Elastic/Endpoint/state/response_actions\" and process.command_line == \"base64 -d\") or\n    (process.working_directory == \"/home/deploy\" and user.name == \"deploy\" and process.parent.args == \"bash\") or\n    process.entry_leader.executable == \"/usr/sbin/qemu-ga\"\n  )]\n  [process where event.type == \"start\" and event.action == \"exec\" and process.name like (\n    \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\",\n    \"python*\", \"perl*\", \"ruby*\", \"lua*\", \"php*\", \"node\", \"pwsh\", \"deno\"\n  ) and process.args_count == 1 and\n  process.args like (\n    \"-bash\", \"-dash\", \"-sh\", \"-tcsh\", \"-csh\", \"-zsh\", \"-ksh\", \"-fish\",\n    \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\",\n    \"/bin/bash\", \"/bin/dash\", \"/bin/sh\", \"/bin/tcsh\", \"/bin/csh\",\n    \"/bin/zsh\", \"/bin/ksh\", \"/bin/fish\",\n    \"/usr/bin/bash\", \"/usr/bin/dash\", \"/usr/bin/sh\", \"/usr/bin/tcsh\",\n    \"/usr/bin/csh\", \"/usr/bin/zsh\", \"/usr/bin/ksh\", \"/usr/bin/fish\",\n    \"python*\", \"/bin/python*\", \"/usr/bin/python*\", \"/usr/local/bin/python*\",\n    \"perl*\", \"/bin/perl*\", \"/usr/bin/perl*\", \"/usr/local/bin/perl*\",\n    \"ruby*\", \"/bin/ruby*\", \"/usr/bin/ruby*\", \"/usr/local/bin/ruby*\",\n    \"lua*\", \"/bin/lua*\", \"/usr/bin/lua*\", \"/usr/local/bin/lua*\",\n    \"php*\", \"/bin/php*\", \"/usr/bin/php*\", \"/usr/local/bin/php*\",\n    \"node\", \"/bin/node\", \"/usr/bin/node\", \"/usr/local/bin/node\",\n    \"pwsh\", \"/bin/pwsh\", \"/usr/bin/pwsh\", \"/usr/local/bin/pwsh\",\n    \"deno\", \"/bin/deno\", \"/usr/bin/deno\", \"/usr/local/bin/deno\",\n    \"/dev/fd/*\"\n  ) and\n  not (\n    process.parent.command_line in (\"bash ./run_tests.sh unit-integration\", \"/bin/sh /var/lib/dpkg/info/nmap-common.postinst configure\") or\n    process.command_line == \"/usr/bin/perl /usr/bin/shasum -a 256\" or\n    process.working_directory like (\n      \"/usr/local/zeek\", \"/opt/zeek\", \"/var/lib/docker/overlay2/*/opt/zeek\", \"/usr/local/zeek_old_install\",\n      \"/var/lib/docker/overlay2/*/usr/local/zeek\", \"/proc/self/fd/*/usr/local/zeek\"\n    ) or\n    (process.parent.name == \"zsh\" and process.parent.command_line like \"*extendedglob*\") or\n    (process.name like \"python*\" and process.parent.name like \"python*\")\n  )]\n"
  min_endpoint_version: "8.3.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 1
    - action: kill_process
      field: process.parent.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
          subtechnique:
            - id: T1204.002
              name: Malicious File
              reference: "https://attack.mitre.org/techniques/T1204/002/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
        - id: T1140
          name: Deobfuscate/Decode Files or Information
          reference: "https://attack.mitre.org/techniques/T1140/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.3.0"
