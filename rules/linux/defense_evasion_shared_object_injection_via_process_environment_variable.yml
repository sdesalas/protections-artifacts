id: f6f74bd6-414a-4f22-89ec-c045d634a805_1.0.51
type: security-rule
attributes:
  description: |
    This rule detects the use of process environment variables LD_PRELOAD to inject a shared library into a binary at or
    prior to execution. A threat actor may do this to load a malicious shared library for persistence, privilege escalation,
    and defense evasion. This activity is not common and should indicate malicious or suspicious behavior.
  rule_id: f6f74bd6-414a-4f22-89ec-c045d634a805
  license: Elastic License v2
  name: Shared Object Injection via Process Environment Variable
  os_list:
    - linux
  reference:
    - "https://attack.mitre.org/techniques/T1574/006/"
  version: "1.0.51"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.env_vars like \"LD_PRELOAD=?*\" and \n  (\n    (\n      process.env_vars like (\"LD_PRELOAD=/tmp/*.so\", \n                          \"LD_PRELOAD=./*.so\", \n                          \"LD_PRELOAD=$LD_PRELOAD*\",  \n                          \"LD_PRELOAD=$*LD_PRELOAD*\")\n    ) or \n    (\n      process.command_line : (\"./*\") and \n      process.env_vars : (\"LD_PRELOAD=/home/*\",\n                          \"LD_PRELAOD=/tmp/*\",\n                          \"LD_PRELOAD=/dev/shm/*\",\n                          \"LD_PRELOAD=/run/*\")\n    ) or \n    (\n      process.executable : (\"/bin/busybox\", \n                            \"/usr/bin/busybox\", \n                            \"/bin/vi\", \n                            \"/usr/bin/vi\") and \n      process.env_vars : \"LD_PRELOAD=*.so\"\n    ) or \n    (\n      process.args_count <= 1 and \n      process.parent.name : (\"bash\", \"sh\") and\n      process.env_vars : (\"LD_PRELOAD=/home/*\",\n                          \"LD_PRELAOD=/tmp/*\",\n                          \"LD_PRELOAD=/dev/shm/*\",\n                          \"LD_PRELOAD=/run/*\")\n    ) or\n    (process.env_vars : \"LD_PRELOAD=/proc/*\")\n  ) and not (\n  process.env_vars like (\n    \"LD_PRELOAD=\", \"LD_LIBRARY_PATH=\", \"LD_PRELOAD=/tmp/pressure-vessel-libs-*/${LIB}/gameoverlayrenderer.so\",\n    \"LD_PRELOAD=*/.mount_*\", \"LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2\",\n    \"LD_PRELOAD=/opt/deepinstinct/bin/libDeepInterception.so\", \"LD_PRELOAD=/usr/lib/preloadable_libiconv.so\",\n    \"LD_PRELOAD=./build/liblib.so\", \"LD_PRELOAD=/usr/libexec/sudo/sudo_noexec.so\", \"LD_PRELOAD=/home/oracle/*\",\n    \"LD_PRELOAD=/home/*/lib/python*/site-packages/*\", \"*LD_PRELOAD=*MATLAB*ld_shim.so.2.*\", \n    \"LD_PRELOAD=/tmp/intercept-*/libear.so\",\n    \"LD_PRELOAD=/opt/dynatrace/oneagent/agent/bin/current/linux-x86-64/liboneagentproc.so\",\n    \"LD_PRELOAD=/home/*/.local/lib/vivaldi/media-codecs-*/libffmpeg.so\",\n    \"LD_PRELOAD=/usr/local/lib/libmimalloc.so\", \"LD_PRELOAD=/home/*/opt/commvault/Base/libCvDllFilter.so\",\n    \"LD_PRELOAD=/usr/lib/libjemalloc.so.2:/opt/zlib-ng/lib/libz.so\",\n    \"LD_PRELOAD=/lib/x86_64-linux-gnu/libSegFault.so\", \"LD_PRELOAD=/usr/lib/libnss_wrapper.so\",\n    \"LD_PRELOAD=/tmp/*/openwrt-imagebuilder*/runas.so\", \"LD_PRELOAD=/tmp/pressure-vessel-libs-*/libMangoHud_shim.so\",\n    \"LD_PRELOAD=/home/libjemalloc.so.2\", \"LD_PRELOAD=/tmp/libredirectnull.so\", \"LD_PRELOAD=/tmp/libcuda_trace.so\",\n    \"LD_PRELOAD=:/usr/lib/libjemalloc.so\", \"LD_PRELOAD=/lib/libSegFault.so\", \"LD_PRELOAD=/tmp/baum/easybuild/*\",\n    \"LD_PRELOAD=/home/*/.local/share/WebexLauncher/*/bin/../lib/libCefMallinfoShim.so\",\n    \"LD_PRELOAD=/tmp/nss_wrapper/libnss_wrapper.so\"\n  ) or\n  (process.env_vars == \"LD_PRELOAD=./getrandom.so\" and process.parent.command_line == \"/opt/perlbrew/perls/perl-5.40.3/bin/perl t/getrandom.t\") or\n  process.parent.command_line == \"runc init\" or\n  process.parent.executable like (\n    \"/usr/local/bin/fluentd\", \"/nix/store/*\", \"/usr/lib/pressure-vessel/from-host/bin/pressure-vessel-adverb\", \n    \"/opt/tm/toolchains/*\", \"/bin/sudoedit\"\n  ) or\n  process.executable == \"/usr/bin/adb\" or\n  process.executable like \"/tmp/newroot/*\" or\n  (\n    process.env_vars like \"LD_PRELOAD=/tmp/pytest-of-*/*/.runtime/qgc/libqgc_timer_guard.so\" and\n    process.parent.executable == \"/usr/bin/bash\"\n  ) or\n  process.parent.command_line like \"*/.codex/*\"\n)\n"
  min_endpoint_version: "8.6.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1574
          name: Hijack Execution Flow
          reference: "https://attack.mitre.org/techniques/T1574/"
          subtechnique:
            - id: T1574.006
              name: Dynamic Linker Hijacking
              reference: "https://attack.mitre.org/techniques/T1574/006/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1574
          name: Hijack Execution Flow
          reference: "https://attack.mitre.org/techniques/T1574/"
          subtechnique:
            - id: T1574.006
              name: Dynamic Linker Hijacking
              reference: "https://attack.mitre.org/techniques/T1574/006/"
      tactic:
        id: TA0004
        name: Privilege Escalation
        reference: "https://attack.mitre.org/tactics/TA0004/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1574
          name: Hijack Execution Flow
          reference: "https://attack.mitre.org/techniques/T1574/"
          subtechnique:
            - id: T1574.006
              name: Dynamic Linker Hijacking
              reference: "https://attack.mitre.org/techniques/T1574/006/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.6.0"
