id: "7d4b0dfc-d305-4761-94f4-ab2ed221b3ee_1.0.14"
type: security-rule
attributes:
  description: |
    This rule detects when a web server executes a payload. Attackers may exploit RCE or file upload vulnerabilities to
    execute malicious payloads on web servers to gain/maintain access and to establish a command and control channel.
  rule_id: "7d4b0dfc-d305-4761-94f4-ab2ed221b3ee"
  license: Elastic License v2
  name: Payload Execution by Web Server
  os_list:
    - linux
  version: "1.0.14"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.parent.interactive == false and (\n  process.parent.name in (\n    \"nginx\", \"apache2\", \"httpd\", \"caddy\", \"mongrel_rails\", \"uwsgi\", \"daphne\", \"httpd.worker\", \"flask\",\n    \"php-cgi\", \"php-fcgi\", \"php-cgi.cagefs\", \"lswsctrl\", \"varnishd\", \"uvicorn\", \"waitress-serve\", \"starman\",\n    \"frankenphp\", \"zabbix_server\", \"asterisk\", \"sw-engine-fpm\", \"lighttpd\", \"httpd-worker\",\n    \"httpd-prefork\", \"lshttpd\", \"litespeed\", \"openlitespeed\", \"fcgiwrap\", \"hypercorn\", \"granian\", \"puma\",\n    \"unicorn\", \"unicorn_rails\", \"thin\", \"rackup\", \"plackup\", \"twiggy\", \"hypnotoad\", \"starlet\", \"unitd\",\n    \"unitd-debug\", \"gitea\"\n  ) or\n  process.parent.name like (\"php-fpm*\", \"gunicorn*\", \"*.cgi\", \"*.fcgi\", \"lsphp*\") or\n  (\n    process.parent.name like \"ruby*\" and\n    process.parent.command_line like~ (\"*puma*\", \"*rails*\", \"*passenger*\") and\n    not process.parent.command_line == \"sh -c /usr/bin/lsb_release -cidvr 2>/dev/null\"\n  ) or\n  (\n    process.parent.name like \"python*\" and\n    process.parent.command_line like~ (\n      \"*hypercorn*\", \"*flask*\", \"*uvicorn*\", \"*django*\", \"*app.py*\", \"*server.py*\", \"*wsgi.py*\", \"*asgi.py*\"\n    )\n  ) or\n  (process.parent.name like \"perl*\" and process.parent.command_line like~ \"*plackup*\") or\n  (process.parent.name == \"beam.smp\" and process.parent.executable like \"*/couchdb/*\") or\n  (process.parent.name in (\"java\", \"jsvc\", \"jstart\") and process.parent.args like~ (\n    /* Tomcat */\n    \"org.apache.catalina.startup.Bootstrap\", \"-Dcatalina.base=*\",\n\n    /* Jetty */\n    \"org.eclipse.jetty.start.Main\", \"-Djetty.home=*\",\n    \"*start.jar*\",\n    \"-Djetty.base=*\",\n\n    /* WildFly / JBoss */\n    \"org.jboss.modules.Main\", \"-Djboss.home.dir=*\",\n\n    /* WebLogic */\n    \"weblogic.Server\", \"-Dweblogic.Name=*\", \"*weblogic-launcher.jar*\",\n\n    /* WebSphere traditional + Liberty */\n    \"com.ibm.ws.runtime.WsServer\", \"com.ibm.ws.kernel.boot.cmdline.Bootstrap\",\n\n    /* GlassFish */\n    \"com.sun.enterprise.glassfish.bootstrap.ASMain\",\n    \"com.sun.enterprise.glassfish.bootstrap.GlassFishMain\",\n\n    /* Resin */\n    \"com.caucho.server.resin.Resin\",\n\n    /* Spring Boot */\n    \"org.springframework.boot.loader.*\",\n\n    /* Quarkus */\n    \"*quarkus-run.jar*\", \"io.quarkus.runner.GeneratedMain\",\n\n    /* Micronaut */\n    \"io.micronaut.runtime.Micronaut\",\n\n    /* Dropwizard */\n    \"io.dropwizard.cli.ServerCommand\",\n\n    /* Play */\n    \"play.core.server.ProdServerStart\",\n\n    /* Helidon */\n    \"io.helidon.microprofile.server.Main\", \"io.helidon.webserver*\",\n    \"io.helidon.Main\",\n    \"io.helidon.microprofile.cdi.Main\",\n\n    /* Vert.x */\n    \"io.vertx.core.Launcher\",\n    \"io.vertx.launcher.application.VertxApplication\",\n\n    /* Keycloak */\n    \"org.keycloak*\",\n    \"io.quarkus.bootstrap.runner.QuarkusEntryPoint\",\n    \"-Dkc.home.dir=*\",\n    \"-Dkc.script.pid=*\",\n\n    /* Apereo CAS */\n    \"org.apereo.cas*\",\n\n    /* Elasticsearch */\n    \"org.elasticsearch.bootstrap.Elasticsearch\",\n\n    /* Atlassian / Gerrit */\n    \"com.atlassian.jira.startup.Launcher\", \"*BitbucketServerLauncher*\", \"com.google.gerrit.pgm.Daemon\",\n\n    /* Solr */\n    \"*-Dsolr.solr.home=*\",\n\n    /* Jenkins */\n    \"*jenkins.war*\",\n\n    /* Ktor */\n    \"io.ktor.server.netty.EngineMain\",\n    \"io.ktor.server.cio.EngineMain\",\n    \"io.ktor.server.jetty.jakarta.EngineMain\",\n    \"io.ktor.server.tomcat.jakarta.EngineMain\",\n  \n\n    /* Payara Micro */\n    \"*payara-micro*.jar*\",\n\n    /* Karaf */\n    \"org.apache.karaf.main.Main\",\n    \"-Dkaraf.home=*\",\n    \"-Dkaraf.base=*\",\n\n    /* WSO2 */\n    \"org.wso2.carbon.bootstrap.Bootstrap\",\n\n    /* OpenSearch */\n    \"org.opensearch.bootstrap.OpenSearch\",\n    \"-Dopensearch.path.home=*\",\n\n    /* Sling / AEM */\n    \"*org.apache.sling*.jar*\",\n    \"*aem-author*.jar*\",\n    \"*aem-publish*.jar*\",\n    \"*aem-quickstart*.jar*\",\n    \"*cq-quickstart*.jar*\",\n\n    /* CAS */\n    \"*cas.war*\",\n\n    /* Legacy JBoss */\n    \"org.jboss.Main\",\n\n    /* SonarQube / Nexus */\n    \"org.sonar.server.app.WebServer\",\n    \"org.sonatype.nexus.karaf.NexusMain\"\n    )\n  )\n) and\nprocess.name in (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\", \"busybox\") and\nprocess.args in (\"-c\", \"-cl\", \"-lc\") and (\n  process.command_line like~ (\n\n    /* Suspicious Paths */\n    \"* /tmp/* \", \"* /var/tmp/* \", \"* /dev/shm/*\", \"* /run/*\", \"* /var/run/*\",\n\n    /* Encoding, Decoding & Piping */\n    \"*|sh\", \"*| sh *\", \"*| sh \", \"*|bash*\", \"*| bash*\", \"*|zsh*\",  \"*| zsh*\", \"*|dash*\",  \"*| dash*\",\n    \"*|python*\", \"*| python*\", \"*|php*\", \"*| php*\", \"*|perl*\", \"*| perl*\", \"*|ruby*\", \"*| ruby*\",\n    \"*|node*\", \"*| node*\", \"*|lua*\",  \"*| lua*\", \"*|busybox*\", \"*| busybox*\", \"*|*base64 -d*\", \"*|*base64 --decode*\",\n    \"*|*base64 --decode*\", \"*|*openssl base64 -d*\", \"*xxd *\", \"*| openssl*enc * -d *\", \"*b64decode -r*\",\n\n    /* Interpreter Execution */\n    \"*python -c*\", \"*python3 -c*\", \"*php -r*\", \"*perl -e*\", \"*ruby -e*\", \"*lua -e*\", \"*node -e *\",\n\n    /* Reverse Shells */\n    \"*netcat *\", \"* nc *\", \"*ncat *\", \"*/dev/tcp*\", \"*/dev/udp/*\", \"*socat *\", \"*openssl*s_client *\", \"*stty*raw*-echo*\",\n    \"*mkfifo /tmp/*\", \n\n    /* File Access */\n    \"*>*/etc/cron*\", \"*crontab*\", \"*/etc/ssh*\", \"*/home/*/.ssh/*\", \"*/root/.ssh*\", \"*~/.ssh/*\", \"*/etc/shadow*\",\n    \"*/etc/passwd*\", \"*/etc/master.passwd*\",\n\n    /* Enumeration & Discovery */\n    \"*/etc/hosts*\", \"*/etc/resolv.conf*\", \"*/etc/hostname*\", \"*/etc/issue*\", \"*/etc/os-release*\", \"*lsb_release*\",\n    \"*/proc/*/environ*\", \"*sudo -l*\", \"*/proc/*/cgroup*\", \"*dockerenv*\", \"*/proc/*/mountinfo*\", \"*printenv*\",\n    \"*cat*.env *\", \"*getcap*\", \"*capsh*\", \"*find / *\", \"*netstat *\",\n\n    /* AWS Credentials */\n    \"*aws_access_key_id*\", \"*aws_secret_access_key*\", \"*aws_session_token*\", \"*accesskeyid*\", \"*secretaccesskey*\",\n    \"*.aws/credentials*\", \"*/.aws/config*\",\n\n    /* Azure Credentials */\n    \"*AZURE_CLIENT_ID*\", \"*AZURE_TENANT_ID*\", \"*AZURE_CLIENT_SECRET*\", \"*AZURE_FEDERATED_TOKEN_FILE*\",\n    \"*IDENTITY_ENDPOINT*\", \"*IDENTITY_HEADER*\", \"*MSI_ENDPOINT*\", \"*MSI_SECRET*\", \"*/.azure/*\",\n    \"*/run/secrets/azure/*\",\n\n    /* GCP Credentials */\n    \"*/.config/gcloud/*\", \"*application_default_credentials.json*\", \"*type: service_account*\",\n    \"*client_email*\", \"*private_key_id*\", \"*/run/secrets/google/*\", \"*GOOGLE_APPLICATION_CREDENTIALS*\",\n\n    /* Misc. Cloud */\n    \"*/.docker/config.json*\", \"*/.npmrc*\", \"*/secrets/kubernetes.io/serviceaccount/*\",\n\n    /* Helpers */\n    \"*timeout *sh -c *\", \"*env *sh *-c*\", \"*exec -a*\",\n\n    /* Miscellaneous */\n    \"*chattr *\", \"*busybox *\",  \"*#!*\", \"*chmod +x *\", \"*chmod 777*\", \"*chpasswd*\",\n    \"*<?php*?>*\", \"*kworker*\",\n    \n    /* Decompression */\n    \"*gzip -*d *\", \"*bzip2 -*d *\", \"*xz -*d *\", \"*tar -*x*\",\n    \n    /* Path Traversal */\n    \"*../../../*etc/*\", \"*/.../*\", \"*../../../*home/*/*\", \"*../../../*root/*\",\n\n    /* File Upload/Download */\n    \"*pastebin.com*\", \"*transfer.sh*\", \"*bashupload.com*\"\n  ) or\n  process.args in (\"id\", \"whoami\", \"hostname\")\n) and\nnot (\n  (\n    process.parent.name == \"nginx\" and\n    (\n      process.args like (\"chmod 777 /etc/resty-*\", \"resty*\") or\n      process.command_line like (\"sh -c*/tmp/lua_* 2> /tmp/lua_*\", \"sh -c gcc -print-multiarch 2>/dev/null > /tmp/lua_*\")\n    )\n  ) or\n  (\n    process.parent.name == \"apache2\" and (\n      process.command_line in (\n        \"sh -c /usr/local/bin/php -r 'echo phpversion();'\", \"sh -c -- /usr/local/bin/php -r 'echo phpversion();'\",\n        \"sh -c /usr/bin/php -r 'echo phpversion();'\",\n        \"sh -c /usr/bin/lsb_release -a 2>/dev/null\",\n        \"sh -c /usr/bin/crontab -l;\",\n        \"sh -c -- whoami\",\n        \"sh -c /usr/bin/crontab  -l 2>/dev/null\",\n        \"sh -c /usr/bin/crontab  -\",\n        \"sh -c lsb_release --all </dev/null 2>/dev/null\",\n        \"sh -c /usr/bin/lsb_release -ds | cut -d= -f2 | tr -d '\\\"'\"\n      ) or\n      process.args like (\n        \"\"\"bash -c \"( /home/*/apps/richdocumentscode/collabora/Collabora_Online.AppImage*\"\"\",\n        \"chmod 777 /etc/cobra/uploads/mysql*\", \"stat*\"\n      ) or\n      process.command_line like (\n        \"*/usr/bin/crontab*phpupdatecrontab.txt\", \"*mysqldump*/var/www/html/*/writable/uploads/backup/mysql*\",\n        \"sh -c chmod 777 -R /opt/data/www/php_upload/*/temp\", \"sh -c chmod 777 -R /opt/data/www/php_upload/*/sync/*\",\n        \"*gs * -sDEVICE=pdfwrite*\"\n      )\n    )\n  ) or\n  (\n    process.parent.name like \"php-fpm*\" and (\n      process.command_line in (\n        \"sh -c /usr/bin/php -r 'echo phpversion();'\", \"sh -c -- /usr/bin/php -r 'echo phpversion();'\",\n        \"sh -c php -r 'print_r(phpversion());'\", \"sh -c chattr -i -a /usr/local/virtualizor/license2.php\",\n        \"sh -c -- netstat -ie 2>&1\",\n        \"sh -c hostname\",\n        \"sh -c source /etc/os-release 2>/dev/null && echo $ID $ID_LIKE\",\n        \"sh -c netstat -ie 2>&1\",\n        \"sh -c php -r \\\"echo date('T');\\\"\",\n        \"sh -c php -r \\\"echo PHP_VERSION;\\\"\",\n        \"sh -c -- php -r \\\"echo (int)function_exists('pcntl_signal');\\\"\",\n        \"sh -c -- php -r \\\"echo PHP_VERSION;\\\"\",\n        \"sh -c -- php -r \\\"echo date('T');\\\"\",\n        \"sh -c /usr/bin/lsb_release -a 2>/dev/null\"\n      ) or\n      process.command_line like (\n        \"*var_export*extension_loaded*\", \"*/tmp/tmp_resize*\", \"*/v1/objects/hosts/*_Infoterminal*\", \"*python -m json.tool*\",\n        \"sh -c timeout 3600 ssh -o ControlMaster=auto -o ControlPath=/var/www/html/storage/app/ssh/mux/*\",\n        \"sh -c -- chmod 777 *.XML\", \"sh -c /usr/bin/lsb_release -a 2>/dev/null\"\n      ) or\n      process.args like (\"ps*|*grep*\", \"ffmpeg*\", \"chmod*777*.xml\")\n    )\n  ) or\n  (\n    process.parent.name == \"php-cgi\" and (\n      process.command_line like (\n        \"sh -c nohup php /home/*/public_html/lockindex.php index.php >/dev/null 2>&1 &\",\n        \"sh -c nohup php /home/*/public_html/wp-content/* >> /dev/null 2>&1 &\",\n        \"sh -c nohup php /home/*/public_html/wp-includes/* >> /dev/null 2>&1 &\",\n        \"sh -c nohup php /home/*/public_html/*/wp-content/* >> /dev/null 2>&1 &\",\n        \"*-ef|grep*\",\n        \"sh -c /usr/bin/php -r 'echo phpversion();'\"\n      ) or\n      process.args like \"ps*| grep*\"\n    )\n  ) or\n  (\n    process.parent.name == \"java\" and process.command_line == \"/usr/bin/env sh -c ldd /usr/bin/env | grep -q musl\"\n  ) or\n  (\n    process.command_line == \"/bin/sh -c echo | openssl s_client -connect localhost:61617 2>/dev/null | openssl x509 -noout -enddate\" and\n    process.parent.name == \"gunicorn\"\n  ) or\n  (\n    process.parent.executable == \"/usr/local/bin/gunicorn\" and\n    process.command_line == \"/bin/sh -c echo 'Q' | openssl s_client -connect localhost:61617 2>/dev/null | openssl x509 -noout -enddate\"\n  ) or\n   (\n    process.parent.executable like \"/home/rails/.rbenv/versions/*/bin/ruby\" and\n    process.command_line == \"sh -c crontab -l 2> /dev/null\"\n  ) or\n  (\n   process.parent.executable == \"/opt/bitnami/apache/bin/httpd\" and\n   process.command_line == \"sh -c /opt/bitnami/php/bin/php -r 'echo phpversion();'\"\n  ) or\n  (\n    process.parent.executable like \"/var/lib/containers/storage/overlay/*/merged/usr/local/sbin/php-fpm\" and\n    process.command_line == \"sh -c /usr/local/bin/php -r 'echo phpversion();'\"\n  ) or\n  (\n    process.parent.executable like \"/var/lib/docker/overlay2/*/merged/usr/sbin/uwsgi\" and\n    process.command_line == \"/bin/sh -c { touch /run/uwsgi-logrotate  }\"\n  ) or\n  (process.parent.executable == \"/var/www/cgi-bin/vtsystem.cgi\" and process.command_line == \"sh -c hostname\") or\n  (\n    process.parent.name like \"python*\" and (\n      process.parent.command_line like (\"*hive_server.py*\", \"*/home/*/workspace/claudopus/server/server.py*\") or\n      process.parent.args == \"pytest\"\n    )\n  ) or\n  (process.parent.name == \"sw-engine-fpm\" and process.command_line like (\"*/opt/psa/admin/bin/*\", \"*/usr/local/psa/admin/*\")) or\n  (\n    process.parent.name == \"httpd\" and\n    process.command_line like (\n      \"*/datastore/htdocs/control-states/compass*\", \"*/dev/shm/netmon-log*\", \"sh -c /usr/bin/crontab  -l 2>/dev/null\",\n      \"sh -c /usr/bin/crontab  -\", \"*/etc/ffmpeg/ffmpeg*\"\n    )\n  ) or\n  (process.parent.name == \"asterisk\" and process.args like \"/bin/chmod 777 */gravacoes/*.WAV\") or\n  (process.parent.name == \"varnishd\" and process.args like \"exec gcc*\") or\n  (process.parent.name in (\"apache2\", \"php-cgi\", \"lsphp\") and process.command_line in (\"sh -c crontab -l\", \"sh -c -- crontab -l\")) or\n  (\n    process.parent.name == \"lsphp\" and\n    process.command_line like (\"sh -c crontab -l *\", \"sh -c crontab /home/*/boldgrid_backup/*\", \"sh -c crontab /tmp/cg*\")\n  ) or\n  (process.parent.name in (\"php-fpm\", \"httpd\") and process.command_line in (\n    \"sh -c whoami\", \"sh -c /usr/bin/php -r 'echo phpversion();'\",\n    \"sh -c TERM=dumb cat /var/run/elasticsearch/elasticsearch.pid\", \"sh -c TERM=dumb cat /var/run/logstash/logstash.pid\",\n    \"sh -c TERM=dumb cat /var/run/opensearch/opensearch.pid\"\n  )) or\n  (process.parent.name == \"zabbix_server\" and process.command_line like \"*/usr/sbin/sendmail*\") or\n  (process.parent.executable == \"/opt/morpheus/embedded/java/jre/bin/java\" and process.command_line like \"*morpheus-local*\") or\n  (\n    process.parent.name == \"ruby\" and\n    process.command_line in (\n      \"sh -c cat /etc/hostname 2>/dev/null\",\n      \"sh -c echo \\\"^d\\\" | openssl s_client -connect 127.0.0.1:443 2>&1\",\n      \"sh -c cat /etc/hosts.allow 2>/dev/null\"\n    )\n  ) or\n  (process.parent.name == \"java\" and process.args like \"chmod 777 *.csv\") or\n  process.command_line == \"sh -c node -v || nodejs -v\" or\n  process.working_directory == \"/var/lib/puppet/rack/puppetmasterd\" or\n  (process.working_directory == \"/olympe\" and process.parent.executable == \"/usr/local/bin/ruby\" and process.command_line == \"sh -c ssh-keygen -f ~/.ssh/id_ed25519 -y\") or\n  (process.parent.name like \"python*\" and process.parent.args == \"/root/.local/share/uv/tools/mini-swe-agent/bin/python\") or\n  (process.parent.name == \"zabbix_server\" and process.command_line like \"*/usr/lib/zabbix/alertscripts/*\") or\n  (\n    process.parent.name == \"java\" and\n    process.parent.args in (\"org.apache.karaf.wrapper.internal.service.Main\", \"org.apache.karaf.main.Main\") and\n    process.name == \"bash\" and process.args like \"cd*\"\n  ) or\n  process.parent.executable like (\"/opt/uniagent/jre/bin/java\", \"/cvmfs/*/tools/eb/x86_64/generic/software/Python/*/bin/python*\") or\n  (process.parent.name == \"java\" and process.command_line == \"/bin/sh -c lsb_release -a | grep \\\"Description\\\"\") or\n  process.parent.working_directory like \"/tmp/claude-*\"\n)\n"
  min_endpoint_version: "8.2.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1190
          name: Exploit Public-Facing Application
          reference: "https://attack.mitre.org/techniques/T1190/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1505
          name: Server Software Component
          reference: "https://attack.mitre.org/techniques/T1505/"
          subtechnique:
            - id: T1505.003
              name: Web Shell
              reference: "https://attack.mitre.org/techniques/T1505/003/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1210
          name: Exploitation of Remote Services
          reference: "https://attack.mitre.org/techniques/T1210/"
      tactic:
        id: TA0008
        name: Lateral Movement
        reference: "https://attack.mitre.org/tactics/TA0008/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.2.0"
