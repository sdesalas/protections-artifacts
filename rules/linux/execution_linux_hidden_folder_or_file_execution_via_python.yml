id: b25ec4e7-34f1-40c2-b683-bbf1dcdd84e5_1.0.18
type: security-rule
attributes:
  description: |
    Detects possible Python-based malware that stages their files in a hidden directory or file. This rule looks for Python
    executions where the process arguments include references to hidden folders or files in the suspicious directories.
  rule_id: b25ec4e7-34f1-40c2-b683-bbf1dcdd84e5
  license: Elastic License v2
  name: Linux Hidden Folder or File Execution via Python
  os_list:
    - linux
  reference:
    - "https://github.com/rapid7/metasploit-framework"
  version: "1.0.18"
  query: "process where event.type == \"start\" and event.action == \"exec\" and\nprocess.executable like~ (\"/bin/python*\", \"/usr/bin/python*\", \"/usr/local/bin/python*\") and\nprocess.args : \"python*\" and process.args : (\"/tmp/.*\", \"/var/tmp/.*\", \"/dev/shm/.*\") and\nnot (\n  process.parent.name in (\"browser_tests\", \"unit_tests\", \"arduino-cli\", \"node\", \"python.original\") or\n  process.args like (\n    \"/tmp/.build/*\", \"/tmp/.sentrycli*\", \"/var/tmp/.mount_GIMP*\", \"/tmp/.mount_GIMP*\", \"/tmp/*/ansible-tmp-*/AnsiballZ*.py\",\n    \"/tmp/selfgz*.py\", \"/home/*/git/roche/product-packages/common/hearst/test-submit-enclave-measurements.py\",\n    \"/tmp/.ctx-mode-*\", \"/tmp/.tmp*/drivers/fake.*/run.py\"\n  ) or\n  process.args in (\n    \"/opt/sev-snp-measure/measure.py\", \"/tmp/.__preview_vite_base_fixer.py\", \"/tmp/.soc_models_helper.py\",\n    \"/opt/fortanix/enclave-os/blobs/kernel_enabled_gpu/bzImage\"\n  ) or\n  process.parent.args like \"/home/*/git/roche/product-packages/common/hearst/test-submit-enclave-measurements.py\" or\n  (\n    process.parent.executable like \"/home/*/node_modules/@openai/codex/bin/codex-x86_64-unknown-linux-musl\" and\n    process.command_line like \"python3 /tmp/.tmp*\"\n  ) or\n  (process.args in (\"/usr/bin/ukify\", \"/bin/ukify\") and process.args == \"build\") or \n  (process.args == \"--include-private-keys\" and process.parent.args like \"/home/*/.ansible/tmp/ansible-tmp-*/ir_scan.sh\") or\n  (process.parent.executable == \"./runc\" and process.parent.command_line == \"runc init\") or\n  (process.parent.executable like \"/home/gitlab-runner/builds/*/bach\" and process.args like \"/tmp/.tmp*/*/run.py\")\n)\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
            - id: T1059.006
              name: Python
              reference: "https://attack.mitre.org/techniques/T1059/006/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.15.0"
