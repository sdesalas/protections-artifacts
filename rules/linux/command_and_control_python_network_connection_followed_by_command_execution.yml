id: b86c5998-3068-43e8-bfb5-ecb593e34ca9_1.0.12
type: security-rule
attributes:
  description: |
    Detects network connections originating from Python, followed by a suspicious command execution. This behavior is
    consistent with Python-based agents such as Medusa connecting to a C2 framework such as Mythic. The agent polls the C2
    for commands through a web request, after which the command gets executed.
  rule_id: b86c5998-3068-43e8-bfb5-ecb593e34ca9
  license: Elastic License v2
  name: Python Network Connection Followed by Command Execution
  os_list:
    - linux
  version: "1.0.12"
  query: "sequence with maxspan=3s\n  [network where event.type == \"start\" and event.action == \"connection_attempted\" and\n   process.name like \"python*\" and \n   process.executable like (\"/bin/python*\", \"/usr/bin/python*\", \"/usr/local/bin/python*\") and\n   not (\n     destination.ip == null or destination.ip == \"0.0.0.0\" or cidrmatch(\n       destination.ip, \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \"192.0.0.0/24\", \"192.0.0.0/29\",\n       \"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\", \"192.0.0.170/32\", \"192.0.0.171/32\", \"192.0.2.0/24\",\n       \"192.31.196.0/24\", \"192.52.193.0/24\", \"192.168.0.0/16\", \"192.88.99.0/24\", \"224.0.0.0/4\", \"100.64.0.0/10\",\n       \"192.175.48.0/24\",\"198.18.0.0/15\", \"198.51.100.0/24\", \"203.0.113.0/24\", \"240.0.0.0/4\", \"::1\", \"FE80::/10\",\n       \"FF00::/8\"\n     )\n   )\n  ] by process.entity_id\n  [process where event.type == \"start\" and event.action == \"exec\" and\n   process.parent.executable like (\"/bin/python*\", \"/usr/bin/python*\", \"/usr/local/bin/python*\") and\n   process.name in (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\") and process.args == \"-c\" and\n   process.parent.args_count < 3 and process.command_line like (\n     \"*whoami*\", \"* wget *\", \"* chmod *\", \"* busybox *\", \"* chattr *\", \"* php*\", \"* perl*\", \"* ruby*\", \"* lua*\",\n     \"*netcat *\", \"*ncat *\", \"*/dev/shm/*\", \"* base64 *\", \"*base32*\"\n   ) and not (\n     process.parent.executable like (\n       \"/opt/code/localstack/.venv/bin/python\", \"/opt/imunify360*\", \"/var/www/kyb/*/env/bin/python3\",\n       \"/opt/saltstack/salt/bin/python*\", \"/usr/lib/venv-salt-minion/bin/python.original\"\n     ) or\n     process.parent.args in (\"/sbin/mount.efs\", \"/usr/local/bin/cloud_updater.py\") or\n     process.command_line in (\n       \"/bin/sh -c echo $(ls /home/) root 2>/dev/null\",\n       \"/bin/sh -c (dir 2>&1 *`|echo CMD);&<# rem #>echo powershell\",\n       \"/bin/sh -c chmod 744 /tmp/import_gpgkey.sh\"\n     ) or\n     process.parent.command_line in (\n       \"/opt/imunify360/venv/bin/python3 -m im360.run\", \"python3 /app_v2/user_monitor_v2.2.py\"\n    ) or\n     process.args like (\"*openssl*\", \"/home/*/connect.sh*\", \"*scraper*\", \"*crawler*\", \"*X-aws-ec2-metadata-token:*\") or\n     process.parent.command_line like (\"*scraper*\", \"*crawler*\", \"*ansible*\")\n   )\n  ] by process.parent.entity_id\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
            - id: T1059.006
              name: Python
              reference: "https://attack.mitre.org/techniques/T1059/006/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
          subtechnique:
            - id: T1071.001
              name: Web Protocols
              reference: "https://attack.mitre.org/techniques/T1071/001/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "7.15.0"
