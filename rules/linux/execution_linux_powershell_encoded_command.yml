id: cd6e64ec-2890-4bd8-9d07-bef06465b06f_1.0.16
type: security-rule
attributes:
  description: |
    Detects the execution of Powershell (pwsh) with the encoded command flag set in the process arguments, in conjunction
    with an unusual process command line length. Powershell usage on Linux is rare, and the usage of encoded commands with
    unusual lengths is through Powershell may indicate malicious behavior.
  rule_id: cd6e64ec-2890-4bd8-9d07-bef06465b06f
  license: Elastic License v2
  name: Linux Powershell Encoded Command
  os_list:
    - linux
  version: "1.0.16"
  query: "process where event.action == \"exec\" and event.type == \"start\" and process.name == \"pwsh\" and\nprocess.args : (\"-EncodedCommand\", \"-enc\", \"-E\") and process.args : (\"-nop\", \"-noprofile\") and \nlength(process.command_line) >= 100 and not (\n  process.parent.name in (\"node\", \"code\", \"code-insiders\", \"cursor\") or\n  process.parent.command_line : \"*Invoke-Pester*\" or\n  process.parent.args == \"--utility-sub-type=node.mojom.NodeService\" or\n  process.parent.executable like (\"/data/user/docker/*\", \"/tmp/.mount_Cursor*/usr/share/cursor/cursor\") or\n  process.parent.executable in (\"/usr/lib/electron30/electron\", \"/usr/lib/electron32/electron\", \"/tmp/newroot/proc/self/exe\") or\n  (\n    process.args == \"IAAoAEcAZQB0AC0ASABvAHMAdAApAC4AVgBlAHIAcwBpAG8AbgAuAFQAbwBTAHQAcgBpAG4AZwAoACkAIAA=\" and \n    process.parent.args == \"Invoke-LightRail.ps1\"\n  ) or\n  process.args like~ \"JABFAHIAcgBvAHIAQQBjAHQAaQBvAG4AUAByAGUAZgBlAHIAZQBuAGMAZQAgAD0AIAAnAFMAdABvAHAAJwAKAFsAdgBlAHIAcwBp*\" or\n  process.args in (\n    \"VwByAGkAdABlAC0ATwB1AHQAcAB1AHQAIAAnAEgARQBMAEwATwAgAFcATwBSAEwARAAnAA==\", \"dwByAGkAdABlAC0AaABvAHMAdAAgACIAdABlAHMAdAAiAA=\",\n    \"dwByAGkAdABlAC0AaABvAHMAdAAgACIAdABlAHMAdAAiAA==\"\n  )\n)\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
    - action: kill_process
      field: process.parent.entity_id
      state: 0
      tree: true
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.15.0"
