id: "8c2977dd-07ce-4a8e-8ccd-5e4183138675_1.0.16"
type: security-rule
attributes:
  description: |
    Detects network connections originating from a binary located in a potentially suspicious location, followed by command
    execution. This behavior is consistent with C2 agents such as Poseidon and Athena, connecting to a C2 framework such as
    Mythic. The agent polls the C2 for commands through a web request, after which the command gets executed.
  rule_id: "8c2977dd-07ce-4a8e-8ccd-5e4183138675"
  license: Elastic License v2
  name: Egress Network Connection Followed by Command Execution
  os_list:
    - linux
  version: "1.0.16"
  query: "sequence with maxspan=5s\n  [network where event.type == \"start\" and event.action == \"connection_attempted\" and\n   process.executable like (\"./*\", \"/boot/*\", \"/dev/shm/*\", \"/run/*\", \"/var/run/*\", \"/tmp/*\", \"/var/tmp/*\") and\n   not (\n      process.executable like \"/tmp/*/*\" or\n      destination.ip == null or\n      destination.ip == \"0.0.0.0\" or \n      cidrmatch(\n        destination.ip, \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\",\n        \"192.0.0.0/24\", \"192.0.0.0/29\",\"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\",\n        \"192.0.0.170/32\", \"192.0.0.171/32\", \"192.0.2.0/24\", \"192.31.196.0/24\", \"192.52.193.0/24\",\n        \"192.168.0.0/16\", \"192.88.99.0/24\", \"224.0.0.0/4\", \"100.64.0.0/10\", \"192.175.48.0/24\",\n        \"198.18.0.0/15\", \"198.51.100.0/24\", \"203.0.113.0/24\", \"240.0.0.0/4\", \"::1\", \"FE80::/10\",\n        \"FF00::/8\"\n      )\n    )\n  ] by process.entity_id\n  [process where event.type == \"start\" and event.action == \"exec\" and\n   process.parent.executable like (\"./*\", \"/boot/*\", \"/dev/shm/*\", \"/run/*\", \"/var/run/*\", \"/tmp/*\", \"/var/tmp/*\") and\n   process.args like (\n     \"ip*\", \"whoami*\", \"id*\", \"hostname*\", \"touch*\", \"curl*\", \"wget*\", \"chmod*\", \"busybox*\", \"chattr*\", \"echo*\",\n     \"php*\", \"perl*\", \"ruby*\", \"lua*\", \"openssl*\", \"nc*\", \"netcat*\", \"ncat*\"\n   ) and\n   not (\n     process.parent.executable in (\n       \"/srv/nessus_agent/sbin/nessus-agent-module\", \"/var/log/amazon/ssm/patch-baseline-operations\", \"./app\",\n       \"./config.json/usr/local/bin/py.test\", \"./runc\"\n     ) or\n     process.parent.name in (\"nseserv\", \"nexserv\", \"pycharm\") or\n     process.parent.command_line == \"/usr/bin/php ./boot-watcher.php\" or\n     process.working_directory == \"/usr/lib/adlumin\" or\n     process.parent.executable like (\n       \"/run/k3s/containerd/*\", \"/run/user/*/.bubblewrap/opt/chef/bin/chef-client\", \"/run/containerd/*\",\n       \"/var/tmp/.mount_Cursor*/usr/bin/cursor\", \"/var/run/docker/containerd/daemon/io.containerd.runtime.v2.task/moby/opt/docker/overlay2/*/merged/usr/sbin/httpd\",\n       \"/run/systemd/mount-rootfs/usr/sbin/php-fpm*\"\n     ) or\n     (\n       process.command_line == \"sh -c -- hostname -I 2>/dev/null | awk '{print $1}'\" and\n       process.parent.command_line like \"/usr/sbin/php-fpm* --nodaemonize --fpm-config /etc/php/*/fpm/php-fpm.conf\"\n     )\n   )\n  ] by process.parent.entity_id\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
          subtechnique:
            - id: T1071.001
              name: Web Protocols
              reference: "https://attack.mitre.org/techniques/T1071/001/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "7.15.0"
