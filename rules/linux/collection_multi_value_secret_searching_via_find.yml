id: "18405ccf-5443-4577-8b25-629aac642002_1.0.2"
type: security-rule
attributes:
  description: |
    Identifies the execution of the find command with a multi-value search pattern to collect sensitive information. This is
    a common technique used by attackers to collect sensitive information from the system.
  rule_id: "18405ccf-5443-4577-8b25-629aac642002"
  license: Elastic License v2
  name: Multi-Value Secret Searching via Find
  os_list:
    - linux
  reference:
    - "https://socket.dev/blog/10-npm-typosquatted-packages-deploy-credential-harvester"
    - "https://futuresearch.ai/blog/litellm-pypi-supply-chain-attack/"
    - "https://www.virustotal.com/gui/file/71e35aef03099cd1f2d6446734273025a163597de93912df321ef118bf135238"
  version: "1.0.2"
  query: "sequence by process.parent.entity_id with maxspan=10s\n  [process where event.type == \"start\" and event.action == \"exec\" and process.name == \"find\" and \n  process.args == \"-type\" and process.args == \"f\" and process.command_line like~ (\n    \"*password*\", \"*passwd*\", \"*pwd*\", \"*secret*\", \"*token*\", \"*apikey*\", \"*api.key*\", \"*access_key*\",\n    \"*private_key*\", \"*client_secret*\", \"*credential*\", \"*auth*\", \"*bearer*\",\n    \"*begin private*\", \"*begin openssh private*\", \"*begin rsa private*\", \"*begin dsa private*\", \"*begin ec private*\",\n    \"*id_rsa*\", \"*id_dsa*\", \"*id_ecdsa*\", \"*id_ed25519*\", \"*ssh-rsa*\", \"*ghp_*\", \"*github_pat*\", \"*xoxb-*\",\n    \"*hooks.slack.com*\", \"*discord.com/api/webhooks*\", \"*/.aws/*\", \"*/.env *\", \"*/.azure/*\",\n    \"*azure_client_id*\", \"*azure_tenant_id*\", \"*azure_client_secret*\", \"*azure_federated_token_file*\",\n    \"*identity_endpoint*\", \"*identity_header*\", \"*msi_endpoint*\", \"*msi_secret*\", \"*/var/run/secrets/azure/*\",\n    \"*/.config/gcloud/*\", \"*application_default_credentials.json*\", \"*type: service_account*\", \"*client_email*\",\n    \"*/var/run/secrets/google/*\", \"*google_application_credentials*\", \"*/run/secrets/kubernetes.io/serviceaccount/*\"\n  ) and process.parent.executable != null and\n  not (\n    (process.args == \"-L\" and process.args == \"-xdev\") or\n    process.parent.args like (\n      \"/etc/cron.daily/plesk-rrd-cleaner\", \"/war-deployment/ops.servers/backup.sh\", \"/home/*/tools/unyo/mulpay_deletelog.sh\",\n      \"/usr/local/psa/admin/sbin/spamtrain\", \"plz-out/bin/pipeline/authn/authn.bin.sh\", \"/usr/bin/makepkg\"\n    ) or\n    process.command_line in (\n      \"find /etc/zerum-stacks/lynx/wdr_proxy/.htpasswd -type f\",\n      \"find /run/credentials/getty@tty4.service -xdev -type f ( -perm -0002 -a ! -perm -1000 )\",\n      \"find /run/credentials/getty@tty3.service -xdev -type f ( -perm -0002 -a ! -perm -1000 )\",\n      \"find /run/snapd/ns/authd-msentraid.mnt -xdev -type f -perm -002 -exec chmod o-w {} ;\"\n    ) or\n    process.command_line like \"find /var/tmp/portage/*\" or\n    process.parent.executable in (\"/usr/bin/make\", \"/usr/bin/sw-engine\", \"/usr/local/bin/build_rpm\", \"/opt/puppetlabs/puppet/bin/ruby\") or\n    process.working_directory like (\n      \"/opt/rapid7/ir_agent/components/endpoint_broker/common\", \"/__w/Modular-Teepee/Modular-Teepee\",\n      \"/build*\", \"/opt/netconfs/home/*\", \"/tmp/plz_sandbox\"\n    ) or\n    process.args like (\n      \"/run/credentials/systemd-*.service\", \"/var/lib/sannav/docker/containers/*/mounts/secrets\", \"/snap/authd-msentraid/*\",\n      \"/home/*/.cache/yay/1password/pkg/1password/*\", \"/var/tmp/dracut.*/initramfs\"\n    ) or\n    (process.parent.name == \"bash\" and process.parent.command_line like \"*XDG_CONFIG_HOME*\" and process.working_directory == \"/tmp/plz_sandbox\") or\n    (\n      process.parent.executable == \"/usr/bin/xargs\" and\n      process.parent.command_line == \"xargs -I {} find {} -xdev -type f ( -perm -0002 -a ! -perm -1000 )\"\n    )\n  )] as event0\n  [process where event.type == \"start\" and event.action == \"exec\" and process.name == \"find\" and \n  not startswith~(process.command_line, event0.process.command_line) and\n  process.args == \"-type\" and process.args == \"f\" and process.command_line like~ (\n    \"*password*\", \"*passwd*\", \"*pwd*\", \"*secret*\", \"*token*\", \"*apikey*\", \"*api.key*\", \"*access_key*\",\n    \"*private_key*\", \"*client_secret*\", \"*credential*\", \"*auth*\", \"*bearer*\",\n    \"*begin private*\", \"*begin openssh private*\", \"*begin rsa private*\", \"*begin dsa private*\", \"*begin ec private*\",\n    \"*id_rsa*\", \"*id_dsa*\", \"*id_ecdsa*\", \"*id_ed25519*\", \"*ssh-rsa*\", \"*ghp_*\", \"*github_pat*\", \"*xoxb-*\",\n    \"*hooks.slack.com*\", \"*discord.com/api/webhooks*\", \"*/.aws/*\", \"*/.env *\", \"*/.azure/*\",\n    \"*azure_client_id*\", \"*azure_tenant_id*\", \"*azure_client_secret*\", \"*azure_federated_token_file*\",\n    \"*identity_endpoint*\", \"*identity_header*\", \"*msi_endpoint*\", \"*msi_secret*\", \"*/var/run/secrets/azure/*\",\n    \"*/.config/gcloud/*\", \"*application_default_credentials.json*\", \"*type: service_account*\", \"*client_email*\",\n    \"*/var/run/secrets/google/*\", \"*google_application_credentials*\", \"*/run/secrets/kubernetes.io/serviceaccount/*\"\n  )] as event1\n  [process where event.type == \"start\" and event.action == \"exec\" and process.name == \"find\" and\n  not startswith~(process.command_line, event1.process.command_line) and\n  process.args == \"-type\" and process.args == \"f\" and process.command_line like~ (\n    \"*password*\", \"*passwd*\", \"*pwd*\", \"*secret*\", \"*token*\", \"*apikey*\", \"*api.key*\", \"*access_key*\",\n    \"*private_key*\", \"*client_secret*\", \"*credential*\", \"*auth*\", \"*bearer*\",\n    \"*begin private*\", \"*begin openssh private*\", \"*begin rsa private*\", \"*begin dsa private*\", \"*begin ec private*\",\n    \"*id_rsa*\", \"*id_dsa*\", \"*id_ecdsa*\", \"*id_ed25519*\", \"*ssh-rsa*\", \"*ghp_*\", \"*github_pat*\", \"*xoxb-*\",\n    \"*hooks.slack.com*\", \"*discord.com/api/webhooks*\", \"*/.aws/*\", \"*/.env *\", \"*/.azure/*\",\n    \"*azure_client_id*\", \"*azure_tenant_id*\", \"*azure_client_secret*\", \"*azure_federated_token_file*\",\n    \"*identity_endpoint*\", \"*identity_header*\", \"*msi_endpoint*\", \"*msi_secret*\", \"*/var/run/secrets/azure/*\",\n    \"*/.config/gcloud/*\", \"*application_default_credentials.json*\", \"*type: service_account*\", \"*client_email*\",\n    \"*/var/run/secrets/google/*\", \"*google_application_credentials*\", \"*/run/secrets/kubernetes.io/serviceaccount/*\"\n  )]\n"
  min_endpoint_version: "8.4.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 1
    - action: kill_process
      field: process.entity_id
      state: 2
    - action: kill_process
      field: process.parent.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 1
    - action: kill_process
      field: process.parent.entity_id
      state: 2
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1082
          name: System Information Discovery
          reference: "https://attack.mitre.org/techniques/T1082/"
        - id: T1083
          name: File and Directory Discovery
          reference: "https://attack.mitre.org/techniques/T1083/"
      tactic:
        id: TA0007
        name: Discovery
        reference: "https://attack.mitre.org/tactics/TA0007/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1074
          name: Data Staged
          reference: "https://attack.mitre.org/techniques/T1074/"
          subtechnique:
            - id: T1074.001
              name: Local Data Staging
              reference: "https://attack.mitre.org/techniques/T1074/001/"
        - id: T1119
          name: Automated Collection
          reference: "https://attack.mitre.org/techniques/T1119/"
      tactic:
        id: TA0009
        name: Collection
        reference: "https://attack.mitre.org/tactics/TA0009/"
  internal:
    min_endpoint_version: "8.4.0"
