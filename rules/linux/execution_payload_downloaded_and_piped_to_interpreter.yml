id: "0369a845-9383-4be6-8102-5e5688b8253b_1.0.4"
type: security-rule
attributes:
  description: |
    This rule detects when a payload is downloaded by an interpreter, and piped to an interpreter. Attackers may use this
    technique to download and execute payloads for various malicious purposes, such as establishing persistence or
    exfiltrating data.
  rule_id: "0369a845-9383-4be6-8102-5e5688b8253b"
  license: Elastic License v2
  name: Payload Downloaded and Piped to Interpreter
  os_list:
    - linux
  version: "1.0.4"
  query: "sequence by process.parent.entity_id with maxspan=1s\n  [network where event.type == \"start\" and event.action == \"connection_attempted\" and (\n    process.name like (\n      \"bash\", \"dash\", \"sh\", \"tcsh\", \"tclsh\", \"wish\", \"csh\", \"zsh\", \"ksh\", \"fish\",\n      \"mksh\", \"busybox\", \"rscript\", \"r\", \"julia\", \"mono\", \"dotnet\", \"groovy\", \"kotlin\",\n      \"scala\", \"erlang\", \"escript\", \"ocaml\", \"ocamlopt\", \"ld.so\", \"ld-linux-x86-64.so.2\",\n      \"ld-musl-x86_64.so.1\", \"awk\", \"gawk\", \"mawk\", \"nawk\", \"node\", \"nodejs\", \"deno\",\n      \"env\", \"timeout\", \"nice\", \"stdbuf\", \"setsid\", \"setarch\", \"unshare\", \"nsenter\", \"flock\",\n      \"runuser\", \"sudo\", \"snap\"\n    ) or\n    process.name like (\"python*\", \"perl*\", \"ruby*\", \"lua*\", \"php*\", \"qemu-*-static\")\n  ) and \n   not (destination.ip == null or destination.ip == \"0.0.0.0\" or cidrmatch(\n     destination.ip, \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \"192.0.0.0/24\", \"192.0.0.0/29\",\n     \"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\", \"192.0.0.170/32\", \"192.0.0.171/32\", \"192.0.2.0/24\",\n     \"192.31.196.0/24\", \"192.52.193.0/24\", \"192.168.0.0/16\", \"192.88.99.0/24\", \"224.0.0.0/4\", \"100.64.0.0/10\",\n     \"192.175.48.0/24\",\"198.18.0.0/15\", \"198.51.100.0/24\", \"203.0.113.0/24\", \"240.0.0.0/4\", \"::1\", \"FE80::/10\",\n     \"FF00::/8\"\n     )\n   )]\n  [process where event.type == \"start\" and event.action == \"exec\" and process.interactive == true and (\n    process.name like (\n      \"bash\", \"dash\", \"sh\", \"tcsh\", \"tclsh\", \"wish\", \"csh\", \"zsh\", \"ksh\", \"fish\",\n      \"mksh\", \"busybox\", \"rscript\", \"r\", \"julia\", \"mono\", \"dotnet\", \"groovy\", \"kotlin\",\n      \"scala\", \"erlang\", \"escript\", \"ocaml\", \"ocamlopt\", \"ld.so\", \"ld-linux-x86-64.so.2\",\n      \"ld-musl-x86_64.so.1\", \"awk\", \"gawk\", \"mawk\", \"nawk\", \"node\", \"nodejs\", \"deno\"\n    ) or\n    process.name like (\"python*\", \"perl*\", \"ruby*\", \"lua*\", \"php*\")\n  ) and (\n    stringcontains(process.executable, process.command_line) or\n    stringcontains(process.name, process.command_line)\n  ) and\n  process.args_count == 1 and\n  /* Prevent FPs from long single argument strings due to parsing */\n  length(process.command_line) < 50 and\n  not (\n    process.parent.executable like (\n      \"/usr/sbin/univention-directory-listener\", \"/home/*/.local/zed.app/libexec/zed-editor\",\n      \"/home/*/nvim-linux-x86_64/bin/nvim\"\n    ) or\n    process.executable like (\n      \"/usr/local/php*/bin/php-cgi\", \"/opt/plesk/php/*/bin/php-cgi\", \"/opt/cpanel/ea-php*/root/usr/bin/php-cgi\", \"/usr/bin/php-cgi\",\n      \"/opt/universal/python/bin/python3*\", \"/opt/remi/php*/root/usr/bin/php-cgi\", \"/oracle/app/oracle/*/perl/bin/perl\",\n      \"/mnt/Xilinx/PetaLinux/*/usr/bin/python3.*.real\", \"/usr/bin/php-cgi*\", \"/oracle_agent/*/agent/*/perl/bin/perl\",\n      \"/home/*/anaconda3/envs/pnid_env/bin/python*\", \"/tmp/newroot/home/*/.nvm/versions/node/*/bin/node\"\n    ) or\n    (\n      process.name like \"python*\" and\n      process.args in (\"/usr/bin/pip\", \"/usr/local/bin/pip\")\n    )\n  )]\n"
  min_endpoint_version: "8.6.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 1
    - action: kill_process
      field: process.parent.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.6.0"
