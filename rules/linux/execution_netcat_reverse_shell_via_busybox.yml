id: "332a8018-6615-4d2d-aeff-61e85e5ae77b_1.0.9"
type: security-rule
attributes:
  description: |
    This rule detects the creation of a reverse shell through netcat using Busybox. Attackers may spawn reverse shells to
    establish persistence onto a target system. By proxying the execution through Busybox, attackers may attempt to evade
    detection.
  rule_id: "332a8018-6615-4d2d-aeff-61e85e5ae77b"
  license: Elastic License v2
  name: Netcat Reverse Shell via Busybox
  os_list:
    - linux
  version: "1.0.9"
  query: "sequence by process.entity_id with maxspan=5s\n  [process where event.type == \"start\" and event.action == \"exec\" and process.name == \"busybox\" and\n   process.command_line like (\"* nc *\", \"* netcat *\", \"* ncat *\") and not process.command_line like \"*-*z*\"]\n  [network where event.type == \"start\" and event.action == \"connection_attempted\" and process.name == \"busybox\" and \n   not (destination.ip == null or destination.ip == \"0.0.0.0\" or cidrmatch(\n     destination.ip, \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \"192.0.0.0/24\", \"192.0.0.0/29\",\n     \"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\", \"192.0.0.170/32\", \"192.0.0.171/32\", \"192.0.2.0/24\",\n     \"192.31.196.0/24\", \"192.52.193.0/24\", \"192.168.0.0/16\", \"192.88.99.0/24\", \"224.0.0.0/4\", \"100.64.0.0/10\",\n     \"192.175.48.0/24\",\"198.18.0.0/15\", \"198.51.100.0/24\", \"203.0.113.0/24\", \"240.0.0.0/4\", \"::1\", \"FE80::/10\",\n     \"FF00::/8\"\n     )\n   )\n  ]\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
    - action: kill_process
      field: process.entity_id
      state: 1
      tree: true
    - action: kill_process
      field: process.parent.entity_id
      state: 0
      tree: true
    - action: kill_process
      field: process.parent.entity_id
      state: 1
      tree: true
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1218
          name: System Binary Proxy Execution
          reference: "https://attack.mitre.org/techniques/T1218/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "7.15.0"
