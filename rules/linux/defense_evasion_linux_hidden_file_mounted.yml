id: "5b544dbb-2c66-42cd-a4ee-8d1e5afe9903_1.0.6"
type: security-rule
attributes:
  description: |
    Detects when a hidden file gets mounted. This is suspicious behavior, and has been observed in MacOS and Linux malware
    samples.
  rule_id: "5b544dbb-2c66-42cd-a4ee-8d1e5afe9903"
  license: Elastic License v2
  name: Linux Hidden File Mounted
  os_list:
    - linux
  version: "1.0.6"
  query: "process where event.type == \"start\" and event.action == \"exec\" and (\n  process.name in (\"mount\", \"pmount\", \"lsblk\") or \n  (process.name == \"udisksctl\" and process.args == \"mount\") \n) and process.args like (\"/media/.*\", \"/mnt/.*\", \"/tmp/mnt/.*\") and \nnot process.parent.command_line == \"/usr/sbin/automount --pid-file /var/run/autofs.pid\"\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1211
          name: Exploitation for Defense Evasion
          reference: "https://attack.mitre.org/techniques/T1211/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
