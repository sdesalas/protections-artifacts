id: f1e932e5-41c5-465f-823b-83fc6f379bb4_1.0.3
type: security-rule
attributes:
  description: |
    Identifies when a non-interactive terminal (tty) is being upgraded to a fully interactive shell. Attackers may upgrade a
    simple reverse shell to a fully interactive tty after obtaining initial access to a host, in order to obtain a more
    stable connection.
  rule_id: f1e932e5-41c5-465f-823b-83fc6f379bb4
  license: Elastic License v2
  name: Non-interactive Shell Upgrade
  os_list:
    - linux
  version: "1.0.3"
  query: "process where event.type == \"start\" and event.action == \"exec\" and (\n  (\n    process.name == \"stty\" and\n    process.args == \"raw\" and\n    process.args == \"-echo\" and\n    process.args_count >= 3\n  ) or\n  (\n    process.name == \"script\" and\n    process.args in (\"-qc\", \"-c\") and\n    process.args == \"/dev/null\" and\n    process.args_count == 4\n  )\n) and\nnot (\n  process.parent.command_line like (\"linode-longview\", \"*bootstrap*\", \"*homebrew*\", \"*/home/*/.claude/shell-snapshots/snapshot*\") or\n  process.parent.executable in (\"/usr/bin/expect\", \"/usr/bin/nsh-single-command\", \"/usr/bin/runc\", \"/tmp/newroot/home/linuxbrew/.linuxbrew/Homebrew/Library/Homebrew/vendor/portable-ruby/current/bin/ruby\") or\n  process.parent.executable like \"/home/linuxbrew/.linuxbrew/Homebrew/Library/Homebrew/vendor/portable-ruby/*/bin/ruby\" or\n  process.command_line == \"stty -echo raw min 0 time 2\" or\n  process.args like (\"/dev/tty*\", \"/dev/serial/*\") or\n  process.parent.args == \"/usr/share/emacs/site-lisp/emacspeak/servers/dtk-exp\" \n)\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.15.0"
