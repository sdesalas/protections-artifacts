id: "5f6dbe52-6643-486f-9130-256f58ba9a0c_1.0.12"
type: security-rule
attributes:
  description: |
    This rule detects when a shell command is executed as a child process of a Node.js process. Attackers may use Node.js to
    run shell commands for various malicious purposes, such as downloading and executing payloads, establishing persistence,
    or exfiltrating data.
  rule_id: "5f6dbe52-6643-486f-9130-256f58ba9a0c"
  license: Elastic License v2
  name: Suspicious Shell Command Execution via Node.js Parent
  os_list:
    - linux
  version: "1.0.12"
  query: "process where event.type == \"start\" and event.action == \"exec\" and\nprocess.parent.executable in (\"/bin/node\", \"/usr/bin/node\", \"/usr/local/bin/node\") and\nprocess.name in (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\") and process.args == \"-c\" and (\n  (process.command_line like \"*echo *\" and process.command_line like (\n    \"*./.*\", \"*http://*\", \"*https://*\", \"*/dev/tcp*\", \"*/dev/udp/*\", \"*import*pty*spawn*\",\n    \"*import*subprocess*call*\", \"*TCPSocket.new*\", \"*TCPSocket.open*\", \"*io.popen*\", \"*os.execute*\",\n    \"*fsockopen*\", \"*disown*\", \"*wget*\", \"*curl*\"\n    )\n  ) or\n  (\n    process.command_line like (\n      \"*/etc/cron*\", \"*/etc/rc.local*\", \"*/dev/tcp/*\", \"*/etc/init.d*\", \"*/etc/update-motd.d*\",\n      \"*/etc/ld.so*\", \"*/etc/sudoers*\", \"*base64 *\", \"*base32 *\", \"*base16 *\", \"*/etc/profile.d/*\",\n      \"*/dev/shm/*\", \"*/etc/ssh*\", \"*/home/*/.ssh/*\", \"*/root/.ssh*\" , \"*~/.ssh/*\", \"*autostart*\",\n      \"*xxd *\", \"*/etc/shadow*\", \"*/var/tmp/*\"\n    )\n  ) or\n  (process.command_line regex~ \"\"\".*http?://[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}.*\"\"\")\n) and \nnot (\n  process.executable like \"/tmp/newroot/*\" or\n  process.command_line like (\n    \"*169.254.169.254*\", \"*localhost*\", \"*127.0.0.1*\", \"*SNAPSHOT_FILE=*\", \"*/tmp/claude-shell-snapshot*\",\n    \"/home/*/.openclaw/*\", \"/api.notion.com/*\", \"/shubble.git/*\"\n  ) or\n  process.args like (\"-l SNAPSHOT_FILE*\", \"-l source*\", \"NODE_TLS_REJECT_UNAUTHORIZED=0*\", \"*.claude/*\", \"ssh-keyscan*\", \"supergateway --sse*\") or\n  (\n    process.command_line like \"/bin/sh -c rm -rf /dev/shm/streams/*\" and\n    process.parent.args == \"/usr/local/lib/node_modules/pm2/lib/ProcessContainerFork.js\"\n  ) or\n  process.parent.args like (\"/home/*/openclaw/*\", \"openclaw-gateway\", \"/opt/cursor-agent/node\", \"/usr/lib/node_modules/openclaw/dist/index.js\", \"/usr/local/bin/gemini\") or\n  process.parent.command_line like (\"*@playwright/cli*\", \"*playwright-cli*\") or\n  process.command_line in (\n    \"\"\"/bin/sh -c echo BROWSER=none > .env && echo DEMO=true >> .env && echo PORT=3000 >> .env && printf \"PUBLIC_URL=http://$(hostname -I | awk '{print $1}'):3000/\\n\" >> .env && echo WDS_SOCKET_PORT=3000 >> .env && printf \"WDS_SOCKET_HOST=$(hostname -I | awk '{print $1}')\\n\" >> .env && echo JSX_IMPORT_SOURCE=@ac/library-utils/dist/web-components/wc-jsx >> .env\"\"\",\n    \"/bin/sh -c chmod +x /etc/init.d/pm2-docker-deployer\", \"\"\"/bin/sh -c grep \"^#[ ]*Port[ ]*[0-9]*\" /etc/ssh/sshd_config 2>/dev/null\"\"\"\n  ) or\n  (process.command_line like \"*shubblecompose-app*\" and process.parent.command_line == \"node -r dotenv/config dist/server.mjs\") or \n  \n  process.parent.args in (\"supergateway\", \"/usr/local/bin/ccstatusline\", \"http://172.17.0.1:7790/sherlock/mcp\") or \n\n  process.args ==  \"../../node_modules/.bin/psdev tms run-all || echo ''\" or \n  \n  process.command_line like (\"*http://10.0.*\", \"*http://0.0.0.0:*\")\n)\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "7.15.0"
