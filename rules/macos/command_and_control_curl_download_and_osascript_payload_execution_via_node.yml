id: "1ef77794-f718-4bc0-a846-971c45aa00e7_1.0.11"
type: security-rule
attributes:
  description: |
    Detects when curl or nscurl is executed as an argument of a shell interpreter via a node parent process. This is a
    common technique used by malware to download additional payloads and evade traditional defenses.
  rule_id: "1ef77794-f718-4bc0-a846-971c45aa00e7"
  license: Elastic License v2
  name: Curl Download and OsaScript Payload Execution via Node
  os_list:
    - macos
  reference:
    - "https://medium.com/@D00MFist/loads-of-fun-e1f0dac3d4f8"
  version: "1.0.11"
  query: "sequence with maxspan=30s\n[process where event.type == \"start\" and process.parent.name == \"node\" and\n (\n  (process.name like~ (\"sh\", \"bash\", \"zsh\", \"tclsh*\") and\n    process.args == \"-c\" and\n    process.args like~ (\"curl*\", \"nscurl*\")) or \n  (process.name in (\"curl\", \"nscurl\"))\n )] by process.entity_id\n[process where event.type == \"start\" and event.action == \"exec\" and process.name == \"osascript\"] by process.parent.entity_id\n"
  min_endpoint_version: "8.7.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1105
          name: Ingress Tool Transfer
          reference: "https://attack.mitre.org/techniques/T1105/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.7.0"
