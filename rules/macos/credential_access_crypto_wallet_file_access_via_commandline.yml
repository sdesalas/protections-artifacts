id: "259d683b-8551-41ce-b101-d0897e530a36_1.0.6"
type: security-rule
attributes:
  description: |
    Detects the use of the Cat binary to access the contents of sensitive Crypto Wallet files. The AMOS malware along with
    other stealers have been observed using this technique in order to collect sensitive file data and stage it for
    exfiltration.
  rule_id: "259d683b-8551-41ce-b101-d0897e530a36"
  license: Elastic License v2
  name: Crypto Wallet File Access via CommandLine
  os_list:
    - macos
  version: "1.0.6"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.name == \"cat\" and\n process.args like~ (\"/Users/*/.electrum/*\",\n                     \"/Users/*/Library/Application_Support/*/Default/Extensions/*\",\n                     \"/Users/*/Library/Application Support/*/Default/Local Extension Settings/*\",\n                     \"/Users/*/Library/Application Support/Electrum/*\",\n                     \"/Users/*/Library/Application Support/Exodus/*\", \n                     \"/Users/*/Library/Application Support/Coinomi/*\",\n                     \"/Users/*/Library/Application Support/Atomic/*\",\n                     \"/Users/*/Library/Application Support/@trezor/*\",\n                     \"/Users/*/Library/Application Support/Ledger Live/*\",\n                     \"/Users/*/Library/Application Support/WasabiWallet/*\",\n                     \"/Users/*/Monero/*\",\n                     \"/Users/*/Library/Application Support/Bitcoin/*\",\n                     \"/Users/*/Library/Application Support/Litecoin/*\",\n                     \"/Users/*/Library/Application Support/DashCore/*\",\n                     \"/Users/*/Library/Application Support/ElectronCash/*\",\n                     \"/Users/*/Library/Application Support/Guarda/*\",\n                     \"/Users/*/Library/Application Support/Dogecoin/*\",\n                     \"/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/BraveWallet/*\",\n                     \"/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/Default/Local Extension Settings/pgojbichloddijphfmfhhfolimnhjklk/*\",\n                     \"/Users/*/Library/Application Support/Firefox/Profiles/*/extensions/*\") and\n  not process.Ext.effective_parent.executable in (\"/Library/NessusAgent/run/sbin/nessus-service\", \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\")\n"
  min_endpoint_version: "8.11.1"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.11.1"
