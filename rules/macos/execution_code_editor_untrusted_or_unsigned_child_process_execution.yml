id: "9b9776bb-6bf3-4c06-94ff-64159b52a2f3_1.0.20"
type: security-rule
attributes:
  description: |
    Detects when a code editor (VSCode, Cursor, or IntelliJ IDEA) spawns a shell to execute a self-signed and untrusted
    binary. This activity is indicative of a malicious 3rd party plugin or extension.
  rule_id: "9b9776bb-6bf3-4c06-94ff-64159b52a2f3"
  license: Elastic License v2
  name: Code Editor Untrusted or Unsigned Child Process Execution
  os_list:
    - macos
  version: "1.0.20"
  query: "process where event.type == \"start\" and event.action == \"exec\" and\n process.Ext.effective_parent.executable in (\"/Applications/IntelliJ IDEA.app/Contents/MacOS/idea\",\n                                             \"/Applications/Visual Studio Code.app/Contents/MacOS/Electron\",\n                                             \"/Applications/Cursor.app/Contents/MacOS/Cursor\") and \n process.parent.name in (\"bash\", \"sh\", \"zsh\") and\n (process.code_signature.trusted == false or process.code_signature.exists == false) and \n process.code_signature.signing_id regex~ \"\"\"[A-Za-z0-9\\_\\s]{2,}\\-[a-z0-9]{40}\"\"\" and \n process.args_count <= 4 and\n not process.executable like~\n                          (\"/opt/homebrew/*\",\n                           \"/Users/*/.homebrew/Cellar/*\",\n                           \"/nix/store/*\",\n                           \"/usr/local/microsoft/powershell/7/pwsh\", \n                           \"/usr/local/Cellar/*\",\n                           \"/opt/nordic/ncs/toolchains/*/Cellar/*\",\n                           \"/opt/nordic/ncs/toolchains/*/bin/*\",\n                           \"/Users/*/homebrew/Cellar/*\") and \n not process.command_line like~ (\"bento completion zsh --silent\", \"*http://localhost*\") and\n not process.code_signature.signing_id like~ (\"python3-*\", \n                                              \"ruby-*\", \n                                              \"python-*\", \n                                              \"node-*\", \n                                              \"rg-*\",\n                                              \"gs-*\",\n                                              \"jspawnhelper-*\",\n                                              \"fvm-*\")\n"
  min_endpoint_version: "8.7.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.7.0"
