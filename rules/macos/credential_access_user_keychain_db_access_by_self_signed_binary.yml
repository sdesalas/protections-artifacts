id: af71383d-f843-468a-b365-c202a547bc65_1.0.15
type: security-rule
attributes:
  description: |
    Detects when a self-signed binary (signed with native CodeSign tool) attempts to open the user's Keychain DB. This
    activity is not normal and should be considered suspicious. The macOS keychain is highly sought after and targeted by
    threat actors as it contains sensitive credential data that can be used to further compromise a user or environment.
  rule_id: af71383d-f843-468a-b365-c202a547bc65
  license: Elastic License v2
  name: User Keychain DB Access by Self-Signed Binary
  os_list:
    - macos
  reference:
    - "https://attack.mitre.org/techniques/T1555/001/"
    - "https://github.com/MythicAgents/poseidon"
  version: "1.0.15"
  query: "file where event.action == \"open\" and file.name like \"login.keychain-db\" and \n process.code_signature.trusted == false and \n process.code_signature.signing_id regex~ \"\"\"[A-Za-z0-9\\_\\s]{2,}\\-[a-z0-9]{40}\"\"\" and \n not process.executable like (\"/opt/homebrew/*\", \"/usr/local/Cellar/*\") and \n not process.code_signature.signing_id like~ (\"python-*\", \n                                              \"python3-*\", \n                                              \"apphost-*\", \n                                              \"laclient-*\",\n                                              \"emulator-*\",\n                                              \"eclipse-*\",\n                                              \"mksdcard-*\",\n                                              \"MicrosoftSqlToolsServiceLayer-*\",\n                                              \"binary-*\", \n                                              \"ruby-*\",\n                                              \"rg-*\", \n                                              \"jspawnhelper-*\",\n                                              \"dotnet-*\",\n                                              \"pnpm-*\") and \nnot Effective_process.executable like (\"/Users/*/Library/Application Support/Claude/claude-code/*/claude.app/Contents/MacOS/claude\", \"/Applications/Claude.app/Contents/MacOS/Claude\") and \nnot process.executable == \"/usr/local/bin/symfony\"\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.001
              name: Keychain
              reference: "https://attack.mitre.org/techniques/T1555/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.11.0"
