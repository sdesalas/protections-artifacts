id: "192ec591-1d00-4c16-a717-8a7481038d23_1.0.41"
type: security-rule
attributes:
  description: |
    Detects the use of curl to upload an archived file to an internet server. Threat actors often will collect data on a
    system and compress it in an archive file before exfiltrating the file back to their C2 server for review. Many threat
    actors have been seen utilizing curl to upload this archive file with the collected data to do this. Use of curl in this
    way while not inherently malicious should be considered highly abnormal and suspicious activity.
  rule_id: "192ec591-1d00-4c16-a717-8a7481038d23"
  license: Elastic License v2
  name: Potential Data Exfiltration via Curl
  os_list:
    - macos
  reference:
    - "https://everything.curl.dev/usingcurl/uploads.html"
    - "https://objective-see.org/blog/blog_0x71.html#-sentinelsneak"
    - "https://objective-see.org/blog/blog_0x66.html"
  version: "1.0.41"
  query: "sequence by process.entity_id with maxspan=15s\n[process where event.type == \"start\" and event.action == \"exec\" and process.name == \"curl\" and \n process.args like~ (\"-F\", \"-T\", \"-d\", \"--data*\") and \n process.args like~ (\"*@*.zip\", \"*@*.gz\", \"*@*.tgz\", \"b64=@*\") and \n process.args like~ \"http*\" and\n (process.parent.name like~ (\"osascript\", \"python*\", \"node\", \"ruby\", \"bash\", \"sh\", \"zsh\", \"perl\") or (process.parent.code_signature.trusted == false or process.parent.code_signature.exists == false)) and\n not process.args like (\"Authorization*\", \"PRIVATE-TOKEN*\") and \n not process.parent.command_line like \"/bin/bash --init-file /Applications/Visual Studio Code.app/Contents/Resources/app/out/vs/workbench/contrib/terminal/common/scripts/shellIntegration-bash.sh\" and\n not process.Ext.effective_parent.executable like (\"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\",\n                                               \"/Applications/Support.app/Contents/MacOS/Support\")]\n[network where event.type == \"start\" and not destination.domain : (\"*.cloud.es.io\", \"*.elastic-cloud.com\")]\n"
  min_endpoint_version: "8.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1048
          name: Exfiltration Over Alternative Protocol
          reference: "https://attack.mitre.org/techniques/T1048/"
      tactic:
        id: TA0010
        name: Exfiltration
        reference: "https://attack.mitre.org/tactics/TA0010/"
  internal:
    min_endpoint_version: "8.16.0"
