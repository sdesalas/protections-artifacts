id: "559fc9c7-f2fd-4fd9-af07-df8b7408e0b8_1.0.3"
type: security-rule
attributes:
  description: |
    Detects the use of the AuthorizationExecuteWithPrivileges function to provide the user a password prompt via an unsigned
    or untrusted application. Threat actors have recently used this in order to trick users into providing their malicious
    application with higher privileges.
  rule_id: "559fc9c7-f2fd-4fd9-af07-df8b7408e0b8"
  license: Elastic License v2
  name: ExecuteWithPrivileges Prompt via Unsigned or Untrusted Application
  os_list:
    - macos
  reference:
    - "https://securelist.com/new-macos-backdoor-crypto-stealer/111778/"
  version: "1.0.3"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.name == \"security_authtrampoline\" and\n process.args like (\"/Applications/*\", \"/Volumes/*\") and process.args like \"auth*\" and\n (process.parent.code_signature.exists == false or process.parent.code_signature.trusted == false) and \n process.Ext.effective_parent.executable like (\"/Applications/*\", \"/Volumes/*\")\n"
  min_endpoint_version: "8.10.2"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1548
          name: Abuse Elevation Control Mechanism
          reference: "https://attack.mitre.org/techniques/T1548/"
          subtechnique:
            - id: T1548.004
              name: Elevated Execution with Prompt
              reference: "https://attack.mitre.org/techniques/T1548/004/"
      tactic:
        id: TA0004
        name: Privilege Escalation
        reference: "https://attack.mitre.org/tactics/TA0004/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1548
          name: Abuse Elevation Control Mechanism
          reference: "https://attack.mitre.org/techniques/T1548/"
          subtechnique:
            - id: T1548.004
              name: Elevated Execution with Prompt
              reference: "https://attack.mitre.org/techniques/T1548/004/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.10.2"
