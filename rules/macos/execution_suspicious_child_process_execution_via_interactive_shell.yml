id: f10a679a-c266-494f-b3aa-53830949d288_1.0.22
type: security-rule
attributes:
  description: |
    Detects when a process is executed via an interactive shell. C2 platforms will commonly spawn an interactive shell
    providing the threat actor with a remote shell on the system as if they were physically at the terminal allowing them to
    send and execute commands manually.
  rule_id: f10a679a-c266-494f-b3aa-53830949d288
  license: Elastic License v2
  name: Suspicious Child Process Execution via Interactive Shell
  os_list:
    - macos
  version: "1.0.22"
  query: "sequence by process.Ext.effective_parent.entity_id with maxspan=1m\n[process where event.type == \"start\" and event.action == \"exec\" and (process.name in (\"zsh\", \"bash\", \"sh\", \"dash\", \"csh\", \"tcsh\", \"ksh\", \"tclsh\", \"fish\") or process.name like \"tclsh*\") and\n  process.args == \"-i\" and process.args_count <= 2 and\n  process.parent.name like~ (\"osascript\", \"python*\", \"node\")]\n[process where event.type == \"start\" and event.action == \"exec\" and \n  process.name like~ (\"curl\", \"whoami\", \"pwd\", \"nscurl\", \"wget\", \"dscl\", \"osascript\", \".*\") and\n  not process.args like~ (\"SendEnv=GIT_PROTOCOL\", \"-V\", \"--version\", \"-ss\", \"localhost*\") and\n  not process.parent.executable like~ \n                                  (\"/Library/Developer/CommandLineTools/usr/bin/git\",\n                                   \"/Users/*/.pyenv/*\",\n                                   \"/Users/*/.nvm/*\",\n                                   \"/Applications/Docker.app/Contents/Resources/bin/docker-credential-desktop\",\n                                   \"/Applications/Xcode.app/Contents/Developer/usr/bin/git\", \n                                   \"/opt/homebrew/*\") and\n  not (process.parent.command_line like \"bash /Users/*/.claude/statusline-command.sh\" and \n       process.Ext.effective_parent.executable == \"/Applications/Visual Studio Code.app/Contents/MacOS/Code\")]\n"
  min_endpoint_version: "8.7.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.7.0"
