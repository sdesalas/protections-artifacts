id: ecd7fb9b-4a70-4a8f-8035-2df7fc90cfd5_1.0.7
type: security-rule
attributes:
  description: |
    Detects the execution of an unsigned or untrusted binary by a shell interpreter via an XPC call. This activity can be
    carried out in several ways but the most common is when a Login Item gets created that is specified to execute a
    specific binary (in this instance an unsigned or untrusted binary). Threat actors will often utilize Login Items as a
    persistence mechanism to launch their payloads on system boot.
  rule_id: ecd7fb9b-4a70-4a8f-8035-2df7fc90cfd5
  license: Elastic License v2
  name: Unsigned or Untrusted Binary Execution via XPC call
  os_list:
    - macos
  version: "1.0.7"
  query: "process where event.type == \"start\" and event.action == \"exec\" and\n process.Ext.effective_parent.name == \"xpcproxy\" and\n process.parent.name in (\"sh\", \"zsh\", \"bash\") and\n (process.code_signature.trusted == false or process.code_signature.exists == false) and \n process.args_count <= 2 and \n process.executable like~ (\"/Volumes/*\", \"/Applications/*\", \"/Users/Shared/*\", \"/Library/Application Support/*\", \"/Users/*/Library/*\", \"/tmp/*\", \"/private/tmp/*\", \"/var/tmp/*\") and\n not process.name like~ \"python*\" and\n not process.executable like~ (\"/private/tmp/claude-*\")\n"
  min_endpoint_version: "8.7.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
        - id: T1559
          name: Inter-Process Communication
          reference: "https://attack.mitre.org/techniques/T1559/"
          subtechnique:
            - id: T1559.003
              name: XPC Services
              reference: "https://attack.mitre.org/techniques/T1559/003/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.7.0"
