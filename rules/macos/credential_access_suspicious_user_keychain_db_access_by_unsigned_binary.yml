id: f2887252-f1ac-4a3d-b551-0efe53852823_1.0.4
type: security-rule
attributes:
  description: |
    Detects when an unsigned binary executing from a volume mount or temporary execution path attempts to access the user's
    keychain file.
  rule_id: f2887252-f1ac-4a3d-b551-0efe53852823
  license: Elastic License v2
  name: Suspicious User Keychain DB Access by Unsigned Binary
  os_list:
    - macos
  reference:
    - "https://objective-see.org/blog/blog_0x7A.html"
  version: "1.0.4"
  query: "file where event.action == \"open\" and process.executable like (\"/Volumes/*\", \"/private/var/folders/*.app/*\") and \n file.path like~ \"/Users/*/Library/Keychains/login.keychain-db\" and file.name like \"login.keychain-db\" and \n process.code_signature.exists == false\n"
  min_endpoint_version: "8.10.2"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.001
              name: Keychain
              reference: "https://attack.mitre.org/techniques/T1555/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.10.2"
