id: "1f1b8910-e6b3-4d9d-9bf0-7a7728f5bce6_1.0.11"
type: security-rule
attributes:
  description: |
    Detects the use of specific commandline arguments that can be used with certain Electron based applications to covertly
    execute code for a variety of purposes.
  rule_id: "1f1b8910-e6b3-4d9d-9bf0-7a7728f5bce6"
  license: Elastic License v2
  name: Suspicious Electron Command Execution
  os_list:
    - macos
  reference:
    - "https://medium.com/@MalFuzzer/one-electron-to-rule-them-all-dc2e9b263daf"
  version: "1.0.11"
  query: "sequence with maxspan=15s\n[process where event.type == \"start\" and event.action == \"exec\"  and \n  process.command_line like~ (\"*--gpu-launcher=?*\", \n                             \"*--utility-cmd-prefix=?*\", \n                             \"*--browser-subprocess-path=?*\", \n                             \"*--renderer-cmd-prefix=?*\") and\n  not process.command_line like~ \"*--browser-subprocess-path=/Users/*Chromium Helper*\"] by process.entity_id\n[process where event.type == \"start\" and event.action == \"exec\"] by process.parent.entity_id\n"
  min_endpoint_version: "8.10.2"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.10.2"
