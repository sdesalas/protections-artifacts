id: "36536aab-671a-4f3f-aad2-8d113bedec8a_1.0.12"
type: security-rule
attributes:
  description: |
    Identifies when Python spawns the native Osascript binary to execute a Javascript payload. An adversary may use this
    technique to execute their malicious payload and obtain initial access to an endpoint.
  rule_id: "36536aab-671a-4f3f-aad2-8d113bedec8a"
  license: Elastic License v2
  name: Execution of JavaScript Payload via Python
  os_list:
    - macos
  reference:
    - "https://github.com/MythicAgents/medusa"
  version: "1.0.12"
  query: "process where event.action == \"exec\" and process.name == \"osascript\" and\n process.parent.name like~ \"python*\" and\n process.args == \"-l\" and process.args : \"JavaScript*\" and\n not process.command_line == \"osascript -l JavaScript -e ObjC.import('Foundation'); ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('ManagedInstalls').objectForKey('ManagedInstallDir'))\" and\n not process.Ext.effective_parent.executable in (\"/usr/local/jamf/bin/jamf\",\n                                                 \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\", \n                                                 \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfManagementService.app/Contents/MacOS/JamfManagementService\") and\n not process.Ext.effective_parent.executable : (\"/Applications/*/Contents/MacOS/*\",\n                                                \"/System/Applications/*/Contents/MacOS/*\")\n"
  min_endpoint_version: "8.5.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.5.0"
