id: ffda6af2-fa65-4ef6-88a4-318b396844fe_1.0.15
type: security-rule
attributes:
  description: |
    Detects the abnormal stop of the TCC daemon via the launchctl system binary. This activity can indicate an attempt to
    restart the TCC daemon following an exploit and may indicate a threat actors attempt to bypass security controls,
    escalate privileges, evade defenses.
  rule_id: ffda6af2-fa65-4ef6-88a4-318b396844fe
  license: Elastic License v2
  name: Suspicious Stop of TCCD via Launchctl
  os_list:
    - macos
  version: "1.0.15"
  query: "process where event.type == \"start\" and \n    (\n        (\n            process.name == \"launchctl\" and\n            process.args like~ \"stop\" and\n            process.args like~ \"com.apple.tccd\"\n        ) or \n        (\n            (process.name in (\"sh\", \"zsh\", \"bash\", \"dash\", \"csh\", \"tcsh\", \"ksh\", \"tclsh\", \"fish\") or process.name like \"tclsh*\") and\n            process.args == \"-c\" and\n            process.args like~ \"*com.apple.tccd\"\n        )\n    ) and not \nprocess.parent.executable in (\"/sbin/launchd\",\n                              \"/usr/local/jamf/bin/jamf\", \n                              \"/usr/bin/sudo\") and not \nprocess.Ext.effective_parent.executable in (\"/System/Applications/Utilities/Terminal.app/Contents/MacOS/Terminal\",\n                                            \"/usr/local/jamf/bin/jamf\", \n                                            \"/Applications/iTerm.app/Contents/MacOS/iTerm2\")\n"
  min_endpoint_version: "8.5.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1553
          name: Subvert Trust Controls
          reference: "https://attack.mitre.org/techniques/T1553/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.5.0"
