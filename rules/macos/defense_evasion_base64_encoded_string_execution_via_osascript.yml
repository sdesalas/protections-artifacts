id: "32b43493-dd69-47b3-ad63-34242aeebe39_1.0.7"
type: security-rule
attributes:
  description: |
    Detects when Osascript executes AppleScript containing a base64 encoded string. Many stealer samples execute AppleScript
    and some encode the script using base64 in order to avoid detection.
  rule_id: "32b43493-dd69-47b3-ad63-34242aeebe39"
  license: Elastic License v2
  name: Base64 Encoded String Execution via Osascript
  os_list:
    - macos
  version: "1.0.7"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.name == \"osascript\" and\n process.args == \"-e\" and\n process.args regex~ \"\"\".*[A-Za-z0-9\\+\\/]{30,}\\={0,2}.*\"\"\" and \n process.command_line : \"*base64*\" and\n not process.parent.code_signature.team_id == \"9BNSXJN65R\" and\n not process.Ext.effective_parent.executable like \"/Applications/Docker.app/Contents/MacOS/com.docker.backend\"\n"
  min_endpoint_version: "8.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.002
              name: AppleScript
              reference: "https://attack.mitre.org/techniques/T1059/002/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
        - id: T1140
          name: Deobfuscate/Decode Files or Information
          reference: "https://attack.mitre.org/techniques/T1140/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.16.0"
