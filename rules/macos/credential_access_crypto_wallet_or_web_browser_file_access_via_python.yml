id: cb8feeee-02f4-43bc-a836-4e510382acd3_1.0.6
type: security-rule
attributes:
  description: |
    Detects when Python accesses crypto wallet or web browser files on a macOS system like crypto wallet files, or web
    browser cookies.
  rule_id: cb8feeee-02f4-43bc-a836-4e510382acd3
  license: Elastic License v2
  name: Crypto Wallet or Web Browser File Access via Python
  os_list:
    - macos
  version: "1.0.6"
  query: "file where event.action == \"open\" and (process.name like~ \"python*\" or Effective_process.name like~ \"python*\") and \n (file.path like~ (\"/Users/*/.electrum/*\",\n                   \"/Users/*/Library/Application_Support/*/Default/Extensions/*\",\n                   \"/Users/*/Library/Application Support/*/Default/Local Extension Settings/*\",\n                   \"/Users/*/Library/Application Support/Electrum/*\",\n                   \"/Users/*/Library/Application Support/Exodus/*\", \n                   \"/Users/*/Library/Application Support/Coinomi/*\",\n                   \"/Users/*/Library/Application Support/Atomic/*\",\n                   \"/Users/*/Library/Application Support/@trezor/*\",\n                   \"/Users/*/Library/Application Support/Ledger Live/*\",\n                   \"/Users/*/Library/Application Support/WasabiWallet/*\",\n                   \"/Users/*/Monero/*\",\n                   \"/Users/*/Library/Application Support/Bitcoin/*\",\n                   \"/Users/*/Library/Application Support/Litecoin/*\",\n                   \"/Users/*/Library/Application Support/DashCore/*\",\n                   \"/Users/*/Library/Application Support/ElectronCash/*\",\n                   \"/Users/*/Library/Application Support/Guarda/*\",\n                   \"/Users/*/Library/Application Support/Dogecoin/*\",\n                   \"/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/BraveWallet/*\",\n                   \"/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/Default/Local Extension Settings/pgojbichloddijphfmfhhfolimnhjklk/*\",\n                   \"/Users/*/Library/Application Support/Firefox/Profiles/*/extensions/*\") or\n   file.name like~ (\"cookies.sqlite\", \n                    \"key?.db\", \n                    \"logins.json\", \n                    \"Cookies\", \n                    \"Cookies.binarycookies\", \n                    \"Login Data\")) and\n   not file.path like \"/Users/*/Library/Application Support/Slack/Cookies\" and\n   not Effective_process.executable like \"/Applications/Vorta.app/Contents/MacOS/vorta-darwin\"\n"
  min_endpoint_version: "8.11.1"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.11.1"
