id: "318d3d9d-ba60-40e3-bc8c-3d3304209a3c_1.0.38"
type: security-rule
attributes:
  description: |
    Identifies the use of osascript to execute scripts via standard input that may prompt a user with a rogue dialog for
    credentials.
  rule_id: "318d3d9d-ba60-40e3-bc8c-3d3304209a3c"
  license: Elastic License v2
  name: Potential Credentials Phishing via Osascript
  os_list:
    - macos
  reference:
    - "https://github.com/EmpireProject/EmPyre/blob/master/lib/modules/collection/osx/prompt.py"
    - "https://ss64.com/osx/osascript.html"
    - "https://www.elastic.co/security-labs/beyond-the-wail"
  version: "1.0.38"
  query: "process where event.action == \"exec\" and\n process.name == \"osascript\" and process.args == \"-e\" and process.command_line like~ (\"*osascript*display*dialog*password*\", \n                                                                                      \"*osascript*display*dialog*passphrase*\",\n                                                                                      \"*osascript*display*dialog*authenticate*\", \n                                                                                      \"*pass*display*dialog*\") and\n not (process.parent.executable == \"/usr/bin/sudo\" and process.command_line like~ \"*Encryption Key Escrow*\") and\n not (process.command_line like~ \"*-e with timeout of 3600 seconds*\" and user.id == 0 and process.parent.executable == \"/bin/bash\") and\n not process.parent.command_line like \"sudo*\" and\n not process.Ext.effective_parent.executable like~\n                                               (\"/usr/local/jamf/*\",\n                                                \"/Library/Intune/Microsoft Intune Agent.app/Contents/MacOS/IntuneMdmDaemon\",\n                                                \"/Library/Application Support/Mosyle/MosyleMDM.app/Contents/MacOS/MosyleMDM\",\n                                                \"/Applications/NinjaRMMAgent/programfiles/ninjarmm-macagent\",\n                                                \"/Applications/Karabiner-Elements.app/Contents/MacOS/Karabiner-Elements\",\n                                                \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\",\n                                                \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfManagementService.app/Contents/MacOS/JamfManagementService\")\n"
  min_endpoint_version: "8.8.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1056
          name: Input Capture
          reference: "https://attack.mitre.org/techniques/T1056/"
          subtechnique:
            - id: T1056.002
              name: GUI Input Capture
              reference: "https://attack.mitre.org/techniques/T1056/002/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.8.0"
