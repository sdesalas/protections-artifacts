id: a39d0c2f-30d0-4a32-b198-41b135f85bad_1.0.16
type: security-rule
attributes:
  description: |
    Detects when Curl is seen creating a .pdf or .doc file in a suspicious directory like /tmp or /users/shared. A recent
    DPRK sample was seen downloading a decoy document via Curl like this.
  rule_id: a39d0c2f-30d0-4a32-b198-41b135f85bad
  license: Elastic License v2
  name: Decoy Document Creation via Curl
  os_list:
    - macos
  reference:
    - "https://www.kandji.io/blog/todoswift-disguises-malware-download-behind-bitcoin-pdf"
  version: "1.0.16"
  query: "sequence by process.entity_id with maxspan=1m\n[process where event.type == \"start\" and event.action == \"exec\" and process.name in (\"curl\", \"nscurl\") and\n not process.parent.command_line like~ (\"*/.claude/shell-snapshots/*\", \"*/tmp/claude-*\") and\n not process.parent.executable like~ (\n  \"/opt/homebrew/*/codex/*/bin/codex\",\n  \"/Users/*/.codex/packages/*/bin/codex\"\n)]\n[file where event.action == \"modification\" and file.path like (\"/tmp/*\", \"/private/tmp/*\", \"/Users/Shared/*\", \"/Users/*/Library/*\") and\n file.extension in (\"pdf\", \"doc\") and process.name in (\"curl\", \"nscurl\") and\n not Effective_process.executable like~ (\n  \"/Applications/Cursor.app/Contents/MacOS/Cursor\",\n  \"/Applications/Codex.app/Contents/MacOS/*\",\n  \"/Applications/ChatGPT.app/Contents/MacOS/ChatGPT\",\n  \"/Applications/Visual Studio Code.app/Contents/MacOS/Code\",\n  \"/Users/*/Library/Application Support/Claude/claude-code/*/claude.app/Contents/MacOS/claude\",\n  \"/Applications/Visual Studio Code.app/Contents/MacOS/Electron\",\n  \"/Users/*/.local/share/claude/versions/*\",\n  \"/Applications/Zed.app/Contents/MacOS/zed\"\n) and not \n(Effective_process.executable like \"/Applications/Microsoft Word.app/Contents/MacOS/Microsoft Word\" and \n  file.path like \"/Users/*/Library/Containers/com.microsoft.Word/Data/tmp/Content.MSO/*\") and \n not file.path like \"/private/tmp/claude*\"]\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
          subtechnique:
            - id: T1204.002
              name: Malicious File
              reference: "https://attack.mitre.org/techniques/T1204/002/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.11.0"
