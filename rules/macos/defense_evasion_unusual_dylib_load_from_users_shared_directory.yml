id: "99ab55b4-03c9-4d1c-8766-6cf6d01fd5a2_1.0.5"
type: security-rule
attributes:
  description: |
    Detects when a dylib gets loaded from an unusual location ("/usr/local/lib") by an application in the /Users/Shared
    directory. This is highly uncommon and has been used by the LightSpy malware when loading post-exploitation modules.
  rule_id: "99ab55b4-03c9-4d1c-8766-6cf6d01fd5a2"
  license: Elastic License v2
  name: Unusual Dylib Load from Users Shared Directory
  os_list:
    - macos
  reference:
    - "https://www.huntress.com/blog/lightspy-malware-variant-targeting-macos"
  version: "1.0.5"
  query: "library where event.action == \"load\" and dll.path like \"/usr/local/lib/*\" and \n (process.executable like \"/Users/Shared/*\" or Effective_process.executable like \"/Users/Shared/*\")\n"
  min_endpoint_version: "8.11.1"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1574
          name: Hijack Execution Flow
          reference: "https://attack.mitre.org/techniques/T1574/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.1"
