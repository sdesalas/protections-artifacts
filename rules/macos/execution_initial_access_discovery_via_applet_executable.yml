id: d169079a-3495-40ce-9fde-387852b201de_1.0.8
type: security-rule
attributes:
  description: Detects the execution of a system or user discovery command via a compiled Apple script binary Applet.
  rule_id: d169079a-3495-40ce-9fde-387852b201de
  license: Elastic License v2
  name: Initial Access Discovery via Applet Executable
  os_list:
    - macos
  version: "1.0.8"
  query: "process where event.type == \"start\" and event.action == \"exec\" and \n (process.Ext.effective_parent.name == \"applet\" or process.parent.name == \"applet\") and \n process.name in (\"whoami\", \"sw_vers\", \"arch\", \"uname\")\n"
  min_endpoint_version: "8.7.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1033
          name: System Owner/User Discovery
          reference: "https://attack.mitre.org/techniques/T1033/"
      tactic:
        id: TA0007
        name: Discovery
        reference: "https://attack.mitre.org/tactics/TA0007/"
  internal:
    min_endpoint_version: "8.7.0"
