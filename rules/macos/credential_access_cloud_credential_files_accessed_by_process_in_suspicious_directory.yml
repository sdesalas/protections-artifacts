id: caf1b0eb-ab71-4474-84cf-d7821ec0c292_1.0.16
type: security-rule
attributes:
  description: |
    Identifies an untrusted or unsigned process accessing cloud credential and configuration files. Adversaries may attempt
    to access these files in order to gain access to sensitive data, laterally move or gain initial access into a cloud
    environment.
  rule_id: caf1b0eb-ab71-4474-84cf-d7821ec0c292
  license: Elastic License v2
  name: Cloud Credential Files Accessed by Process in Suspicious Directory
  os_list:
    - macos
  version: "1.0.16"
  query: "file where event.action == \"open\" and \n file.path like~ (\"/Users/*/.aws/*\", \"/Users/*/.config/gcloud/credentials.db\", \"/Users/*/.azure/*\") and\n Effective_process.executable != null and\n (Effective_process.executable like~\n                                 (\"/Users/Shared/*\",\n                                  \"/Users/*/Public/*\",\n                                  \"/private/tmp/*\",\n                                  \"/tmp/*\",\n                                  \"/var/root/*\",\n                                  \"/Library/WebServer/*\",\n                                  \"/Library/Graphics/*\",\n                                  \"/Library/Fonts/*\",\n                                  \"/private/var/root/Library/HTTPStorages/*\",\n                                  \"/private/var/root/Library/*\") or\n  process.executable like~ (\"/Users/Shared/*\",\n                            \"/Users/*/Public/*\",\n                            \"/private/tmp/*\",\n                            \"/tmp/*\",\n                            \"/var/root/*\",\n                            \"/Library/WebServer/*\",\n                            \"/Library/Graphics/*\",\n                            \"/Library/Fonts/*\",\n                            \"/private/var/root/Library/HTTPStorages/*\",\n                            \"/private/var/root/Library/*\")) and\n not process.name like~ \"python*\" and\n not process.executable like (\"/opt/homebrew/*\", \"/usr/local/Cellar/*\") and \n not (process.executable like (\"/private/tmp/*/terraform-provider-aws*\",\n      \"/private/tmp/*/docs-builder\", \"/private/tmp/*/terragrunt\", \"/private/tmp/*/terraform\") and file.name in (\"credentials\", \"config\")) and\n not (Effective_process.executable like~ (\n        \"/Users/*/Library/Application Support/Claude/claude-code/*/claude.app/Contents/MacOS/claude\",\n        \"/Applications/Visual Studio Code.app/Contents/MacOS/Code\",\n        \"/System/Applications/Utilities/Terminal.app/Contents/MacOS/Terminal\",\n        \"/Applications/Claude.app/Contents/MacOS/Claude\",\n        \"/Applications/GoLand.app/Contents/MacOS/goland\",\n        \"/private/tmp/claude-501/*\",\n        \"/Applications/Ghostty.app/Contents/MacOS/ghostty\",\n        \"/Applications/iTerm.app/Contents/MacOS/iTerm2\",\n        \"/Applications/Warp.app/Contents/MacOS/stable\") and\n      process.executable like \"/private/tmp/*\" and\n      file.path like \"/Users/*/.aws/*\") and\n not Effective_process.executable in (\"/Applications/Cursor.app/Contents/MacOS/Cursor\")\n"
  min_endpoint_version: "8.11.1"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.11.1"
