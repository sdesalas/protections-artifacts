id: "0e99bc1e-caeb-4a6e-b5ca-5d0d1ee6916c_1.0.5"
type: security-rule
attributes:
  description: |
    Identifies the Osascript process accessing sensitive Slack files. Adversaries can steal certain Slack files that allows
    them to log in to the Slack workspace as that user without a password in order to collect additional sensitive data or
    spy on the organization.
  rule_id: "0e99bc1e-caeb-4a6e-b5ca-5d0d1ee6916c"
  license: Elastic License v2
  name: Slack Workspace Files Accessed by Osascript
  os_list:
    - macos
  version: "1.0.5"
  query: "file where event.action == \"open\" and \n file.path like~ (\"/Users/*/Library/Application Support/Slack/storage/slack-workspaces.db\", \n                  \"/Users/*/Library/Application Support/Slack/Cookies.sqlite\", \n                  \"/Users/*/Library/Containers/com.tinyspeck.slackmacgap/Data/Library/Application Support/Slack/slack-workspaces.db\", \n                  \"/Users/*/Library/Containers/com.tinyspeck.slackmacgap/Data/Library/Application Support/Slack/Cookies.sqlite\") and \n process.name == \"osascript\"\n"
  min_endpoint_version: "8.11.1"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.executable
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.008
              name: Chat Messages
              reference: "https://attack.mitre.org/techniques/T1552/008/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.11.1"
