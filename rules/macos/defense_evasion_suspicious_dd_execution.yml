id: c99b8b83-2b2c-43b0-a962-ddb0274c6939_1.0.10
type: security-rule
attributes:
  description: |
    Detects suspicious execution of the dd command reading from standard input, often used by infostealer malware to convert
    decoded data. This technique is uncommon on macOS and typically indicates malicious activity.
  rule_id: c99b8b83-2b2c-43b0-a962-ddb0274c6939
  license: Elastic License v2
  name: Suspicious DD Execution
  os_list:
    - macos
  version: "1.0.10"
  query: "sequence by process.Ext.effective_parent.entity_id with maxspan=15s\n[process where event.type == \"start\" and event.action == \"exec\" and (process.name in (\"bash\", \"sh\", \"zsh\", \"osascript\", \"dash\", \"csh\", \"tcsh\", \"ksh\", \"tclsh\", \"fish\") or process.name like \"tclsh*\" or (process.code_signature.trusted == false or process.code_signature.exists == false)) and\n  not process.Ext.effective_parent.executable like (\"/Library/Addigy/go-agent\", \n                                                    \"/usr/local/bin/amagent\",\n                                                    \"/Applications/Support.app/Contents/MacOS/Support\",\n                                                    \"/Library/Application Support/Mosyle/MosyleMDM.app/Contents/MacOS/MosyleMDM\",\n                                                    \"/Library/Sentinel/sentinel-agent.bundle/Contents/MacOS/sentineld_helper.app/Contents/MacOS/sentineld_helper\",\n                                                    \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\",\n                                                    \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfManagementService.app/Contents/MacOS/JamfManagementService\", \n                                                    \"/usr/local/jamf/bin/jamf\") and\n  not process.parent.command_line like \"/bin/bash /Library/Scripts/Elastic SHIELD Firewall Manager LAUNCHD\"] \n[process where event.type == \"start\" and event.action == \"exec\" and process.name == \"dd\" and \n  process.command_line : \"*if=/dev/stdin*\"]\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
        - id: T1140
          name: Deobfuscate/Decode Files or Information
          reference: "https://attack.mitre.org/techniques/T1140/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.0"
