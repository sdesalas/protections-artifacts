id: "9c20c94b-aad6-4052-b5b4-70d968e70971_1.0.3"
type: security-rule
attributes:
  description: |
    Detects when a JavaScript file within an application's directory structure gets modified via Node.js. Malicious npm
    packages have been observed hijacking legitimate applications like Cursor editor by injecting malicious JavaScript code
    into application files to enable persistent code execution.
  rule_id: "9c20c94b-aad6-4052-b5b4-70d968e70971"
  license: Elastic License v2
  name: Application Javascript Injection via Nodejs
  os_list:
    - macos
  reference:
    - "https://socket.dev/blog/malicious-npm-packages-hijack-cursor-editor-on-macos"
  version: "1.0.3"
  query: "file where event.action == \"modification\" and file.extension == \"js\" and\n file.path like \"/Applications/*\" and (process.name == \"node\" or Effective_process.name == \"node\") and \n Effective_process.executable != \"/Applications/Visual Studio Code 2.app/Contents/MacOS/Electron\" and\n not file.path like \"/Applications/foundation4-docs/*\"\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1195
          name: Supply Chain Compromise
          reference: "https://attack.mitre.org/techniques/T1195/"
          subtechnique:
            - id: T1195.001
              name: Compromise Software Dependencies and Development Tools
              reference: "https://attack.mitre.org/techniques/T1195/001/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1554
          name: Compromise Host Software Binary
          reference: "https://attack.mitre.org/techniques/T1554/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.0"
