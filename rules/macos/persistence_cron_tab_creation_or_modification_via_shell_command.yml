id: e5fc1285-d312-4b45-9e6b-e6c037276c17_1.0.24
type: security-rule
attributes:
  description: |
    Detects the creation or modification of cron tabs by a suspicious or malicious process. Cron is one of the most well
    known persistence mechanisms for macOS. It is a scheduler that allows a user to create a scheduled execution. Threat
    actors have abused this tool to persist their malware on macOS systems.
  rule_id: e5fc1285-d312-4b45-9e6b-e6c037276c17
  license: Elastic License v2
  name: Cron Tab Creation or Modification via Shell Command
  os_list:
    - macos
  reference:
    - "https://theevilbit.github.io/beyond/beyond_0004/"
  version: "1.0.24"
  query: "sequence by process.entity_id with maxspan=5s\n[process where event.type == \"start\" and (process.name in (\"bash\", \"sh\", \"zsh\", \"dash\", \"csh\", \"tcsh\", \"ksh\", \"tclsh\", \"fish\") or process.name like \"tclsh*\") and process.args == \"-c\" and\n  not process.command_line : (\"*/.claude/shell-snapshots/*\", \"*/.codex/shell_snapshots/*\", \"*/.cursor/shell-snapshots/*\")]\n[file where event.action != \"deletion\" and \n  file.path like \"/private/var/at/tabs/*\" and\n  process.executable == \"/usr/bin/crontab\" and not\n  file.path == \"/private/var/at/tabs/root\"]\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1053
          name: Scheduled Task/Job
          reference: "https://attack.mitre.org/techniques/T1053/"
          subtechnique:
            - id: T1053.003
              name: Cron
              reference: "https://attack.mitre.org/techniques/T1053/003/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1053
          name: Scheduled Task/Job
          reference: "https://attack.mitre.org/techniques/T1053/"
          subtechnique:
            - id: T1053.003
              name: Cron
              reference: "https://attack.mitre.org/techniques/T1053/003/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
  internal:
    min_endpoint_version: "8.11.0"
