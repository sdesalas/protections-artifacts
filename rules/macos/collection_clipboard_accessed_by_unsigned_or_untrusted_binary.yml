id: "71ebb1e8-8089-4843-bdd7-8ae992c7df93_1.0.3"
type: security-rule
attributes:
  description: |
    Detects when an unsigned or untrusted binary attempts to access the Pasteboard XPC service in order to collect Clipboard
    data. Threat actors will monitor the clipboard or collect its contents in order to gain access to sensitive information
    such as passwords and seedphrases.
  rule_id: "71ebb1e8-8089-4843-bdd7-8ae992c7df93"
  license: Elastic License v2
  name: Clipboard accessed by Unsigned or Untrusted Binary
  os_list:
    - macos
  reference:
    - "https://github.com/MythicAgents/poseidon/blob/master/Payload_Type/poseidon/poseidon/agentfunctions/clipboard.go"
    - "https://github.com/MythicAgents/poseidon/blob/master/Payload_Type/poseidon/poseidon/agentfunctions/clipboard_monitor.go"
  version: "1.0.3"
  query: "sequence by process.entity_id with maxspan=10s\n[process where event.type == \"start\" and event.action == \"fork\" and process.name == \"launchd\" and \n  process.args like \"xpcproxy\" and process.args like \"com.apple.pasteboard*\" and \n  process.args_count == 2]\n[process where event.type == \"start\" and event.action == \"exec\" and \n  (process.code_signature.trusted == false or process.code_signature.exists == false)]\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1115
          name: Clipboard Data
          reference: "https://attack.mitre.org/techniques/T1115/"
      tactic:
        id: TA0009
        name: Collection
        reference: "https://attack.mitre.org/tactics/TA0009/"
  internal:
    min_endpoint_version: "8.11.0"
