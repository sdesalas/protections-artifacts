id: c851df2d-2400-4d11-8bc1-55a26b41263f_1.0.12
type: security-rule
attributes:
  description: |
    Detects the execution of a process that should not be executed by the native auval or auvaltool binaries. This activity
    may occur after a threat actor loads a malicious audio unit plug-in via auval or auvaltool providing them unsigned code
    execution in the context of those binaries.
  rule_id: c851df2d-2400-4d11-8bc1-55a26b41263f
  license: Elastic License v2
  name: Abnormal Auval Child Process Execution
  os_list:
    - macos
  reference:
    - "https://specterops.io/blog/2020/07/13/audio-unit-plug-ins/"
  version: "1.0.12"
  query: "process where event.type == \"start\" and (process.parent.name in (\"auval\", \"auvaltool\") or\n process.Ext.effective_parent.name in (\"auval\", \"auvaltool\")) and\n process.name like~ (\"curl\",\n                    \"nscurl\", \n                    \"osascript\", \n                    \"bash\", \n                    \"sh\", \n                    \"zsh\", \n                    \"python*\") and \n not process.command_line like (\"/Applications/Logic Pro X.app/Contents/MacOS/Logic Pro X\", \"/Applications/Logic Pro.app/Contents/MacOS/Logic Pro\") and\n not process.Ext.effective_parent.executable like (\"/Applications/Logic Pro X.app/Contents/MacOS/Logic Pro X\", \"/Applications/Logic Pro.app/Contents/MacOS/Logic Pro\")\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.11.0"
