id: "49c1f843-2461-4714-bdb1-ec8f0d930afb_1.0.4"
type: security-rule
attributes:
  description: |
    Detects unsigned binaries masquerading as "Ledger Live" cryptocurrency wallet software. These fake applications steal
    wallet seed phrases and private keys from victims through social engineering.
  rule_id: "49c1f843-2461-4714-bdb1-ec8f0d930afb"
  license: Elastic License v2
  name: Malicious Ledger Live Execution
  os_list:
    - macos
  reference:
    - "https://x.com/moonlock_lab/status/1902381331490738345"
  version: "1.0.4"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.name like~ \"ledger live\" and \n process.code_signature.trusted == false\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
          subtechnique:
            - id: T1036.005
              name: Match Legitimate Resource Name or Location
              reference: "https://attack.mitre.org/techniques/T1036/005/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.0"
