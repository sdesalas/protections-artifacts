id: "4abdbb10-6653-4a3b-8e7a-9c4f9382f03b_1.0.25"
type: security-rule
attributes:
  description: |
    Detects the abnormal unload of the Elastic Agent plist via the launchctl system binary. This activity can indicate an
    attempt to disable or destroy the agent's ability to continuously monitor system activity and may indicate a threat
    actors attempt to evade defenses and remain undetected or not be recorded while performing actions on their objective.
  rule_id: "4abdbb10-6653-4a3b-8e7a-9c4f9382f03b"
  license: Elastic License v2
  name: Suspicious Unload of Elastic Agent via Launchctl
  os_list:
    - macos
  version: "1.0.25"
  query: "process where event.type == \"start\" and \n    (\n        (\n            process.name == \"launchctl\" and\n            process.args : \"unload\" and\n            process.args like~ \"*co.elastic.elastic-agent.plist\"\n        ) or \n        (\n            (process.name in (\"sh\", \"zsh\", \"bash\", \"dash\", \"csh\", \"tcsh\", \"ksh\", \"tclsh\", \"fish\") or process.name like \"tclsh*\") and\n            process.args == \"-c\" and\n            process.command_line like~ \"*unload*co.elastic.elastic-agent.plist*\"\n        )\n    ) and not \nprocess.parent.name == \"elastic-agent\" and not\nprocess.parent.executable like~ (\"/sbin/launchd\",\n                                 \"/Library/PrivilegedHelperTools/*\",\n                                 \"/Library/Application Support/Mosyle/MosyleMDM.app/Contents/MacOS/MosyleMDM\",\n                                 \"/usr/local/jamf/bin/jamf\", \n                                 \"/usr/bin/sudo\") and not \nprocess.Ext.effective_parent.executable like~ (\"/System/Applications/Utilities/Terminal.app/Contents/MacOS/Terminal\",\n                                               \"/usr/local/jamf/bin/jamf\",\n                                               \"/usr/libexec/xpcproxy\",\n                                               \"/Library/Kandji/Kandji Agent.app/Contents/Helpers/Kandji Library Manager.app/Contents/MacOS/kandji-library-manager\",\n                                               \"/Library/PrivilegedHelperTools/com.todyl.SGNCoreHelper\", \n                                               \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfManagementService.app/Contents/MacOS/JamfManagementService\",\n                                               \"/Library/Elastic/Agent/data/elastic-agent*/elastic-agent.app/Contents/MacOS/elastic-agent\",\n                                               \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\",\n                                               \"/opt/jc/bin/jumpcloud-agent\",\n                                               \"/Library/Elastic/Agent/*\",\n                                               \"/Library/PrivilegedHelperTools/com.todyl.SGNCoreHelper\",\n                                               \"/Applications/NinjaRMMAgent/programfiles/ninjarmm-macagent\",\n                                               \"/Library/Intune/Microsoft Intune Agent.app/Contents/MacOS/IntuneMdmDaemon\",\n                                               \"/Library/Endgame/esensor\",\n                                               \"/Library/Application Support/Mosyle/MosyleMDM.app/Contents/MacOS/MosyleMDM\",\n                                               \"/Applications/iTerm.app/Contents/MacOS/iTerm2\") and not\nprocess.parent.command_line like~ \"/Library/Application Support/Mosyle/MosyleMDM.app/Contents/MacOS/MosyleMDM*\"\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1562
          name: Impair Defenses
          reference: "https://attack.mitre.org/techniques/T1562/"
          subtechnique:
            - id: T1562.001
              name: Disable or Modify Tools
              reference: "https://attack.mitre.org/techniques/T1562/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.0"
