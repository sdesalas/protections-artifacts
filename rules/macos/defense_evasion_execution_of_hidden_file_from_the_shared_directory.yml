id: e89d9e7d-54b8-4bda-9b00-fd669c15b18f_1.0.6
type: security-rule
attributes:
  description: |
    Detects the rename or modification of a hidden executable file within the /Users/Shared directory. This is a consistent
    technique seen utilized by DPRK actors in several separate and recent campaigns. The /Users/Shared directory is where
    hidden payloads have been staged.
  rule_id: e89d9e7d-54b8-4bda-9b00-fd669c15b18f
  license: Elastic License v2
  name: Execution of Hidden File from the Shared Directory
  os_list:
    - macos
  version: "1.0.6"
  query: "any where \n (\n  (event.category == \"file\" and event.action != \"deletion\" and file.Ext.header_bytes like~ (\"cffaedfe*\", \"cafebabe*\") and\n   file.path like \"/Users/Shared/*\" and file.name like~ \".*\" ) or\n  \n  (event.category == \"process\" and event.action == \"exec\" and process.executable like \"/Users/Shared/*\" and\n   (process.code_signature.trusted == false or process.code_signature.exists == false) and process.name like~ \".*\")\n )\n"
  min_endpoint_version: "8.8.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1564
          name: Hide Artifacts
          reference: "https://attack.mitre.org/techniques/T1564/"
          subtechnique:
            - id: T1564.001
              name: Hidden Files and Directories
              reference: "https://attack.mitre.org/techniques/T1564/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.8.0"
