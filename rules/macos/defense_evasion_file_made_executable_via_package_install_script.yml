id: "75f5d51a-218f-4d5b-80e5-eb74e498fde4_1.0.27"
type: security-rule
attributes:
  description: |
    Detects when a file in a suspicious file path is made executable via the chmod binary immediately after an installer pkg
    is executed via the postinstall script. This is not a common occurrence and indicates the installation of a malicious
    binary.
  rule_id: "75f5d51a-218f-4d5b-80e5-eb74e498fde4"
  license: Elastic License v2
  name: File Made Executable via Package Install Script
  os_list:
    - macos
  version: "1.0.27"
  query: "sequence by process.parent.pid with maxspan=30s\n[process where event.type == \"start\" and event.action == \"fork\" and \n    process.name like~ (\"bash\", \"zsh\", \"sh\", \"python*\", \"tclsh*\", \"dash\", \"csh\", \"tcsh\", \"ksh\", \"fish\") and\n    process.args like~ \"/tmp/PKInstallSandbox.*/Scripts/*/postinstall\" and \n    process.args like (\"/Users/*\", \"/Volumes/*\") and \n    not process.args like \"/Applications/Adobe Acrobat DC\"]\n[process where event.type == \"start\" and event.action == \"exec\" and \n    process.name == \"chmod\" and \n    process.args in (\"+x\", \"a+x\", \"0777\", \"777\") and\n    process.args like~ (\"/private/tmp/*\", \n                        \"/var/tmp/*\", \n                        \"/var/lib/*\",\n                        \"/tmp/*\", \n                        \"/var/folders/*\", \n                        \"/Users/Shared/*\", \n                        \"/Library/Containers/*\", \n                        \"/Users/*/Library/*\",\n                        \"/Users/*/Applications/*\",\n                        \"/var/root/*\", \n                        \"/Library/WebServer/*\",\n                        \"/Library/Fonts/*\",\n                        \"/usr/local/bin/*\") and\n    process.parent.name like~ (\"bash\", \"zsh\", \"sh\", \"python*\", \"tclsh*\", \"osascript\", \"dash\", \"csh\", \"tcsh\", \"ksh\", \"fish\") and not\n    process.command_line == \"chmod +x decompress\"]\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1222
          name: File and Directory Permissions Modification
          reference: "https://attack.mitre.org/techniques/T1222/"
          subtechnique:
            - id: T1222.002
              name: Linux and Mac File and Directory Permissions Modification
              reference: "https://attack.mitre.org/techniques/T1222/002/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.0"
