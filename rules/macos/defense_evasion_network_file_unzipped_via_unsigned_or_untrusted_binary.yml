id: "28611239-08e6-47d5-a88b-76136670788c_1.0.6"
type: security-rule
attributes:
  description: |
    Detects the decompression of a file into a specified folder directly from a network download using unzip via an unsigned
    or untrusted binary.
  rule_id: "28611239-08e6-47d5-a88b-76136670788c"
  license: Elastic License v2
  name: Network File Unzipped via Unsigned or Untrusted Binary
  os_list:
    - macos
  version: "1.0.6"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.name == \"unzip\" and \n process.args: \"/*/CFNetworkDownload*\" and process.args == \"-d\" and \n (process.parent.code_signature.trusted == false or process.parent.code_signature.exists == false) and\n not process.parent.name == \"figma_agent\"\n"
  min_endpoint_version: "8.12.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
        - id: T1140
          name: Deobfuscate/Decode Files or Information
          reference: "https://attack.mitre.org/techniques/T1140/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.12.0"
