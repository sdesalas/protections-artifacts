id: deb1c9c8-2227-4dd4-a198-4adb3216b40f_1.0.3
type: security-rule
attributes:
  description: Detects when Python executes and immediately makes an outbound network connection over FTP.
  rule_id: deb1c9c8-2227-4dd4-a198-4adb3216b40f
  license: Elastic License v2
  name: Python Outbound Network Connection over FTP
  os_list:
    - macos
  version: "1.0.3"
  query: "sequence by process.entity_id with maxspan=1m\n[process where event.type == \"start\" and event.action == \"exec\" and process.name like~ \"python*\"]\n[network where event.type == \"start\" and destination.port == 21 and\n   not cidrmatch(destination.ip, \n       \"240.0.0.0/4\", \"233.252.0.0/24\", \"224.0.0.0/4\", \"198.19.0.0/16\", \"192.18.0.0/15\", \n       \"192.0.0.0/24\", \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \n       \"192.0.2.0/24\", \"192.31.196.0/24\", \"192.52.193.0/24\", \"192.168.0.0/16\", \"192.88.99.0/24\", \n       \"100.64.0.0/10\", \"192.175.48.0/24\", \"198.18.0.0/15\", \"198.51.100.0/24\", \"203.0.113.0/24\",\n       \"::1\", \"FE80::/10\", \"FF00::/8\")]\n"
  min_endpoint_version: "8.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1105
          name: Ingress Tool Transfer
          reference: "https://attack.mitre.org/techniques/T1105/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.16.0"
