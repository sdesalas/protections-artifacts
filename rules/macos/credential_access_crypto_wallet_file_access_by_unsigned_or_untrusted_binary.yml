id: a3050eae-c8ae-434d-aeff-97112eddcb48_1.0.19
type: security-rule
attributes:
  description: |
    Detects when a suspicious process attempts to access a crypto wallet sensitive file. This is an alpha version of this
    rule and meant to be used to assess and test.
  rule_id: a3050eae-c8ae-434d-aeff-97112eddcb48
  license: Elastic License v2
  name: Crypto Wallet File Access by Unsigned or Untrusted Binary
  os_list:
    - macos
  reference:
    - "https://www.elastic.co/security-labs/beyond-the-wail"
  version: "1.0.19"
  query: "file where event.action == \"open\" and \n file.path like~ (\"/Users/*/.electrum/*\",\n                  \"/Users/*/Library/Application_Support/*/Default/Extensions/*\",\n                  \"/Users/*/Library/Application Support/*/Default/Local Extension Settings/*\",\n                  \"/Users/*/Library/Application Support/Electrum/*\",\n                  \"/Users/*/Library/Application Support/Exodus/*\", \n                  \"/Users/*/Library/Application Support/Coinomi/*\",\n                  \"/Users/*/Library/Application Support/Atomic/*\",\n                  \"/Users/*/Library/Application Support/@trezor/*\",\n                  \"/Users/*/Library/Application Support/Ledger Live/*\",\n                  \"/Users/*/Library/Application Support/WasabiWallet/*\",\n                  \"/Users/*/Monero/*\",\n                  \"/Users/*/Library/Application Support/Bitcoin/*\",\n                  \"/Users/*/Library/Application Support/Litecoin/*\",\n                  \"/Users/*/Library/Application Support/DashCore/*\",\n                  \"/Users/*/Library/Application Support/ElectronCash/*\",\n                  \"/Users/*/Library/Application Support/Guarda/*\",\n                  \"/Users/*/Library/Application Support/Dogecoin/*\",\n                  \"/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/BraveWallet/*\",\n                  \"/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/Default/Local Extension Settings/pgojbichloddijphfmfhhfolimnhjklk/*\",\n                  \"/Users/*/Library/Application Support/Firefox/Profiles/*/extensions/*\") and\n  process.executable != null and\n  (process.code_signature.trusted == false or process.code_signature.exists == false) and\n  not process.code_signature.signing_id : (\"rg-*\", \"git-*\", \"rg\") and\n  not process.executable like \"/opt/homebrew/Cellar/rtk/*/bin/rtk\" and\n  not (Effective_process.executable like \"/Library/Elastic/Agent/data/elastic-agent-*/elastic-agent.app/Contents/MacOS/elastic-agent\" and process.executable like \"/Library/Elastic/Agent/data/elastic-agent-*/components/osquery-extension.ext\")\n"
  min_endpoint_version: "8.11.1"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.executable
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.11.1"
