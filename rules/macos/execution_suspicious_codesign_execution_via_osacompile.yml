id: "7d2a993e-967f-4abd-b53e-ac14fdd66ddb_1.0.10"
type: security-rule
attributes:
  description: |
    Detects the abnormal execution of the codesign binary via Osacompile to forcefully sign all contents of a bundle. Threat
    actors may use this technique to bypass code signing requirements.
  rule_id: "7d2a993e-967f-4abd-b53e-ac14fdd66ddb"
  license: Elastic License v2
  name: Suspicious Codesign Execution via Osacompile
  os_list:
    - macos
  version: "1.0.10"
  query: "process where event.type == \"start\" and event.action == \"exec\" and \n process.name == \"codesign\" and\n process.args in (\"--sign\", \"-s\") and\n process.args in (\"--force\", \"-f\") and\n process.args in (\"--deep\") and\n ((process.parent.name == \"osacompile\") or (process.parent.name in (\"bash\", \"sh\", \"zsh\") and process.Ext.effective_parent.name like~ (\"terminal\", \"codesign\"))) and\n not process.Ext.effective_parent.executable like~ \"/Volumes/PostgreSQL*/postgresql*.app/Contents/MacOS/PostgreSQL\"\n"
  min_endpoint_version: "8.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.002
              name: AppleScript
              reference: "https://attack.mitre.org/techniques/T1059/002/"
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1553
          name: Subvert Trust Controls
          reference: "https://attack.mitre.org/techniques/T1553/"
          subtechnique:
            - id: T1553.002
              name: Code Signing
              reference: "https://attack.mitre.org/techniques/T1553/002/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.16.0"
