id: "2cf4a0ba-6d6e-4984-963e-ee4785f8c9b6_1.0.21"
type: security-rule
attributes:
  description: |
    Detects when a payload is dropped to a temporary location and executed via osascript. This technique is used by malware
    like Apfell agent to establish new callbacks.
  rule_id: "2cf4a0ba-6d6e-4984-963e-ee4785f8c9b6"
  license: Elastic License v2
  name: Osascript Payload Drop and Execute
  os_list:
    - macos
  reference:
    - "https://github.com/MythicAgents/apfell/"
    - "https://github.com/MythicAgents/apfell/blob/master/documentation-payload/apfell/commands/spawn_drop_and_execute.md"
    - "https://www.elastic.co/security-labs/beyond-the-wail"
  version: "1.0.21"
  query: "sequence with maxspan=15s\n[file where event.action == \"modification\" and \n  (file.path like~ (\"/Users/Shared/*\", \n                    \"/tmp/*\", \n                    \"/private/tmp/*\", \n                    \"/var/tmp/*\", \n                    \"/private/var/tmp/*\",\n                    \"/Users/*/Library/Assistant/CustomVocabulary/*\", \n                    \"/private/var/folders/*\", \n                    \"/var/folders/*\") or\n   file.name like \".*\") and\n   file.extension in (\"scpt\", \"sh\", \"js\", \"lock\") and\n   not file.path like~ (\"/tmp/claude/*\", \"/private/tmp/claude/*\", \"/private/tmp/claude-*/*\")] as event0\n[process where event.type == \"start\" and event.action == \"exec\" and \n  process.name == \"osascript\" and stringcontains~(process.command_line, event0.file.name) and\n  not process.args == \"-e\" and\n  not process.Ext.effective_parent.executable like~ (\"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\",\n                                      \"/Users/*/Library/Application Support/Claude/claude-code/*/claude.app/Contents/MacOS/claude\",\n                                      \"/Applications/Cursor.app/Contents/MacOS/Cursor\") and\n  not (process.parent.name in (\"zsh\", \"bash\", \"sh\") and process.parent.command_line : (\n    \"*/.claude/shell-snapshots/*\",\n    \"*/.codex/shell_snapshots/*\",\n    \"*/.cursor/shell-snapshots/*\"))]\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
    - action: kill_process
      field: process.parent.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1105
          name: Ingress Tool Transfer
          reference: "https://attack.mitre.org/techniques/T1105/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.11.0"
