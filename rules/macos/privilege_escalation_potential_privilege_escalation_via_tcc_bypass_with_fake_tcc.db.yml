id: "8446b30d-a9c4-4646-8261-979c06edd0ff_1.0.36"
type: security-rule
attributes:
  description: |
    Identifies the creation of an alternate or fake TCC database potentially containing rogue macOS privacy preferences. The
    creation of another TCC database should not occur normally in any circumstance and should be considered highly
    suspicious.
  rule_id: "8446b30d-a9c4-4646-8261-979c06edd0ff"
  license: Elastic License v2
  name: Potential Privilege Escalation via TCC bypass with fake TCC.db
  os_list:
    - macos
  reference:
    - "https://www.elastic.co/security-labs/inital-research-of-jokerspy"
    - "https://www.microsoft.com/security/blog/2022/01/10/new-macos-vulnerability-powerdir-could-lead-to-unauthorized-user-data-access/"
  version: "1.0.36"
  query: "file where file.name : \"TCC.db\" and \nprocess.executable != null and not\nevent.action in (\"open\", \"deletion\") and\nnot process.code_signature.team_id == \"UBF8T346G9\" and\nnot process.executable like~ (\n  \"/Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/Profiles/Runtimes/iOS.simruntime/Contents/Resources/RuntimeRoot/System/Library/PrivateFrameworks/TCC.framework/Support/tccd\",\n  \"/System/Library/PrivateFrameworks/TCC.framework/*\",\n  \"/usr/bin/sysdiagnose\",\n  \"/Applications/FortiClient.app/Contents/MacOS/FortiClient\",\n  \"/Applications/MosyleSecurity.app/Contents/MacOS/MosyleSecurity\",\n  \"/Applications/*/iOS.simruntime/*/System/Library/PrivateFrameworks/TCC.framework/tccd\",\n  \"/Users/*/Downloads/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/Profiles/Runtimes/iOS.simruntime/Contents/Resources/RuntimeRoot/System/Library/PrivateFrameworks/TCC.framework/tccd\",\n  \"/Library/Developer/CoreSimulator/*\",\n  \"/System/Library/Frameworks/FileProvider.framework/XPCServices/ArchiveService.xpc/Contents/MacOS/ArchiveService\",\n  \"/System/Library/PrivateFrameworks/SystemMigration.framework/Versions/A/Resources/systemmigrationd\",\n  \"/Applications/FortiClient.app/Contents/Frameworks/FortiClient Helper (Renderer).app/Contents/MacOS/FortiClient Helper (Renderer)\",\n  \"/usr/libexec/xpcproxy\", \"/sbin/launchd\") and \nnot file.path like \"/Volumes/*\" and\nnot (event.action == \"modification\" and file.path like \"/Users/*/Library/Application Support/com.apple.TCC/TCC.db\" and not file.path like \"/Users/*/*/Library/*\") and\nnot file.path like\n                (\"/Users/*/Library/Developer/CoreSimulator/Devices/*/data/Library/TCC/TCC.db\",\n                 \"/Users/*/Library/Developer/Xcode/UserData/Previews/Simulator Devices/*/data/Library/TCC/TCC.db\",\n                 \"/private/var/folders/*/com.apple.desktopservices.ArchiveService/TemporaryItems/NSIRD_ArchiveService_*/logs/Accessibility/TCC.db\")\n"
  min_endpoint_version: "8.10.2"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1068
          name: Exploitation for Privilege Escalation
          reference: "https://attack.mitre.org/techniques/T1068/"
        - id: T1548
          name: Abuse Elevation Control Mechanism
          reference: "https://attack.mitre.org/techniques/T1548/"
          subtechnique:
            - id: T1548.006
              name: TCC Manipulation
              reference: "https://attack.mitre.org/techniques/T1548/006/"
      tactic:
        id: TA0004
        name: Privilege Escalation
        reference: "https://attack.mitre.org/tactics/TA0004/"
  internal:
    min_endpoint_version: "8.10.2"
