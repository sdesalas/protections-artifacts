id: d8a84851-53ac-42ba-8c41-dd16fda7e9da_1.0.4
type: security-rule
attributes:
  description: |
    Detects when curl or nscurl is executed followed by osascript execution within 15 seconds from the same parent process.
    This pattern indicates potential malicious workflows where curl output is being piped to osascript for AppleScript
    execution, commonly used for payload downloads and immediate execution or C2 communication.
  rule_id: d8a84851-53ac-42ba-8c41-dd16fda7e9da
  license: Elastic License v2
  name: Curl Output Piped to Osascript
  os_list:
    - macos
  version: "1.0.4"
  query: "sequence by process.parent.entity_id with maxspan=20s\n[process where event.type == \"start\" and event.action == \"exec\" and\n  process.name in (\"curl\", \"nscurl\") and process.parent.name in (\"bash\", \"sh\", \"zsh\")]\n[process where event.type == \"start\" and event.action == \"exec\" and \n  ((process.args == \"osascript\" and process.args == \"-l\" and process.args == \"JavaScript\" and process.args_count == 3) or \n   (process.args == \"osascript\" and process.args_count == 1))]\n"
  min_endpoint_version: "8.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.002
              name: AppleScript
              reference: "https://attack.mitre.org/techniques/T1059/002/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1105
          name: Ingress Tool Transfer
          reference: "https://attack.mitre.org/techniques/T1105/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.16.0"
