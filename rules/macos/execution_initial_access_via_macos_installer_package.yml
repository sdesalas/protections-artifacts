id: d40ffcba-b83e-4d0a-8d6d-84385def8e18_1.0.48
type: security-rule
attributes:
  description: |
    Identifies when a macOS installer package is executed followed by the execution of a utility that's commonly used by
    attackers when downloading a payload, establishing persistence, profiling an endpoint, or decompressing/decoding a file
    before execution. An attacker may configure an installer package to download an additional payload or malware for
    execution to gain initial access or establish persistence on an endpoint.
  rule_id: d40ffcba-b83e-4d0a-8d6d-84385def8e18
  license: Elastic License v2
  name: Initial Access via macOS Installer Package
  os_list:
    - macos
  reference:
    - "https://redcanary.com/blog/clipping-silver-sparrows-wings/"
    - "https://youtu.be/Eow5uNHtmIg"
  version: "1.0.48"
  query: "sequence with maxspan=1m\n  [process where event.action == \"exec\" and process.name in (\"installer\", \"package_script_service\") and not\n    process.args like~\n                   (\"/Library/Application Support/JAMF/Downloads/*\",\n                    \"/tmp/KSInstallAction.*\",\n                    \"/tmp/FLEXnet\", \n                    \"./Epson Scanner Monitor.pkg\",\n                    \"./Epson Event Manager.pkg\",\n                    \"./Epson Scanner ICA Driver.pkg\",\n                    \"/tmp/PKInstallSandbox.*/Scripts/com.epson.pkg.eventmanager.*/Epson Scanner Monitor.pkg\",\n                    \"/Library/Addigy/ansible/packages/TeamViewer Host */TeamViewer_Host.pkg\") and not\n    process.parent.executable like~ (\"/usr/local/ltechagent/ltupdate\",\n                                     \"/sbin/launchd\", \n                                     \"/Users/*/Library/Caches/*\",\n                                     \"/Library/PrivilegedHelperTools/*\",\n                                     \"/Applications/Epson Software/EPSON Software Updater.app/Contents/MacOS/EPSON Software Updater\",\n                                     \"/private/var/folders/*/download/ARMDCHammer\") and not\n    process.Ext.effective_parent.executable in (\"/usr/local/jamf/bin/jamf\",\n                                                \"/Library/Intune/Microsoft Intune Agent.app/Contents/MacOS/IntuneMdmDaemon\",\n                                                \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\",\n                                                \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfManagementService.app/Contents/MacOS/JamfManagementService\",\n                                                \"/Volumes/Fiery Software Manager/Fiery Software Manager.app/Contents/MacOS/Fiery Software Manager\")]\n  [process where event.action in (\"exec\", \"fork\") and\n\n    // Descendant of macOS installer process\n    descendant of [\n        process where event.action == \"exec\" and\n        process.name in (\"Installer\", \"package_script_service\") and not\n        process.args like~\n                       (\"/Library/Application Support/JAMF/Downloads/*\",\n                        \"/tmp/KSInstallAction.*\",\n                        \"/tmp/PKInstallSandbox.*/Scripts/com.epson.pkg.eventmanager.*/Epson Scanner Monitor.pkg\",\n                        \"./Epson Scanner Monitor.pkg\",\n                        \"/tmp/FLEXnet\",\n                        \"/Library/Preferences/com.epson.Epson Scan OCR Component Pro.XmlType.UnInstallList.plist\",\n                        \"./Epson Event Manager.pkg\",\n                        \"./Epson Scanner ICA Driver.pkg\",\n                        \"/Library/Addigy/ansible/packages/TeamViewer Host */TeamViewer_Host.pkg\") and not\n        process.parent.executable like~\n                                    (\"/usr/local/ltechagent/ltupdate\",\n                                     \"/sbin/launchd\", \n                                     \"/Users/*/Library/Caches/*\",\n                                     \"/Applications/Epson Software/EPSON Software Updater.app/Contents/MacOS/EPSON Software Updater\",\n                                     \"/Library/PrivilegedHelperTools/*\",\n                                     \"/private/var/folders/*/download/ARMDCHammer\") and not\n        process.Ext.effective_parent.executable in (\"/usr/local/jamf/bin/jamf\",\n                                                    \"/Library/Intune/Microsoft Intune Agent.app/Contents/MacOS/IntuneMdmDaemon\",\n                                                    \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\", \n                                                    \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfManagementService.app/Contents/MacOS/JamfManagementService\",\n                                                    \"/Volumes/Mac_User_SW/Fiery Master Installer.app/Contents/MacOS/Fiery Master Installer\",\n                                                    \"/Volumes/Fiery Software Manager/Fiery Software Manager.app/Contents/MacOS/Fiery Software Manager\")\n        ] and\n\n    (\n      // curl scope limited to silver-sparrows to reduce noise\n      (process.name in (\"curl\", \"nscurl\") and process.command_line : (\"*.amazonaws.com*\",\n                                                         \"*.cloudfront.net*\", \n                                                         \"*raw.githubusercontent.com*\")) or\n      // No hang up executed with a bash command\n      (process.name == \"nohup\" and process.command_line : \"* &\") or\n      // Open SSL used to encrypt or encode/decode data\n      (process.name == \"openssl\" and process.args : (\"-base64\", \"-enc\")) or\n      // Base64 used to decode data\n      (process.name == \"base64\" and process.args : \"-d\") or\n      // chmod used to make files readable, writable and executable by all users\n      (process.name == \"chmod\" and process.args : (\"+x\", \"a+x\", \"0777\", \"755\", \"777\") and process.args : \"/tmp/*\" and\n\t   not process.args : (\"/tmp/com.adobe.acrobat.DC\", \"/tmp/FLEXnet\")) or\n      // xattr used to change extended attributes for a file\n      (process.name == \"xattr\" and ((process.args : \"com.apple.quarantine\" and \n        process.args : (\"-d\", \"-w\", \"-?d\", \"-?w\")) or\n        (process.args == \"-c\")) and process.args : \"/tmp/*\") or\n      (process.name == \"touch\" and process.args : \"/tmp/*\") or\n      (process.name in (\"bash\", \"sh\", \"zsh\") and process.args == \"-c\" and process.args : (\"*/bin/curl*.amazonaws.com*\",\n                                                                                        \"*/bin/curl*.cloudfront.net*\",\n                                                                                        \"*/bin/curl*raw.githubusercontent.com*\",\n                                                                                        \"*/bin/osascript*\",\n                                                                                        \"*/bin/wget*\", \n                                                                                        \"*/bin/chmod +x*\", \n                                                                                        \"*/bin/plutil*-convert*\", \n                                                                                        \"*/bin/openssl*-enc*\",\n                                                                                        \"*/bin/openssl*-base64*\",  \n                                                                                        \"*/bin/base64*-d*\", \n                                                                                        \"*/bin/xattr*com.apple.quarantine*\",\n                                                                                        \"*/bin/touch /tmp/*\"))\n    ) and\n    not process.parent.executable : (\"/sbin/launchd\", \n                                     \"/Users/*/Library/Caches/*\",\n                                     \"/Library/PrivilegedHelperTools/*\",\n                                     \"/private/var/folders/*/download/ARMDCHammer\") and not\n    process.Ext.effective_parent.executable in (\"/Applications/Epson Software/EPSON Software Updater.app/Contents/MacOS/EPSON Software Updater\",\n                                               \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\",\n                                               \"/Volumes/Mac_User_SW/Fiery Master Installer.app/Contents/MacOS/Fiery Master Installer\",\n                                               \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfManagementService.app/Contents/MacOS/JamfManagementService\",\n                                               \"/Volumes/Fiery Software Manager/Fiery Software Manager.app/Contents/MacOS/Fiery Software Manager\",\n                                               \"/usr/local/jamf/bin/jamf\")]\n"
  min_endpoint_version: "8.7.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1566
          name: Phishing
          reference: "https://attack.mitre.org/techniques/T1566/"
          subtechnique:
            - id: T1566.001
              name: Spearphishing Attachment
              reference: "https://attack.mitre.org/techniques/T1566/001/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
          subtechnique:
            - id: T1204.002
              name: Malicious File
              reference: "https://attack.mitre.org/techniques/T1204/002/"
        - id: T1569
          name: System Services
          reference: "https://attack.mitre.org/techniques/T1569/"
          subtechnique:
            - id: T1569.001
              name: Launchctl
              reference: "https://attack.mitre.org/techniques/T1569/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1543
          name: Create or Modify System Process
          reference: "https://attack.mitre.org/techniques/T1543/"
          subtechnique:
            - id: T1543.001
              name: Launch Agent
              reference: "https://attack.mitre.org/techniques/T1543/001/"
        - id: T1547
          name: Boot or Logon Autostart Execution
          reference: "https://attack.mitre.org/techniques/T1547/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1647
          name: Plist File Modification
          reference: "https://attack.mitre.org/techniques/T1647/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1082
          name: System Information Discovery
          reference: "https://attack.mitre.org/techniques/T1082/"
      tactic:
        id: TA0007
        name: Discovery
        reference: "https://attack.mitre.org/tactics/TA0007/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1105
          name: Ingress Tool Transfer
          reference: "https://attack.mitre.org/techniques/T1105/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.7.0"
