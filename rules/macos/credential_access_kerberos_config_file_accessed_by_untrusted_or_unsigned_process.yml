id: "143a7c98-62d3-4294-b660-6a98ae0a477c_1.0.6"
type: security-rule
attributes:
  description: |
    Identifies an untrusted or unsigned process accessing the Kerberos configuration file. Adversaries may attempt to access
    this file in order to gain situational awareness regarding the Active Directory domain to include its structure and
    settings.
  rule_id: "143a7c98-62d3-4294-b660-6a98ae0a477c"
  license: Elastic License v2
  name: Kerberos Config File Accessed by Untrusted or Unsigned Process
  os_list:
    - macos
  version: "1.0.6"
  query: "file where event.action == \"open\" and \n file.path like \"/etc/krb5.conf\" and \n (process.code_signature.trusted == false or process.code_signature.exists == false)\n"
  min_endpoint_version: "8.11.1"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.executable
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1558
          name: Steal or Forge Kerberos Tickets
          reference: "https://attack.mitre.org/techniques/T1558/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1016
          name: System Network Configuration Discovery
          reference: "https://attack.mitre.org/techniques/T1016/"
      tactic:
        id: TA0007
        name: Discovery
        reference: "https://attack.mitre.org/tactics/TA0007/"
  internal:
    min_endpoint_version: "8.11.1"
