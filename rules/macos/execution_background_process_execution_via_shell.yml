id: "603ac59e-9cca-4c48-9750-e38399079043_1.0.19"
type: security-rule
attributes:
  description: |
    Detects when a binary located in a suspicious location gets executed by a shell interpreter and put in the background
    via the & operator. Malwares may execute their payloads in the background in an effort to remain hidden.
  rule_id: "603ac59e-9cca-4c48-9750-e38399079043"
  license: Elastic License v2
  name: Background Process Execution via Shell
  os_list:
    - macos
  version: "1.0.19"
  query: "process where event.type == \"start\" and event.action == \"exec\" and \n    process.name like~ (\"bash\", \"sh\", \"zsh\", \"tclsh*\") and\n    process.args == \"-c\" and process.args like~ (\"/* &\", \"/*&\") and\n    process.args_count == 3 and \n    process.parent.executable like~ \n                                (\"/private/tmp/*\", \n                                 \"/var/tmp/*\", \n                                 \"/tmp/*\", \n                                 \"/var/folders/*\", \n                                 \"/Library/Containers/*\", \n                                 \"/Library/Graphics/*\",\n                                 \"/Users/Shared/*\", \n                                 \"/Users/*/Library/Preferences/*\", \n                                 \"/var/root/*\", \n                                 \"/Library/WebServer/*\", \n                                 \"/Library/Preferences/*\", \n                                 \"/Library/Services/*\", \n                                 \"/Library/Fonts/*\", \n                                 \"/usr/local/bin/*\")\n"
  min_endpoint_version: "8.10.2"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.10.2"
