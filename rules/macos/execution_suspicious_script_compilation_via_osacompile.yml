id: "60a14513-1793-4798-bad6-99c40fc4791e_1.0.8"
type: security-rule
attributes:
  description: |
    Detects the execution of the Osacompile binary followed by the immediate file modification of a script or executable
    file. This is a technique that threat actors have used by to compile scripts into executable binaries on victim systems.
  rule_id: "60a14513-1793-4798-bad6-99c40fc4791e"
  license: Elastic License v2
  name: Suspicious Script Compilation via Osacompile
  os_list:
    - macos
  version: "1.0.8"
  query: "sequence by process.entity_id with maxspan=30s\n[process where event.type == \"start\" and event.action == \"exec\" and \n  process.name == \"osacompile\" and process.args == \"-x\" and process.args == \"-o\"]\n[file where event.action == \"modification\" and \n  process.name == \"osacompile\" and file.extension == \"scpt\" and\n  not Effective_process.executable like~ \"/Volumes/PostgreSQL*osx.app/Contents/MacOS/PostgreSQL\"]\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.002
              name: AppleScript
              reference: "https://attack.mitre.org/techniques/T1059/002/"
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
          subtechnique:
            - id: T1027.004
              name: Compile After Delivery
              reference: "https://attack.mitre.org/techniques/T1027/004/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.0"
