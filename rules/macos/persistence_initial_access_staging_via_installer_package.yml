id: "6e53dbb1-55c6-419c-ab8e-75a5d53aac49_1.0.12"
type: security-rule
attributes:
  description: |
    Detects when an installer package creates a new directory structure and immediately moves an executable file into that
    directory. Threat actors will often include system preparation steps in their initial access installer packages
    implemented via pre or post install scripts with the purpose of preparing a location to drop and execute their payload
    from that won't raise suspicion.
  rule_id: "6e53dbb1-55c6-419c-ab8e-75a5d53aac49"
  license: Elastic License v2
  name: Initial Access Staging via Installer Package
  os_list:
    - macos
  version: "1.0.12"
  query: "sequence by process.entity_id with maxspan=15s\n[process where event.type == \"start\" and process.Ext.effective_parent.name == \"installer\" and\n  process.parent.name : (\"bash\", \"sh\", \"zsh\", \"dash\", \"csh\", \"tcsh\", \"ksh\", \"tclsh*\", \"fish\") and process.name in (\"cp\", \"mv\")]\n[file where event.action != \"deletion\" and file.Ext.header_bytes like~ (\"cffaedfe*\", \"cafebabe*\") and\n  (file.name like~ \".*\" or file.path like\n                                  (\"/Users/Shared/*\",\n                                   \"/tmp/*\", \n                                   \"/private/tmp/*\", \n                                   \"/var/tmp/*\", \n                                   \"/Library/WebServer/*\", \n                                   \"/Library/Graphics/*\", \n                                   \"/Library/Fonts/*\")) and\n  not file.path like\n                  (\"/private/tmp/org.gpgtools/gpgmailloader_install/GPGMailLoader.signed.mailbundle/Contents/MacOS/GPGMailLoader\",\n                   \"/private/tmp/PKInstallSandbox*\")]\n"
  min_endpoint_version: "8.8.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1546
          name: Event Triggered Execution
          reference: "https://attack.mitre.org/techniques/T1546/"
          subtechnique:
            - id: T1546.016
              name: Installer Packages
              reference: "https://attack.mitre.org/techniques/T1546/016/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
  internal:
    min_endpoint_version: "8.8.0"
