id: "72f9191c-f099-4349-8c73-794b4ee8c4ea_1.0.17"
type: security-rule
attributes:
  description: |
    Detects when Powershell (pwsh) spawns a highly abnormal or suspicious child process. Powershell usage on macOS is
    extremely rare but usage of Powershell to spawn a process like curl or osascript is almost always indicative of
    malicious behavior.
  rule_id: "72f9191c-f099-4349-8c73-794b4ee8c4ea"
  license: Elastic License v2
  name: Suspicious Powershell Child Process
  os_list:
    - macos
  version: "1.0.17"
  query: "process where event.type == \"start\" and \n (process.parent.name == \"pwsh\" or process.Ext.effective_parent.name == \"pwsh\") and \n process.name like~ (\"curl\", \"nscurl\", \"osascript\") and\n not process.args like~ (\"http://localhost*\", \"https://localhost*\",\n                          \"http://127.0.0.1*\", \"https://127.0.0.1*\") and\n not (\n    process.parent.code_signature.team_id == \"UBF8T346G9\" and process.parent.code_signature.trusted == true and\n    process.args == \"--aws-sigv4\" and process.args like~ (\"aws:amz:*:monitoring\", \"aws:amz:*:aps\")\n)\n"
  min_endpoint_version: "8.8.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.8.0"
