id: "752a2f7f-8d0c-4a7e-9665-ec948d14e947_1.0.5"
type: security-rule
attributes:
  description: |
    Detects the execution of an unsigned or untrusted process via a shell by the macOS installer binary. This activity is
    abnormal and may indicate an attempt to stage and execute a malicious payload.
  rule_id: "752a2f7f-8d0c-4a7e-9665-ec948d14e947"
  license: Elastic License v2
  name: Unsigned or Untrusted Process Execution via Installer
  os_list:
    - macos
  version: "1.0.5"
  query: "process where event.type == \"start\" and \n (process.code_signature.trusted == false or process.code_signature.exists == false) and \n process.args_count == 1 and \n process.parent.name in (\"bash\", \"sh\", \"zsh\") and\n process.Ext.effective_parent.executable like~ (\"/usr/sbin/installer\", \"/System/Library/CoreServices/Installer.app/Contents/MacOS/Installer\")\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1546
          name: Event Triggered Execution
          reference: "https://attack.mitre.org/techniques/T1546/"
          subtechnique:
            - id: T1546.016
              name: Installer Packages
              reference: "https://attack.mitre.org/techniques/T1546/016/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
  internal:
    min_endpoint_version: "8.11.0"
