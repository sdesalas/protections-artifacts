id: f8ec483c-dc3b-4d60-b863-65f61b4d382e_1.0.7
type: security-rule
attributes:
  description: Detects the execution of arbitrary Python code via Nodejs.
  rule_id: f8ec483c-dc3b-4d60-b863-65f61b4d382e
  license: Elastic License v2
  name: Arbitrary Python Code Execution via Nodejs
  os_list:
    - macos
  reference:
    - "https://jp.security.ntt/tech_blog/contagious-interview-ottercookie"
  version: "1.0.7"
  query: "process where event.type == \"start\" and event.action == \"exec\" and process.name like~ \"python*\" and process.args == \"-c\" and \n (process.parent.name == \"node\" or process.Ext.effective_parent.name == \"node\") and\n process.command_line : (\"*os.system*\", \"*subprocess.run*\", \"*subprocess.Popen*\", \"*exec(*\", \"*eval(*\") and\n not (process.command_line like~ \"*subprocess.run*\" and process.command_line like~ \"\"\"*/bin/ps\",*\"\"\") and\n not process.command_line like~ \"*-c import sys;exec(eval(sys.stdin.readline()))\"\n"
  min_endpoint_version: "8.10.2"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.006
              name: Python
              reference: "https://attack.mitre.org/techniques/T1059/006/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.10.2"
