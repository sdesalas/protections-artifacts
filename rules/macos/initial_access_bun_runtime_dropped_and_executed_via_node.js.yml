id: "8d439fa0-a386-4dc8-a5ce-daa669a80fc5_1.0.1"
type: security-rule
attributes:
  description: |
    Detects creation of a Bun runtime binary (bun/bun.exe) by common download, archive, shell, or Node.js processes,
    followed within one minute by execution of Bun as a child or descendant of Node.js. Multiple npm supply chain campaigns
    (including Mini Shai-Hulud / Team PCP style attacks) use a Node install/preinstall script to fetch a standalone Bun
    binary, then invoke Bun to run a heavily obfuscated second-stage payload and evade Node-focused monitoring.
  rule_id: "8d439fa0-a386-4dc8-a5ce-daa669a80fc5"
  license: Elastic License v2
  name: Bun Runtime Dropped and Executed via Node.js
  os_list:
    - macos
  reference:
    - "https://www.stepsecurity.io/blog/a-mini-shai-hulud-has-appeared"
    - "https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain"
    - "https://www.elastic.co/security-labs/threat-command/axios-one-rat-to-rule-them-all"
  version: "1.0.1"
  query: "sequence by user.id with maxspan=1m\n  [file where event.type == \"creation\" and\n    process.name : (\n      \"curl\", \"curl.exe\",\n      \"wget\", \"wget.exe\",\n      \"powershell.exe\", \"pwsh.exe\",\n      \"node\", \"node.exe\",\n      \"tar\", \"tar.exe\",\n      \"unzip\", \"unzip.exe\"\n    ) and\n    file.name : (\"bun\", \"bun.exe\")]\n  [process where event.type == \"start\" and event.action in (\"exec\", \"start\") and\n    process.name : (\"bun\", \"bun.exe\") and\n    (\n      process.parent.name : (\"node\", \"node.exe\") or\n      descendant of [\n        process where event.action in (\"start\", \"exec\") and process.name : (\"node\", \"node.exe\")\n      ]\n    ) and \n    not process.args in (\"--revision\", \"--version\", \"/builds/stovetv-backend/partners-chat-fe/scripts/update-app-version.mjs\")]\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
      tree: true
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1195
          name: Supply Chain Compromise
          reference: "https://attack.mitre.org/techniques/T1195/"
          subtechnique:
            - id: T1195.002
              name: Compromise Software Supply Chain
              reference: "https://attack.mitre.org/techniques/T1195/002/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1105
          name: Ingress Tool Transfer
          reference: "https://attack.mitre.org/techniques/T1105/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "7.15.0"
