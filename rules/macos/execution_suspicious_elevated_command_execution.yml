id: "2f7b4008-99c6-46e9-9d93-97a4b801ac91_1.0.8"
type: security-rule
attributes:
  description: |
    Detects potential malicious elevated command executions on macOS by monitoring processes spawned by authtrampoline,
    which handles macOS privilege escalation. It flags processes with untrusted or missing code signatures, commonly abused
    process names like osascript, curl, and dscl, as well as shell executions with suspicious arguments. The aim is to
    swiftly identify and respond to abnormal elevated activities on a macOS system.
  rule_id: "2f7b4008-99c6-46e9-9d93-97a4b801ac91"
  license: Elastic License v2
  name: Suspicious Elevated Command Execution
  os_list:
    - macos
  version: "1.0.8"
  query: "process where event.type == \"start\" and event.action == \"exec\" and\n process.parent.name == \"authtrampoline\" and\n (\n  ((process.code_signature.trusted == false or process.code_signature.exists == false) and not process.executable like~ (\"/opt/homebrew/*\", \"/usr/local/Cellar/*\")) or \n  (process.name like~ (\"osascript\", \"curl\", \"nscurl\", \"dscl\", \".*\")) or\n  (process.name in (\"sh\", \"bash\", \"zsh\") and process.args == \"-c\" and\n    process.args like~ (\"dscl*\", \"curl*\", \"nscurl*\", \"osascript*\", \"/tmp/*\", \"/private/tmp/*\", \"/var/tmp/*\"))\n )\n"
  min_endpoint_version: "8.5.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.5.0"
