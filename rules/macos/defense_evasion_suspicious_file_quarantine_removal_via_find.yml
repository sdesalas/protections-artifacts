id: c43102bc-f307-48a4-bfc5-a02444b3fed2_1.0.4
type: security-rule
attributes:
  description: |
    Detects when the Find command is executed with the exec option in order to execute the Xattr command for removal of the
    file quarantine bit.
  rule_id: c43102bc-f307-48a4-bfc5-a02444b3fed2
  license: Elastic License v2
  name: Suspicious File Quarantine Removal via Find
  os_list:
    - macos
  version: "1.0.4"
  query: "sequence with maxspan=3s\n[process where event.type == \"start\" and event.action == \"exec\" and process.name == \"find\" and \n  process.args in~ (\"-exec\", \"-execdir\") and \n  process.args like~ \"*com.apple.quarantine*\"] by process.parent.entity_id\n[file where event.action == \"extended_attributes_delete\" and \n  process.executable like \"/usr/bin/xattr\"] by Effective_process.entity_id\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.entity_id
      state: 1
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1553
          name: Subvert Trust Controls
          reference: "https://attack.mitre.org/techniques/T1553/"
          subtechnique:
            - id: T1553.001
              name: Gatekeeper Bypass
              reference: "https://attack.mitre.org/techniques/T1553/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.0"
