id: "9885462e-e551-4d61-91ad-1e76ec67a040_1.0.6"
type: security-rule
attributes:
  description: |
    Detects when Osascript is seen accessing sensitive web browser files. Adversaries may steal credentials from web
    browsers by reading files specific to the target browser.
  rule_id: "9885462e-e551-4d61-91ad-1e76ec67a040"
  license: Elastic License v2
  name: Web Browser Credential Data Accessed by Osascript
  os_list:
    - macos
  version: "1.0.6"
  query: "file where event.action == \"open\" and process.name == \"osascript\" and \n file.name like~ (\"cookies.sqlite\", \n                  \"key?.db\", \n                  \"logins.json\", \n                  \"Cookies\", \n                  \"Cookies.binarycookies\", \n                  \"Login Data\")\n"
  min_endpoint_version: "8.10.2"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1539
          name: Steal Web Session Cookie
          reference: "https://attack.mitre.org/techniques/T1539/"
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.003
              name: Credentials from Web Browsers
              reference: "https://attack.mitre.org/techniques/T1555/003/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.10.2"
