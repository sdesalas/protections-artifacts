id: "3540b77a-80a6-42ea-b7f4-714291a28a62_1.0.5"
type: security-rule
attributes:
  description: |
    Detects the execution of curl via an automator application. Threat actors have been using automator applications in
    order to bypass security controls and download second stage payloads as automator apps can be signed/trusted by the
    system and are generally not subject to scanning.
  rule_id: "3540b77a-80a6-42ea-b7f4-714291a28a62"
  license: Elastic License v2
  name: Curl Execution via Automator Application
  os_list:
    - macos
  version: "1.0.5"
  query: "process where event.type == \"start\" and process.parent.name in (\"Application Stub\", \"Automator Application Stub\") and \n (\n  (process.name like~ (\"sh\", \"bash\", \"zsh\", \"tclsh*\") and\n    process.args == \"-c\" and\n    process.args like~ (\"curl*\", \"nscurl*\")) or\n  (process.name in (\"curl\", \"nscurl\"))\n )\n"
  min_endpoint_version: "8.7.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1105
          name: Ingress Tool Transfer
          reference: "https://attack.mitre.org/techniques/T1105/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.7.0"
