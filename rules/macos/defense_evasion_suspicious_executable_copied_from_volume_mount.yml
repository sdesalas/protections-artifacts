id: "0facb446-7d95-4b27-bd40-490bbec5a95b_1.0.6"
type: security-rule
attributes:
  description: |
    Detects when an executable file is copied from a hidden directory on a volume mounted disk to the applications
    directory. Geacon samples have been observed utilizing this technique as a method for setting up persistence with the
    second stage payload prior to establishing persistence via the .zshrc file.
  rule_id: "0facb446-7d95-4b27-bd40-490bbec5a95b"
  license: Elastic License v2
  name: Suspicious Executable Copied from Volume Mount
  os_list:
    - macos
  reference:
    - "https://github.com/darkr4y/geacon"
  version: "1.0.6"
  query: "sequence by process.entity_id with maxspan=3s\n  [process where event.type == \"start\" and event.action == \"exec\" and process.name == \"cp\" and \n    process.args_count == 3 and process.args in (\"cp\", \"/bin/cp\", \"/usr/bin/cp\") and \n    process.args like~ \"/Volumes/*/.*\" and process.args like \"/Applications/*\"] as event0\n  [file where event.action == \"modification\" and process.name == \"cp\" and file.path like \"/Applications/*\" and \n    file.Ext.header_bytes like~ (\"cffaedfe*\", \"cafebabe*\") and\n    stringcontains~(event0.process.command_line, file.name)]\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: Effective_process.entity_id
      state: 1
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
          subtechnique:
            - id: T1036.005
              name: Match Legitimate Resource Name or Location
              reference: "https://attack.mitre.org/techniques/T1036/005/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.11.0"
