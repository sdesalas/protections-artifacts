id: "41dcfe9e-9170-4ffe-b620-351736366ced_1.0.10"
type: security-rule
attributes:
  description: |
    Identifies the execution of a shell process from a Java JAR application post an incoming network connection. This
    behavior may indicate a reverse shell activity via malicious Java application.
  rule_id: "41dcfe9e-9170-4ffe-b620-351736366ced"
  license: Elastic License v2
  name: Possible JAVA Reverse Shell
  os_list:
    - macos
  version: "1.0.10"
  query: "sequence with maxspan=5s\n[network where event.action in (\"connection_accepted\", \"connection_attempted\") and \n process.name in (\"java\", \"javaw\")] by process.entity_id\n[process where event.action == \"start\" and process.parent.name like \"java\" and\n process.parent.args like~ \"-jar\" and\n process.name in (\"bash\", \"sh\", \"zsh\")] by process.parent.entity_id\n"
  min_endpoint_version: "8.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.16.0"
