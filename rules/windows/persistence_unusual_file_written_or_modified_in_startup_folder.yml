id: "30a90136-7831-41c3-a2aa-1a303c1186ac_1.0.41"
type: security-rule
attributes:
  description: |
    Identifies suspicious file extensions or names written to the startup folder. Adversaries may use this technique to
    maintain persistence.
  rule_id: "30a90136-7831-41c3-a2aa-1a303c1186ac"
  license: Elastic License v2
  name: Unusual File Written or Modified in Startup Folder
  os_list:
    - windows
  version: "1.0.41"
  query: "file where event.action != \"deletion\" and\n  process.pid != 4 and process.executable != null and\n  file.name != null and not user.id : (\"S-1-5-18\", \"S-1-5-19\", \"S-1-5-20\") and\n  file.path : (\"?:\\\\Users\\\\*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\\*\",\n               \"?:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\StartUp\\\\*\") and\n  (\n   /* file extensions rarely written to Startup folder by legit installers */\n   file.extension : (\"exe\", \"com\", \"scr\", \"dll\", \"hta\", \"ps1\", \"cmd\", \"url\", \"wsh\", \"wsf\", \"vbe\", \"jse\", \"sick\", \"png\", \"jpg\", \"manifest\", \"ahk\", \"jar\") or\n\n   /* suspicious file names */\n   length(file.name) <= 6 or\n   file.name :\n        (\"*Microsoft*\",\n         \"*fuck*\",\n         \"*:*\",\n         \"*.*.\",\n         \"*update*\",\n         \"*windows*\",\n         \"*setup*\",\n         \"*googl*\",\n         \"*adobe*\",\n         \"*chrome*\")\n   ) and\n   not process.executable :\n               (\"?:\\\\Windows\\\\SysWOW64\\\\msiexec.exe\",\n                \"?:\\\\Windows\\\\system32\\\\msiexec.exe\",\n                \"?:\\\\Windows\\\\explorer.exe\",\n                \"?:\\\\Windows\\\\System32\\\\svchost.exe\",\n                \"?:\\\\Windows\\\\System32\\\\dllhost.exe\",\n                \"?:\\\\Windows\\\\System32\\\\xcopy.exe\",\n                \"?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*.exe\",\n                \"?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender Advanced Threat Protection\\\\Platform\\\\*.exe\",\n                \"?:\\\\Program Files\\\\Windows Defender Advanced Threat Protection\\\\*.exe\",\n                \"\\\\Device\\\\Mup\\\\*\\\\SysVol\\\\*\") and\n    not (process.executable : (\"?:\\\\Program Files\\\\*.exe\", \"?:\\\\Program Files (x86)\\\\*.exe\") and not process.name : \"javaw.exe\") and\n    not (process.name : \"cmd.exe\" and file.extension : \"cmd\") and\n    not (process.code_signature.subject_name :\n                 (\"Intercontinental Exchange, Inc.\", \"Chocolatey Software, Inc.\", \"ONELAUNCH TECHNOLOGIES INC.\", \n                  \"Notepad++\", \"Ghisler Software GmbH\", \"Western Union Holdings Inc.\", \"AnyDesk Software GmbH\", \"Learnpulse SAS\") and\n         process.code_signature.status : (\"trusted\", \"errorExpired\", \"errorCode_endpoint*\")) and\n    not (process.executable : \"?:\\\\Windows\\\\System32\\\\notepad.exe\" and file.extension : (\"bat\", \"cmd\")) and\n    not (process.executable : \"C:\\\\Windows\\\\SysWOW64\\\\cscript.exe\" and file.name : \"WUPOSStartup.exe\") and\n    not (process.name : \"cmd.exe\" and file.name : \"MonitorES.exe\")\n"
  min_endpoint_version: "8.0.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1547
          name: Boot or Logon Autostart Execution
          reference: "https://attack.mitre.org/techniques/T1547/"
          subtechnique:
            - id: T1547.001
              name: Registry Run Keys / Startup Folder
              reference: "https://attack.mitre.org/techniques/T1547/001/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
          subtechnique:
            - id: T1036.005
              name: Match Legitimate Resource Name or Location
              reference: "https://attack.mitre.org/techniques/T1036/005/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.0.0"
