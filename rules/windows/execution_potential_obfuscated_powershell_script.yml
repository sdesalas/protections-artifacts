id: f4db84b1-13d8-432d-999a-54a09784e62b_1.0.5
type: security-rule
attributes:
  description: |
    Identifies the execution of PowerShell with potentially obfuscated content. This behavior is often observed during
    malware installation leveraging PowerShell.
  rule_id: f4db84b1-13d8-432d-999a-54a09784e62b
  license: Elastic License v2
  name: Potential Obfuscated PowerShell Script
  os_list:
    - windows
  version: "1.0.5"
  query: "api where process.Ext.api.name == \"AmsiScanBuffer\" and\n process.Ext.api.parameters.app_name == \"PowerShell\" and\n(\n  process.Ext.api.parameters.buffer regex \"\"\".*(\\\"\\{[0-9]{1,2}\\}\\{[0-9]{1,2}\\}\\{[0-9]{1,2}\\}|['\\\"] {0,2}\\+ {0,2}['\\\"][^$]{1,25}['\\\"]{0,2}\\+ {0,2}['\\\"][^$]{1,25}['\\\"]\\+['\\\"][^$]{1,25}['\\\"]\\+['\\\"]).*\"\"\" or\n  process.Ext.api.parameters.buffer regex~ \"\"\".*\\.\\\"s(`+e`*t`*v`*a`*l`*u`*e)|(`*e`+t`*v`*a`*l`*u`*e)|(`*e`*t`+v`*a`*l`*u`*e)|(`*e`*t`*v`+a`*l`*u`*e)|(`*e`*t`*v`*a`+l`*u`*e)|(`*e`*t`*v`*a`*l`+u`*e)|(`*e`*t`*v`*a`*l`*u`+e).*\"\"\"\n) and\nnot (user.id == \"S-1-5-18\" and process.Ext.api.parameters.content_name == \"C:\\\\Install-Beats.ps1\" and process.Ext.api.parameters.buffer like \"*Install-Beat($ElasticAgent)*\") and\nnot process.Ext.api.parameters.buffer : \n               (\"*:::::\\\\windows\\\\sentinel\\\\*\", \"*<#sentinelbreakpoints#>*\", \"*$merged_stderr*\", \"*$branchStatusTextSpan.Text*\") and\nnot (user.id == \"S-1-5-18\" and process.Ext.api.parameters.content_name : \"C:\\\\WINDOWS\\\\CCM\\\\*.ps1\") and\nnot process.Ext.api.parameters.content_name : (\"C:\\\\Program Files\\\\Microsoft Azure AD Connect Health Agent\\\\Products\\\\AdFederationService\\\\AdfsDiagnostics\\\\AdfsToolbox\\\\diagnosticsModule\\\\Private\\\\CommonHealthChecks.ps1\") and\nnot process.parent.executable : \"C:\\\\Program Files\\\\ConEmu\\\\ConEmu\\\\ConEmuC64.exe\"\n"
  min_endpoint_version: "8.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.16.0"
