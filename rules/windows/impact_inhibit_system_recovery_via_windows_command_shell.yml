id: d3588fad-43ae-4f2d-badd-15a27df72133_1.0.34
type: security-rule
attributes:
  description: |
    Identifies the execution of Windows utilities to tamper with system recovery settings. Adversaries may delete or remove
    built-in operating system data and turn off services designed to aid in the recovery of a corrupted system and prevent
    recovery.
  rule_id: d3588fad-43ae-4f2d-badd-15a27df72133
  license: Elastic License v2
  name: Inhibit System Recovery via Windows Command Shell
  os_list:
    - windows
  version: "1.0.34"
  query: "sequence with maxspan=1m\n  [process where event.action == \"start\" and process.name : \"cmd.exe\" and\n    not process.parent.executable : (\"?:\\\\Program Files\\\\*.exe\", \"?:\\\\Program Files (x86)\\\\*.exe\") and\n    not (process.args : \"\\\\\\\\*\\\\SysVol\\\\*\\\\Policies\\\\{*}\\\\*\" and process.parent.executable : \"?:\\\\Windows\\\\System32\\\\gpscript.exe\") and\n    not process.command_line : (\"*\\\\\\\\*\\\\*.cmd*\", \"*\\\\\\\\*\\\\*.bat*\") and \n    not descendant of [process where event.action == \"start\" and process.executable : \"?:\\\\Windows\\\\System32\\\\gpscript.exe\"] and\n    not (process.parent.executable : \"?:\\\\Windows\\\\System32\\\\wbem\\\\WmiPrvSE.exe\" and\n         user.id == \"S-1-5-18\" and process.args : \"BOOTSTATUSPOLICY\") and\n    not (user.id == \"S-1-5-18\" and process.parent.executable : (\"C:\\\\$VcmsTemp$\\\\VcmsPush.exe\", \"C:\\\\windows\\\\ctsrsvc.exe\"))\n  ] by process.entity_id\n  [process where event.action == \"start\" and\n    (\n     (process.pe.original_file_name : \"wmic.exe\" and process.command_line : \"*shadowcopy*\" and process.command_line : \"*delete*\") or\n     (process.pe.original_file_name : \"vssadmin.exe\" and process.command_line : \"*shadows*\" and process.command_line : (\"*delete*\", \"*resize*401*\")) or\n     (process.pe.original_file_name : \"bcdedit.exe\" and process.command_line : (\"*bootstatuspolicy*\", \"*recoveryenabled*\")) or\n     (process.pe.original_file_name : \"wbadmin.exe\" and process.command_line : (\"*catalog*\", \"*systemstatebackup*\") and process.command_line : \"*delete*\")\n    ) and\n    /* noisy FP patterns */\n    not (process.name : \"bcdedit.exe\" and process.args : \"DisplayAllFailures\") and\n    not (process.name : \"wbadmin.exe\" and process.args : \"-keepVersions*\") and\n    not (process.name : \"bcdedit.exe\" and process.command_line: \"*recoveryenabled*yes*\") and\n    /* granular deletion of a shadowcopy by unique ID often seen in legit deletion */\n    not (process.name : \"vssadmin.exe\" and process.command_line : \"*/shadow=*\")\n  ] by process.parent.entity_id\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
    - action: kill_process
      field: process.entity_id
      state: 1
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1047
          name: Windows Management Instrumentation
          reference: "https://attack.mitre.org/techniques/T1047/"
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.003
              name: Windows Command Shell
              reference: "https://attack.mitre.org/techniques/T1059/003/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1490
          name: Inhibit System Recovery
          reference: "https://attack.mitre.org/techniques/T1490/"
      tactic:
        id: TA0040
        name: Impact
        reference: "https://attack.mitre.org/tactics/TA0040/"
  internal:
    min_endpoint_version: "7.15.0"
