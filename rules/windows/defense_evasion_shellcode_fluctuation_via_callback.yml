id: "2909b5bc-c975-4dbe-ac79-4029a2c5763f_1.0.4"
type: security-rule
attributes:
  description: |
    Identifies private (JIT) code memory with fluctuating page protections. This may indicate an attempt to hide injected
    code from memory scanners.
  rule_id: "2909b5bc-c975-4dbe-ac79-4029a2c5763f"
  license: Elastic License v2
  name: Shellcode Fluctuation via CallBack
  os_list:
    - windows
  version: "1.0.4"
  query: "api where process.Ext.api.behaviors in (\"execute_fluctuation\", \"write_fluctuation\") and \n process.Ext.api.behaviors == \"proxy_call\" and\n process.thread.Ext.call_stack_summary in\n            (\"ntdll.dll|kernelbase.dll|ntdll.dll|kernel32.dll|ntdll.dll\", \"ntdll.dll|kernelbase.dll|ntdll.dll|Unknown\") and\n (process.thread.Ext.call_stack_final_user_module.path == \"c:\\\\windows\\\\system32\\\\ntdll.dll\" or\n  process.thread.Ext.call_stack_final_user_module.name == \"Undetermined\")\n"
  min_endpoint_version: "8.10.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.10.0"
