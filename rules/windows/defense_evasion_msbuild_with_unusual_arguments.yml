id: "6518cdaf-e6cd-4cf9-a51e-043117c3dbeb_1.0.29"
type: security-rule
attributes:
  description: |
    Identifies the execution of the built-in MSBuild utility with a suspicious count of command line arguments (less than
    three). Adversaries may use MSBuild to proxy the execution of malicious code via a trusted Windows utility.
  rule_id: "6518cdaf-e6cd-4cf9-a51e-043117c3dbeb"
  license: Elastic License v2
  name: MSBuild with Unusual Arguments
  os_list:
    - windows
  reference:
    - "https://lolbas-project.github.io/lolbas/Binaries/Msbuild/"
  version: "1.0.29"
  query: "process where event.action == \"start\" and\n process.pe.original_file_name == \"MSBuild.exe\" and process.args_count == 2 and\n  /* FP - expected developers msbuild installation directories */\n\n not process.executable : (\"?:\\\\Program Files (x86)\\\\Microsoft Visual Studio\\\\*\",\n                           \"?:\\\\Program Files\\\\Microsoft Visual Studio\\\\*\",\n                           \"?:\\\\Program Files (x86)\\\\MSBuild\\\\*\",\n                           \"?:\\\\Program Files\\\\MSBuild\\\\*\") and\n not process.command_line : (\"* /*\", \"* .\\\\*\", \"*.proj*\", \"*.sln*\") and\n  /* FP - Third Party Programs except MS Office */\n\n not (process.parent.executable : (\"?:\\\\Program Files (x86)\\\\*.exe\", \"?:\\\\Program Files\\\\*.exe\") and\n       not process.parent.name : \n                          (\"winword.exe\",\n                           \"excel.exe\",\n                           \"outlook.exe\",\n                           \"powerpnt.exe\",\n                           \"eqnedt32.exe\",\n                           \"fltldr.exe\",\n                           \"mspub.exe\",\n                           \"msaccess.exe\"))\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1127
          name: Trusted Developer Utilities Proxy Execution
          reference: "https://attack.mitre.org/techniques/T1127/"
          subtechnique:
            - id: T1127.001
              name: MSBuild
              reference: "https://attack.mitre.org/techniques/T1127/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
