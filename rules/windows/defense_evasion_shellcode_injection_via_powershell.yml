id: "98fffa16-53e1-4db9-9126-2d0441cac417_1.0.10"
type: security-rule
attributes:
  description: |
    Identifies shellcode execution behavior from a powershell script interpreter. This may indicate the execution of a
    malicious powershell script or the result of a cross process injection targeting powershell.
  rule_id: "98fffa16-53e1-4db9-9126-2d0441cac417"
  license: Elastic License v2
  name: Shellcode Injection via PowerShell
  os_list:
    - windows
  version: "1.0.10"
  query: "api where process.Ext.api.name in (\"VirtualAlloc\", \"VirtualAllocEx\", \"VirtualProtect\", \"VirtualProtectEx\", \"WriteProcessMemory\", \"connect\") and\n    process.name : (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\") and\n    process.Ext.api.behaviors in (\"shellcode\", \"allocate_shellcode\") and\n    process.thread.Ext.call_stack_final_user_module.name == \"Unbacked\" and\n    process.thread.Ext.call_stack_final_user_module.protection_provenance == \"Unbacked\" and\n    (process.Ext.api.name == \"connect\" or process.Ext.api.parameters.size >= 10000) and\n    process.thread.Ext.call_stack_summary like \"?*\" and\n    _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info : \"Unbacked*\" and $entry.callsite_trailing_bytes : \"?*\") and\n\n    /* noisy patterns */\n    not _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info like \"Unbacked*\" and\n                     $entry.callsite_trailing_bytes like\n                                   (\"*85f60f95c10fb6c9894dac488bcce82f000000908b45ac0fb6c0488b55a0c6420c01*\",\n                                    \"488dac24d00000004c8bb424a8000000*4c8b45f84d8d4e08*\",\n                                    \"*85f60f95c10fb6c9894dac488bcce82f000000908b45*\", \n                                    \"*7f00004883c42848ffe000190401000442000040000*\", \n                                    \"488986200f0000488d8fe00d000048894*\", \n                                    \"*8bc6488d65f85e5dc355564883ec28488b6920*\")) and\n    not (process.thread.Ext.call_stack_summary  == \"ntdll.dll|Unbacked\" and\n         _arraysearch(process.thread.Ext.call_stack, $entry, $entry.protection_provenance == \"Unknown\")) and\n    not process.thread.Ext.call_stack_summary like (\"Unbacked\", \"*Unknown*\") and\n    not _arraysearch(process.thread.Ext.call_stack, $entry,\n                     $entry.protection_provenance like (\"Kernel\", \"clr.dll\", \"coreclr.dll\", \"fships.dll*\", \"Kernel|*\", \"tmmon.dll\",\n                                                     \"mfehcthe.dll\", \"mfehcs.exe|mfehcs.exe\", \"conemuhk64.dll\", \"tmmon64.dll\", \"dwadv.dll\", \"bdhkm32.dll\",\n                                                     \"epmpthe.dll\")) and\n    not _arraysearch(process.thread.Ext.call_stack, $entry,\n                     $entry.symbol_info : (\"?:\\\\Program Files\\\\*.dll*\",\n                                           \"?:\\\\Program Files (x86)\\\\*.dll*\",\n                                           \"?:\\\\windows\\\\system32\\\\*\\\\tmmon*.dll*\",\n                                           \"c:\\\\windows\\\\syswow64\\\\ntdll.dll!RtlInitializeExceptionChain*\",\n                                           \"c:\\\\windows\\\\syswow64\\\\ntdll.dll!RtlGetFullPathName*\",\n                                           \"c:\\\\windows\\\\syswow64\\\\ntdll.dll!RtlGetAppContainerNamedObjectPath*\")) and\n    not (process.Ext.api.name == \"connect\" and process.parent.executable : \"C:\\\\Program Files\\\\Tychon\\\\TychonEngine.exe\") and\n    not (user.id in (\"S-1-5-18\", \"S-1-5-19\", \"S-1-5-20\") and\n         process.parent.executable : (\"?:\\\\Windows\\\\System32\\\\svchost.exe\", \"?:\\\\Windows\\\\System32\\\\services.exe\") and\n         _arraysearch(process.thread.Ext.call_stack, $entry, $entry.protection_provenance == \"Unbacked\")) and\n    not (process.thread.Ext.call_stack_final_user_module.name == \"Unbacked\" and\n         process.thread.Ext.call_stack_final_user_module.protection_provenance_path == \"c:\\\\windows\\\\syswow64\\\\sppc.dll\") and\n    not process.parent.executable : \"C:\\\\Program Files (x86)\\\\Msp Agent\\\\components\\\\generic-asset-interrogator\\\\0.2.10\\\\generic-asset-interrogator.exe\" and\n    not (process.Ext.api.name == \"VirtualProtect\" and\n         _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info like (\"c:\\\\windows\\\\sys?????\\\\ntdll.dll!LdrLoadDll*\", \"c:\\\\windows\\\\sys?????\\\\kernelbase.dll!LoadLibrary*\"))) and\n    not _arraysearch(process.thread.Ext.call_stack_final_user_module.code_signature, $entry, $entry.trusted == true and\n                     $entry.subject_name in (\"Microsoft Windows Hardware Compatibility Publisher\", \"Microsoft Windows Software Compatibility Publisher\", \"SentinelOne Inc.\")) and\n    not process.thread.Ext.call_stack_final_user_module.protection_provenance_path like \"c:\\\\windows\\\\assembly\\\\nativeimages_*\\\\microsoft.powershell.commands.diagnostics.ni.dll\"\n"
  min_endpoint_version: "8.14.2"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.14.2"
