id: c0a977b4-1342-4794-9cd2-5d726c26c1b9_1.0.17
type: security-rule
attributes:
  description: |
    Identifies attempts to access AutoLogons credentials via registry value query. Adversaries may search local file systems
    and remote file shares for files containing insecurely stored credentials.
  rule_id: c0a977b4-1342-4794-9cd2-5d726c26c1b9
  license: Elastic License v2
  name: AutoLogons Access Attempt via Registry
  os_list:
    - windows
  reference:
    - "https://github.com/GhostPack/SharpUp/blob/master/SharpUp/Checks/RegistryAutoLogons.cs#L26"
  version: "1.0.17"
  query: "registry where event.action == \"query\" and process.executable != null and\n registry.path : \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\DefaultPassword\" and\n not process.executable :\n            (\"?:\\\\Windows\\\\System32\\\\LogonUI.exe\",\n             \"?:\\\\$WINDOWS.~BT\\\\Sources\\\\SetupHost.exe\",\n             \"?:\\\\$WINDOWS.~BT\\\\Sources\\\\SetupPlatform.exe\",\n             \"?:\\\\$WINDOWS.~BT\\\\Sources\\\\WindowsUpdateBox.exe\",\n             \"?:\\\\Windows\\\\System32\\\\svchost.exe\",\n             \"?:\\\\Windows\\\\System32\\\\wbem\\\\WmiPrvSE.exe\",\n             \"?:\\\\Windows\\\\SysWOW64\\\\wbem\\\\WmiPrvSE.exe\",\n             \"?:\\\\Windows\\\\System32\\\\MusNotification.exe\", \n             \"?:\\\\Windows\\\\SysWOW64\\\\MusNotification.exe\",\n             \"?:\\\\Windows\\\\System32\\\\wsmprovhost.exe\",\n             \"?:\\\\Windows\\\\System32\\\\conhost.exe\",\n             \"?:\\\\Windows\\\\System32\\\\SecurityHealthSystray.exe\",\n             \"?:\\\\Windows\\\\System32\\\\reg.exe\",\n             \"?:\\\\Windows\\\\regedit.exe\", \n             \"?:\\\\Program Files\\\\*.exe\", \n             \"?:\\\\Program Files (x86)\\\\*.exe\",\n             \"?:\\\\Windows\\\\System32\\\\cmd.exe\",\n             \"C:\\\\ProgramData\\\\Guardicore\\\\utils\\\\gc-insight.exe\",\n             \"?:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v*\\\\powershell.exe\", \n             \"?:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v*\\\\powershell_ise.exe\",\n             \"?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*\\\\MpCmdRun.exe\",\n             \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\OneDrive\\\\OneDrive.exe\",\n             \"?:\\\\Windows\\\\SystemApps\\\\MicrosoftWindows.Client.*\\\\SearchHost.exe\",\n             \"?:\\\\Windows\\\\Temp\\\\MSS\\\\IRTKDeploy\\\\fennec-windows-x64.exe\",\n             \"\\\\Device\\\\Mup\\\\*\\\\Autologon.exe\",\n             \"?:\\\\Windows\\\\ServiceProfiles\\\\LocalService\\\\AppData\\\\Local\\\\ServicePortalAgent\\\\current\\\\emulator\\\\MmrAgent.NetFxEmulator.exe\") and\n  not (process.code_signature.trusted == true and not process.code_signature.subject_name : \"Microsoft*\") and\n  not (process.name : \"Autologon.exe\" and process.code_signature.subject_name : \"Microsoft*\")\n"
  min_endpoint_version: "8.6.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.6.0"
