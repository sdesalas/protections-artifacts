id: fcbeaab7-017f-4bba-8b27-ffe68d64a28c_1.0.8
type: security-rule
attributes:
  description: |
    Identifies instances where an unusual process spawns a chrome browser child process. This behavior could be related to
    malwares stealing browser information.
  rule_id: fcbeaab7-017f-4bba-8b27-ffe68d64a28c
  license: Elastic License v2
  name: Chrome Browser Spawned from an Unusual Parent
  os_list:
    - windows
  version: "1.0.8"
  query: "process where event.type == \"start\" and\n process.name : \"chrome.exe\" and process.args in~ (\"--profile-directory=\\\"Default\\\"\", \"--profile-directory=Default\") and\n process.parent.executable != null and\n not process.parent.executable in~\n                     (\"c:\\\\windows\\\\explorer.exe\",\n                      \"c:\\\\program files\\\\google\\\\chrome\\\\application\\\\chrome_proxy.exe\",\n                      \"C:\\\\Program Files (x86)\\\\Google\\\\Chrome\\\\Application\\\\chrome_proxy.exe\",\n                      \"c:\\\\program files\\\\google\\\\chrome\\\\application\\\\chrome.exe\",\n                      \"c:\\\\Program Files (x86)\\\\google\\\\chrome\\\\application\\\\chrome.exe\",\n                      \"C:\\\\Windows\\\\System32\\\\rdpinit.exe\",\n                      \"C:\\\\Windows\\\\System32\\\\sihost.exe\",\n                      \"C:\\\\Windows\\\\System32\\\\RuntimeBroker.exe\",\n                      \"C:\\\\Windows\\\\System32\\\\SECOCL64.exe\") and\n not process.parent.executable : (\n                      \"C:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\seapo64.inf_*\\\\SECOCL64.exe\", \n                      \"C:\\\\Program Files\\\\OutSystems\\\\Service Studio ??\\\\Service Studio\\\\ServiceStudio.exe\",\n                      \"C:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\snapo64.inf_amd64_*\\\\SNAPOS64.exe\",\n                      \"C:\\\\Program Files\\\\WindowsApps\\\\*.exe\") and\n not (process.parent.code_signature.subject_name in (\n        \"Google LLC\", \"Sound Research Corporation\", \"FactSet Research Systems Inc.\", \"LEGENDARY SOFTWARE LLC\", \"UiPath, Inc.\", \"PRIDEWAY ENTERPRISES LTD\"\n      ) and process.parent.code_signature.trusted == true) and\n not (process.parent.name : \"cmd.exe\" and process.parent.args : \"*\\\\Desktop\\\\*.bat \" and process.args : \"--profile-directory=Default\") and\n not (process.parent.name == \"chromedriver.exe\" and process.args == \"--test-type=webdriver\") and\n not (process.parent.name == \"gralvior-desktop.exe\" and process.args == \"https://google.com\") and\n not (process.parent.name == \"rundll32.exe\" and process.parent.args == \"C:\\\\windows\\\\System32\\\\SHELL32.dll,RunAsNewUser_RunDLL\") and\n not (process.parent.code_signature.subject_name in (\"AMARYLLIS SIGNAL LTD\", \"BLUE TAKIN LTD\", \"METROPOLITAN DESIGN LLC\") and process.parent.code_signature.trusted == true)\n"
  min_endpoint_version: "8.10.0"
  actions:
    - action: kill_process
      field: process.parent.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1539
          name: Steal Web Session Cookie
          reference: "https://attack.mitre.org/techniques/T1539/"
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.003
              name: Credentials from Web Browsers
              reference: "https://attack.mitre.org/techniques/T1555/003/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.10.0"
