id: a26e8618-136d-4988-a8a7-eb45d5f1d468_1.0.3
type: security-rule
attributes:
  description: |
    Identifies attempts to change the memory page permissions of Event Tracing for Windows (ETW) functions in ntdll.dll to
    make them writable from an unsigned or suspicious module. This is a precursor to patching those functions via a raw
    pointer write, which can disable ETW-based telemetry and evade security tooling that relies on it.
  rule_id: a26e8618-136d-4988-a8a7-eb45d5f1d468
  license: Elastic License v2
  name: Potential ETW Bypass via VirtualProtect
  os_list:
    - windows
  reference:
    - "https://blog.xpnsec.com/hiding-your-dotnet-etw/"
    - "https://www.elastic.co/security-labs/doubling-down-etw-callstacks"
  version: "1.0.3"
  query: "api where process.Ext.api.name in (\"VirtualProtect\", \"VirtualProtectEx\") and\n process.Ext.api.metadata.target_address_name like (\"ntdll.dll!Etw*\", \"ntdll.dll!NtTrace*\") and\n process.Ext.api.parameters.protection like \"?W*\" and\n process.executable != null and\n process.thread.Ext.call_stack_final_user_module.hash.sha256 != null and \n not process.thread.Ext.call_stack_final_user_module.name in (\"Unknown\", \"Undetermined\") and\n not (process.executable : \"?:\\\\Program Files\\\\Microsoft Visual Studio\\\\*\\\\IDE\\\\devenv.exe\" and \n      process.Ext.api.metadata.target_address_name like (\"ntdll.dll!EtwUnregisterTraceGuid*\", \"ntdll.dll!EtwRegisterTraceGuids*\")) and \n not _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info like (\"c:\\\\windows\\\\system32\\\\ntdll.dll!Ldr*\", \"c:\\\\program files\\\\microsoft sql server management studio*\\\\ide\\\\ssms.exe!SetOnAssertCallback*\")) and \n not _arraysearch(process.thread.Ext.call_stack_final_user_module.code_signature, $entry, $entry.trusted == true and\n                  $entry.subject_name in (\"Microsoft Windows Hardware Compatibility Publisher\",\n                                          \"Microsoft Windows Software Compatibility Publisher\",\n                                          \"Palo Alto Networks\", \"Sentinel Labs, Inc.\",\n                                          \"Microsoft Corporation\", \n                                          \"Check Point Software Technologies Ltd.\", \n                                          \"ESET, spol. s r.o.\",\n                                          \"Promon AS\",\n                                          \"SAP\",\n                                          \"NOVASYNC LABS PTE. LTD.\",\n                                          \"Tonalio GmbH\",\n                                          \"SentinelOne Inc.\",\n                                          \"JetBrains s.r.o.\",\n                                          \"Safetica a.s.\",\n                                          \"ModuleWorks GmbH\",\n                                          \"Star Finanz-Software Entwicklung und Vertriebs GmbH\", \n                                          \"TRACKER SOFTWARE PRODUCTS (CANADA) LIMITED, TRACKER SOFTWARE PRODUCTS (CANADA) LIMITED\")) and \n  not (process.executable like \"C:\\\\Program Files (x86)\\\\SFirmV*\\\\SFEbicsWorker.exe\" and process.thread.Ext.call_stack_final_user_module.protection_provenance_path == \"c:\\\\windows\\\\system32\\\\rundll32.exe\") and \n  not (process.parent.executable like \"C:\\\\Program Files (x86)\\\\StarMoney*\\\\app\\\\StarMoney.exe\" and process.thread.Ext.call_stack_final_user_module.protection_provenance_path == \"c:\\\\windows\\\\system32\\\\rundll32.exe\") and \n  process.thread.Ext.call_stack_final_user_module.protection_provenance_path != \"c:\\\\windows\\\\syswow64\\\\icu.dll\" and \n  not (process.thread.Ext.call_stack_final_user_module.path == \"c:\\\\windows\\\\syswow64\\\\combase.dll\" and process.Ext.api.summary == \"VirtualProtect( ntdll.dll!EtwEventRegister, 0x5, RWX, R-X )\")\n"
  min_endpoint_version: "8.16.3"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1562
          name: Impair Defenses
          reference: "https://attack.mitre.org/techniques/T1562/"
          subtechnique:
            - id: T1562.001
              name: Disable or Modify Tools
              reference: "https://attack.mitre.org/techniques/T1562/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.16.3"
