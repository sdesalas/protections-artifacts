id: "59a55372-5b1a-4a72-bd6e-9a55cf9298b4_1.0.4"
type: security-rule
attributes:
  description: "Identifies the creation of a Windows network socket from unbacked memory, this may indicate process code injection."
  rule_id: "59a55372-5b1a-4a72-bd6e-9a55cf9298b4"
  license: Elastic License v2
  name: Windows Socket Creation from Unbacked Memory
  os_list:
    - windows
  version: "1.0.4"
  query: "api where process.Ext.api.name == \"VirtualProtect\" and\n process.Ext.api.metadata.target_address_name == \"mswsock.dll\" and\n process.thread.Ext.call_stack_summary in (\"ntdll.dll|apphelp.dll|ntdll.dll|kernelbase.dll|ws2_32.dll|Unbacked\",\n                                           \"ntdll.dll|wow64.dll|wow64cpu.dll|wow64.dll|ntdll.dll|apphelp.dll|ntdll.dll|kernelbase.dll|ws2_32.dll|Unbacked\") and\n _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info like \"Unbacked*\" and $entry.callsite_trailing_bytes : \"?*\") and\n _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info : \"c:\\\\windows\\\\sys?????\\\\ws2_32.dll!WSASocket*\") and\n not process.thread.Ext.call_stack_final_user_module.protection_provenance_path like (\"c:\\\\windows\\\\microsoft.net\\\\framework64\\\\v*\\\\clr.dll\", \"c:\\\\program files\\\\dotnet\\\\shared\\\\microsoft.netcore.app\\\\*\\\\coreclr.dll\") and \n not _arraysearch(process.thread.Ext.call_stack_final_user_module.code_signature,\n                  $entry, $entry.subject_name: (\"Essential Objects, Inc.\", \"COLONY LABS, INC.\", \"GN Hearing A/S\", \"OCBASE\", \"ocbase.com\", \"Netwrix Corporation\", \"MPS Monitor Srl\", \n                                                \"TRANSACT CAMPUS, LLC\", \"Enclave Networks Limited\", \"Ashampoo GmbH & Co. KG\", \"IC SOLUTIONS sp. z o. o.\", \".NET\") and $entry.status == \"trusted\")\n"
  min_endpoint_version: "8.14.2"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.14.2"
