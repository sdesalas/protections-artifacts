id: "6b045c74-157d-4f05-b08f-620ce9ea96e9_1.0.23"
type: security-rule
attributes:
  description: |
    Adversaries may create or modify shortcuts that can execute a program during system boot or user login. Shortcuts are
    used to reference other files or programs that will be opened or executed when the shortcut is clicked or executed by a
    system startup process.
  rule_id: "6b045c74-157d-4f05-b08f-620ce9ea96e9"
  license: Elastic License v2
  name: Potential Execution via Shortcut Modification
  os_list:
    - windows
  version: "1.0.23"
  query: "process where event.action : \"start\" and\n\n process.name : (\"cmd.exe\", \"powershell.exe\") and process.parent.executable : \"?:\\\\Windows\\\\Explorer.exe\" and\n\n process.working_directory :\n       (\"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\", \"?:\\\\Users\\\\*\\\\AppData\\\\Roaming\\\\Zoom\\\\bin\\\\*\",\n        \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\slack\\\\*\", \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Discord\\\\*\") and\n\n process.command_line : (\"*chrome.exe*\", \"*firefox.exe*\", \"*outlook.exe*\", \"msedge.exe\", \"*thunderbird.exe*\",\n                         \"*slack.exe*\", \"*notepad++.exe*\", \"*discord.exe*\", \"*winword.exe*\", \"*excel.exe*\", \"*powerpnt*\",\n                         \"*Teams*\", \"*zoom.exe*\", \"*update.exe*\") and \n not (process.name : \"cmd.exe\" and process.command_line : \"*chrome.exe*\" and process.args : \"SET RENDERDOC_HOOK_EGL=0 && START \\\"\")\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
            - id: T1059.003
              name: Windows Command Shell
              reference: "https://attack.mitre.org/techniques/T1059/003/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1547
          name: Boot or Logon Autostart Execution
          reference: "https://attack.mitre.org/techniques/T1547/"
          subtechnique:
            - id: T1547.009
              name: Shortcut Modification
              reference: "https://attack.mitre.org/techniques/T1547/009/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
  internal:
    min_endpoint_version: "7.15.0"
