id: "215d1262-984e-4ffc-8e26-f568ed77b3cb_1.0.2"
type: security-rule
attributes:
  description: |
    Identifies an unexpected process accessing the password store of commonly used web browsers. Adversaries may steal
    credentials from web browsers by reading files specific to the target browser.
  rule_id: "215d1262-984e-4ffc-8e26-f568ed77b3cb"
  license: Elastic License v2
  name: Web Browser Credential Access via Scripting Utility
  os_list:
    - windows
  reference:
    - "https://www.elastic.co/security-labs/globally-distributed-stealers"
    - "https://www.elastic.co/security-labs/detect-credential-access"
  version: "1.0.2"
  query: "sequence by process.entity_id with maxspan=5m\n[process where event.action == \"start\" and \n (\n  process.name : (\"node.exe\", \"python*.exe\", \"wscript.exe\", \"mshta.exe\",  \"AutoIt*.exe\") or\n  process.code_signature.subject_name : (\"AutoIt Consulting Ltd\", \"OpenJS Foundation\", \"The MathWorks, Inc.\", \"Python Software Foundation\")\n ) and\n not (process.name : \"wscript.exe\" and process.args : \"\\\\\\\\*\\\\*\") and \n not process.executable : \n             (\"?:\\\\Program Files\\\\Microsoft SDKs\\\\Azure\\\\CLI2\\\\python.exe\", \n              \"?:\\\\Program Files\\\\Common Files\\\\Adobe\\\\Creative Cloud Libraries\\\\libs\\\\node.exe\", \n              \"?:\\\\Program Files (x86)\\\\Adobe\\\\Adobe Creative Cloud Experience\\\\libs\\\\node.exe\", \n              \"?:\\\\Program Files\\\\Adobe\\\\Adobe Creative Cloud Experience\\\\libs\\\\node.exe\",\n              \"?:\\\\Program Files\\\\Qlik\\\\Sense\\\\ServiceDispatcher\\\\Node\\\\node.exe\", \n              \"?:\\\\Program Files\\\\MATLAB\\\\*\\\\bin\\\\win64\\\\MATLAB.exe\")]\n[file where event.type == \"access\" and\n  file.path :\n           (\"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Google\\\\Chrome\\\\User Data\\\\Local State\",\n            \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\Edge\\\\User Data\\\\Local State\",\n            \"?:\\\\users\\\\*\\\\AppData\\\\Local\\\\Google\\\\Chrome\\\\User Data\\\\Default\\\\Login Data\",\n            \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\Edge\\\\User Data\\\\Default\\\\Login Data\")]\n"
  min_endpoint_version: "8.10.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1539
          name: Steal Web Session Cookie
          reference: "https://attack.mitre.org/techniques/T1539/"
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.003
              name: Credentials from Web Browsers
              reference: "https://attack.mitre.org/techniques/T1555/003/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.10.0"
