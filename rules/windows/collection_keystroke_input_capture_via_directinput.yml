id: "102b5c1a-7f2a-4254-8b26-6b299705fce7_1.0.13"
type: security-rule
attributes:
  description: |
    Identifies attempts to enumerate keystroke state using the Windows DirectInput API. Adversaries may log user keystrokes
    to intercept credentials or other information from the user as the user types them.
  rule_id: "102b5c1a-7f2a-4254-8b26-6b299705fce7"
  license: Elastic License v2
  name: Keystroke Input Capture via DirectInput
  os_list:
    - windows
  reference:
    - "https://attack.mitre.org/techniques/T1056/001/"
    - "https://learn.microsoft.com/en-us/previous-versions/windows/desktop/ee416842(v=vs.85)"
    - "https://wikileaks.org/ciav7p1/cms/page_3375220.html"
    - "https://www.elastic.co/security-labs/protecting-your-devices-from-information-theft-keylogger-protection"
  version: "1.0.13"
  query: "api where process.executable : \"C:\\\\*\" and \n\n process.thread.Ext.call_stack_final_user_module.name : \"dinput*.dll\" and \n \n (process.code_signature.exists == false or \n  process.code_signature.status == \"errorBadDigest\" or \n  process.code_signature.subject_name in (\"The MathWorks, Inc.\", \"AutoIt Consulting Ltd\", \"Python Software Foundation\") or \n  (process.code_signature.subject_name in (\"Microsoft Windows\", \"Microsoft Corporation\") and process.executable : \"?:\\\\Windows\\\\*\" )) and \n  \n  (process.Ext.api.name == \"RegisterRawInputDevices\" and\n   process.Ext.api.parameters.usage == \"KEYBOARD\" and process.thread.Ext.call_stack_summary like \"*|dinput?.dll|*\") and \n   \n  not process.executable : (\"?:\\\\Windows\\\\System32\\\\dxdiag.exe\", \"?:\\\\Windows\\\\SysWOW64\\\\dxdiag.exe\") and \n  not (process.executable : \"?:\\\\Windows\\\\System32\\\\rundll32.exe\" and \n       process.command_line : \"?:\\\\WINDOWS\\\\system32\\\\rundll32.exe ?:\\\\WINDOWS\\\\system32\\\\inetcpl.cpl,ClearMyTracksByProcess*\") and \n  not (process.executable : \"?:\\\\Windows\\\\Sys*\\\\regsvr32.exe\" and process.command_line : \"*\\\\Program Files*\\\\LGHUB\\\\sdks\\\\sdk_legacy_steering_wheel*\") and \n  not process.executable : (\"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\", \n                            \"?:\\\\Windows\\\\System32\\\\Macromed\\\\Flash\\\\FlashUtil_ActiveX.exe\") and\n  not process.thread.Ext.call_stack_summary like\n              \"wow64win.dll|wow64.dll|wow64cpu.dll|wow64.dll|ntdll.dll|win32u.dll|dinput8.dll|Unknown*\"\n"
  min_endpoint_version: "8.10.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1056
          name: Input Capture
          reference: "https://attack.mitre.org/techniques/T1056/"
          subtechnique:
            - id: T1056.001
              name: Keylogging
              reference: "https://attack.mitre.org/techniques/T1056/001/"
      tactic:
        id: TA0009
        name: Collection
        reference: "https://attack.mitre.org/tactics/TA0009/"
  internal:
    min_endpoint_version: "8.10.0"
