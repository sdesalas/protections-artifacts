id: c8776070-eca6-4370-8438-f2b6282615ef_1.0.34
type: security-rule
attributes:
  description: |
    Identifies a suspicious sequence of file modifications where the entropy of the file is set to zero and its original
    size is still shown as unmodified. This may indicate a data wiping attack behavior.
  rule_id: c8776070-eca6-4370-8438-f2b6282615ef
  license: Elastic License v2
  name: Potential Data wiping Attack Behavior
  os_list:
    - windows
  version: "1.0.34"
  query: "sequence by process.entity_id with maxspan=1s\n\n  /* a sequence of file mod by same process */\n\n [file where event.action == \"modification\" and process.pid != 4 and process.executable != null and \n  file.Ext.entropy == 0 and file.Ext.header_bytes : \"0000000*\" and\n  file.extension : (\"exe\", \"dll\", \"html\", \"doc\", \"docx\", \"xls\", \"xlsx\", \"ppt\", \"pptx\", \"pdf\", \"txt\", \"png\") and file.size > 10 and\n  not process.executable :\n            (\"?:\\\\Program Files\\\\*.exe\",\n             \"?:\\\\Program Files (x86)\\\\*.exe\",\n             \"?:\\\\Windows\\\\System32\\\\spoolsv.exe\",\n             \"?:\\\\Windows\\\\System32\\\\svchost.exe\",\n             \"?:\\\\Windows\\\\Explorer.exe\",\n             \"?:\\\\Program Files (x86)\\\\Steam\\\\steamapps\\\\*.exe\",\n             \"\\\\Device\\\\HarddiskVolume?\\\\Steam\\\\steam.exe\") and\n  not (process.name : \"steam.exe\" and file.path : \"?:\\\\Users\\\\*\\\\steamapps\\\\downloading\\\\*.txt\") and\n  not (process.code_signature.subject_name : \"Valve Corp.\" and process.code_signature.trusted == true) and\n  not file.path : \"?:\\\\Program Files (x86)\\\\Steam\\\\steamapps\\\\downloading\\\\*\" and\n  not (file.extension : (\"dll\", \"exe\", \"txt\") and process.executable : \"C:\\\\Windows\\\\System32\\\\msiexec.exe\") and\n  not (process.executable : \"C:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\OneDrive\\\\OneDrive.exe\" and\n       process.code_signature.subject_name == \"Microsoft Corporation\" and process.code_signature.trusted == true)\n  ]\n [file where event.action == \"modification\" and\n  file.Ext.entropy == 0 and file.Ext.header_bytes : \"0000000*\" and\n  file.extension : (\"exe\", \"dll\", \"html\", \"doc\", \"docx\", \"xls\", \"xlsx\", \"ppt\", \"pptx\", \"pdf\", \"txt\", \"png\") and file.size > 10]\n [file where event.action == \"modification\" and\n  file.Ext.entropy == 0 and file.Ext.header_bytes : \"0000000*\" and\n  file.extension : (\"exe\", \"dll\", \"html\", \"doc\", \"docx\", \"xls\", \"xlsx\", \"ppt\", \"pptx\", \"pdf\", \"txt\", \"png\") and file.size > 10]\n [file where event.action == \"modification\" and\n  file.Ext.entropy == 0 and file.Ext.header_bytes : \"0000000*\" and\n  file.extension : (\"exe\", \"dll\", \"html\", \"doc\", \"docx\", \"xls\", \"xlsx\", \"ppt\", \"pptx\", \"pdf\", \"txt\", \"png\") and file.size > 10]\n"
  min_endpoint_version: "8.0.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1485
          name: Data Destruction
          reference: "https://attack.mitre.org/techniques/T1485/"
      tactic:
        id: TA0040
        name: Impact
        reference: "https://attack.mitre.org/tactics/TA0040/"
  internal:
    min_endpoint_version: "8.0.0"
