47985e2e15ca7ec971c4165d68f66eed86\",\n                                 \"2b6c43f27f3c72652dedd07fa12131d64b4451638922361879a13e7289e552af\",\n                                 \"644bca8e169fe2434124f528a7e2fabd45634301575890da81377d8f03636d35\",\n                                 \"7eabaf02d37a50a3fb4aaae154f9e803f67a275e9af4b59adac4dccd733485d7\",\n                                 \"21eb39285fcd91148385d11b77489aad84e00f15b42bbdd98c6bc2fdaca7b987\",\n                                 \"18bc51c6c267f218e14280d7b21b48ee23968c9ea76bbab945d7456a3da05907\", \n                                 \"f52cf893bd4b5ed92065197bb1eecb2546cd192b603c831cef0acb2d03ab83a4\", \n                                 \"eb5a608211fc88588094ef613b9983f4a7744a90309375096eaf12fe29d506d9\", \n                                 \"cf131738f4b5fe3f42e9108e24595fc3e6573347d78e4e69ec42106c1eebe42c\", \n                                 \"097b30f6ef06eb2447f459a20a777190eefda55d148dd109ed3547b2338b540f\", \n                                 \"c4bac26cc79788539e98b99989b3d2e9e13b74974b861badc66613a5e661ba90\", \n                                 \"b83ca6663e8840c29790c00783bf29c8aa6d8cab6bae5cb9ca8aa7c7901462f4\", \n                                 \"705e4e1db0576aa2a6df0ba9ebeda9e647e2ce95d90727d6b95f559a4a95c1fe\",\n                                 \"c70c8840b2d56de13c20fd2144784bfb955b847c83b45673352375802d14b3d5\",\n                                 \"394ba9db0f6d26ec083decceee35ef7973a41681c522b9d400cf46fc5709015f\",\n                                 \"28304f6396076ca10babe682950eaa06574a291e5fbee5aaeec8ac69f1dc46b3\", \n                                 \"dbd690d20b6a0ef2fec54ce7cf549884ad0509ed08ae0eb715fe5b7c501afe6b\") and\nnot _arraysearch(process.thread.Ext.call_stack_final_user_module.code_signature, $entry,\n($entry.trusted == true or $entry.status == \"errorExpired\") and\n$entry.subject_name in (\n\"AMD PMP-PE CB Code Signer v20140501\",\n\"Carbon Black, Inc.\",\n\"PC SOFT INFORMATIQUE SAS\",\n\"Kaspersky Lab JSC\",\n\"Kaspersky Lab\",\n\"AO Kaspersky Lab\",\n\"ESET, spol. s r.o.\",\n\"MUSARUBRA US LLC\",\n\"Microsoft Windows Hardware Compatibility Publisher\"\n)) and\nnot _arraysearch(process.thread.Ext.call_stack, $entry,\n                 $entry.symbol_info like\n                                     (\"c:\\\\windows\\\\*\\\\ntdll.dll!Ldr*\",\n                                      \"c:\\\\windows\\\\*\\\\ntdll.dll!RtlAllocateHeap*\",\n                                      \"c:\\\\windows\\\\sys?????\\\\ntdll.dll!RtlFreeHeap*\",\n                                      \"c:\\\\windows\\\\sys?????\\\\ntdll.dll!RtlReAllocateHeap*\",\n                                      \"c:\\\\windows\\\\sys?????\\\\ntdll.dll!RtlUnlockHeap*\",\n                                      \"c:\\\\windows\\\\sys?????\\\\ntdll.dll+0x*\", \n                                      \"c:\\\\windows\\\\sys*\\\\kernelbase.dll!VirtualAlloc*\", \n                                      \"c:\\\\windows\\\\system32\\\\kernelbase.dll!HeapCreat*\")) and\nnot (process.executable : \"\\\\\\\\?\\\\Volume{*}\\\\*.exe\" and process.thread.Ext.call_stack_final_user_module.path like \"?:\\\\*\\\\docker\\\\*\\\\windows\\\\*\") and \nnot process.thread.Ext.call_stack_summary like (\"ntdll.dll|libpcre*.dll|libgobject-*.dll|ntdll.dll\", \"ntdll.dll|libffi-*.dll|libpython*.dll|ntdll.dll\")\n"
  min_endpoint_version: "8.16.3"
  optional_actions: []
  actions:
