id: "970e26d3-9a1d-474e-b2bf-facc5e1666f9_1.0.1"
type: security-rule
attributes:
  description: |
    Identifies anomalous execution of BrowserCore.exe, the Windows component used by Chromium-based browsers for native
    messaging. Adversaries abuse BrowserCore to extract Primary Refresh Tokens (PRTs) from the Web Account Manager (WAM)
    without user interaction, enabling Entra ID session hijacking.
  rule_id: "970e26d3-9a1d-474e-b2bf-facc5e1666f9"
  license: Elastic License v2
  name: Potential Entra ID PRT Extraction via BrowserCore
  os_list:
    - windows
  reference:
    - "https://www.armadin.com/blog-posts/prtremote-extract-prt-cookies-remotely-with-interactivetoken-scheduled-task"
    - "https://github.com/dmcxblue/ANIMO/blob/master/helpers/scripts/GrabTokenAzureAD/PrtExtractor.cs"
    - "https://attack.mitre.org/techniques/T1528/"
    - "https://attack.mitre.org/techniques/T1539/"
  version: "1.0.1"
  query: "process where event.action == \"start\" and process.parent.name != null and \n(\n  /* Wrong path - masquerade */\n  (\n    (process.pe.original_file_name == \"BrowserCore.exe\" or process.name : \"BrowserCore.exe\") and\n    not process.executable : (\"?:\\\\Windows\\\\BrowserCore\\\\BrowserCore.exe\", \"?:\\\\Program Files\\\\Windows Security\\\\BrowserCore\\\\BrowserCore.exe\")\n  )\n  or\n  /* Anomalous launch context */\n  (\n    process.name : \"BrowserCore.exe\" and\n    process.executable : (\"?:\\\\Windows\\\\BrowserCore\\\\BrowserCore.exe\", \"?:\\\\Program Files\\\\Windows Security\\\\BrowserCore\\\\BrowserCore.exe\") and\n    not (\n      process.parent.name : \"cmd.exe\" and \n      process.parent.command_line : \"*chrome-extension*--parent-window=*\" and process.command_line : \"*chrome-extension*--parent-window=*\"\n    )\n  )\n)\n"
  min_endpoint_version: "8.10.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
    - action: kill_process
      field: process.parent.entity_id
      state: 0
      tree: true
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1528
          name: Steal Application Access Token
          reference: "https://attack.mitre.org/techniques/T1528/"
        - id: T1539
          name: Steal Web Session Cookie
          reference: "https://attack.mitre.org/techniques/T1539/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.10.0"
