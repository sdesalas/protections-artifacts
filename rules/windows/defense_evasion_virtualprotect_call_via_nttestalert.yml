id: "9906a386-771f-4003-b426-fbe75bdd6e73_1.0.7"
type: security-rule
attributes:
  description: |
    Detects calls to the VirtualProtect Windows API to change memory permissions and the call is originating from a thread
    pointing to the API NtTestAlert. This may indicate that this call is coming from a pending APC or a sleeping thread.
  rule_id: "9906a386-771f-4003-b426-fbe75bdd6e73"
  license: Elastic License v2
  name: VirtualProtect Call via NtTestAlert
  os_list:
    - windows
  reference:
    - "https://www.elastic.co/security-labs/doubling-down-etw-callstacks"
  version: "1.0.7"
  query: "api where \n process.Ext.api.name : \"VirtualProtect\" and \n process.thread.Ext.call_stack_summary : \"ntdll.dll*\" and \n _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info : (\"*NtTestAlert*\", \"*ZwTestAlert*\")) and \n _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info : \"*ProtectVirtualMemory*\") and \n process.thread.Ext.call_stack_summary : (\"ntdll.dll\", \"ntdll.dll|kernelbase.dll|ntdll.dll|Unknown\", \"ntdll.dll|Unbacked\", \"ntdll.dll|Unknown\") and\n not _arraysearch(process.thread.Ext.call_stack, $entry, $entry.protection_provenance : (\"Kernel\", \"Kernel|*\"))\n"
  min_endpoint_version: "8.8.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.8.0"
