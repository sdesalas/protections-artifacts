id: "8f9a6523-fa8f-46d1-b2de-72ef18e85f52_1.0.6"
type: security-rule
attributes:
  description: |
    Identifies the load of a signed DLL followed by calling VirtualAlloc API to allocate writable and executable memory.
    This may indicate an attempt to perform code injection from a signed library.
  rule_id: "8f9a6523-fa8f-46d1-b2de-72ef18e85f52"
  license: Elastic License v2
  name: Memory Allocation from a High Entropy Module
  os_list:
    - windows
  version: "1.0.6"
  query: "sequence\n[file where event.type in (\"creation\", \"change\") and user.id != \"S-1-5-18\" and process.pid != 4 and\n file.Ext.header_bytes : \"4d5a*\" and file.Ext.entropy >= 6 and\n not file.path : (\"?:\\\\Windows\\\\Installer\\\\*\",\n                  \"?:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\*\",\n                  \"?:\\\\Windows\\\\SysWOW64\\\\DriverStore\\\\FileRepository\\\\*\",\n                  \"?:\\\\Windows\\\\assembly\\\\*\",\n                  \"?:\\\\Program Files\\\\*\",\n                  \"?:\\\\Program Files (x86)\\\\*\")] as event0\n[api where\n  process.Ext.api.name : (\"VirtualAlloc*\", \"MapViewOfFile*\") and process.Ext.api.parameters.protection == \"RWX\" and\n  process.Ext.api.metadata.target_address_name == \"Unbacked\" and\n  process.Ext.token.integrity_level_name in (\"medium\", \"high\") and\n  process.thread.Ext.call_stack_final_user_module.hash.sha256 != null and\n  _arraysearch(process.thread.Ext.call_stack_final_user_module.code_signature, $entry, $entry.trusted == true and \n               not $entry.subject_name : (\"College Board\", \"SEIKO EPSON CORPORATION\", \"EPADLINK\", \"Flexera Software, Inc. \", \"Acresso Software Inc.\", \"Realtek Semiconductor Corp\")) and\n  stringcontains~(process.thread.Ext.call_stack_final_user_module.path, event0.file.path) and\n  (\n   endswith~(process.thread.Ext.call_stack_summary, concat(\"ntdll.dll|kernelbase.dll|\", event0.file.name)) or\n   endswith~(process.thread.Ext.call_stack_summary, concat(\"ntdll.dll|\", event0.file.name))\n   ) and\n   not process.executable : (\"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\") and\n   not startswith~(process.thread.Ext.call_stack_final_user_module.name, process.name) and\n   not (process.thread.Ext.call_stack_final_user_module.name in (\"isrt.dll\", \"issetup.dll\", \"_isres.dll\", \"wow64.lmd\") and\n        process.thread.Ext.call_stack_summary in\n                               (\"ntdll.dll|wow64.dll|wow64cpu.dll|wow64.dll|ntdll.dll|kernelbase.dll|isrt.dll\",\n                                \"ntdll.dll|wow64.dll|wow64cpu.dll|wow64.dll|ntdll.dll|kernelbase.dll|issetup.dll\",\n                                \"ntdll.dll|wow64.dll|wow64cpu.dll|wow64.dll|ntdll.dll|kernelbase.dll|_isres.dll\",\n                                \"ntdll.dll|wow64.dll|wow64cpu.dll|wow64.dll|ntdll.dll|kernelbase.dll|wow64.lmd\")) and\n   not (process.executable : \"?:\\\\Windows\\\\SysWOW64\\\\msiexec.exe\" and\n        process.thread.Ext.call_stack_final_user_module.name like \"msi*.tmp\" and\n        process.thread.Ext.call_stack_summary like \"ntdll.dll|wow64.dll|wow64cpu.dll|wow64.dll|ntdll.dll|kernelbase.dll|msi*.tmp\") and\n   process.thread.Ext.call_stack_final_user_module.hash.sha256 != \"b35e38071d8f32e1cfc51f7aa4c7f406461eb062123fd25ef746b3c75416c01a\"\n   ]\nuntil [process where event.action == \"end\"]\n"
  min_endpoint_version: "8.10.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
        - id: T1574
          name: Hijack Execution Flow
          reference: "https://attack.mitre.org/techniques/T1574/"
          subtechnique:
            - id: T1574.001
              name: DLL
              reference: "https://attack.mitre.org/techniques/T1574/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.10.0"
