id: "39f60a36-8c5a-4703-8576-ad3e8c800a0f_1.0.35"
type: security-rule
attributes:
  description: |
    Identifies an unusual process accessing common cloud providers credential files. Adversaries may search local file
    systems and remote file shares for files containing insecurely stored credentials.
  rule_id: "39f60a36-8c5a-4703-8576-ad3e8c800a0f"
  license: Elastic License v2
  name: Sensitive File Access - Cloud Credentials
  os_list:
    - windows
  reference:
    - "https://github.com/GhostPack/Seatbelt"
  version: "1.0.35"
  query: "sequence by process.entity_id with maxspan=5m\n   [process where event.action == \"start\" and\n    user.id like (\"S-1-5-21*\", \"S-1-12-*\") and process.executable != null and \n    not (process.code_signature.subject_name : (\"Johannes Schindelin\", \"Anaconda, Inc.\") and process.code_signature.status == \"trusted\") and\n    not (process.code_signature.subject_name : \"Python Software Foundation\" and\n         process.executable : \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Google\\\\Cloud SDK\\\\google-cloud-sdk\\\\platform\\\\bundledpython\\\\python.exe\") and\n    not process.executable :\n          (\n            /* third party programs common install path - requires local admin */\n            \"?:\\\\Program Files\\\\*\",\n            \"?:\\\\Program Files (x86)\\\\*\",\n\n            /*\n              dllhost.exe (IFileOperation like view/changing security permission of a file/folder).\n              explorer.exe for directory and file discovery.\n              SearchProtocolHost.exe is for file searches and indexing.\n             */\n            \"?:\\\\Windows\\\\explorer.exe\",\n            \"?:\\\\Windows\\\\System32\\\\dllhost.exe\",\n            \"?:\\\\Windows\\\\System32\\\\SearchProtocolHost.exe\",\n\n            /* Windows Defender */\n            \"?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*\\\\MsMpEng.exe\",\n            \"?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*\\\\MpCopyAccelerator.exe\") and\n    process.hash.sha256 != \"0a8876ede7d2b65a5a0443831b2b4757d3519396a22bd55c20102bc67e6d16b3\"]\n   [file where event.type == \"access\" and\n    /* non system accounts */\n    user.id like (\"S-1-5-21*\", \"S-1-12-*\") and\n\n    /* AWS/Google/Azure/Git cloud credential files */\n    file.path : (\"?:\\\\users\\\\*\\\\AppData\\\\*\\\\gcloud\\\\credentials.db\",\n                 \"?:\\\\users\\\\*\\\\AppData\\\\*\\\\gcloud\\\\legacy_credentials\",\n                 \"?:\\\\users\\\\*\\\\AppData\\\\*\\\\gcloud\\\\access_tokens.db\",\n                 \"?:\\\\users\\\\*\\\\.azure\\\\accessTokens.json\",\n                 \"?:\\\\users\\\\*\\\\.azure\\\\azureProfile.json\",\n                 \"?:\\\\users\\\\*\\\\.azure\\\\msal_token_cache.json\",\n                 \"?:\\\\users\\\\*\\\\.azure\\\\msal_token_cache.bin\",\n                 \"?:\\\\users\\\\*\\\\.azure\\\\msal_http_cache.bin\",\n                 \"?:\\\\users\\\\*\\\\.aws\\\\credentials\",\n                 \"?:\\\\Users\\\\*\\\\.config\\\\git\\\\credentials\")]\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "7.15.0"
