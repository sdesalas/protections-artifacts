id: cabd7f21-70ff-429b-8818-f210ba603461_1.0.27
type: security-rule
attributes:
  description: |
    Identifies attempt to coerce a local NTLM authentication via HTTP using Printer Spooler service as a target. An
    adversary may use this primitive in combination with others to elevate privileges on a compromised system.
  rule_id: cabd7f21-70ff-429b-8818-f210ba603461
  license: Elastic License v2
  name: Privilege Escalation via NTLMRelay2Self
  os_list:
    - windows
  reference:
    - "https://github.com/med0x2e/NTLMRelay2Self"
  version: "1.0.27"
  query: "process where event.action == \"start\" and\n  process.name : \"rundll32.exe\" and \n  \n  /* Rundll32 WbeDav Client  */\n  process.args : (\"?:\\\\Windows\\\\System32\\\\davclnt.dll,DavSetCookie\", \"?:\\\\Windows\\\\SysWOW64\\\\davclnt.dll,DavSetCookie\") and \n  \n  /* Access to named pipe via http */\n  process.args : (\"http*/print/pipe/*\", \"http*/pipe/spoolss\", \"http*/pipe/srvsvc\")\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1068
          name: Exploitation for Privilege Escalation
          reference: "https://attack.mitre.org/techniques/T1068/"
      tactic:
        id: TA0004
        name: Privilege Escalation
        reference: "https://attack.mitre.org/tactics/TA0004/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1558
          name: Steal or Forge Kerberos Tickets
          reference: "https://attack.mitre.org/techniques/T1558/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "7.15.0"
