id: "4b61b37d-c569-444a-bafa-e29d221ee55c_1.0.33"
type: security-rule
attributes:
  description: |
    Identifies abuse of the Console Window Host (conhost.exe) to execute an arbitrary executable. This behavior is used as a
    defense evasion technique to blend-in malicious activity with legitimate Windows software.
  rule_id: "4b61b37d-c569-444a-bafa-e29d221ee55c"
  license: Elastic License v2
  name: Indirect Command Execution via Console Window Host
  os_list:
    - windows
  reference:
    - "https://lolbas-project.github.io/lolbas/Binaries/Conhost/"
  version: "1.0.33"
  query: "process where event.action == \"start\" and\n  process.parent.name : \"conhost.exe\" and process.parent.args_count >= 2 and\n  process.parent.command_line : (\"*conhost* *.exe*\", \"*cmd /c *\", \"*powershell*\", \"*script*\", \"*mshta*\", \"* curl *\") and\n  not process.command_line :\n            (\"?:\\\\windows\\\\system32\\\\cmd.exe\",\n             \"?:\\\\windows\\\\SysWOW64\\\\cmd.exe\", \"cmd.exe\",\n             \"?:\\\\windows\\\\system32\\\\windowspowershell\\\\*\\\\powershell.exe\",\n             \"powershell.exe -NoProfile -ExecutionPolicy Bypass -File winget-upgrade.ps1\",\n             \"powershell.exe -NoProfile -ExecutionPolicy Bypass -File WAU-Notify.ps1\") and\n  not process.parent.executable : \"\\\\Device\\\\Mup\\\\*\\\\IBM\\\\ClientSolutions\\\\Start_Programs\\\\Windows*\\\\acslaunch_win-*.exe\" and \n  not process.hash.sha256 : \"b37565fabde8680ef7d0de3c808096b7512f42c62071f2fb486da14b773ec04a\" and\n  not process.executable : (\"?:\\\\Program Files\\\\*.exe\", \"?:\\\\Program Files (x86)\\\\*.exe\") and\n  not (process.code_signature.subject_name == \"International Business Machines Corporation\" and process.code_signature.trusted == true) and\n  not (process.name : \"powershell.exe\" and process.args : \"-ExecutionPolicy\" and process.args : (\"-F\", \"Stop-Process*\")) and\n  not (process.args in (\"/bin/sh\", \"bash\") and process.parent.args == \"--height\" and process.parent.args == \"24\") and\n  not process.parent.command_line : \"*\\\\ProgramData\\\\MaverickGardner\\\\WingetUpgrade\\\\*\"\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1202
          name: Indirect Command Execution
          reference: "https://attack.mitre.org/techniques/T1202/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
