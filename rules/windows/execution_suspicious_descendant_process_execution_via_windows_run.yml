id: "9afd4fdc-15bc-4725-9164-dfcc2f1cb5ee_1.0.4"
type: security-rule
attributes:
  description: |
    Identifies the execution of Windows commands via the Windows Run window. Adversaries may use phishing to instruct the
    victim to copy and paste malicious commands for execution via the Windows Run menu.
  rule_id: "9afd4fdc-15bc-4725-9164-dfcc2f1cb5ee"
  license: Elastic License v2
  name: Suspicious Descendant Process Execution via Windows Run
  os_list:
    - windows
  reference:
    - "https://blog.sekoia.io/clickfake-interview-campaign-by-lazarus/"
  version: "1.0.4"
  query: "process where event.action == \"start\" and\n process.name : (\"powershell.exe\", \"curl.exe\", \"msiexec.exe\", \"mshta.exe\", \"wscript.exe\", \"rundll32.exe\", \"certutil.exe\", \"certreq.exe\") and process.args_count >= 2 and\n descendant of [process where event.action == \"start\" and process.name : (\"cmd.exe\", \"powershell.exe\") and\n                process.parent.name : \"explorer.exe\" and\n                process.parent.thread.Ext.call_stack_summary like \"*|user32.dll|shell32.dll|explorer.exe|shcore.dll|*\" and\n                _arraysearch(process.parent.thread.Ext.call_stack, $entry, \n                $entry.symbol_info like (\"C:\\\\Windows\\\\System32\\\\user32.dll!DialogBoxParamW*\", \n                                         \"C:\\\\Windows\\\\System32\\\\user32.dll!DialogBoxIndirectParamW*\", \n                                         \"C:\\\\Windows\\\\System32\\\\shell32.dll!GetFileNameFromBrowse*\"))] and\n not (process.name : \"powershell.exe\" and\n      process.args :(\"-NoProfile\", \"-Command\", \"-ExecutionPolicy\", \"-noexit\", \"-WindowsStyle\", \"ls\", \"*-UseBasicParsing*\", \"-file\", \"--version\", \"*Get-WmiObjec*\", \"Port\", \"Test-Path\", \"Get-*\")) and\n not (process.name : \"curl.exe\" and process.parent.name : (\"cmd.exe\", \"bash.exe\")) and\n not (process.name : \"curl.exe\" and process.args : (\"-L\", \"-F\", \"POST\")) and\n not (process.name : \"certutil.exe\" and not process.args : (\"-urlcache\", \"-decode\")) and\n not (process.name : \"rundll32.exe\" and process.parent.executable : (\"C:\\\\Windows\\\\System32\\\\control.exe\", \"C:\\\\$WINDOWS.~BT\\\\Sources\\\\SetupHost.exe\")) and\n not (process.name : \"rundll32.exe\" and\n      process.command_line :(\"rundll32  printui.dll PrintUIEntry /im\",\n                             \"rundll32.exe \\\"C:\\\\ProgramData\\\\FastTrack Software\\\\Admin By Request\\\\ShellHelper32.dll\\\",#1\",\n                             \"rundll32.exe \\\"C:\\\\ProgramData\\\\FastTrack Software\\\\Admin By Request\\\\ShellHelper64.dll\\\",#1\",\n                             \"rundll32  printui.dll PrintYUEntry /im\")) and\n not (process.name : \"rundll32.exe\" and\n      process.args : (\"C:\\\\Windows\\\\system32\\\\inetcpl.cpl,ClearMyTracksByProcess\", \"url.dll,FileProtocolHandler\", \"ndfapi.dll,NdfRunDllDiagnoseWithAnswerFile\", \"inetcpl.cpl\",\n                      \"C:\\\\Program Files\\\\Notepad++\\\\contextmenu\\\\NppShell.dll,CleanupDll\", \"user32.dll,*\", \"printui.dll\", \"keymgr.dll,*\", \"url,OpenURL\")) and\n not (process.name : \"wscript.exe\" and process.parent.executable : \"C:\\\\Program Files (x86)\\\\Beyond Compare ?\\\\BCompare.exe\") and\n not (process.name : \"wscript.exe\" and process.args : (\"*\\\\Program Files\\\\*\", \"C:\\\\Windows\\\\system32\\\\slmgr.vbs\", \"\\\\\\\\*\")) and\n not (process.name : \"msiexec.exe\" and process.args : (\"/log\", \"/passive\", \"/L*V\", \"WAZUH_AGENT_GROUP=default\", \"/x\", \"D:\\\\*.msi\", \"/a\", \"/uninstall\", \"/unregister\", \"/regserver\", \"USERDOMAIN*\", \"C:\\\\Windows\\\\Temp\\\\*\", \"/I{*\", \"TOKEN=*\")) and \n not process.working_directory : (\"?:\\\\\", \"?:\\\\Program Files*\", \"C:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Programs\\\\Microsoft VS Code\\\\\") and \n not process.executable : (\"C:\\\\Program Files\\\\*\\\\curl.exe\", \"\\\\Device\\\\Mup\\\\*.exe\") and\n not process.parent.executable :  (\"\\\\Device\\\\Mup\\\\*.exe\", \"D:\\\\*.exe\")\n"
  min_endpoint_version: "8.10.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1566
          name: Phishing
          reference: "https://attack.mitre.org/techniques/T1566/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
            - id: T1059.003
              name: Windows Command Shell
              reference: "https://attack.mitre.org/techniques/T1059/003/"
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.10.0"
