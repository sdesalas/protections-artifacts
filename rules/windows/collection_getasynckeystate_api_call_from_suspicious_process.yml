id: ef0a2322-641b-4127-8b48-2def55fe1f1f_1.0.5
type: security-rule
attributes:
  description: |
    Identifies attempts to enumerate the state of keyboard keys by an unusual process. Adversaries may log user keystrokes
    to intercept credentials or other information from the user as the user types them.
  rule_id: ef0a2322-641b-4127-8b48-2def55fe1f1f
  license: Elastic License v2
  name: GetAsyncKeyState API Call from Suspicious Process
  os_list:
    - windows
  reference:
    - "https://attack.mitre.org/techniques/T1056/001/"
    - "https://learn.microsoft.com/en-us/windows/win32/api/winuser/nf-winuser-getasynckeystate"
    - "https://www.elastic.co/security-labs/protecting-your-devices-from-information-theft-keylogger-protection"
  version: "1.0.5"
  query: "sequence by process.entity_id with maxspan=5m\n [process where event.action == \"start\" and\n  (\n   (process.Ext.device.product_id : (\"Virtual DVD-ROM\", \"Virtual Disk\") and not process.executable : \"C:\\\\*\") or\n   (process.Ext.relative_file_creation_time <= 500 and (process.code_signature.trusted == false or process.code_signature.exists == false)) or\n   process.name in~ (\"rundll32.exe\", \"regsvr32.exe\", \"powershell.exe\", \"wscript.exe\", \"cscript.exe\", \"mshta.exe\") or\n   process.pe.original_file_name : (\"python*.exe\", \"AutoIt*.exe\") or\n   (process.Ext.relative_file_creation_time <= 500 and\n    process.executable :\n                (\"?:\\\\Users\\\\Public\\\\*\",\n                 \"?:\\\\Users\\\\*\\\\Downloads\\\\*\",\n                 \"?:\\\\Windows\\\\Temp\\\\*\",\n                 \"?:\\\\Windows\\\\Tasks\\\\*\",\n                 \"?:\\\\ProgramData\\\\*\",\n                 \"?:\\\\Windows\\\\Microsoft.NET\\\\*\")) or\n    process.executable : (\"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\7z*\\\\\",\n                         \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\Rar$*\\\\*\",\n                         \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\Temp?_*\\\\*\",\n                         \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\BNZ.*\") or\n   (process.parent.name : \"svchost.exe\" and process.parent.args : \"Schedule\")\n  ) and\n  not process.executable :\n              (\"?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*\\\\MsMpEng.exe\",\n              \"?:\\\\Program Files (x86)\\\\*.exe\",\n              \"?:\\\\Program Files\\\\*.exe\") and\n  not (process.name : \"rundll32.exe\" and process.args : \"C:\\\\Windows\\\\System32\\\\LogiLDA.dll,LogiFetch\")\n  ]\n [api where process.Ext.api.name == \"GetAsyncKeyState\" and\n   process.Ext.api.metadata.background_callcount >= 400 and process.Ext.api.metadata.ms_since_last_keyevent >= 100 and \n   not (process.executable : \"?:\\\\Windows\\\\System32\\\\rundll32.exe\" and \n        process.command_line : \"\\\"?:\\\\Windows\\\\System32\\\\rundll32.exe\\\" C:\\\\Windows\\\\System32\\\\LogiLDA.dll,LogiFetch\" and \n        process.thread.Ext.call_stack_summary == \"win32u.dll|winsrvext.dll|ntdll.dll\")]\n"
  min_endpoint_version: "8.12.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1056
          name: Input Capture
          reference: "https://attack.mitre.org/techniques/T1056/"
          subtechnique:
            - id: T1056.001
              name: Keylogging
              reference: "https://attack.mitre.org/techniques/T1056/001/"
      tactic:
        id: TA0009
        name: Collection
        reference: "https://attack.mitre.org/tactics/TA0009/"
  internal:
    min_endpoint_version: "8.12.0"
