id: "8b1ae402-a41b-485f-8eb6-00ae6144cf8a_1.0.7"
type: security-rule
attributes:
  description: |
    Identifies the execution of a binary via the Windows RunExeHelper utility. Adversaries may bypass process and
    signature-based defenses by proxying execution of malicious content with signed, or otherwise trusted, binaries.
  rule_id: "8b1ae402-a41b-485f-8eb6-00ae6144cf8a"
  license: Elastic License v2
  name: Binary Proxy Execution via Runexehelper
  os_list:
    - windows
  reference:
    - "https://lolbas-project.github.io/lolbas/Binaries/Runexehelper/"
  version: "1.0.7"
  query: "process where event.action == \"start\" and process.parent.name : \"runexehelper.exe\" and \n not process.executable :\n              (\"?:\\\\Windows\\\\System32\\\\conhost.exe\",\n               \"?:\\\\Windows\\\\System32\\\\powercfg.exe\",\n               \"?:\\\\WINDOWS\\\\system32\\\\wevtutil.exe\",\n               \"?:\\\\Windows\\\\System32\\\\WSCollect.exe\",\n               \"?:\\\\Windows\\\\System32\\\\TpmTool.exe\",\n               \"?:\\\\Windows\\\\System32\\\\MdmDiagnosticsTool.exe\",\n               \"?:\\\\Windows\\\\System32\\\\dsregcmd.exe\",\n               \"?:\\\\Windows\\\\System32\\\\stordiag.exe\",\n               \"?:\\\\Windows\\\\System32\\\\dxdiag.exe\",\n               \"?:\\\\Windows\\\\System32\\\\logman.exe\",\n               \"?:\\\\Windows\\\\System32\\\\licensingdiag.exe\",\n               \"?:\\\\Windows\\\\System32\\\\dispdiag.exe\",\n               \"?:\\\\Windows\\\\System32\\\\pnputil.exe\",\n               \"?:\\\\Windows\\\\System32\\\\hcsdiag.exe\",\n               \"?:\\\\Windows\\\\System32\\\\ddodiag.exe\")\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1218
          name: System Binary Proxy Execution
          reference: "https://attack.mitre.org/techniques/T1218/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
