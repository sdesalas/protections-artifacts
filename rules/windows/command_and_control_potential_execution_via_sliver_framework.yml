id: "14626cac-eb09-4e52-81f1-f87975e8f5ae_1.0.19"
type: security-rule
attributes:
  description: |
    Identifies the execution of commands via Windows PowerShell with a pattern specific to the Sliver pentesting framework.
    Sliver is an open source cross-platform adversary emulation and red team framework.
  rule_id: "14626cac-eb09-4e52-81f1-f87975e8f5ae"
  license: Elastic License v2
  name: Potential Execution via Sliver Framework
  os_list:
    - windows
  reference:
    - "https://github.com/BishopFox/sliver/blob/master/implant/sliver/shell/shell_windows.go#L39"
    - "https://github.com/BishopFox/sliver"
  version: "1.0.19"
  query: "process where event.action == \"start\" and\n\n(\n  /* Silver default shell cmd */\n (process.name : \"powershell.exe\" and\n  process.command_line : \"?:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\*\\\\powershell.exe -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8\") or\n\n (process.parent.name : \"powershell.exe\" and\n  process.parent.command_line : \"?:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\*\\\\powershell.exe -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8\") or\n\n  descendant of [process where event.action == \"start\" and\n                 process.name : \"powershell.exe\" and\n                 process.command_line : \"?:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\*\\\\powershell.exe -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8\"] or\n\n   /* getsystem default to injecting spoolsv.exe and for diverse cmds default to spawn a notepad.exe instance */\n  (process.executable : \"?:\\\\Windows\\\\System32\\\\notepad.exe\" and process.parent.executable : \"?:\\\\Windows\\\\system32\\\\spoolsv.exe\") or\n\n   /* Silver spawns_as a child process with extra quotes after the process image */\n  (process.args_count == 2 and process.command_line : \"?:\\\\*.exe \\\"\\\"\" and process.args : \"?:\\\\Windows\\\\*.exe\")\n) and\nnot (process.code_signature.subject_name : \"Chocolatey Software, Inc.\" and process.code_signature.trusted == true) and\nnot (process.parent.executable : \"?:\\\\ProgramData\\\\chocolatey\\\\choco.exe\" and process.parent.args : \"install\") and\nnot  descendant of [process where event.action == \"start\" and\n                    process.code_signature.subject_name : \"Chocolatey Software, Inc.\" and process.code_signature.trusted == true] and\nnot (process.executable : \"?:\\\\Windows\\\\System32\\\\setx.exe\" and\n      process.args : \"ChocolateyLastPathUpdate\" and process.parent.name : \"powershell.exe\") and \nnot process.parent.executable : \"?:\\\\Program Files (x86)\\\\Microsoft Office\\\\root\\\\Office*\\\\protocolhandler.exe\"\n"
  min_endpoint_version: "7.16.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "7.16.0"
