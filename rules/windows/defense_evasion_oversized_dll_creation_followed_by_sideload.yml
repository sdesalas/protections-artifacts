id: "33cdad6c-5809-4d78-94f0-5a5153289e7e_1.0.23"
type: security-rule
attributes:
  description: |
    Identifies the creation of an unsigned or untrusted large DLL and subsequently loaded by a trusted binary. This behavior
    is consistent with some malwares leveraging malicious DLLs for evasion and execution.
  rule_id: "33cdad6c-5809-4d78-94f0-5a5153289e7e"
  license: Elastic License v2
  name: Oversized DLL Creation followed by SideLoad
  os_list:
    - windows
  version: "1.0.23"
  query: "sequence with maxspan=5m\n [file where event.action != \"deletion\" and file.Ext.header_bytes : \"4d5a*\" and\n\n  /* size more or equal to 90MB */\n   file.size >= 90000000 and\n\n  not process.executable : \"?:\\\\Windows\\\\System32\\\\drvinst.exe\" and\n\n  not (process.code_signature.trusted == true and not process.code_signature.subject_name : \"Microsoft *\")\n ] as event0\n [library where\n   (dll.Ext.relative_file_creation_time < 5000 or dll.Ext.relative_file_name_modify_time < 5000) and\n   not dll.code_signature.trusted == true and\n   process.code_signature.trusted == true and not startswith~(dll.name, process.name) and\n   startswith~(dll.path, event0.file.path) and\n   not process.executable : \n               (\"?:\\\\Program Files\\\\*.exe\", \n                \"?:\\\\Program Files (x86)\\\\*.exe\", \n                \"?:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\*\", \n                \"?:\\\\Windows\\\\SysWOW64\\\\DriverStore\\\\FileRepository\\\\*\", \n                \"?:\\\\Windows\\\\System32\\\\msiexec.exe\", \n                \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\SquirrelTemp\\\\Update.exe\") and \n   not process.code_signature.subject_name :\n                              (\"TEAMDEV LTD.\", \"Spotify AB\", \"Snap-on Business Solutions, Inc.\", \"ITAU UNIBANCO S.A.\",\n                               \"Kahua Inc.\", \"Bloomberg LP\", \"Amazon.com Services LLC\", \"EnterpriseDB Corporation\",\n                               \"Mitel Networks Corporation\", \"The Document Foundation\", \"Bytedance Pte. Ltd.\", \"Kahua Inc.\", \n                               \"Sikka Software Corporation\", \"Leica Geosystems Inc\", \"3M Company\", \"DASSAULT SYSTEMES SE\",\n                               \"Dassault Systemes SolidWorks Corp.\", \"Siemens Industry Software Inc.\", \"PlanGrid, Inc.\",\n                               \"Stichting Blender Foundation\") and\n   not dll.name : (\"libcef.dll\", \"Qt?WebEngineCore.dll\", \"xul.dll\", \"chrome.dll\", \"libwireshark.dll\", \"chrome_child.dll\", \"msedge.dll\") and\n  /* loaded from current dir */\n   endswith~(substring(dll.path, 0, length(dll.path) - (length(dll.name) + 1)),\n             substring(process.executable, 0, length(process.executable) - (length(process.name) + 1)))]\n"
  min_endpoint_version: "8.4.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
          subtechnique:
            - id: T1027.001
              name: Binary Padding
              reference: "https://attack.mitre.org/techniques/T1027/001/"
        - id: T1574
          name: Hijack Execution Flow
          reference: "https://attack.mitre.org/techniques/T1574/"
          subtechnique:
            - id: T1574.001
              name: DLL
              reference: "https://attack.mitre.org/techniques/T1574/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.4.0"
