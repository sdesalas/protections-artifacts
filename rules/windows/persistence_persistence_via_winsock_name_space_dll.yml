id: "2dfb5c86-0563-4c1e-aaf2-f975f37cc84d_1.0.2"
type: security-rule
attributes:
  description: |
    Identifies the modification of the WinSock2 Name Space registry to potentially maintain persistence via a malicious DLL
    that gets loaded by any processes invoking the Winsock 2 library (ws2_32.dll).
  rule_id: "2dfb5c86-0563-4c1e-aaf2-f975f37cc84d"
  license: Elastic License v2
  name: Persistence via WinSock Name Space DLL
  os_list:
    - windows
  reference:
    - "https://www.welivesecurity.com/en/eset-research/nspx30-sophisticated-aitm-enabled-implant-evolving-since-2005/"
  version: "1.0.2"
  query: "sequence with maxspan=1m\n [file where event.action != \"deletion\" and (file.Ext.header_bytes : \"4d5a*\" or file.extension : \"dll\") and\n  not (user.id == \"S-1-5-18\" and process.name == \"msiexec.exe\") and\n  not process.executable : \"?:\\\\$WINDOWS.~BT\\\\Sources\\\\mighost.exe\"] as event0\n [registry where registry.data.strings != null and registry.value == \"LibraryPath\" and\n  _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info: \"*ws2_32.dll!WSCInstallNameSpace*\") and \n  stringcontains~(registry.data.strings, event0.file.path)]\n"
  min_endpoint_version: "8.8.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1112
          name: Modify Registry
          reference: "https://attack.mitre.org/techniques/T1112/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.8.0"
