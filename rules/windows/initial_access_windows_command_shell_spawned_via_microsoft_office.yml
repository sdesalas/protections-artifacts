id: "2a396a3c-b343-42a9-b74b-c5b9925b6ee2_1.0.33"
type: security-rule
attributes:
  description: |
    Identifies a Microsoft Office application starting a Windows command prompt with suspicious command line arguments. This
    behavior is consistent with a victim opening a malicious document and executing an attacker's malicious code.
  rule_id: "2a396a3c-b343-42a9-b74b-c5b9925b6ee2"
  license: Elastic License v2
  name: Windows Command Shell Spawned via Microsoft Office
  os_list:
    - windows
  reference:
    - "https://github.com/danielbohannon/Invoke-DOSfuscation"
  version: "1.0.33"
  query: "process where event.action == \"start\" and\n  process.parent.name : (\"excel.exe\", \"powerpnt.exe\", \"winword.exe\") and\n  (process.pe.original_file_name == \"Cmd.Exe\" or process.name : \"cmd.exe\") and\n  process.command_line :\n              (\"*^*^*^*^*^*\",\n              \"*set *set *set *\",\n              \"*set *for *call *\",\n              \"*set *for *cmd *\",\n              \"*$*$*$*$*\",\n              \"*comspec*\",\n              \"*powershell*\",\n              \"*wscript*\",\n              \"*cscript*\",\n              \"*mshta*\", \n              \"*certutil*\", \n              \"*bitsadmin*\", \n              \"*/transfer*\",\n              \"*-transfer*\",\n              \"*urlcache*\", \n              \"*-decode*\", \n              \"*addfile*\",\n              \"*msbuild*\",\n              \"*msiexec*\",\n              \"*rundll32*\",\n              \"*regsvr32*\", \n              \"*ping * -n *&*\",\n              \"*http://*\",\n              \"*%%*%%*%%*\", \n              \"*copy*.exe*\") and\n  not process.command_line : \n             (\"*:\\\\Program Files\\\\Tableau\\\\*--server*http://tableau*\", \n              \"*:\\\\Program Files (x86)\\\\Tableau\\\\*--server*http://tableau*\", \n              \"\\\"C:\\\\Windows\\\\System32\\\\cmd.exe\\\" /c C:\\\\windows\\\\System32\\\\rundll32 advpack.dll,LaunchINFSection \\\"C:\\\\Users\\\\*\\\\AppData\\\\Roaming\\\\McGowan Partners LLC UAT\\\\setup.inf\\\", DefaultInstall*\") and \n  not process.args : \"$bytes=[System.Text.Encoding]::UTF8.GetBytes('*');$hash=[System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes);[BitConverter]::ToString($hash).Replace('-','').ToLower()\"\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1566
          name: Phishing
          reference: "https://attack.mitre.org/techniques/T1566/"
          subtechnique:
            - id: T1566.001
              name: Spearphishing Attachment
              reference: "https://attack.mitre.org/techniques/T1566/001/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.003
              name: Windows Command Shell
              reference: "https://attack.mitre.org/techniques/T1059/003/"
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
          subtechnique:
            - id: T1204.002
              name: Malicious File
              reference: "https://attack.mitre.org/techniques/T1204/002/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.15.0"
