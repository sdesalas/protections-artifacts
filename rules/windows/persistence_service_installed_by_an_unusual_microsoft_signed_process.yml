id: "07f2c66e-46e3-4ce2-aca1-291172fc88fc_1.0.3"
type: security-rule
attributes:
  description: |
    Identifies the install of a new service by an unusual Microsoft signed program or an executable from a world user
    writable path. Adversaries may use this technique to maintain persistence or run with System privileges.
  rule_id: "07f2c66e-46e3-4ce2-aca1-291172fc88fc"
  license: Elastic License v2
  name: Service Installed by an Unusual Microsoft Signed Process
  os_list:
    - windows
  version: "1.0.3"
  query: "any where event.category == \"configuration\" and event.action == \"service_installed\" and user.id != \"S-1-5-18\" and\n  process.code_signature.subject_name == \"Microsoft Windows\" and\n  not winlog.event_data.ServiceStartType in (\"Manual\", \"Disabled\") and\n  not process.executable : (\"?:\\\\Windows\\\\Sys?????\\\\sc.exe\",\n                             \"C:\\\\Program Files (x86)\\\\Microsoft Visual Studio\\\\Installer\\\\setup.exe\",\n                             \"C:\\\\Windows\\\\Microsoft.NET\\\\Framework\\\\v*\\\\InstallUtil.exe\",\n                             \"C:\\\\Program Files\\\\Microsoft SQL Server\\\\*\\\\ScenarioEngine.exe\",\n                             \"C:\\\\Windows\\\\System32\\\\wsmprovhost.exe\",\n                             \"C:\\\\Windows\\\\Sys?????\\\\msiexec.exe\",\n                             \"C:\\\\Program Files\\\\Microsoft\\\\AzureAttestService\\\\AzureAttestServiceInstaller.exe\",\n                             \"C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell_ise.exe\",\n                             \"C:\\\\Program Files\\\\Common Files\\\\microsoft shared\\\\ClickToRun\\\\OfficeClickToRun.exe\",\n                             \"C:\\\\Program Files\\\\Microsoft Office\\\\root\\\\Integration\\\\Addons\\\\OneDriveSetup.exe\",\n                             \"C:\\\\Program Files (x86)\\\\AOMEI Cyber Backup\\\\x64\\\\InstallUtil.exe\",\n                             \"C:\\\\Windows\\\\Microsoft.NET\\\\Framework64\\\\*\\\\InstallUtil.exe\",\n                             \"C:\\\\Program Files (x86)\\\\AOMEI Cyber Backup\\\\x64\\\\iscsi\\\\InstallUtil.exe\",\n                             \"C:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeUpdate\\\\MicrosoftEdgeUpdate.exe\") and\n   not (process.parent.executable : (\"C:\\\\Windows\\\\Sys?????\\\\msiexec.exe\", \"C:\\\\Program Files\\\\Wireshark\\\\USBPcapSetup-*.exe\", \"C:\\\\Program Files (x86)\\\\AOMEI Cyber Backup\\\\x64\\\\AOMEIImgService.exe\") and\n        process.executable : \"?:\\\\Windows\\\\Sys?????\\\\rundll32.exe\") and\n   not process.parent.executable : (\"F:\\\\setup.exe\") and\n   not process.command_line : (\"\\\"C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\\\" \",\n                               \"\\\"C:\\\\WINDOWS\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\\\" -ExecutionPolicy UnRestricted -File *\") and \n   not (process.executable : \"?:\\\\Windows\\\\System32\\\\dllhost.exe\" and\n        process.command_line :  \"C:\\\\Windows\\\\system32\\\\dllhost.exe /Processid:{02D4B3F1-FD88-11D1-960D-00805FC79235}\" and\n        process.parent.executable : \"C:\\\\Windows\\\\System32\\\\services.exe\")\n"
  min_endpoint_version: "9.0.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1543
          name: Create or Modify System Process
          reference: "https://attack.mitre.org/techniques/T1543/"
          subtechnique:
            - id: T1543.003
              name: Windows Service
              reference: "https://attack.mitre.org/techniques/T1543/003/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
  internal:
    min_endpoint_version: "9.0.0"
