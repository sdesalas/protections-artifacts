dll.name) + 1)), substring(process.executable, 0, length(process.executable) - (length(process.name) + 1))) and\n    not process.name : (\"regsvr32.exe\", \"rundll32.exe\")) and\n\n    not (process.code_signature.subject_name:\n                        (\"Johannes Schindelin\",\n                         \"Datto Inc\",\n                         \"IFS World Operations AB\",\n                         \"RingCentral, Inc.\", \"Net Health Systems, Inc.\",\n                         \"Mobatek\",\n                         \"Red Gate Software Ltd\",\n                         \"Signal Messenger, LLC\",\n                         \"KYLIN INC.\",\n                         \"Cricut, Inc.\",\n                         \"Clevercontrol LLC\",\n                         \"VNG CORPORATION\",\n                         \"Connectwise, LLC\",\n                         \"PreVeil, Inc\",\n                         \"RICOH COMPANY,LTD.\",\n                         \"ONELAUNCH TECHNOLOGIES INC.\",\n                         \"Overjet, Inc.\",\n                         \"BANDAI NAMCO Online Inc.\",\n                         \"Jade Software Corporation Limited\",\n                         \"Freshworks Inc\",\n                         \"8bit Solutions LLC\",\n                         \"Canon Electronics Inc.\",\n                         \"OPERIS SAS\",\n                         \"TD Ameritrade\",\n                         \"INTEGRATED COMPUTER SYSTEMS, INC.\",\n                         \"KYOCERA Document Solutions Inc.\",\n                         \"Conexant Systems LLC\",\n                         \"Lenovo\",\n                         \"Paessler AG\",\n                         \"Rainberry Inc\",\n                         \"Fibocom Wireless Inc.\",\n                         \"Fiserv\",\n                         \"Rocket.Chat Technologies Corp.\",\n                         \"Solarwinds Worldwide, LLC\",\n                         \"Milsoft Utility Solutions, Inc.\",\n                         \"Talkdesk, Inc.\",\n                         \"Amazon.com Services LLC\",\n                         \"Canva\",\n                         \"Wondershare Technology Group Co.,Ltd\",\n                         \"Jade Software Corporation Ltd\",\n                         \"Ivanti, Inc.\",\n                         \"The Reynolds and Reynolds Company\",\n                         \"Brother Industries, Ltd.\",\n                         \"FrontApp, Inc.\",\n                         \"The Neat Company, Inc.\",\n                         \"Environmental Systems Research Institute, Inc.\",\n                         \"CANON INC.\",\n                         \"Micro Focus International plc\",\n                         \"Mattermost, Inc.\",\n                         \"PFU Limited\",\n                         \"Poised Inc\",\n                         \"Loom, Inc.\",\n                         \"NUUO Inc.\",\n                         \"Tencent Technology(Shenzhen) Company Limited\",\n                         \"TEDDYSOFT OOD\",\n                         \"The MathWorks, Inc.\",\n                         \"Exclaimer Ltd\") and process.code_signature.trusted == true)]\n"
  min_endpoint_version: "8.10.0"
  optional_actions: []
  reputation: true
  actions:
