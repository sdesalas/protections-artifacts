id: d66765b8-010b-4a40-ab62-1d8f13a44878_1.0.36
type: security-rule
attributes:
  description: |
    Identifies access to the Active Directory Domain Database file (ntds.dit). This file contains sensitive information
    including hashed domain credentials.
  rule_id: d66765b8-010b-4a40-ab62-1d8f13a44878
  license: Elastic License v2
  name: Suspicious Access to Active Directory Database File
  os_list:
    - windows
  reference:
    - "https://www.ired.team/offensive-security/credential-access-and-credential-dumping/ntds.dit-enumeration"
  version: "1.0.36"
  query: "file where event.action == \"open\" and process.pid != 4 and \n file.path : \"*\\\\Windows\\\\NTDS\\\\ntds.dit\" and process.executable : \"?:\\\\*\" and\n /* covered by RuleId 3c44fc50-2672-48b3-af77-ff43b895ac70 */\n not process.executable :\n             (\"?:\\\\Windows\\\\System32\\\\ntdsutil.exe\",\n              \"?:\\\\Windows\\\\System32\\\\esentutl.exe\",\n              \"?:\\\\Windows\\\\system32\\\\lsass.exe\",\n              \"?:\\\\Windows\\\\System32\\\\wbengine.exe\",\n              \"?:\\\\Program Files\\\\*.exe\",\n              \"?:\\\\Program Files (x86)\\\\*.exe\",\n              \"C:\\\\PCBP\\\\WBPS.exe\",\n              \"?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender\\\\Platform\\\\*.exe\", \n              \"?:\\\\ProgramData\\\\Microsoft\\\\Windows Defender Advanced Threat Protection\\\\Platform\\\\*.exe\",\n              \"?:\\\\Windows\\\\explorer.exe\") and\n /* WMI provider host on domain controllers: health monitoring and backup providers open ntds.dit routinely */\n not (process.executable : (\"?:\\\\Windows\\\\System32\\\\wbem\\\\WmiPrvSE.exe\", \"?:\\\\Windows\\\\SysWOW64\\\\wbem\\\\WmiPrvSE.exe\") and\n      process.code_signature.subject_name == \"Microsoft Windows\" and process.code_signature.trusted == true) and\n not (process.code_signature.subject_name in (\"EFOLDER, INC.\", \"Avira Operations GmbH\") and process.code_signature.trusted == true)\n"
  min_endpoint_version: "8.1.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1003
          name: OS Credential Dumping
          reference: "https://attack.mitre.org/techniques/T1003/"
          subtechnique:
            - id: T1003.003
              name: NTDS
              reference: "https://attack.mitre.org/techniques/T1003/003/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.1.0"
