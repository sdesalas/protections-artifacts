id: "83da4fac-563a-4af8-8f32-5a3797a9068e_1.0.41"
type: security-rule
attributes:
  description: |
    Identifies unusual windows script interpreter child process which could indicate code injection or other form of
    malicious code execution via Windows scripts.
  rule_id: "83da4fac-563a-4af8-8f32-5a3797a9068e"
  license: Elastic License v2
  name: Suspicious Windows Script Interpreter Child Process
  os_list:
    - windows
  reference:
    - "https://www.elastic.co/security-labs/thawing-the-permafrost-of-icedid-summary"
  version: "1.0.41"
  query: "process where event.type == \"start\" and\n  process.parent.name : (\"wscript.exe\", \"mshta.exe\") and\n  process.parent.args_count >= 2 and\n  not process.Ext.token.integrity_level_name == \"system\" and\n   (\n    process.name : (\"rundll32.exe\", \"odbcconf.exe\") or\n\n   (process.name : (\"cmd.exe\", \"powershell.exe\", \"curl.exe\") and process.parent.name : \"mshta.exe\") or\n\n    /* suspicious or unusual paths */\n    process.executable : (\"?:\\\\Windows\\\\Microsoft.NET\\\\*\",\n                          \"?:\\\\Users\\\\Public\\\\*\",\n                          \"?:\\\\Windows\\\\Tasks\\\\*\",\n                          \"?:\\\\Windows\\\\System32\\\\Tasks\\\\*\") or\n\n     /* potential hollowed trusted system process with no arguments */\n    (process.args_count == 1 and\n     process.executable : (\"?:\\\\Windows\\\\System32\\\\*.exe\", \"?:\\\\Windows\\\\SysWOW64\\\\*.exe\") and\n     process.code_signature.trusted == true and process.code_signature.subject_name : \"Microsoft *\" and\n     not process.name : (\"conhost.exe\", \"gpupdate.exe\", \"logoff.exe\", \"HOSTNAME.EXE\"))\n     ) and\n     not (process.parent.name : \"mshta.exe\" and process.parent.args : \"?:\\\\Program Files\\\\HP\\\\*\\\\HPSolutionsPortal.hta\") and\n     not (process.name : \"regsvr32.exe\" and process.parent.name : \"wscript.exe\" and process.parent.command_line : (\"*LiteTouch.wsf*\", \"*LTICleanup.wsf*\")) and\n     not (process.pe.original_file_name == \"acslaunch\" and process.executable : \"?:\\\\Users\\\\Public\\\\IBM\\\\*.exe\") and\n     not (process.name : (\"rundll32.exe\", \"regsvr32.exe\") and\n          process.args : (\"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\", \"ndfapi.dll,NdfRunDllDiagnoseWithAnswerFile\", \"?:\\\\Windows\\\\sysWOW64\\\\*.ocx\")) and\n     not process.executable : (\"?:\\\\WINDOWS\\\\Microsoft.NET\\\\Framework\\\\*\\\\caspol.exe\", \"?:\\\\Windows\\\\System32\\\\Vmw.exe\") and\n     not (process.name : \"rundll32.exe\" and process.args : \"UpdatePerUserSystemParameters\" and process.args : \"user32.dll,\") and\n     not (process.executable : \"?:\\\\Windows\\\\System32\\\\Vmw.exe\" and process.parent.args : \"kms_host.vbs\") and\n     not (process.name : \"regsvr32.exe\" and process.args : \"C:\\\\nondefault\\\\System\\\\*.exe\" and process.args : \"/u\") and \n     not (process.name : (\"rundll32.exe\", \"regsvr32.exe\", \"regasm.exe\") and process.args : (\"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\")) and\n     not process.executable : (\"?:\\\\WINDOWS\\\\Microsoft.NET\\\\Framework\\\\*\\\\caspol.exe\", \"?:\\\\Windows\\\\System32\\\\Vmw.exe\") and\n     not (process.name : \"rundll32.exe\" and\n          process.args : (\"printui.dll,PrintUIEntry\", \"user32.dll,UpdatePerUserSystemParameters\", \"dfshim.dll,ShArpMaintain\")) and\n     not (process.name : \"regsvr32.exe\" and process.args : (\"?:\\\\Windows\\\\sysWOW64\\\\*.ocx\", \"?:\\\\EQ\\\\System\\\\QXLAddInDialogs.exe\")) and\n     not (process.code_signature.subject_name : \"Dassault Systemes SolidWorks Corp.\" and process.code_signature.trusted == true) and\n     not (process.parent.name : \"cscript.exe\" and\n          process.parent.args : \"?:\\\\Windows\\\\Options\\\\SWD\\\\MapHomeDrive_*.vbs\" and process.name : \"mshta.exe\") and\n     not (process.name : \"rundll32.exe\" and process.parent.args : \"?:\\\\Program Files (x86)\\\\PCMatic\\\\PC Matic\\\\registerActiveX.wsf\") and\n     not process.command_line : \"mshta.exe\" and\n     not (process.name : \"wscript.exe\" and process.args : \"\\\\\\\\*\\\\netlogon\\\\*.vbe\") and\n     not (process.name : \"rundll32.exe\" and process.args: \"C:\\\\ProgramData\\\\FastTrack Software\\\\Admin By Request\\\\ShellHelper32.dll,#1\") and\n     not (process.name: (\"cmd.exe\", \"regsvr32.exe\") and process.parent.executable : \"C:\\\\Windows\\\\SysWOW64\\\\mshta.exe\") and\n     not (process.executable : \"?:\\\\Windows\\\\System32\\\\odbcconf.exe\" and process.args : \"configdsn\") and\n     not process.hash.sha256 in (\"13eacb4b57ac207f7f5c118915359a6e66a7f52f7154f8bb577f54b48b0d5e68\", \"6e0cb7d79cfc0b51468904701ff5227270180b9c8ff79d181000049ce991fc5a\") and\n     not (process.parent.name : \"mshta.exe\" and\n          process.executable : (\"C:\\\\Windows\\\\SysWOW64\\\\cmd.exe\", \"C:\\\\Windows\\\\SysWOW64\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\") and\n          process.working_directory : (\"C:\\\\Users\\\\*\\\\AppData\\\\Roaming\\\\DriverPack Notifier\\\\bin\\\\\", \"\\\\\\\\*\")) and\n     not (process.parent.executable : \"C:\\\\Windows\\\\SysWOW64\\\\mshta.exe\" and process.name : \"rundll32.exe\" and process.args == \"dsquery.dll,OpenQueryWindow\") and\n     not (process.name : \"cmd.exe\" and process.command_line : \"\\\"C:\\\\Windows\\\\System32\\\\cmd.exe   /C mklink /D *\")\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.005
              name: Visual Basic
              reference: "https://attack.mitre.org/techniques/T1059/005/"
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
