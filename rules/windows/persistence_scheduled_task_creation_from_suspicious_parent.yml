id: "0ce4faf0-1fe4-4455-a152-bd923e1fbdf6_1.0.5"
type: security-rule
attributes:
  description: |
    Identifies the creation of a scheduled task from a suspicious parent process. This behavior is consistent with an
    adversary attempting to establish persistence.
  rule_id: "0ce4faf0-1fe4-4455-a152-bd923e1fbdf6"
  license: Elastic License v2
  name: Scheduled Task Creation from Suspicious Parent
  os_list:
    - windows
  reference:
    - "https://docs.microsoft.com/en-us/windows/win32/taskschd"
  version: "1.0.5"
  query: "sequence with maxspan=1m\n [process where event.action == \"start\" and\n  (\n   (process.Ext.device.product_id : (\"Virtual DVD-ROM\", \"Virtual Disk\", \"USB *\") and\n    not process.executable : \"C:\\\\*\") or\n\n   ((process.Ext.relative_file_creation_time <= 900 or process.Ext.relative_file_name_modify_time <= 900) and\n     not process.code_signature.status : \"trusted\") or\n\n   (process.executable :\n\t        (\"?:\\\\Users\\\\*\\\\AppData\\\\*\",\n\t         \"?:\\\\Users\\\\*\\\\Downloads\\\\*\",\n\t         \"?:\\\\Users\\\\*\\\\Desktop\\\\*\",\n\t         \"?:\\\\Users\\\\Public\\\\*\",\n\t         \"\\\\Device\\\\Mup*\") and not process.code_signature.status : \"trusted\")\n   ) and \n   not process.executable : \"?:\\\\Program Files\\\\WinCompose\\\\wincompose.exe\" and \n   not process.hash.sha256 : \"fef078893ac6b23a7412b0b757f6e24631db84133cc420a9844e1e64212e4478\"] by process.entity_id\n  [process where event.action == \"start\" and\n   (process.pe.original_file_name : \"schtasks.exe\" or process.name : \"schtasks.exe\") and\n   not process.Ext.token.integrity_level_name == \"system\" and\n   process.args : (\"/create\", \"-create\") and process.args : \"/tr\" and\n   not process.command_line : (\"*:\\\\Program Files\\\\*\", \"*:\\\\Program Files (x86)\\\\*\")] by process.parent.entity_id\n"
  min_endpoint_version: "8.4.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 1
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1053
          name: Scheduled Task/Job
          reference: "https://attack.mitre.org/techniques/T1053/"
          subtechnique:
            - id: T1053.005
              name: Scheduled Task
              reference: "https://attack.mitre.org/techniques/T1053/005/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
  internal:
    min_endpoint_version: "8.4.0"
