id: f4f436c8-5c4a-4f61-b0cc-17b154920887_1.0.9
type: security-rule
attributes:
  description: |
    Identifies the execution of Windows commands via the Windows Run window. Adversaries may use phishing to instruct the
    victim to copy and paste malicious commands for execution via the Windows Run menu.
  rule_id: f4f436c8-5c4a-4f61-b0cc-17b154920887
  license: Elastic License v2
  name: Suspicious Command Execution via Windows Run
  os_list:
    - windows
  reference:
    - "https://www.cloudsek.com/blog/unmasking-the-danger-lumma-stealer-malware-exploits-fake-captcha-pages"
  version: "1.0.9"
  query: "process where event.action == \"start\" and\n (\n   process.name : (\"cmd.exe\", \"powershell.exe\", \"curl.exe\", \"msiexec.exe\", \"mshta.exe\", \"wscript.exe\", \"cscript.exe\") or \n   (process.name : \"rundll32.exe\" and process.command_line : \"*\\\\\\\\*@*,*\")\n ) and\n process.parent.name : \"explorer.exe\" and process.args_count >= 2 and\n (\n  process.parent.thread.Ext.call_stack_summary like \"ntdll.dll|kernelbase.dll|kernel32.dll|windows.storage.dll|shell32.dll|user32.dll|shell32.dll|explorer.exe|shcore.dll|*\" or\n  (process.parent.thread.Ext.call_stack_summary like \"*|user32.dll|shell32.dll|explorer.exe|shcore.dll|*\" and\n   _arraysearch(process.parent.thread.Ext.call_stack, $entry, \n                $entry.symbol_info like (\"C:\\\\Windows\\\\System32\\\\user32.dll!DialogBoxParamW*\", \n                                         \"C:\\\\Windows\\\\System32\\\\user32.dll!DialogBoxIndirectParamW*\", \n                                         \"C:\\\\Windows\\\\System32\\\\shell32.dll!GetFileNameFromBrowse*\")))\n ) and\n not (process.name : \"cmd.exe\" and\n      process.args : (\"*.bat*\", \"*.cmd\", \"dir\", \"ipconfig\", \"C:\\\\WINDOWS\\\\system32\\\\sconfig.cmd \", \"Code\\\\bin\\\\code.cmd \", \"mkdir\",\n                      \"C:\\\\Users\\\\*.cmd \")) and\n not (process.name : \"powershell.exe\" and process.args : (\"Start-Process powershell -Verb RunAs\", \"C:\\\\*.ps1\", \"-SPLAGroup\", \"\\\\\\\\*\\\\netlogon\\\\*.ps1\")) and\n not (process.name : \"msiexec.exe\" and process.args : \"?:\\\\*.msi\") and\n not process.command_line : (\"\\\"C:\\\\WINDOWS\\\\system32\\\\cmd.exe\\\" /k net use\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\cmd.exe\\\" -a\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\cmd.exe\\\" /c start terminal\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\cmd.exe\\\" D:\\\\\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\cmd.exe\\\" /admin\",\n                             \"\\\"C:\\\\Windows\\\\system32\\\\msiexec.exe\\\" /regserver\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\cmd.exe\\\" /c start WindowsTerminal\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\cmd.exe\\\" /c start chrome --app=D:\\\\Notify\\\\index.html\",\n                             \"\\\"C:\\\\windows\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\PowerShell.exe\\\" -ep bypass\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\PowerShell.exe\\\" ise\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\PowerShell.exe\\\" -Command Start-Process PowerShell -Verb RunAs\",\n                             \"C:\\\\WINDOWS\\\\system32\\\\cmd.exe /c \\\"\\\"C:\\\\Users\\\\*\\\\AppData\\\\Roaming\\\\npm\\\\*z.cmd\\\" \\\"\",\n                             \"\\\"C:\\\\WINDOWS\\\\system32\\\\WindowsPowerShell\\\\v1.0\\\\PowerShell.exe\\\" -ExecutionPolicy Bypass\") and\n not (process.name : (\"wscript.exe\", \"cscript.exe\") and process.args : (\"\\\\\\\\*\\\\MapNetworkDrives.vbs\", \"?:\\\\*.js\", \"?:\\\\*.vbs\")) and\n not (process.name : \"powershell.exe\" and process.args : \"-command\" and process.args : \"vnc\") and\n not (process.name : (\"msiexec.exe\", \"powershell.exe\", \"wscript.exe\") and process.working_directory : \"\\\\\\\\*\") and\n not (process.name : \"msiexec.exe\" and process.args :  \"\\\\\\\\*\\\\SYSVOL\\\\*.msi\")\n"
  min_endpoint_version: "8.10.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1566
          name: Phishing
          reference: "https://attack.mitre.org/techniques/T1566/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
            - id: T1059.003
              name: Windows Command Shell
              reference: "https://attack.mitre.org/techniques/T1059/003/"
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.10.0"
