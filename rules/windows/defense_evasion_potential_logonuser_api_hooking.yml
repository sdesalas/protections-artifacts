id: "19523b07-b1ce-4b4e-882c-18e9492e9591_1.0.11"
type: security-rule
attributes:
  description: |
    Identifies attempts to hook LogonUser API via memory modification. This may indicate an attempt to steal credentials
    passed for authentication verification via this API.
  rule_id: "19523b07-b1ce-4b4e-882c-18e9492e9591"
  license: Elastic License v2
  name: Potential LogonUser API Hooking
  os_list:
    - windows
  version: "1.0.11"
  query: "api where process.Ext.api.name in (\"WriteProcessMemory\", \"VirtualProtect\") and\n process.Ext.api.metadata.target_address_name like \"advapi32.dll!LogonUser*\" and process.executable != null and\n not process.thread.Ext.call_stack_final_user_module.name in (\"Kernel\", \"Unknown\", \"Undetermined\") and\n not process.thread.Ext.call_stack_final_user_module.path in (\"c:\\\\windows\\\\syswow64\\\\werfault.exe\", \"c:\\\\windows\\\\system32\\\\werfault.exe\") and\n not _arraysearch(process.thread.Ext.call_stack_final_user_module.code_signature, $entry, $entry.trusted == true or $entry.status like \"errorCode_endpoint*\") and\n process.thread.Ext.call_stack_final_user_module.hash.sha256 != \"fdfc853b183d682c912e6487a64dbaea98f8d09207a55d0a512e550c988d6273\" and\n not _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info like \"c:\\\\windows\\\\system32\\\\ntdll.dll!LdrLoadDll*\") and\n not process.thread.Ext.call_stack_final_user_module.path : \n                              (\"?:\\\\program files\\\\avg\\\\antivirus\\\\aswhook.dll\", \n                               \"?:\\\\program files\\\\avg\\\\antivirus\\\\x86\\\\aswhook.dll\", \n                               \"?:\\\\program files\\\\avast software\\\\avast\\\\aswhook.dll\",\n                               \"?:\\\\program files\\\\avast software\\\\avast\\\\x86\\\\aswhook.dll\",\n                               \"?:\\\\program files\\\\avast software\\\\suite\\\\aswhook.dll\",\n                               \"?:\\\\program files\\\\norton\\\\suite\\\\aswhook.dll\",\n                               \"?:\\\\windows\\\\assembly\\\\nativeimages_*\\\\microsoft.powershell.commands.management.ni.dll\") and \n not process.executable : (\"C:\\\\Program Files (x86)\\\\Common Files\\\\Adobe\\\\ARM\\\\1.0\\\\AdobeARM.exe\", \n                           \"C:\\\\Program Files (x86)\\\\Common Files\\\\Adobe\\\\Adobe Desktop Common\\\\IPCBox\\\\AdobeIPCBroker.exe\", \n                           \"C:\\\\Program Files\\\\Avast Software\\\\Browser\\\\Application\\\\AvastBrowserProtect.exe\")\n"
  min_endpoint_version: "8.10.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1562
          name: Impair Defenses
          reference: "https://attack.mitre.org/techniques/T1562/"
          subtechnique:
            - id: T1562.001
              name: Disable or Modify Tools
              reference: "https://attack.mitre.org/techniques/T1562/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.10.0"
