id: "50dd274c-651e-46aa-9485-768fa4939b93_1.0.4"
type: security-rule
attributes:
  description: |
    Identifies an attempt to load a recently created and unsigned DLL file by a .NET application via an AppDomain Manager
    manifest followed by suspicious VirtualProtect call to modify the memory content of the loaded DLL. This may indicate an
    attempt to load a malicious module via DLL search order hijacking.
  rule_id: "50dd274c-651e-46aa-9485-768fa4939b93"
  license: Elastic License v2
  name: Self Injection via AppDomain Manager Assembly
  os_list:
    - windows
  reference:
    - "https://jp.security.ntt/insights_resources/tech_blog/appdomainmanager-injection-en/"
  version: "1.0.4"
  query: "sequence by process.entity_id with maxspan=1m\n [library where\n  not dll.code_signature.status : \"trusted\" and not endswith~(dll.name, process.name) and\n  user.id : (\"S-1-5-21*\", \"S-1-12-*\") and\n  (dll.Ext.relative_file_creation_time <= 500 or \n   dll.Ext.relative_file_name_modify_time <= 500 or \n   (dll.Ext.device.product_id : (\"Virtual DVD-ROM\", \"Virtual Disk\",\"USB *\") and not dll.path : \"C:\\\\*\")) and\n  _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info: \"*clr.dll!ParseManifest*\") and\n  process.thread.Ext.call_stack_summary : \"ntdll.dll|kernelbase.dll|clr.dll|mscorlib.ni.dll|clr.dll|mscoreei.dll|mscoree.dll|kernel32.dll|ntdll.dll\" and \n   \n   /* DLL loaded from the process.executable current directory */\n  endswith~(substring(dll.path, 0, length(dll.path) - (length(dll.name) + 1)), substring(process.executable, 0, length(process.executable) - (length(process.name) + 1))) and \n  \n  not process.executable : \n           (\"?:\\\\Program Files\\\\*\", \n            \"?:\\\\Program Files (x86)\\\\*\", \n            \"?:\\\\Windows\\\\Explorer.exe\", \n            \"?:\\\\Windows\\\\SysWOW64\\\\*\", \n            \"?:\\\\Windows\\\\System32\\\\*\", \n            \"?:\\\\Windows\\\\splwow64.exe\", \n            \"?:\\\\Windows\\\\Microsoft.NET\\\\*\") and\n            \n  not dll.path :\n        (\"?:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\*\", \n         \"?:\\\\Windows\\\\SysWOW64\\\\DriverStore\\\\FileRepository\\\\*\", \n         \"?:\\\\Windows\\\\assembly\\\\NativeImages\\\\*\",\n         \"?:\\\\windows\\\\WinSxS\\\\*\",\n         \"?:\\\\windows\\\\system32\\\\*\",\n         \"?:\\\\windows\\\\syswow64\\\\*\",\n         \"?:\\\\Program Files\\\\*\", \n         \"?:\\\\Program Files (x86)\\\\*\", \n         \"?:\\\\Windows\\\\Microsoft.NET\\\\*\")] as event0\n [api where process.Ext.api.name : \"VirtualProtect\" and process.Ext.api.parameters.size >= 10000 and \n  stringcontains~(process.Ext.api.metadata.target_address_path, event0.dll.path) and \n  process.Ext.api.parameters.protection : \"RWX\" and process.Ext.api.parameters.protection_old : \"RCX\" and \n  process.thread.Ext.call_stack_final_user_module.name : \"Unbacked\" and \n  process.thread.Ext.call_stack_final_user_module.protection_provenance : \"clr.dll\"]\n"
  min_endpoint_version: "8.10.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
        - id: T1574
          name: Hijack Execution Flow
          reference: "https://attack.mitre.org/techniques/T1574/"
          subtechnique:
            - id: T1574.001
              name: DLL
              reference: "https://attack.mitre.org/techniques/T1574/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.10.0"
