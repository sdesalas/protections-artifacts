id: "583448c6-986f-412b-8947-e3895bfc9426_1.0.19"
type: security-rule
attributes:
  description: |
    Identifies the use of a browser to perform browser or internet location discovery from an unusual process. HawKEyes
    infostealer performs this action to assess potential targets.
  rule_id: "583448c6-986f-412b-8947-e3895bfc9426"
  license: Elastic License v2
  name: Potential HawkEyes Stealer Infection
  os_list:
    - windows
  reference:
    - "https://malpedia.caad.fkie.fraunhofer.de/details/win.hawkeye_keylogger"
  version: "1.0.19"
  query: "process where event.action == \"start\" and\n process.name : (\"chrome.exe\", \"msedge.exe\", \"brave.exe\", \"browser.exe\", \"dragon.exe\") and\n process.args : \"--dump-dom\" and process.args : \"--headless\" and process.args : \"http*\" and\n process.parent.executable != null and\n not process.parent.executable : \n                   (\"?:\\\\Program Files\\\\*\\\\Endpoint Protection SDK\\\\endpointprotection.exe\", \n                    \"?:\\\\Program Files (x86)\\\\*\\\\Endpoint Protection SDK\\\\endpointprotection.exe\",\n                    \"?:\\\\ProgramData\\\\CentraStage\\\\AEMAgent\\\\RMM.AdvancedThreatDetection\\\\dattoav\\\\Endpoint Protection SDK\\\\endpointprotection.exe\")\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1016
          name: System Network Configuration Discovery
          reference: "https://attack.mitre.org/techniques/T1016/"
          subtechnique:
            - id: T1016.001
              name: Internet Connection Discovery
              reference: "https://attack.mitre.org/techniques/T1016/001/"
      tactic:
        id: TA0007
        name: Discovery
        reference: "https://attack.mitre.org/tactics/TA0007/"
  internal:
    min_endpoint_version: "7.15.0"
