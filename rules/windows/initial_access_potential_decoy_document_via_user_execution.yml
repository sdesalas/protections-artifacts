id: "5ec7d995-c321-4866-b304-8cc5c4bb6157_1.0.35"
type: security-rule
attributes:
  description: |
    Identifies the execution of Microsoft Office or Adobe Reader to open a potential decoy document from an untrusted parent
    process. An adversary may employ this technique to avoid victim suspicion by displaying a legit document after opening a
    malicious executable or script.
  rule_id: "5ec7d995-c321-4866-b304-8cc5c4bb6157"
  license: Elastic License v2
  name: Potential Decoy Document via User Execution
  os_list:
    - windows
  reference:
    - "https://www.welivesecurity.com/2022/03/23/mustang-panda-hodur-old-tricks-new-korplug-variant/"
  version: "1.0.35"
  query: "sequence with maxspan=5s\n [process where event.action == \"start\" and user.id : (\"S-1-5-21*\", \"S-1-12-*\") and\n  (\n    process.parent.name : (\"cmd.exe\", \"wscript.exe\", \"cscript.exe\", \"mshta.exe\", \"powershell.exe\") or\n    (process.executable : (\"?:\\\\Users\\\\*\", \"?:\\\\ProgramData\\\\*\") and process.code_signature.trusted != true) or\n    (process.name : \"cmd.exe\" and process.working_directory : \"?:\\\\\" and not process.working_directory : \"C:\\\\\") or \n    (process.name : \"cmd.exe\" and process.command_line : \"*\\\\Temp\\\\7ZipSfx*\")\n  ) and \n  not process.executable :\n               (\"?:\\\\Program Files (x86)\\\\SmartAdvocate\\\\SADocumentLauncher\\\\SADocumentLauncher.exe\",\n                \"C:\\\\Program Files\\\\Python*\\\\python.exe\",\n                \"C:\\\\Program Files\\\\WindowsApps\\\\PythonSoftwareFoundation.Python.*.exe\",\n                \"C:\\\\Program Files (x86)\\\\Microsoft Office\\\\root\\\\Office??\\\\OUTLOOK.EXE\",\n                \"C:\\\\Program Files\\\\Microsoft Office\\\\root\\\\Office??\\\\OUTLOOK.EXE\") and\n  not process.parent.executable : (\"\\\\Device\\\\Mup\\\\*\",\n                                   \"?:\\\\Program Files\\\\IBM\\\\ClientSolutions\\\\Start_Programs\\\\Windows_x86-64\\\\acspcoc.exe\",\n                                   \"C:\\\\Windows\\\\Microsoft.NET\\\\Framework64\\\\v*\\\\dfsvc.exe\") and\n  not process.executable : \"?:\\\\Program Files\\\\Python??\\\\python.exe\" and\n  not (process.name : \"rundll32.exe\" and process.args : \"url.dll,FileProtocolHandler\") and\n  not process.hash.sha256 in (\"204326fdd6483ebce82c889fce539b1782a645b225c0f2e9fc8d71139546f255\",\n                              \"da5612f679d98e07d49360989fd6abe7de157e7024d0b9ef0a3de527026baff2\",\n                              \"e4a98dac4a1df240f71b75dc73ef4a71a27bd83af460cef4136022f66b1f3a4e\",\n                              \"fe5d6e2fe76c098da524c59108a85afa653a3deee23e487f1ef38985407e0ef5\",\n                              \"fbd1cb3e91e17c9318b5e9d64b9458bdbc98c7761af9f175a77b1d9163dac7be\",\n                              \"a58f1415e0fc8560defca9e485b3c90b4d2f69a754adf40b7e565a9b1ba89d8b\",\n                              \"28ed5f6f1b46d0581941a56e6bf4f5de479eafa92e362ee340b4d9f92ea519b9\",\n                              \"e4a98dac4a1df240f71b75dc73ef4a71a27bd83af460cef4136022f66b1f3a4e\",\n                              \"fe5d6e2fe76c098da524c59108a85afa653a3deee23e487f1ef38985407e0ef5\") and\n  not (process.parent.name : \"cmd.exe\" and process.parent.args : (\"PDF Viewer\", \"1>NUL\", \"C:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\*.pdf\")) and\n  not process.args : \"C:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\JetB2\\\\userReports\\\\*.PDF\"\n  ] by process.entity_id\n [process where event.action == \"start\" and\n  (\n    /* Word as decoy document */\n  (process.name : \"WINWORD.EXE\" and\n   process.args : \"/n\" and process.args : \"/o\" and process.args : (\"?:\\\\Users\\\\*\", \"?:\\\\ProgramData\\\\*\")) or\n\n  (process.executable : \"?:\\\\Program Files\\\\windows nt\\\\accessories\\\\wordpad.exe\" and process.args_count == 2 and process.args : \"*.doc*\") or\n\n    /* PDF as decoy document */\n   (process.name : \"AcroRd32.exe\" and process.args_count == 2 and process.args : (\"?:\\\\Users\\\\*.pdf\", \"?:\\\\ProgramData\\\\*.pdf\")) or\n\n   (process.name : (\"chrome.exe\", \"msedge.exe\") and process.args : \"--single-argument\" and process.args : \"*.pdf\")\n  )\n   ] by process.parent.entity_id\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1566
          name: Phishing
          reference: "https://attack.mitre.org/techniques/T1566/"
          subtechnique:
            - id: T1566.001
              name: Spearphishing Attachment
              reference: "https://attack.mitre.org/techniques/T1566/001/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
          subtechnique:
            - id: T1204.001
              name: Malicious Link
              reference: "https://attack.mitre.org/techniques/T1204/001/"
            - id: T1204.002
              name: Malicious File
              reference: "https://attack.mitre.org/techniques/T1204/002/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.15.0"
