id: "002d9a6d-c09e-4d3f-a1c1-05b92dbdbb67_1.0.5"
type: security-rule
attributes:
  description: |
    Identifies attempts to perform memory changes in the address space of a remote process and where the call stack is
    truncated. This behavior is consistent with remote code injection attacks.
  rule_id: "002d9a6d-c09e-4d3f-a1c1-05b92dbdbb67"
  license: Elastic License v2
  name: Cross Process API Activity with Truncated Stack
  os_list:
    - windows
  version: "1.0.5"
  query: "api where process.Ext.api.behaviors == \"cross-process\" and process.Ext.api.behaviors == \"truncated_stack\" and\n process.Ext.api.name in (\"WriteProcessMemory\", \"VirtualAllocEx\", \"VirtualProtectEx\") and process.Ext.api.parameters.size >= 10000 and\n process.executable != null and Target.process.executable != null and\n not (process.executable : \"C:\\\\Windows\\\\System32\\\\lsass.exe\" and process.parent.executable : \"C:\\\\Windows\\\\System32\\\\wininit.exe\") and\n not process.executable : (\"C:\\\\Program Files\\\\McAfee\\\\Endpoint Security\\\\Threat Prevention\\\\mfetp.exe\",\n                           \"C:\\\\Program Files (x86)\\\\CheckPoint\\\\Endpoint Security\\\\EFR\\\\EFRService.exe\",\n                           \"C:\\\\Program Files\\\\Adobe\\\\Acrobat DC\\\\Acrobat\\\\Acrobat.exe\",\n                           \"C:\\\\Program Files (x86)\\\\360\\\\Total Security\\\\safemon\\\\QHActiveDefense.exe\",\n                           \"C:\\\\Program Files\\\\Palo Alto Networks\\\\DEM\\\\bin\\\\mtr.exe\",\n                           \"C:\\\\Program Files (x86)\\\\Adobe\\\\Acrobat Reader DC\\\\Reader\\\\AcroRd32.exe\",\n                           \"C:\\\\Program Files (x86)\\\\Globus Connect Personal\\\\bin\\\\ext\\\\relaytool.exe\",\n                           \"C:\\\\Program Files (x86)\\\\Adobe\\\\Acrobat *\\\\Acrobat\\\\AcroRd32.exe\",\n                           \"C:\\\\Program Files\\\\Git\\\\usr\\\\bin\\\\bash.exe\",\n                           \"C:\\\\Program Files\\\\Git\\\\usr\\\\bin\\\\sh.exe\",\n                           \"C:\\\\Program Files\\\\Git\\\\usr\\\\bin\\\\mintty.exe\",\n                           \"C:\\\\Program Files\\\\ESET\\\\ESET Security\\\\ekrn.exe\",\n                           \"C:\\\\Program Files (x86)\\\\Adobe\\\\Acrobat DC\\\\Acrobat\\\\Acrobat.exe\",\n                           \"C:\\\\Program Files (x86)\\\\Globus Connect Personal\\\\bin\\\\ext\\\\relaytool.exe\") and\n not (process.name : \"bash.exe\" and Target.process.name : \"bash.exe\" and process.Ext.api.metadata.target_address_name like (\"Data\", \"cyg*.dll\")) and \n not (process.name : \"perl.exe\" and Target.process.name : \"perl.exe\" and process.Ext.api.metadata.target_address_name like (\"Data\", \"cyg*.dll\", \"posix.dll*\", \"msxml3.dll\")) and \n not (process.name : \"ssh.exe\" and Target.process.name : \"ssh.exe\" and process.Ext.api.metadata.target_address_name like (\"Data\", \"msys-*.dll\", \"cyg*.dll\")) and \n not (process.name : \"sh.exe\" and Target.process.name : \"sh.exe\" and process.Ext.api.metadata.target_address_name like (\"Data\", \"cyg*.dll\")) and \n not (process.Ext.api.name == \"WriteProcessMemory\" and process.executable : \"C:\\\\GEservice\\\\cygwin\\\\bin\\\\perl.exe\" and \n      Target.process.executable : \"C:\\\\GEservice\\\\cygwin\\\\bin\\\\perl.exe\" and process.Ext.token.integrity_level_name == \"system\") and\n not (process.Ext.api.summary == \"WriteProcessMemory( ssh.exe, Data, 0x3c80 )\" and process.name == \"relaytool.exe\")\n"
  min_endpoint_version: "8.14.2"
  optional_actions: []
  actions:
    - action: kill_process
      field: Target.process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.14.2"
