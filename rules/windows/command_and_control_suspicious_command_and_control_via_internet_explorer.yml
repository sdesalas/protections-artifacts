id: "5e9fdd8b-5412-483c-a2e6-58de59990ae6_1.0.31"
type: security-rule
attributes:
  description: |
    Identifies instances of Internet Explorer being started via the Component Object Model (COM) from an unusual caller such
    as scripting interpreters or RunDLL32. Adversaries could abuse Internet Explorer via COM to avoid suspicious processes
    making network connections and bypass host-based firewall restrictions.
  rule_id: "5e9fdd8b-5412-483c-a2e6-58de59990ae6"
  license: Elastic License v2
  name: Suspicious Command and Control via Internet Explorer
  os_list:
    - windows
  reference:
    - "https://www.fortinet.com/blog/threat-research/new-variant-of-ursnif-continuously-targeting-italy"
  version: "1.0.31"
  query: "sequence with maxspan=5m\n\n [process where event.action == \"start\" and\n  (\n   process.name : (\"regsvr32.exe\", \"rundll32.exe\", \"wscript.exe\", \"cscript.exe\", \"powershell.exe\", \"mshta.exe\",\n                   \"msbuild.exe\", \"installutil.exe\") or\n   process.pe.original_file_name : (\"regsvr32.exe\", \"rundll32.exe\", \"wscript.exe\", \"cscript.exe\", \"powershell.exe\",\n                                    \"mshta.exe\", \"msbuild.exe\", \"installutil.exe\")\n  ) and\n\n  not (process.name : \"wscript.exe\" and process.args : (\"\\\\\\\\*\", \"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\")) and\n  not (process.name : \"rundll32.exe\" and\n       process.args : (\"?:\\\\Windows\\\\System32\\\\inetcpl.cpl\",\n                       \"?:\\\\Windows\\\\System32\\\\LogiLDA.dll,LogiFetch\",\n                       \"inetcpl.cpl,,?\")) and\n  not (process.name : \"wscript.exe\" and process.working_directory : \"\\\\\\\\*\") and \n\n  not (process.name : \"wscript.exe\" and process.parent.name : \"explorer.exe\" and \n       process.command_line : (\"*\\\\Users\\\\*\\\\Desktop\\\\*\", \"*\\\\Users\\\\*\\\\OneDrive*\")) and\n\n  not (process.name : \"wscript.exe\" and process.args : \"C:\\\\inetpub\\\\wwwroot\\\\wtsp\\\\systemtasks\\\\*.vbs\" and process.parent.name : \"svchost.exe\") and\n\n  not (process.name : \"mshta.exe\" and process.args : (\"?:\\\\Program Files\\\\*.hta\", \"?:\\\\Program Files (x86)\\\\*.hta\", \"?:\\\\PROGRA~?\\\\*\")) and\n  not (process.name : \"cscript.exe\" and process.parent.executable : \"C:\\\\Program Files\\\\AppSense\\\\Environment Manager\\\\Agent\\\\EmUser.exe\")\n  ] by process.entity_id\n\n [process where event.action == \"start\" and process.name : \"ielowutil.exe\" and\n\n  /* ProgId - InternetExplorer.Application.1 */\n  process.args : \"-CLSID:{0002DF01-0000-0000-C000-000000000046}\"] by process.Ext.effective_parent.entity_id\n"
  min_endpoint_version: "8.4.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
            - id: T1059.005
              name: Visual Basic
              reference: "https://attack.mitre.org/techniques/T1059/005/"
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
        - id: T1559
          name: Inter-Process Communication
          reference: "https://attack.mitre.org/techniques/T1559/"
          subtechnique:
            - id: T1559.001
              name: Component Object Model
              reference: "https://attack.mitre.org/techniques/T1559/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1218
          name: System Binary Proxy Execution
          reference: "https://attack.mitre.org/techniques/T1218/"
          subtechnique:
            - id: T1218.005
              name: Mshta
              reference: "https://attack.mitre.org/techniques/T1218/005/"
            - id: T1218.010
              name: Regsvr32
              reference: "https://attack.mitre.org/techniques/T1218/010/"
            - id: T1218.011
              name: Rundll32
              reference: "https://attack.mitre.org/techniques/T1218/011/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
        - id: T1102
          name: Web Service
          reference: "https://attack.mitre.org/techniques/T1102/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.4.0"
