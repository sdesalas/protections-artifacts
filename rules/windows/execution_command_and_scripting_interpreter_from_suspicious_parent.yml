id: "61b8b978-847b-4b1f-9771-b646cde53a9a_1.0.7"
type: security-rule
attributes:
  description: Identifies when a script interpreter is executed with a long command line and from an unsigned parent executable.
  rule_id: "61b8b978-847b-4b1f-9771-b646cde53a9a"
  license: Elastic License v2
  name: Command and Scripting Interpreter from Suspicious Parent
  os_list:
    - windows
  version: "1.0.7"
  query: "sequence with maxspan=1m\n [process where event.action == \"start\" and not user.id : \"S-1-5-18\" and \n  (\n   (process.Ext.device.product_id : (\"Virtual DVD-ROM\", \"Virtual Disk\", \"USB *\") and\n    not process.executable : \"C:\\\\*\") or\n\n   ((process.Ext.relative_file_creation_time <= 900 or process.Ext.relative_file_name_modify_time <= 900) and\n     not process.code_signature.status : (\"trusted\", \"errorExpired\", \"errorCode_endpoint*\") and\n     not process.executable : (\"?:\\\\Program Files (x86)\\\\*\", \"?:\\\\Program Files\\\\*\")) or\n\n   (process.executable :\n\t        (\"?:\\\\Users\\\\*\\\\AppData\\\\*\",\n\t         \"?:\\\\Users\\\\*\\\\Downloads\\\\*\",\n\t         \"?:\\\\Users\\\\*\\\\Desktop\\\\*\",\n\t         \"?:\\\\Users\\\\Public\\\\*\") and not process.code_signature.status : (\"trusted\", \"errorExpired\", \"errorCode_endpoint*\"))\n   ) and\n  not process.parent.executable : \"C:\\\\Program Files\\\\Microsoft Visual Studio\\\\*\\\\VsDebugConsole.exe\" and\n  not process.executable : \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Caira\\\\caira.exe\"\n  ] by process.entity_id\n [process where event.action == \"start\" and process.name : (\"cmd.exe\", \"powershell.exe\") and\n  length(process.command_line) >= 200 and not process.args : (\"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\") and \n  not (process.args : \"-InputFormat\" and process.args : \"-command\") and \n  not process.args : \"UwB0AGEAcgB0ACAAIgBoAHQAdABw*\" and \n  process.command_line : (\"*New-ScheduledTaskAction*\", \"*New-ItemProperty*\", \"*WScript.Shell*\", \"*schtasks* /create*\", \n                          \"*\\\\Start Menu\\\\Programs\\\\*\", \"*CurrentVersion\\\\Run*\", \"*.Invoke(*\", \"*MpPreference*\", \n\t\t\t  \"*-EncodedCommand*\", \"*Get-Content*\", \"*Windows Defender*\", \"*powershell* -e *\", \"*setZeroData*\", \n                          \"*Get-Clipboard*\", \"*http* -xf *\", \"*dns-query?name=*\")\n ] by process.parent.entity_id\n"
  min_endpoint_version: "8.4.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 1
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
            - id: T1059.003
              name: Windows Command Shell
              reference: "https://attack.mitre.org/techniques/T1059/003/"
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.4.0"
