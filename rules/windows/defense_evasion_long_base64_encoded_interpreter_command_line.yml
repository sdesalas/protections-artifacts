id: "389cd325-5e24-4188-8dd3-f9b0ee637ce9_1.0.3"
type: security-rule
attributes:
  description: |
    Identifies attempts to execute commands with long base64 encoded command lines. Adversaries may abuse this technique to
    execute malicious commands.
  rule_id: "389cd325-5e24-4188-8dd3-f9b0ee637ce9"
  license: Elastic License v2
  name: Long Base64 Encoded Interpreter Command Line
  os_list:
    - windows
  version: "1.0.3"
  query: "process where event.type == \"start\" and\n(\n  (\n    process.name like~ \"python*\" and\n    (\n      process.command_line like~ \"*b64decode*\" or\n      (\n        process.command_line like \"*-c *\" and\n        process.command_line like~ \"*base64*\"\n      )\n    )\n  ) or\n  (\n    process.name like~ (\"node*\", \"deno*\") and\n    (\n      process.command_line like~ (\"*atob(*\", \"*eval(*\") or\n      (\n        process.command_line like~ \"*buffer.from*\" and\n        process.command_line like~ \"*base64*\"\n      )\n    )\n  ) or\n  (\n    process.name like~ \"php*\" and\n    process.command_line like~ (\"*base64_decode(*\", \"*convert.base64-decode*\")\n  ) or\n  (\n    process.name like~ \"java*\" and\n    process.command_line like~ \"*base64*decode(*\"\n  ) or\n  (\n    process.name like~ \"lua*\" and\n    process.command_line like~ (\"*mime.decode(*base64*\", \"*mime.unb64(*\")\n  ) or\n  (\n    process.name like~ \"openssl*\" and\n    process.command_line like~ (\"*base64 -d*\", \"*-base64*\")\n  )\n) and length(process.command_line) >= 4000 and \nnot process.parent.executable : (\"C:\\\\Users\\\\*\\\\git\\\\usr\\\\bin\\\\bash.exe\", \"C:\\\\Program Files\\\\Git\\\\usr\\\\bin\\\\bash.exe\", \"C:\\\\Program Files\\\\Git\\\\usr\\\\bin\\\\sh.exe\")\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
            - id: T1059.006
              name: Python
              reference: "https://attack.mitre.org/techniques/T1059/006/"
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
            - id: T1059.011
              name: Lua
              reference: "https://attack.mitre.org/techniques/T1059/011/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
        - id: T1140
          name: Deobfuscate/Decode Files or Information
          reference: "https://attack.mitre.org/techniques/T1140/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
