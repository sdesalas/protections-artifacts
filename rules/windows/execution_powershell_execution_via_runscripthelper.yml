id: c199e7d9-0cbe-4190-a3c1-c552e64f1b6c_1.0.4
type: security-rule
attributes:
  description: Detects attempts to execute a powershell script bypassing constrained language mode using the RunScriptHelper utility.
  rule_id: c199e7d9-0cbe-4190-a3c1-c552e64f1b6c
  license: Elastic License v2
  name: Powershell Execution via Runscripthelper
  os_list:
    - windows
  reference:
    - "https://lolbas-project.github.io/lolbas/Binaries/Runscripthelper/"
  version: "1.0.4"
  query: "process where event.action == \"start\" and \n (process.name : \"runscripthelper.exe\" or process.pe.original_file_name : \"runscripthelper.exe\") and \n process.args : \"surfacecheck\" and process.args_count > 3\n"
  min_endpoint_version: "7.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.16.0"
