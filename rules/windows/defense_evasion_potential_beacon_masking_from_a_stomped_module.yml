id: d04edc65-b0a1-4445-a148-3fb7ec4f731e_1.0.6
type: security-rule
attributes:
  description: |
    Identifies multiple attempts to modify the memory protection of a memory module and the origin of the call is coming
    from the same target module. This may indicate evasion to mask/unmask the text section of beacon from a stomped module.
  rule_id: d04edc65-b0a1-4445-a148-3fb7ec4f731e
  license: Elastic License v2
  name: Potential Beacon Masking from a Stomped Module
  os_list:
    - windows
  version: "1.0.6"
  query: "api where process.Ext.api.name == \"VirtualProtect\" and\n  process.Ext.api.behaviors == \"allocate_shellcode\" and process.Ext.api.behaviors == \"execute_fluctuation\" and\n  process.Ext.api.metadata.target_address_name : \"*.dll\" and process.Ext.api.parameters.size >= 150000 and \n  stringcontains~(process.thread.Ext.call_stack_final_user_module.protection_provenance, process.Ext.api.metadata.target_address_name) and\n  process.thread.Ext.call_stack_final_user_module.hash.sha256 != \"528056732408c8dd2ef0cd585e719acdf1407326bfac4d9566d50dbb11ac2d1d\"\n"
  min_endpoint_version: "8.10.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.10.0"
