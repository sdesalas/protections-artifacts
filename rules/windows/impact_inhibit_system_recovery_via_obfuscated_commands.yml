id: "99358f31-a84a-4f92-bb91-4370083acda0_1.0.34"
type: security-rule
attributes:
  description: |
    Identifies the execution of Windows utilities to tamper with system recovery settings. Adversaries may delete or remove
    built-in operating system data and turn off services designed to aid in the recovery of a corrupted system and prevent
    recovery.
  rule_id: "99358f31-a84a-4f92-bb91-4370083acda0"
  license: Elastic License v2
  name: Inhibit System Recovery via Obfuscated Commands
  os_list:
    - windows
  version: "1.0.34"
  query: "process where event.action == \"start\" and\n  /* Cynet EDR runs scheduled VSS shadow-storage housekeeping (vssadmin Resize ShadowStorage /MaxSize=10%) via its\n     PDScripts runner, whose launcher command lines trip the obfuscation patterns below; anchor the exclusion on a\n     verified Cynet-signed ancestor rather than the spoofable working directory */\n  not descendant of [process where event.action == \"start\" and\n                     process.code_signature.subject_name : \"Cynet*\" and process.code_signature.trusted == true] and\n  descendant of\n    [process where process.name : (\"powershell.exe\", \"pwsh.exe\", \"cmd.exe\") and\n      process.command_line :\n        (\n          \"*^*^*^*^*^*^*^*^*^*\",\n          \"*set *set *set *\",\n          \"*set *for *call *\",\n          \"*set *for *cmd *\",\n          \"*$*$*$*$*$*$*$*$*$*$*$*\",\n          \"*comspec*\",\n          \"*%%*%%*%%*\",\n          \"*''*''*''*\",\n          \"*`*`*`*`*\",\n          \"*+*+*+*+*+*\",\n          \"*[char[]](*)*-join\",\n          \"*Base64String*\",\n          \"*[*Convert]*\",\n          \"*.Text.Encoding*\",\n          \"*.Compression.*\",\n          \"*.replace(*\",\n          \"*MemoryStream*\",\n          \"*WriteAllBytes*\",\n          \"* -en* *\",\n          \"* -ec *\",\n          \"* -e *\",\n          \"* /e *\",\n          \"* /en* *\",\n          \"* /ec *\",\n          \"*WebClient*\",\n          \"*DownloadFile*\",\n          \"*DownloadString*\",\n          \"*Invoke-Exp*\",\n          \"*invoke-web*\",\n          \"*iex*\",\n          \"*iwr*\",\n          \"*Reflection.Assembly*\",\n          \"*Assembly.GetType*\"\n        )\n  ] and\n  (\n    (process.pe.original_file_name : \"wmic.exe\" and process.command_line : \"*shadowcopy*\" and \n\t process.command_line : \"*delete*\") or\n    (process.pe.original_file_name : \"vssadmin.exe\" and process.command_line : \"*shadows*\" and \n\t process.command_line : (\"*delete*\", \"*resize*\")) or\n    (process.pe.original_file_name : \"bcdedit.exe\" and process.command_line : (\"*bootstatuspolicy*\", \"*recoveryenabled*\")) or\n    (process.pe.original_file_name : \"wbadmin.exe\" and process.command_line : (\"*catalog*\", \"*systemstatebackup*\") and process.command_line : \"*delete*\")\n  )\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1047
          name: Windows Management Instrumentation
          reference: "https://attack.mitre.org/techniques/T1047/"
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
            - id: T1059.003
              name: Windows Command Shell
              reference: "https://attack.mitre.org/techniques/T1059/003/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1490
          name: Inhibit System Recovery
          reference: "https://attack.mitre.org/techniques/T1490/"
      tactic:
        id: TA0040
        name: Impact
        reference: "https://attack.mitre.org/tactics/TA0040/"
  internal:
    min_endpoint_version: "7.15.0"
