id: ccfca0c7-c975-4735-82bd-954ffbafd00b_1.0.31
type: security-rule
attributes:
  description: |
    Adversaries may abuse a double extension or unicode right-to-left override (RTLO or RLO) character (U+202E) or multiple
    spaces in the filename as a means of masquerading the true file type. A file name may include a secondary file type
    extension that may cause only the first extension to be displayed which maximize user execution likelihood.
  rule_id: ccfca0c7-c975-4735-82bd-954ffbafd00b
  license: Elastic License v2
  name: Evasion via File Name Masquerading
  os_list:
    - windows
  reference:
    - "https://www.pcmag.com/encyclopedia/term/double-extension"
  version: "1.0.31"
  query: "process where event.action == \"start\" and\n (\n  /* double extension in process.name */\n  process.name regex~ \"\"\".+(\\.|\\,|\\_|\\-)(pdf|doc|docx|xls|xlsx|png|jpg|html|txt|rar|ppt|pptx|htm|GIF)\\.(scr|exe|com|pif)\"\"\" or\n\n  process.name : (\"*   pdf.exe\", \"*_pdf.exe\", \"*_PO_N.*PDF.exe\") or\n\n  /* multiple spaces */\n  process.name regex \"\"\".+\\s{10,}\\.(exe|pif|com|scr)\"\"\" or\n  process.name : \"*                    .exe\" or \n\n  /* fake extension via Unicode Right-To-Left-Override technique */\n  process.name : \"*\\u{202E}*\"\n ) and\n\n /* False Positives */\n not process.hash.sha256 : \n             (\"1211cb4a560586d4ffb4b1bfd268a8146318af09587a9d5e33703575d5178e77\", \n              \"582ae3540ba32e7100fe20c0b01d14d1d85167cdb7ee512f596544d7351a2d5e\", \n              \"b59ac9390d9026ec3b552ebd6f3438c05aab2880d5e17616c13c5d42b6b34c65\",\n              \"a781c337575da892e6c1b2ac26a6272085a127c554dfd68729deb146eca6b837\",\n              \"96234bb98b3266e49ef74ac7accd4644b709355057d5a34b2966e9fa56aadcf3\",\n              \"38473e19af02cb5e6f386f41238da862df72bbc1d7a1e94d838c4b93d6f56e72\",\n              \"5d62d79f6555d7a7edaf3b175312b326df779f9ae8c893e2182e4159f44c9d34\",\n              \"8d0434610280c8f94a0e9c29e4c33b97804fab4ab6fc29531ba76acebd2f5518\",\n              \"7e59dec861a2a9ad68bd2758407c256dedb233cab225683db677ab2d2fbec258\",\n              \"fbd43f9a3567a19427894e61052d1b46f70b7474357ef50de9dc8749fc950509\",\n              \"96234bb98b3266e49ef74ac7accd4644b709355057d5a34b2966e9fa56aadcf3\",\n              \"0ec0ebc7c71ee139ee29fca1e2447b5cc5ec79cb797deb8b560cb05fee3ca3a6\",\n              \"f4e3e2798fe830eac6990d83f568f6cfbba3a194a7787fe224aa1ba90976eaa7\",\n              \"3abbe0ab12a1baa4c0492c5dba9901f3176f23d35998e8f9a1f753880617523c\",\n              \"13fda552b026d0ecba34fbb488a57dbd29187ebef012874eda115ba5c876dade\",\n              \"3e562ff6f8616c623c82b25a6ab2fff7b2832ec2c53ce5c242d047a525f563ff\",\n              \"d0d177839db17d9f30aebe61594dde7e9e8ab82473f3947892cc88ad58939669\") and\n not (process.executable : (\"?:\\\\Program Files\\\\*.exe\", \"?:\\\\Program Files (x86)\\\\*.exe\") and process.code_signature.trusted == true) and\n not (process.code_signature.subject_name : (\"AVANQUEST SOFTWARE S.A.S\", \"Jernej Simončič\") and process.code_signature.trusted == true) and \n not process.executable :\n             (\"?:\\\\Program Files (x86)\\\\PlotSoft\\\\PDFill_PDF_Tools\\\\PlotSoft_PDF.exe\",\n              \"?:\\\\Program Files\\\\Ab Initio\\\\Ab Initio GDE 4.1.4.0\\\\Program Files\\\\ab_zip.exe\",\n              \"C:\\\\Program Files\\\\GIMP 3\\\\lib\\\\gimp\\\\3.0\\\\plug-ins\\\\file-png\\\\file-png.exe\",\n              \"C:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Programs\\\\GIMP 3\\\\lib\\\\gimp\\\\3.0\\\\plug-ins\\\\file-png\\\\file-png.exe\",\n              \"\\\\Device\\\\Mup\\\\*\\\\file-png.exe\") and\n not process.parent.executable : (\"C:\\\\Program Files (x86)\\\\Visionet Systems Inc\\\\Visionet.DocVu.KofaxExtractionService\\\\Visionet.DocVu.KofaxExtractionService.exe\",\n                                  \"C:\\\\Program Files (x86)\\\\Visionet System Inc\\\\DocVuOcrService-NPF\\\\Visionet.DocVu.OCRService.exe\")\n"
  min_endpoint_version: "7.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
          subtechnique:
            - id: T1204.002
              name: Malicious File
              reference: "https://attack.mitre.org/techniques/T1204/002/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
          subtechnique:
            - id: T1036.002
              name: Right-to-Left Override
              reference: "https://attack.mitre.org/techniques/T1036/002/"
            - id: T1036.007
              name: Double File Extension
              reference: "https://attack.mitre.org/techniques/T1036/007/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
