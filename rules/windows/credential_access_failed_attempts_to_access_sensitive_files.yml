id: "3163dd96-c677-4f1f-98bf-c8f3c81b197b_1.0.31"
type: security-rule
attributes:
  description: |
    Identifies failed attempts to access common sensitive files and registries. Adversaries may search local file systems
    and remote file shares for files containing insecurely stored credentials.
  rule_id: "3163dd96-c677-4f1f-98bf-c8f3c81b197b"
  license: Elastic License v2
  name: Failed Attempts to Access Sensitive Files
  os_list:
    - windows
  reference:
    - "https://github.com/GhostPack/Seatbelt"
    - "https://github.com/AlessandroZ/LaZagne"
  version: "1.0.31"
  query: "any where event.category in (\"registry\", \"file\") and\n   event.action in (\"query\", \"open\") and event.outcome == \"failure\" and process.pid != 4 and\n   process.executable != null and\n   (\n    (file.path : \"?:\\\\*\" and\n     file.path :\n\t     (\n\t\t  \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\*\\\\Remote Desktop Connection Manager\\\\RDCMan.settings\",\n\t\t  \"?:\\\\Users\\\\*\\\\AppData\\\\*\\\\NordVPN\\\\NordVPN.exe*\\\\user.config\",\n\t\t  \"?:\\\\Users\\\\*\\\\AppData\\\\*\\\\FileZilla\\\\recentservers.xml\",\n\t\t  \"?:\\\\Users\\\\*\\\\AppData\\\\*\\\\FileZilla\\\\sitemanager.xml\") and\n\t not process.executable :\n\t          (\"?:\\\\Program Files\\\\*\",\n\t           \"?:\\\\Program Files (x86)\\\\*\",\n\t           \"?:\\\\Windows\\\\System32\\\\SearchProtocolHost.exe\",\n\t           \"?:\\\\Windows\\\\System32\\\\svchost.exe\",\n\t           \"?:\\\\Windows\\\\System32\\\\OpenSSH\\\\ssh.exe\", \n\t           \"?:\\\\Windows\\\\System32\\\\OpenSSH\\\\ssh-keygen.exe\",\n\t           \"?:\\\\Windows\\\\System32\\\\OpenWith.exe\", \n\t           \"\\\\Device\\\\Mup*\",\n\t           \"?:\\\\Windows\\\\explorer.exe\",\n\t           \"?:\\\\Windows\\\\eMweb\\\\certutil.exe\") and\n\t not (process.code_signature.subject_name :\n\t          (\"Rapid7 LLC\", \"Mozilla Corporation\", \"Commvault Systems, Inc.\", \"Google LLC\", \"Bitdefender SRL\",\n\t           \"McAfee, Inc.\", \"Serengeti Systems Incorporated\", \"nordvpn s.a.\", \"Kaspersky Lab\", \"JetBrains s.r.o.\", \n\t           \"Illusive Networks LTD\", \"Ghisler Software GmbH\", \"Keeper Security Inc.\", \"Eric R. Zimmerman\", \n\t           \"Galactic Advisors, Inc.\", \"Johannes Schindelin\", \"Mobatek\", \"Shift Technologies Inc.\",\n\t           \"Viber Media S.a r.l.\", \"ONELAUNCH TECHNOLOGIES INC.\", \"SAP SE\") and\n         process.code_signature.trusted == true) and\n     not (process.executable : (\"?:\\\\Program Files\\\\*.exe\", \"?:\\\\Program Files (x86)\\\\*.exe\") and\n         user.id == \"S-1-5-18\" and process.code_signature.trusted == true) and\n     not (file.name : \"RDCMan.settings\" and process.name : (\"RDCMan.exe\", \"RDCMan-x86.exe\"))\n     ) or\n\n\t(registry.path :\n         (\"HKEY_USERS\\\\S-1-5-21*\\\\SOFTWARE\\\\WOW6432Node\\\\TeamViewer\\\\ProxyPassword\", \n\t  \"HKEY_USERS\\\\S-1-5-21*\\\\Software\\\\OpenVPN-GUI\\\\Configs\\\\*auth-data*\") and\n\n\tnot (process.code_signature.trusted == true and\n\t     process.code_signature.subject_name :\n\t        (\"Simon Tatham\", \"Tim Kosse\", \"David Sparer\", \"Martin Prikryl\", \"Open Source Developer, Sven Strickroth\",\n\t         \"Astrospark Technologies, LLC\", \"Solarwinds Worldwide, LLC\", \"NETSUPPORT LTD.\", \"Bitdefender SRL\",\n\t         \"Ivanti, Inc.\", \"Fortinet Technologies*\", \"Ivanti, Inc.\")) and\n\tnot process.executable : \"?:\\\\$WINDOWS.~BT\\\\Sources\\\\SetupHost.exe\")\n    )\n"
  min_endpoint_version: "8.6.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1539
          name: Steal Web Session Cookie
          reference: "https://attack.mitre.org/techniques/T1539/"
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
        - id: T1555
          name: Credentials from Password Stores
          reference: "https://attack.mitre.org/techniques/T1555/"
          subtechnique:
            - id: T1555.003
              name: Credentials from Web Browsers
              reference: "https://attack.mitre.org/techniques/T1555/003/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.6.0"
