id: "5d51b060-3285-4e2f-9197-74f980a6cdb0_1.0.6"
type: security-rule
attributes:
  description: |
    Identifies the modification of commonly used browsers settings via Preferences change. Adversaries may install a rogue
    browser extension or disable certain browser hardening settings to maintain persistence or evade restrictions.
  rule_id: "5d51b060-3285-4e2f-9197-74f980a6cdb0"
  license: Elastic License v2
  name: Suspicious Browser Preferences File Modification
  os_list:
    - windows
  reference:
    - "https://syntax-err0r.github.io/Silently_Install_Chrome_Extension.html"
  version: "1.0.6"
  query: "file where event.action == \"overwrite\" and file.name : (\"Preferences\", \"Secure Preferences\") and\n    process.executable != null and\n\t file.path :\n\t         (\"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Google\\\\Chrome\\\\User Data\\\\Default\\\\Preferences\", \n\t          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Google\\\\Chrome\\\\User Data\\\\Default\\\\Secure Preferences\", \n\t          \"?:\\\\users\\\\*\\\\appdata\\\\local\\\\microsoft\\\\edge\\\\user data\\\\default\\\\Preferences\", \n\t          \"?:\\\\users\\\\*\\\\appdata\\\\local\\\\microsoft\\\\edge\\\\user data\\\\default\\\\Secure Preferences\") and\n\t not user.id : (\"S-1-5-18\", \"S-1-5-19\", \"S-1-5-19\") and\n\t not process.executable :\n\t               (\"?:\\\\Program Files\\\\*.exe\",\n\t                \"?:\\\\Program Files (x86)\\\\*.exe\",\n\t                \"C:\\\\Windows\\\\explorer.exe\",\n\t                \"C:\\\\Windows\\\\System32\\\\xcopy.exe\",\n\t                \"C:\\\\Windows\\\\System32\\\\Robocopy.exe\",\n\t                \"C:\\\\Windows\\\\System32\\\\wscript.exe\",\n\t                \"C:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\",\n\t                \"C:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\DefaultSetup\\\\DefaultSetup.exe\",\n\t                \"C:\\\\Users\\\\*\\\\.cache\\\\selenium\\\\chromedriver\\\\win64\\\\138.0.7204.157\\\\chromedriver.exe\") and\n\t not (process.code_signature.subject_name : \"Microsoft*\" and process.code_signature.trusted == true and\n\t      process.executable : (\"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\EdgeWebView\\\\Application\\\\*\\\\msedgewebview2.exe\",\n\t                            \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\Edge SxS\\\\Application\\\\msedge.exe\",\n\t                            \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\Edge\\\\Application\\\\msedge.exe\",\n\t                            \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\IXP???.TMP\\\\MEDefaultPCReset.exe\")) and\n\t not (process.code_signature.trusted == true and\n\t      process.code_signature.subject_name :\n\t                (\"Google LLC\", \"PASSWORD BOSS LLC\", \"Piriform Ltd\", \"Piriform Software Ltd\", \"UiPath, Inc.\",\n\t                 \"Gen Digital Inc.\", \"SOFT SOLUTIONS HUB LLC\", \"PIRIFORM SOFTWARE LIMITED\", \"SOFT SOLUTIONS HUB LLC\",\n\t                 \"Guangxi Yunao Network Technology Co. Ltd.\", \"Andrew Ziem\", \"ECHO INFINI SDN. BHD.\"))\n"
  min_endpoint_version: "8.1.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1176
          name: Software Extensions
          reference: "https://attack.mitre.org/techniques/T1176/"
          subtechnique:
            - id: T1176.001
              name: Browser Extensions
              reference: "https://attack.mitre.org/techniques/T1176/001/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
  internal:
    min_endpoint_version: "8.1.0"
