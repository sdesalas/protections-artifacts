id: c89c8742-9040-4de8-b3cf-477407fafac1_1.0.15
type: security-rule
attributes:
  description: |
    Identifies a Windows script interpreter executing for more than 5 minutes followed by spawning a child process. This may
    indicate long term network activity from a Windows script which is common pattern of a command and control backdoor via
    malicious scripts.
  rule_id: c89c8742-9040-4de8-b3cf-477407fafac1
  license: Elastic License v2
  name: Suspicious Execution from a Windows Script
  os_list:
    - windows
  version: "1.0.15"
  query: "sequence with maxspan=1m\n [network where process.pid != 4 and event.action == \"connection_attempted\" and \n  process.uptime >= 300 and user.id != \"S-1-5-18\" and\n  process.name : (\"cscript.exe\", \"wscript.exe\", \"AutoIt*.exe\") and\n  not cidrmatch(destination.ip, \"127.0.0.0/8\", \"::1\", \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \"192.0.0.0/24\",\n       \"192.0.0.0/29\", \"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\", \"192.0.0.170/32\", \"192.0.0.171/32\",\n       \"192.0.2.0/24\", \"192.31.196.0/24\", \"192.52.193.0/24\", \"192.88.99.0/24\", \"224.0.0.0/4\",\n       \"100.64.0.0/10\", \"192.175.48.0/24\",\"198.18.0.0/15\", \"198.51.100.0/24\", \"203.0.113.0/24\", \"240.0.0.0/4\", \"::1\",\n       \"FE80::/10\", \"FF00::/8\")] by process.entity_id\n [process where event.action == \"start\" and\n  process.parent.name : (\"cscript.exe\", \"wscript.exe\", \"AutoIt*.exe\") and\n  not process.hash.sha256 :\n                  (\"ab4ebfc23f71658cc30d21d53a5d774eba2bc27cf5806aafd18f263590541b89\",\n                   \"42bb9150cf428aa3ea2ab4d9d27d30072a7af1ee8c00fd735ef90c11d29e96d6\") and\n  not (process.name : \"reg.exe\" and process.args : \"HKLM\\\\SOFTWARE\\\\AutoTools\\\\ADP SmartAgent\\\\SmartAgent\\\\Jobs\" and user.id == \"S-1-5-18\") and\n  not (process.name : \"reg.exe\" and process.args : \"HKLM\\\\TempHiveTanium-*\") and\n  not process.executable : (\"C:\\\\Windows\\\\regedit.exe\", \"C:\\\\Program Files\\\\Lexmark\\\\Print Management Client\\\\lpmc-app-launcher-win.exe\") and\n  not (process.executable : \"C:\\\\Windows\\\\SysWOW64\\\\sc.exe\" and process.command_line like \"sc config JobEngineService*\") and\n  not process.parent.args :\n              (\"?:\\\\Program Files (x86)\\\\smartagent\\\\agent\\\\common\\\\snapins\\\\adpcommon\\\\ADP_*.vbs\",\n               \"C:\\\\MININT\\\\Scripts\\\\LiteTouch.wsf\",\n               \"/baseUrl:https://utilities.pcpitstop.com\",\n               \"?:\\\\Program Files (x86)\\\\Tanium\\\\Tanium Client\\\\*.vbs\",\n               \"scan.wsf\",\n               \"?:\\\\\\\\Program Files (x86)\\\\\\\\Tanium\\\\\\\\Tanium Client\\\\\\\\Patch\\\\\\\\lib\\\\\\\\tanium-patch.min.vbs\")] by process.parent.entity_id\n"
  min_endpoint_version: "8.8.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1071
          name: Application Layer Protocol
          reference: "https://attack.mitre.org/techniques/T1071/"
        - id: T1573
          name: Encrypted Channel
          reference: "https://attack.mitre.org/techniques/T1573/"
      tactic:
        id: TA0011
        name: Command and Control
        reference: "https://attack.mitre.org/tactics/TA0011/"
  internal:
    min_endpoint_version: "8.8.0"
