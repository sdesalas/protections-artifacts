id: "0a364281-5edc-4f75-a839-48b150cec3f2_1.0.10"
type: security-rule
attributes:
  description: |
    Identifies attempt to mount or copy files from a remote WebDav Share. Adversaries may abuse this method to evade
    dropping malicious files to victim file system.
  rule_id: "0a364281-5edc-4f75-a839-48b150cec3f2"
  license: Elastic License v2
  name: Attempt to Mount a Remote WebDav Share
  os_list:
    - windows
  version: "1.0.10"
  query: "process where event.action == \"start\" and\n (\n  (process.name : \"explorer.exe\" and process.args : \"\\\\\\\\*@*\") or\n  (process.name : \"rundll32.exe\" and process.command_line : \"*\\\\\\\\*@*,*\" and process.parent.name : (\"explorer.exe\", \"cmd.exe\", \"powershell.exe\", \"mshta.exe\", \"msiexec.exe\")) or \n  (process.name : \"net.exe\" and process.args : \"use\" and \n   ((process.args : (\"http*:*\", \"*webdav*\") and process.args : \"/user*@*\") or process.command_line : \"*\\\\\\\\*@ssl\\\\*\") and not process.command_line : \"*//localhost*\") or\n  (process.name : (\"expand.exe\", \"xcopy.exe\", \"cmd.exe\") and process.args : (\"\\\\\\\\webdav*\", \"*DavWWWRoot*\"))\n ) and\n not (process.parent.name : \"rundll32.exe\" and process.parent.args : \"?:\\\\Program Files\\\\Microsoft Office\\\\root\\\\Office16\\\\MLCFG32.CPL\") and\n not process.parent.executable : (\"C:\\\\Program Files\\\\Microsoft Office\\\\root\\\\Office16\\\\WINPROJ.EXE\",\n                                  \"D:\\\\SF-Deploy\\\\Console\\\\Console.exe\",\n                                  \"C:\\\\Program Files\\\\WindowsApps\\\\MyCaseInc.MyCaseFileSync_*\\\\app\\\\MyCase Desktop.exe\",\n                                  \"C:\\\\Program Files\\\\Microsoft Office\\\\root\\\\Office16\\\\OUTLOOK.EXE\") and\n not (process.name : \"xcopy.exe\" and process.args : \"\\\\\\\\*.sharepoint.com\\\\DavWWWRoot\\\\sites\\\\*\")\n"
  min_endpoint_version: "7.16.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1204
          name: User Execution
          reference: "https://attack.mitre.org/techniques/T1204/"
          subtechnique:
            - id: T1204.002
              name: Malicious File
              reference: "https://attack.mitre.org/techniques/T1204/002/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1021
          name: Remote Services
          reference: "https://attack.mitre.org/techniques/T1021/"
          subtechnique:
            - id: T1021.002
              name: SMB/Windows Admin Shares
              reference: "https://attack.mitre.org/techniques/T1021/002/"
      tactic:
        id: TA0008
        name: Lateral Movement
        reference: "https://attack.mitre.org/tactics/TA0008/"
  internal:
    min_endpoint_version: "7.16.0"
