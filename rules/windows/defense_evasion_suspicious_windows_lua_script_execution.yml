id: "8f237d98-1825-4c27-a5cd-e38bde70882a_1.0.32"
type: security-rule
attributes:
  description: |
    Identifies the execution of Lua Windows Standalone Interpreter modules from suspicious locations. Attackers may abuse
    Lua for Windows to execute malicious Lua script and bypass signature-based detection.
  rule_id: "8f237d98-1825-4c27-a5cd-e38bde70882a"
  license: Elastic License v2
  name: Suspicious Windows LUA Script Execution
  os_list:
    - windows
  version: "1.0.32"
  query: "sequence by process.entity_id with maxspan=1m\n [library where dll.name : (\"luacom.dll\", \"lua?.?.dll\", \"lua??.dll\") and not user.id : \"S-1-5-18\" and\n  not dll.code_signature.trusted == true and\n  dll.path : (\"?:\\\\Programdata\\\\*\", \"?:\\\\Users\\\\*\", \"?:\\\\Windows\\\\Temp\\\\*\", \"?:\\\\windows\\\\System32\\\\Tasks\\\\*\", \"?:\\\\Windows\\\\Tasks\\\\*\") and \n  not (process.code_signature.subject_name : (\"Beijing Xiaowei Cloud Inc.\", \"Leslie Newell\") and process.code_signature.trusted == true)]\n [network where event.action == \"connection_attempted\" and \n  not destination.address : (\"127.0.0.1\", \"0.0.0.0\", \"::\", \"10.*\", \"172.*\", \"192.168.*\")]\n"
  min_endpoint_version: "8.1.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
          subtechnique:
            - id: T1036.003
              name: Rename Legitimate Utilities
              reference: "https://attack.mitre.org/techniques/T1036/003/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.1.0"
