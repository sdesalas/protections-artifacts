id: c9674e88-8423-442a-9712-ba6271bcff10_1.0.23
type: security-rule
attributes:
  description: |
    Identifies the load of a DLL from a network file share followed by a suspicious DLL load event. Adversaries may leverage
    this technique to avoid dropping to disk the malicious payload on the targeted machine.
  rule_id: c9674e88-8423-442a-9712-ba6271bcff10
  license: Elastic License v2
  name: Suspicious Image Load from SMB Shares
  os_list:
    - windows
  version: "1.0.23"
  query: "sequence by process.entity_id with maxspan=1m\n [library where dll.path : \"\\\\Device\\\\Mup\\\\*\" and not startswith~(dll.name, process.name) and \n  not _arraysearch(process.thread.Ext.call_stack, $entry,\n                   $entry.symbol_info : (\"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\", \"?:\\\\Windows\\\\Sys*\\\\tmumh\\\\*\\\\tmmon.dll+*\")) and\n  not process.executable :\n            (\"?:\\\\Windows\\\\System32\\\\sdiagnhost.exe\",\n             \"?:\\\\Windows\\\\System32\\\\CompPkgSrv.exe\",\n             \"?:\\\\Windows\\\\System32\\\\backgroundTaskHost.exe\") and \n  not process.thread.Ext.call_stack_summary : \"ntdll.dll|kernelbase.dll|jvm.dll|java.dll|Unbacked\"\n  ]\n [library where\n  process.executable != null and\n  (\n   (dll.name : (\"ws2_32.dll\", \"wininet.dll\", \"psapi.dll\") and\n    process.thread.Ext.call_stack_summary == \"ntdll.dll|kernelbase.dll|Unbacked\") or\n\n   dll.name : (\"dsquery.dll\", \"System.Management.Automation.dll\")\n  ) and \n  not _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info : (\"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\")) and\n  not (dll.name : \"ws2_32.dll\" and process.executable : \"\\\\Device\\\\Mup\\\\*.edu\\\\*\\\\IDTest.exe\") and \n  not (dll.name : \"wininet.dll\" and process.executable : \"\\\\Device\\\\Mup\\\\nf01\\\\Application\\\\*.exe\") and \n  not (process.name : \"UiPath.ActivityCompiler.CommandLine.exe\" and process.code_signature.subject_name : \"UiPath, Inc.\" and \n       process.code_signature.trusted == true and dll.name : \"System.Management.Automation.dll\") and \n       \n  not _arraysearch(process.thread.Ext.call_stack, $entry,\n                   $entry.callsite_leading_bytes :\n                         (\"ffeb1e8d4e0ce86482000083660400684c5*\",\n                          \"8bcee8ac9affff837d10007414ff7510*\",\n                          \"0000004d63db4a8b0c19488b0948894d9890488b4db84533db488b458048898558ffffff488d051500000048898570ffffff488b4588c6400c00488b4598ffd0\",\n                          \"8b750cc706d3c6ca05e8cd9d2e588b4d10e855d728588b4d108b750cc706dec6ca05e884102d588b4d10e8dcf72c588b4d108b750cc706e6c6ca05e89b9d2e58\",\n                          \"008bc3eb8933c0413bed75824488afe81c0000e976ffffffcccccc40534881eca000000033db48391d66360d000f85bb010000488d0db9580b00ff15132b0900\"))\n  ]\n"
  min_endpoint_version: "8.8.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1021
          name: Remote Services
          reference: "https://attack.mitre.org/techniques/T1021/"
          subtechnique:
            - id: T1021.002
              name: SMB/Windows Admin Shares
              reference: "https://attack.mitre.org/techniques/T1021/002/"
      tactic:
        id: TA0008
        name: Lateral Movement
        reference: "https://attack.mitre.org/tactics/TA0008/"
  internal:
    min_endpoint_version: "8.8.0"
