id: "46952f58-6741-4280-8e74-fa43f63c9604_1.0.31"
type: security-rule
attributes:
  description: |
    Identifies a suspicious image load (wmiutils.dll) from Microsoft Office processes followed by a child process spawned
    via Windows Management Instrumentation (WMI). This behavior may indicate adversarial activity to avoid spawning a
    suspicious MS Office child process.
  rule_id: "46952f58-6741-4280-8e74-fa43f63c9604"
  license: Elastic License v2
  name: WMI Image Load via Microsoft Office
  os_list:
    - windows
  reference:
    - "https://medium.com/threatpunter/detecting-adversary-tradecraft-with-image-load-event-logging-and-eql-8de93338c16"
  version: "1.0.31"
  query: "sequence by user.id with maxspan=30s\n    [library where dll.name : (\"wmiutils.dll\", \"fastprox.dll\", \"wbemprox.dll\") and \n     process.name : (\"excel.exe\", \"powerpnt.exe\", \"winword.exe\")]\n    [process where event.action == \"start\" and\n     process.parent.name : \"wmiprvse.exe\" and\n     not process.Ext.token.integrity_level_name == \"system\" and\n     (process.pe.original_file_name :\n        (\n          \"cscript.exe\",\n          \"wscript.exe\",\n          \"PowerShell.EXE\",\n          \"Cmd.Exe\",\n          \"pwsh.exe\",\n          \"bitsadmin.exe\",\n          \"certutil.exe\",\n          \"hh.exe\",\n          \"MSHTA.EXE\",\n          \"RUNDLL32.EXE\",\n          \"REGSVR32.EXE\",\n          \"MSBuild.exe\",\n          \"InstallUtil.exe\",\n          \"RegAsm.exe\",\n          \"RegSvcs.exe\",\n          \"msxsl.exe\",\n          \"CONTROL.EXE\",\n          \"EXPLORER.EXE\",\n          \"Microsoft.Workflow.Compiler.exe\",\n          \"msiexec.exe\",\n          \"sc.exe\",\n          \"schtasks.exe\",\n          \"WMIC.exe\",\n          \"curl.exe\"\n        ) or\n      process.executable : (\"?:\\\\Users\\\\*.exe\", \"?:\\\\ProgramData\\\\*.exe\")\n     ) and\n     not (process.name : \"powershell.exe\" and process.command_line : \"*\\\\windows\\\\CCM\\\\*\")\n\n    ]\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1566
          name: Phishing
          reference: "https://attack.mitre.org/techniques/T1566/"
          subtechnique:
            - id: T1566.001
              name: Spearphishing Attachment
              reference: "https://attack.mitre.org/techniques/T1566/001/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1047
          name: Windows Management Instrumentation
          reference: "https://attack.mitre.org/techniques/T1047/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.15.0"
