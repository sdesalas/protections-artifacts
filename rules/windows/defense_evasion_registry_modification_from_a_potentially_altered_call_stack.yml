id: "2296595e-26d5-4834-8aa1-2602d11de45e_1.0.2"
type: security-rule
attributes:
  description: Detects registry modification from a potentially altered call stack in order to conceal the true source of the call.
  rule_id: "2296595e-26d5-4834-8aa1-2602d11de45e"
  license: Elastic License v2
  name: Registry Modification from a Potentially Altered Call Stack
  os_list:
    - windows
  reference:
    - "https://www.elastic.co/security-labs/doubling-down-etw-callstacks"
  version: "1.0.2"
  query: "registry where event.action == \"modification\" and process.executable != null and registry.value == \"CachePrefix\" and\n process.thread.Ext.call_stack_summary :\n                   (\"ntdll.dll|kernelbase.dll|wininet.dll|ntdll.dll|kernelbase.dll|wininet.dll|kernel32.dll*\",\n                    \"ntdll.dll|kernelbase.dll|wininet.dll|ntdll.dll|kernelbase.dll|wininet.dll|kernelbase.dll*\") and\n _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info: \"?:\\\\Windows\\\\System32\\\\wininet.dll!HttpSendRequest*\") and \n not (process.code_signature.trusted == true and \n      _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info : \"C:\\\\Windows\\\\System32\\\\ntdll.dll!LdrGetDllPath*\") and \n      _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info : \"C:\\\\Windows\\\\System32\\\\KernelBase.dll!GetProcessTimes*\"))\n"
  min_endpoint_version: "8.10.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.10.0"
