id: "5e8498bb-8cc0-412f-9017-793d94ab76a5_1.0.36"
type: security-rule
attributes:
  description: |
    Identifies the execution of commonly abused utilities to run DLLs or scripts via a separate Windows Explorer trampoline.
    Explorer can be abused to launch malicious scripts or executables from a trusted parent process.
  rule_id: "5e8498bb-8cc0-412f-9017-793d94ab76a5"
  license: Elastic License v2
  name: Execution of Commonly Abused Utilities via Explorer Trampoline
  os_list:
    - windows
  reference:
    - "https://lolbas-project.github.io/lolbas/Binaries/Explorer/"
  version: "1.0.36"
  query: "process where event.action == \"start\" and\n  (\n   process.name : (\"cscript.exe\", \"wscript.exe\", \"rundll32.exe\", \"mshta.exe\", \"regsvr32.exe\") or\n   process.pe.original_file_name :\n               (\"cscript.exe\",\n                \"wscript.exe\",\n                \"rundll32.exe\",\n                \"mshta.exe\",\n                \"regsvr32.exe\")\n  ) and\n  /* Explorer started via DCOM */\n  process.parent.name : \"explorer.exe\" and process.parent.command_line : \"*/factory,{75dff2b7-6936-4c06-a8bb-676a7b00b24b}*\" and\n  not\n     (\n      process.name : \"rundll32.exe\" and\n      process.args : (\"rundll32.exe*\\\\Users\\\\*\\\\AppData\\\\Local\\\\Cognitas\\\\CrossLink6\\\\csathl32.dll*\",\n                      /* Issue #340 */\n                      \"*dfshim.dll*ShOpenVerbApplication*\",\n                      \"dfshim.dll,\",\n                      \"?:\\\\WINDOWS\\\\system32\\\\hotplug.dll,HotPlugSafeRemovalDriveNotification\",\n                      \"cryptext.dll,CryptExtOpen*\",\n                      \"cryptext.dll,CryptExtAddCER\",\n                      \"ndfapi.dll,NdfRunDllDiagnoseWithAnswerFile\",\n                      \"shwebsvc.dll,AddNetPlaceRunDll\",\n                      \"?:\\\\Program Files\\\\Windows Photo Viewer\\\\PhotoViewer.dll*\",\n                      \"?:\\\\Windows\\\\system32\\\\hotplug.dll,HotPlugSafeRemovalDriveNotification\",\n                      \"devmgr.dll,DeviceProperties_RunDLL\",\n                      \"printui.dll,PrintUIEntryDPIAware\",\n                      \"?:\\\\windows\\\\System32\\\\srchadmin.dll\",\n                      \"fdprint,InvokeTask\",\n                      \"cryptext.dll,CryptExtAddPFX\",\n                      \"shell32.dll,SHCreateLocalServerRunDll\",\n                      \"?:\\\\WINDOWS\\\\System32\\\\SHELL32.dll,RunAsNewUser_RunDLL\", \n                      \"?:\\\\WINDOWS\\\\system32\\\\spool\\\\DRIVERS\\\\x64\\\\3\\\\*\",\n                      \"C:\\\\Program Files (x86)\\\\Stardock\\\\Fences\\\\FencesMenu64.dll,StartFences\",\n                      \"C:\\\\Windows\\\\System32\\\\*.cpl\")\n      ) and\n  not (process.name : (\"wscript.exe\", \"cscript.exe\") and\n       process.args : (\"\\\\\\\\*.vbs\", \"C:\\\\Robocopy\\\\robocopy_Mail_Config_Veeam.vbs\", \"C:\\\\Users\\\\*\\\\Documents\\\\*.vbs\", \"X:\\\\*.vbs\", \"W:\\\\*.vbs\"))\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1566
          name: Phishing
          reference: "https://attack.mitre.org/techniques/T1566/"
          subtechnique:
            - id: T1566.001
              name: Spearphishing Attachment
              reference: "https://attack.mitre.org/techniques/T1566/001/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1218
          name: System Binary Proxy Execution
          reference: "https://attack.mitre.org/techniques/T1218/"
          subtechnique:
            - id: T1218.005
              name: Mshta
              reference: "https://attack.mitre.org/techniques/T1218/005/"
            - id: T1218.010
              name: Regsvr32
              reference: "https://attack.mitre.org/techniques/T1218/010/"
            - id: T1218.011
              name: Rundll32
              reference: "https://attack.mitre.org/techniques/T1218/011/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
