id: "4c6cea1d-7c50-4d83-861b-3fee8c079d97_1.0.8"
type: security-rule
attributes:
  description: |
    Identifies attempts to drop an executable file via a malicious RDP connection file. This may indicate an attempt to get
    initial access by connecting to an adversary controlled malicious RDP server.
  rule_id: "4c6cea1d-7c50-4d83-861b-3fee8c079d97"
  license: Elastic License v2
  name: Potential Initial Access via Rogue RDP Server
  os_list:
    - windows
  reference:
    - "https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/"
    - "https://shorsec.io/blog/malrdp-implementing-rouge-rdp-manually/"
  version: "1.0.8"
  query: "sequence by process.entity_id with maxspan=5m\n [process where event.action == \"start\" and process.name : \"mstsc.exe\" and process.args_count >= 2 and\n  not (process.args : \"-Embedding\" and process.parent.name : \"svchost.exe\") and\n  not process.parent.executable :\n             (\"?:\\\\Program Files\\\\Thycotic Software Ltd\\\\Secret Server Protocol Handler\\\\RDPWin.exe\",\n              \"?:\\\\Program Files (x86)\\\\Thycotic Software Ltd\\\\Secret Server Protocol Handler\\\\RDPWin.exe\")]\n [network where event.action == \"connection_attempted\" and process.name : \"mstsc.exe\"]\n [file where event.action != \"deletion\" and process.name : \"mstsc.exe\" and \n  (\n   (file.extension : (\"dll\", \"exe\", \"cpl\", \"pif\", \"com\", \"js\", \"vbs\", \"wsh\", \"vbe\", \"jse\", \"bat\", \"cmd\") or\n    file.Ext.header_bytes : \"4d5a*\" or file.name : \"*.exe.config\") or\n\n   file.path : (\"?:\\\\Users\\\\*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\\*\",\n               \"?:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\StartUp\\\\*\",\n               \"?:\\\\Users\\\\*\\\\Desktop\\\\*.lnk\")\n   ) and\n   not file.path : (\"?:\\\\*\\\\AppData\\\\Local\\\\Temp\\\\*\", \"?:\\\\Program Files*\") and\n   not (file.path : \"?:\\\\ProgramData\\\\*\" and not file.path : \"?:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\StartUp\\\\*\")]\n"
  min_endpoint_version: "7.16.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1566
          name: Phishing
          reference: "https://attack.mitre.org/techniques/T1566/"
          subtechnique:
            - id: T1566.001
              name: Spearphishing Attachment
              reference: "https://attack.mitre.org/techniques/T1566/001/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
  internal:
    min_endpoint_version: "7.16.0"
