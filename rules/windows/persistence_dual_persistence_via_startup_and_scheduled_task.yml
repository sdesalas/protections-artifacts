id: "8eb8bf95-872b-43c9-9f7c-528d795d6b4e_1.0.17"
type: security-rule
attributes:
  description: |
    Identifies the creation of two persistence items via startup followed by scheduled task by an unsigned executable.
    Adversaries may use this technique to maintain multiple methods of persistence on an endpoint.
  rule_id: "8eb8bf95-872b-43c9-9f7c-528d795d6b4e"
  license: Elastic License v2
  name: Dual Persistence via Startup and Scheduled Task
  os_list:
    - windows
  reference:
    - "https://docs.microsoft.com/en-us/previous-versions/technet-magazine/ee851671(v=msdn.10)"
  version: "1.0.17"
  query: "sequence with maxspan=3m\n [any where event.category in (\"registry\", \"file\") and\n  process.executable : (\"?:\\\\*\", \"\\\\Device\\\\Mup*\") and\n  event.action != \"deletion\" and user.id like (\"S-1-5-21*\", \"S-1-12-*\") and \n  (process.code_signature.exists == false or\n   (process.code_signature.trusted == false and\n    not process.code_signature.status like (\"errorExpired\", \"errorCode_endpoint*\"))) and\n   (\n    (registry.data.strings != null and \n     not registry.data.strings : (\"*:\\\\Program Files\\\\*\", \"*:\\\\Program Files (x86)\\\\*\") and\n     registry.path :\n              (\"H*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\*\", \n\t       \"H*\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\*\",\n\t       \"H*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run\\\\*\", \n\t       \"H*\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run\\\\*\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Windows\\\\Load\", \n\t       \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\Shell\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\Shell\", \n\t       \"HKEY_USERS\\\\*\\\\Environment\\\\UserInitMprLogonScript\", \n\t       \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\Userinit\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\Shell\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts\\\\Logoff\\\\Script\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts\\\\Logon\\\\Script\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts\\\\Shutdown\\\\Script\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts\\\\Startup\\\\Script\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Ctf\\\\LangBarAddin\\\\*\\\\FilePath\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Internet Explorer\\\\Extensions\\\\*\\\\Exec\", \n\t       \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Command Processor\\\\Autorun\")) or\n    (file.name != null and file.path : \"?:\\\\*\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\\*\" and not file.name : \"desktop.ini\")\n   )] by process.entity_id\n  [file where event.action != \"deletion\" and\n   file.path : \"?:\\\\Windows\\\\System32\\\\Tasks\\\\*\" and file.name != null] by Effective_process.entity_id\n"
  min_endpoint_version: "8.4.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1053
          name: Scheduled Task/Job
          reference: "https://attack.mitre.org/techniques/T1053/"
          subtechnique:
            - id: T1053.005
              name: Scheduled Task
              reference: "https://attack.mitre.org/techniques/T1053/005/"
        - id: T1547
          name: Boot or Logon Autostart Execution
          reference: "https://attack.mitre.org/techniques/T1547/"
          subtechnique:
            - id: T1547.001
              name: Registry Run Keys / Startup Folder
              reference: "https://attack.mitre.org/techniques/T1547/001/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1112
          name: Modify Registry
          reference: "https://attack.mitre.org/techniques/T1112/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.4.0"
