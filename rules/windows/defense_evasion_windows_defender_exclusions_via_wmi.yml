id: "73310ee3-5e48-4680-b7c5-c096813c7f03_1.0.10"
type: security-rule
attributes:
  description: |
    Identifies attempt to modify to the Windows Defender configuration settings to add an exclusion via the Windows
    Management Instrumentation method.
  rule_id: "73310ee3-5e48-4680-b7c5-c096813c7f03"
  license: Elastic License v2
  name: Windows Defender Exclusions via WMI
  os_list:
    - windows
  reference:
    - "https://docs.microsoft.com/en-us/powershell/module/defender/add-mppreference?view=windowsserver2019-ps"
  version: "1.0.10"
  query: "api where\n  process.Ext.api.name == \"IWbemServices::ExecMethod\" and\n  process.Ext.api.parameters.operation : \"*MSFT_MpPreference::Add*\" and\n\n  not (user.id == \"S-1-5-18\" and process.executable : \"C:\\\\Windows\\\\Sys?????\\\\WindowsPowerShell\\\\v*\\\\powershell.exe\") and\n  not (process.executable == \"C:\\\\Windows\\\\System32\\\\svchost.exe\" and process.parent.executable == \"C:\\\\Windows\\\\System32\\\\services.exe\") and\n  not process.parent.executable : (\n          \"?:\\\\Program Files\\\\JetBrains\\\\*\\\\lib\\\\ReSharperHost\\\\JetBrains.Rider.AfterInstall.exe\",\n          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Programs\\\\*\\\\lib\\\\ReSharperHost\\\\JetBrains.Rider.AfterInstall.exe\",\n          \"?:\\\\Program Files\\\\JetBrains\\\\*\\\\bin\\\\elevator.exe\",\n          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Programs\\\\*\\\\bin\\\\elevator.exe\",\n          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\JetBrains\\\\*\\\\bin\\\\elevator.exe\",\n          \"?:\\\\Program Files\\\\Android\\\\Android Studio\\\\bin\\\\elevator.exe\",\n          \"?:\\\\Users\\\\*\\\\Downloads\\\\dbeaver-*\",\n          \"?:\\\\ProgramData\\\\chocolatey\\\\lib\\\\dbeaver\\\\tools\\\\dbeaver-ce-*\",\n          \"?:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\*\\\\DCHUService.exe\",\n          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Programs\\\\*\\\\bin\\\\elevator.exe\", \n          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\*\\\\dbeaver-ce-*\", \n          \"?:\\\\ProgramData\\\\chocolatey\\\\lib\\\\dbeaver\\\\tools\\\\dbeaver-ce-*\", \n          \"?:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\*\\\\DCHUService.exe\", \n          \"?:\\\\Program Files (x86)\\\\XOS Technologies\\\\Thunder\\\\ThunderPowerUserSetupUtility.exe\",\n          \"?:\\\\Program Files (x86)\\\\RXM\\\\Player\\\\bin\\\\26.4.28.4537\\\\RXMusic.Helper.App.exe\"\n        ) and\n  not (process.code_signature.subject_name in (\"Censornet Limited\",  \"JetBrains s.r.o.\") and process.code_signature.trusted == true) and\n  not (process.executable : \"?:\\\\Program Files\\\\AppsAnywhere\\\\AppsAnywhere\\\\AppsAnywhereUpdaterService.exe\" and\n       process.parent.executable : \"?:\\\\Windows\\\\System32\\\\services.exe\" and user.id == \"S-1-5-18\" and\n       process.code_signature.subject_name in (\"AppsAnywhere Limited\", \"AppsAnywhere Ltd\") and\n       process.code_signature.trusted == true) and\n  not (process.executable : \"?:\\\\Program Files\\\\HarfangLab\\\\hurukai.exe\" and\n       process.parent.executable : \"?:\\\\Windows\\\\System32\\\\services.exe\" and user.id == \"S-1-5-18\" and\n       process.Ext.protection == \"PsProtectedSignerAntimalware-Light\" and\n       process.code_signature.subject_name == \"HarfangLab SAS\" and process.code_signature.trusted == true) and\n  not (process.executable : \"?:\\\\Program Files\\\\USSAgent\\\\USSAgent\\\\USSService.exe\" and\n       process.parent.executable : \"?:\\\\Windows\\\\System32\\\\services.exe\" and user.id == \"S-1-5-18\" and\n       process.code_signature.subject_name == \"TrustLayer Limited\" and process.code_signature.trusted == true) and\n  not (process.parent.executable : \"C:\\\\Windows\\\\SysWOW64\\\\cmd.exe\" and process.name : \"powershell.exe\" and\n       process.command_line : \"powerShell  Add-MpPreference -ControlledFolderAccessAllowedApplications*\") and\n  not (process.name : \"wmic.exe\" and\n       process.command_line : (\"WMIC  /NAMESPACE:\\\\\\\\root\\\\Microsoft\\\\Windows\\\\Defender PATH MSFT_MpPreference call Add ExclusionPath=\\\"c:\\\\windows\\\\puppet\\\\activate\\\\*\",\n                               \"WMIC  /NAMESPACE:\\\\\\\\root\\\\Microsoft\\\\Windows\\\\Defender PATH MSFT_MpPreference call Add ExclusionPath=\\\"C:\\\\Windows\\\\AAct_Tools\\\\*\")) and\n  not process.command_line : \"\\\"C:\\\\WINDOWS\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\\\" -NoProfile -ExecutionPolicy Bypass -Command Add-MpPreference -ExclusionProcess \\\"UltraSearch.exe\\\" \" and\n  not (process.name : \"powershell.exe\" and\n       process.command_line : (\"*JABlAHgAYwBsAHUAcwBpAG8AbgBzAD0AQAAoACIAQwA6AFwAUAByAG8AZwByAGEAbQAgAEYAaQBsAGUAcwBcAEQAQgBlAGEAdgBlAHIAXABkAGIAZQBhAHYAZQByAC4AZQB4AGUAI*\",\n                               \"*AkAHMAcABsAGkAdABfAHAAYQByAHQAcwAgAD0AIAAkAGUAeABlAGMAXwB3AHIAYQBwAHAAZQByAF8AcwB0AHIALgBTAHAAbABpAHQAKABAACgAIgBgADAAYAAwAGAAMABgADAAIgApACwAIAAyACwA*\",\n                               \"*WwBDAG8AbABsAGUAYwB0AGkAbwBuAHMALgBHAGUAbgBlAHIAaQBjAC4ASABhAHMAaABTAGUAdABbAFMAdAByAGkAbgBnAF0AXQAoAEcAZQB0AC0A*\")) and\n  not (process.parent.executable : \"C:\\\\Windows\\\\System32\\\\cmd.exe\" and process.command_line : \"*\\\\EC2Launch*\\\\UserScript.ps1*\") and \n  not (process.executable : \"C:\\\\Program Files\\\\USSAgent\\\\USSAgent\\\\USSService.exe\" and process.code_signature.subject_name : \"TrustLayer Limited\" and process.code_signature.trusted == true)\n"
  min_endpoint_version: "8.15.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1047
          name: Windows Management Instrumentation
          reference: "https://attack.mitre.org/techniques/T1047/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1562
          name: Impair Defenses
          reference: "https://attack.mitre.org/techniques/T1562/"
          subtechnique:
            - id: T1562.001
              name: Disable or Modify Tools
              reference: "https://attack.mitre.org/techniques/T1562/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.15.0"
