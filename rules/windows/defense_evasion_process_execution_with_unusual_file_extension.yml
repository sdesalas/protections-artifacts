id: "6daf97b0-8e29-476b-998a-c3d168d98506_1.0.26"
type: security-rule
attributes:
  description: |
    Identifies the creation of a process with an unusual file extension (3 to 3 chars) and from the most commonly abused
    Windows processes for initial access. Attackers may attempt to evade detection by masquerading files using the file
    extension values used by image, logs, or document file types.
  rule_id: "6daf97b0-8e29-476b-998a-c3d168d98506"
  license: Elastic License v2
  name: Process Execution with Unusual File Extension
  os_list:
    - windows
  reference:
    - "https://www.elastic.co/security-labs/doing-time-with-the-yipphb-dropper"
  version: "1.0.26"
  query: "process where event.action == \"start\" and\n\n /* 3 to 4 chars to match on common file extensions length */\n process.name regex~ \"\"\".+\\.[a-z]{3,4}\"\"\" and\n\n /* excluding common or noisy file extensions */\n  not process.name regex~ \"\"\".+\\.(exe|scr|pif|com|tmp|bin|dll|sys|dat|upd|cgi|out|pro|ngn|dep|cxp|axp|srv)\"\"\" and\n\n /* most common parents observed in malware behavior */\n  process.parent.name : (\"cmd.exe\", \"powershell.exe\", \"WmiPrvSe.exe\", \"winword.exe\", \"excel.exe\", \"wscript.exe\", \"cscript.exe\", \"mshta.exe\") and \n\n  process.hash.sha256 != \"28ebebabf1687e5577178b386b92591062b857b8ac04784354c2d501bd69d378\"\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
          subtechnique:
            - id: T1036.007
              name: Double File Extension
              reference: "https://attack.mitre.org/techniques/T1036/007/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "7.15.0"
