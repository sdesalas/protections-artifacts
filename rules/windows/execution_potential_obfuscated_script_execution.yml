id: a279fa6c-61eb-49ea-926e-704db27855e8_1.0.12
type: security-rule
attributes:
  description: |
    Detection involves spotting the generation of a file exhibiting high entropy, which is subsequently executed using
    frequently abused script interpreters. Adversaries may employ script obfuscation techniques to evade static detection
    methods.
  rule_id: a279fa6c-61eb-49ea-926e-704db27855e8
  license: Elastic License v2
  name: Potential Obfuscated Script Execution
  os_list:
    - windows
  version: "1.0.12"
  query: "sequence with maxspan=1m\n [file where event.action == \"creation\" and \n  not user.id : (\"S-1-5-18\", \"S-1-5-19\", \"S-1-5-90\") and \n  process.pid != 4 and \n  file.path : (\"?:\\\\Users\\\\*\", \"?:\\\\ProgramData\\\\*\", \"?:\\\\Windows\\\\Temp\\\\*\", \"?:\\\\Windows\\\\Tasks\\\\*\") and \n  file.Ext.entropy >= 6 and not file.Ext.header_bytes : \"4d5a*\" and\n  not (process.name : \"ifa-PM.exe\" and file.name : \"ifa-PMS.hta\") and\n  not (process.name : \"Code.exe\" and file.name : \"aws-lsp-codewhisperer.js\") and\n  not (process.name : (\"Setup.exe\", \"vrpsetup.exe\") and\n      file.Ext.header_bytes : (\"53657420776d6953657276696365203d\", \"2720436865636b206c6963206265666f\")) and\n  not (process.code_signature.subject_name : (\"BizLink International Corp.\", \"Adobe Inc.\", \"Fabrice PARISOT\", \"Notepad++\", \"Argus Media Ltd\", \"Imprivata, Inc.\")\n       and process.code_signature.trusted == true) and\n  not process.executable : (\"?:\\\\Program Files (x86)\\\\Kovai Ltd\\\\BizTalk360\\\\Service\\\\BHMCollect.exe\",\n                            \"?:\\\\Program Files (x86)\\\\BizTalkHealthMonitor\\\\BHMCollect.exe\",\n                            \"?:\\\\Program Files\\\\Common Files\\\\Voltage Security\\\\VSManager2.exe\",\n                            \"?:\\\\Program Files (x86)\\\\UPS\\\\CrossWare\\\\CrossWare.exe\",\n                            \"?:\\\\Program Files\\\\Automation Anywhere\\\\Bot Agent\\\\jre\\\\bin\\\\javaw.exe\",\n                            \"?:\\\\Program Files\\\\ForeScout SecureConnector\\\\SecureConnector.exe\",\n                            \"?:\\\\Program Files (x86)\\\\Acronis\\\\BackupAndRecovery\\\\mms.exe\",\n                            \"C:\\\\Program Files (x86)\\\\Delcam\\\\FeatureCAM\\\\Program\\\\ezfm.exe\",\n                            \"C:\\\\Program Files\\\\IPA\\\\IPA.exe\",\n                            \"?:\\\\Program Files\\\\EIZO\\\\ColorNavigator 7\\\\ColorNavigator 7.exe\",\n                            \"?:\\\\Program Files (x86)\\\\Windev\\\\AD_Voyager\\\\AD_voyager.exe\",\n                            \"?:\\\\Program Files\\\\BackupClient\\\\BackupAndRecovery\\\\mms.exe\",\n                            \"?:\\\\Program Files\\\\Velneo\\\\vClient.exe\",\n                            \"D:\\\\WINDEV\\\\AD_Voyager\\\\AD_voyager.exe\",\n                            \"C:\\\\Program Files\\\\Java\\\\jre8\\\\bin\\\\java.exe\",\n                            \"C:\\\\Program Files (x86)\\\\SofttechLLC\\\\FlightVector\\\\FlightVector.exe\",\n                            \"?:\\\\Program Files\\\\Automation Anywhere\\\\Bot Agent\\\\jre\\\\bin\\\\BotLauncher.exe\",\n                            \"C:\\\\Program Files\\\\Eclipse Adoptium\\\\jdk-*-hotspot\\\\bin\\\\java.exe\",\n                            \"C:\\\\Program Files (x86)\\\\Imprivata\\\\OneSign Agent\\\\x64\\\\ISXAgent.exe\",\n                            \"C:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeWebView\\\\Application\\\\*\\\\msedgewebview2.exe\")] as event0\n [process where event.action == \"start\" and process.args_count >= 2 and \n  (\n   (process.Ext.relative_file_creation_time <= 500 and process.pe.original_file_name : (\"node.exe\", \"AutoIt*.exe\")) or \n    (process.pe.original_file_name : (\"wscript.exe\", \"mshta.exe\") and\n     event0.file.extension : (\"js\", \"vbs\", \"wsh\", \"vbe\", \"jse\", \"hta\"))\n  ) and \n  stringcontains~(process.command_line, event0.file.name) and\n  not (process.parent.args : \"%TEMP%\\\\Spiceworks\\\\spiceworks_upload.vbs\" and process.parent.name : \"cmd.exe\") and\n  not (process.parent.name : \"mshta.exe\" and process.parent.args : \"\\\\\\\\*\\\\netlogon\\\\ADSelfService_Enroll.hta\") and\n  not (process.parent.name : \"cmd.exe\" and\n       process.parent.command_line : \"C:\\\\WINDOWS\\\\SYSTEM32\\\\cmd.exe /c \\\"\\\"C:\\\\Program Files (x86)\\\\BluePoint Solutions\\\\BPAppLaunch\\\\ConsoleApp\\\\Command BPAppLaunch.bat\\\"\\\"\") and\n  not process.parent.executable : (\"C:\\\\Engineer\\\\Airlock Digital - Allowlisting Auditor v4.1.exe\",\n                                   \"C:\\\\Program Files (x86)\\\\Common Files\\\\Adobe\\\\Adobe Desktop Common\\\\HDBox\\\\Setup.exe\")\n  ]\n"
  min_endpoint_version: "8.4.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 1
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.005
              name: Visual Basic
              reference: "https://attack.mitre.org/techniques/T1059/005/"
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.4.0"
