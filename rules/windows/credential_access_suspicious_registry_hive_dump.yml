id: e7358500-1ef6-4f81-ab2d-f8da696375e8_1.0.8
type: security-rule
attributes:
  description: |
    Identifies attempts to dump registry hives containing access credential secrets, adversaries may dump registry to
    prepare for credential access.
  rule_id: e7358500-1ef6-4f81-ab2d-f8da696375e8
  license: Elastic License v2
  name: Suspicious Registry Hive Dump
  os_list:
    - windows
  reference:
    - "https://adsecurity.org/?page_id=1821"
    - "https://github.com/gentilkiwi/mimikatz/wiki/module-~-lsadump"
  version: "1.0.8"
  query: "any where \n (\n  (event.category == \"registry\" and event.action == \"save\" and registry.path : (\"HKLM\\\\SAM\", \"HKLM\\\\security\", \"HKLM\\\\SECURITY\\\\Policy\\\\Secrets\") and\n   not (process.executable : \"?:\\\\Windows\\\\System32\\\\svchost.exe\" and\n        process.thread.Ext.call_stack_summary == \"ntdll.dll|regsvc.dll|rpcrt4.dll|kernelbase.dll|ntdll.dll|kernel32.dll|ntdll.dll\")) or\n  \n  (event.category == \"file\" and file.Ext.header_bytes like \"72656766*\" and file.size >= 20000 and \n   process.thread.Ext.call_stack_summary like \"*advapi32.dll|Unbacked*\" and  \n   _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info: \"*advapi32.dll!RegSaveKey*\") and \n   _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info: \"Unbacked*\" and $entry.callsite_trailing_bytes : \"?*\"))\n  ) and \n  process.executable != null and\n  not (process.code_signature.subject_name == \"VS REVO GROUP OOD\" and process.code_signature.trusted == true) and\n  not process.executable : (\"?:\\\\Program Files\\\\Commvault\\\\ContentStore\\\\Base\\\\CLBackup.exe\",\n                            \"?:\\\\Program Files (x86)\\\\Commvault\\\\ContentStore\\\\Base\\\\CLBackup.exe\",\n                            \"?:\\\\Program Files\\\\VS Revo Group\\\\Revo Uninstaller Pro\\\\RevoUninPro.exe\", \n                            \"?:\\\\Program Files (x86)\\\\VS Revo Group\\\\Revo Uninstaller Pro\\\\RevoUninPro.exe\", \n                            \"?:\\\\Program Files (x86)\\\\IObit\\\\Advanced SystemCare\\\\ASC.exe\",\n                            \"?:\\\\Program Files\\\\IObit\\\\Advanced SystemCare\\\\ASC.exe\",\n                            \"?:\\\\Program Files\\\\Carbonite\\\\Replication\\\\DoubleTake.exe\", \n                            \"?:\\\\Program Files (x86)\\\\Carbonite\\\\Replication\\\\DoubleTake.exe\",\n                            \"C:\\\\Program Files\\\\Microsoft SQL Server\\\\*\\\\Setup Bootstrap\\\\Release\\\\x64\\\\setup*.exe\")\n"
  min_endpoint_version: "8.8.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1003
          name: OS Credential Dumping
          reference: "https://attack.mitre.org/techniques/T1003/"
          subtechnique:
            - id: T1003.002
              name: Security Account Manager
              reference: "https://attack.mitre.org/techniques/T1003/002/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "8.8.0"
