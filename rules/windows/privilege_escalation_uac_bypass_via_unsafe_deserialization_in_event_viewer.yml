id: df7e55c9-cd36-4e33-9e82-3a54b9c84495_1.0.30
type: security-rule
attributes:
  description: |
    Identifies attempts to bypass User Account Control (UAC) via Unsafe .Net Deserialization in Windows Event Viewer.
    Attackers bypass UAC to stealthily execute code with elevated permissions.
  rule_id: df7e55c9-cd36-4e33-9e82-3a54b9c84495
  license: Elastic License v2
  name: UAC Bypass via Unsafe Deserialization in Event Viewer
  os_list:
    - windows
  reference:
    - "https://twitter.com/orange_8361/status/1518970259868626944"
    - "https://github.com/CsEnox/EventViewer-UACBypass"
  version: "1.0.30"
  query: "file where event.action != \"deletion\" and file.name : \"RecentViews\" and\n file.path : \"?:\\\\Users\\\\*\\\\AppData\\\\*\\\\Microsoft\\\\Event Viewer\\\\RecentViews\" and\n process.executable != null and\n not process.executable :\n            (\"?:\\\\Windows\\\\System32\\\\mmc.exe\",\n             \"?:\\\\Windows\\\\SysWOW64\\\\mmc.exe\",\n             \"?:\\\\Windows\\\\System32\\\\svchost.exe\",\n             \"?:\\\\Windows\\\\Explorer.exe\",\n             \"?:\\\\Program Files\\\\Citrix\\\\User Profile Manager\\\\UserProfileManager.exe\",\n             \"?:\\\\ProgramData\\\\ForensiT\\\\Transwiz\\\\Deployment Files\\\\Transwiz.exe\",\n             \"?:\\\\Windows\\\\WinSxS\\\\*\\\\mmc.exe\",\n             \"?:\\\\Program Files\\\\*.exe\",\n             \"?:\\\\Program Files (x86)\\\\*.exe\",\n             \"?:\\\\Windows\\\\System32\\\\dllhost.exe\",\n             \"?:\\\\Windows\\\\System32\\\\taskhost.exe\") and\n not user.id : (\"S-1-5-18\", \"S-1-5-19\", \"S-1-5-20\") and \n not (process.code_signature.subject_name : \"ForensiT Limited\" and process.code_signature.trusted == true)\n"
  min_endpoint_version: "8.1.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1548
          name: Abuse Elevation Control Mechanism
          reference: "https://attack.mitre.org/techniques/T1548/"
          subtechnique:
            - id: T1548.002
              name: Bypass User Account Control
              reference: "https://attack.mitre.org/techniques/T1548/002/"
      tactic:
        id: TA0004
        name: Privilege Escalation
        reference: "https://attack.mitre.org/tactics/TA0004/"
  internal:
    min_endpoint_version: "8.1.0"
