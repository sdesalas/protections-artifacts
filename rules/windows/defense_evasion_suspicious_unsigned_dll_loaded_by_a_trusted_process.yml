id: "14fbbd38-b858-45fa-8bc5-02a7bfd295e6_1.0.21"
type: security-rule
attributes:
  description: |
    Identifies the load of an unsigned or untrusted DLL by a trusted binary followed by loading a networking DLL from
    unbacked memory region. This may indicate execution via DLL sideloading.
  rule_id: "14fbbd38-b858-45fa-8bc5-02a7bfd295e6"
  license: Elastic License v2
  name: Suspicious Unsigned DLL Loaded by a Trusted Process
  os_list:
    - windows
  reference:
    - "https://www.elastic.co/security-labs/upping-the-ante-detecting-in-memory-threats-with-kernel-call-stacks"
  version: "1.0.21"
  query: "sequence by process.entity_id with maxspan=5s\n[library where\n   (dll.Ext.relative_file_creation_time < 5000 or\n    dll.Ext.relative_file_name_modify_time < 5000 or\n    (dll.Ext.device.product_id : (\"Virtual DVD-ROM\", \"Virtual Disk\",\"USB *\") and not dll.path : \"C:\\\\*\")) and\n    process.code_signature.trusted == true and\n    not dll.code_signature.status : (\"trusted\", \"errorExpired\", \"errorCode_endpoint*\") and\n    dll.hash.sha256 != null and \n    not dll.hash.sha256 in (\"e99fec7f1f2fe16029b4dbe30a96325efd7265c9cc8672f60945ce943684442d\", \"a654a64f0fbd2c34fc2b22cb41e2bf4ac32bd15ae6620e6a4198beb5270790f6\") and\n    (process.thread.Ext.call_stack_summary : \"ntdll.dll*\" and not process.thread.Ext.call_stack_summary : \"*Unbacked*\") and\n    not dll.path : (\"?:\\\\Windows\\\\Installer\\\\*\",\n                   \"?:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\*\",\n                   \"?:\\\\Windows\\\\SysWOW64\\\\DriverStore\\\\FileRepository\\\\*\",\n                   \"?:\\\\Program Files\\\\*\",\n                   \"?:\\\\Program Files (x86)\\\\*\",\n                   \"?:\\\\Windows\\\\assembly\\\\*\") and\n   not process.executable :\n             (\"?:\\\\Program Files\\\\*.exe\", \"?:\\\\Program Files (x86)\\\\*.exe\", \"?:\\\\Windows\\\\Explorer.exe\",\n              \"?:\\\\Windows\\\\SysWOW64\\\\*\", \"?:\\\\Windows\\\\System32\\\\*\", \"?:\\\\Windows\\\\splwow64.exe\", \"?:\\\\Windows\\\\Microsoft.NET\\\\*\") and\n\n   /* DLL loaded from the process.executable current directory */\n   endswith~(substring(dll.path, 0, length(dll.path) - (length(dll.name) + 1)), substring(process.executable, 0, length(process.executable) - (length(process.name) + 1)))]\n[library where\n  dll.name : (\"ws2_32.dll\", \"wininet.dll\", \"winhttp.dll\") and\n  process.thread.Ext.call_stack_summary : \"ntdll.dll|kernelbase.dll|Unbacked\"]\n"
  min_endpoint_version: "8.7.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1574
          name: Hijack Execution Flow
          reference: "https://attack.mitre.org/techniques/T1574/"
          subtechnique:
            - id: T1574.001
              name: DLL
              reference: "https://attack.mitre.org/techniques/T1574/001/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.7.0"
