id: bf252955-4332-4179-870b-6f33745c48ce_1.0.10
type: security-rule
attributes:
  description: |
    Identifies the execution of a Windows script with potential obfuscated content. Adversaries may employ script
    obfuscation techniques to evade static detection methods.
  rule_id: bf252955-4332-4179-870b-6f33745c48ce
  license: Elastic License v2
  name: Execution via Obfuscated Windows Script
  os_list:
    - windows
  version: "1.0.10"
  query: "api where process.Ext.api.name == \"AmsiScanBuffer\" and process.executable != null and\n  process.name in~ (\"wscript.exe\", \"mshta.exe\") and\n  process.Ext.api.parameters.buffer :\n                    (\"*var _0x*;var _0x*;var _0x*\",\n                     \"*function*_0x*_0x*_0x*\",\n                     \"*new ActiveXObject(_0x*\",\n                     \"*function*.apply(this,arguments)*\",\n                     \"*function _0x*\",\n                     \"*function*.charCodeAt(*.charCodeAt(*\",\n                     \"*function*.split(*.split(*.split(*\",\n                     \"function *.fromCharCode*\",\n                     \"*String.fromCharCode(*eval(*\",\n                     \"*String.fromCharCode(*String.fromCharCode(*\",\n                     \"*String.fromCharCode(*.replace(*\",\n                     \"*var *=this[*+*+*+*var *=this[*+*+*+*var *=this[*+*+*\",\n                     \"*function*.charCodeAt(*.charCodeAt(*.charCodeAt(*\",\n                     \"*{return eval(Ox$(*{return eval(Ox$(*{return eval(Ox$(*\",\n                     \"*function *String.fromCharCode(*.Run(*\",\n                     \"*String.fromCharCode(*+*+*+*+*+*+*+*+*\",\n                     \"*.charAt(*.charAt(*.charAt(*.charAt(*.charAt(*.charAt(*.charAt(*\",\n                     \"*this[*+*+*+*+*+*+*]*\",\n                     \"*TVqQAAMAAAAEAAAA*\",\n                     \"*\\\\x??\\\\x??\\\\x??\\\\x??\\\\x??\\\\x??\\\\x??\\\\x??\\\\*\",\n                     \"*bin.base64*\",\n                     \"*replace(split*\",\n                     \"*Chr(*Chr(*Chr(*\",\n                     \"*Replace(Replace(*\") and\n  not process.Ext.api.parameters.content_name :\n                              (\"?:\\\\Program Files\\\\*\",\n                               \"?:\\\\Program Files (x86)\\\\*\",\n                               \"D:\\\\program\\\\xml_fetch_Cavagent.vbs\") and\n  not (process.name : \"cscript.exe\" and  process.Ext.api.parameters.content_name : \"C:\\\\WINDOWS\\\\TEMP\\\\.eset-*\\\\uacinstall.vbs\") and \n  not process.executable :\n                   (\"C:\\\\Program Files (x86)\\\\Tanium\\\\Tanium Client\\\\TaniumClient.exe\",\n                    \"C:\\\\Program Files\\\\Xerox\\\\XeroxPrintExperience\\\\XeroxPrintExperience\\\\XeroxPrintExperience.Exe\") and\n  not (process.code_signature.trusted == true and process.code_signature.subject_name in (\"Altium LLC\", \"Lansweeper NV\", \"SAP SE\", \"Tyler Technologies, Inc.\")) and\n  not (process.Ext.api.parameters.buffer : \"*kkotari: pyenv-lib.vbs proxy*\" and\n       process.Ext.api.parameters.content_name : \"C:\\\\Users\\\\*\\\\.pyenv\\\\pyenv-win\\\\libexec\\\\pyenv.vbs\") and \n  not process.parent.executable :\n                     (\"C:\\\\Program Files (x86)\\\\checkmk\\\\service\\\\check_mk_agent.exe\",\n                      \"C:\\\\Windows\\\\_ScriptingFramework\\\\Modul\\\\Engine.exe\", \n                      \"C:\\\\Program Files (x86)\\\\Bentley\\\\MicroStation V8i (SELECTseries)\\\\MicroStation\\\\ustation.exe\", \n                      \"C:\\\\Program Files\\\\Bentley\\\\*.exe\",\n                      \"C:\\\\Program Files (x86)\\\\PCMatic\\\\PCPitstopScheduleService.exe\",\n                      \"C:\\\\Program Files\\\\Bentley\\\\Engineering\\\\STAAD.Pro *\\\\STAAD\\\\Bentley.Staad.exe\",\n                      \"C:\\\\Program Files (x86)\\\\Bentley\\\\MapStandalone V8i\\\\MapStandalone\\\\MapStandalone.exe\",\n                      \"C:\\\\Program Files\\\\Common Files\\\\Bentley Shared\\\\CONNECTION Client\\\\Bentley.Connect.Client.exe\",\n                      \"C:\\\\Program Files (x86)\\\\Bentley\\\\PowerInRoads V8i\\\\PowerInRoads\\\\PowerInRoads.exe\")\n"
  min_endpoint_version: "8.16.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
      tree: true
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.005
              name: Visual Basic
              reference: "https://attack.mitre.org/techniques/T1059/005/"
            - id: T1059.007
              name: JavaScript
              reference: "https://attack.mitre.org/techniques/T1059/007/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1027
          name: Obfuscated Files or Information
          reference: "https://attack.mitre.org/techniques/T1027/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.16.0"
