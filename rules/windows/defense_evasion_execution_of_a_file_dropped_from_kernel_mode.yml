id: "1c618d05-2cac-4979-9c85-6320fc317177_1.0.5"
type: security-rule
attributes:
  description: |
    Identifies attempt to load an untrusted executable dropped by a Kernel mode code. Adversaries may execute malicious code
    in user mode via existing malicious Kernel drivers.
  rule_id: "1c618d05-2cac-4979-9c85-6320fc317177"
  license: Elastic License v2
  name: Execution of a File Dropped from Kernel Mode
  os_list:
    - windows
  version: "1.0.5"
  query: "sequence with maxspan=5m\n  [file where event.action == \"creation\" and\n   /* library dropped via System Virtual Process - Kernel mode code */\n   process.pid == 4 and user.id : \"S-1-5-18\" and\n   (file.extension : (\"exe\", \"dll\") or file.Ext.header_bytes : \"4d5a*\")] by file.path \n   [library where process.pid != 4 and not dll.code_signature.status : \"trusted\" and process.executable != null and\n    not dll.hash.sha256 : \"6957be7503737453c3feab129d4924fca55e7b0c026ec878d0d040765002732c\"] by dll.path\n"
  min_endpoint_version: "8.4.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 1
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1014
          name: Rootkit
          reference: "https://attack.mitre.org/techniques/T1014/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.4.0"
