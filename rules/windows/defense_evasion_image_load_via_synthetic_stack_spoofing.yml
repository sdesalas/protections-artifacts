id: d8c57cb7-bab6-41fa-9063-dcc8793c3955_1.0.27
type: security-rule
attributes:
  description: |
    Detects attempts to load a networking module from a potentially altered call stack in order to conceal the true source
    of the call.
  rule_id: d8c57cb7-bab6-41fa-9063-dcc8793c3955
  license: Elastic License v2
  name: Image Load via Synthetic Stack Spoofing
  os_list:
    - windows
  reference:
    - "https://www.elastic.co/security-labs/doubling-down-etw-callstacks"
  version: "1.0.27"
  query: "library where\ndll.name : (\"wininet.dll\", \"ws2_32.dll\", \"dnsapi.dll\", \"winhttp.dll\", \"clr.dll\", \"netapi32.dll\",\n                \"mscorwks.dll\", \"System.*.dll\", \"mscorlib*.dll\", \"Microsoft.PowerShell.Security*.dll\",\n                \"Microsoft.PowerShell.ConsoleHost*.dll\", \"wmiutils.dll\", \"fastprox.dll\", \"wbemprox.dll\",\n                \"vaultcli.dll\", \"taskschd.dll\", \"dsquery.dll\", \"mstscax.dll\", \"ntdll.dll\", \"wldap32.dll\",\n                \"wtsapi32.dll\", \"psapi.dll\") and\nprocess.thread.Ext.call_stack_summary like \"ntdll.dll|kernel32.dll*\" and\n \n  /* JMP gadget in kernel32 */\n  _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info regex~ \"\"\".*system32\\\\kernel32.dll!(A|[C-Z]).+\"\"\") and\n  _arraysearch(process.thread.Ext.call_stack, $entry, $entry.symbol_info : \"?:\\\\Windows\\\\System32\\\\ntdll.dll!LdrLoadDll*\") and\n   not process.thread.Ext.call_stack_summary like \"ntdll.dll|kernel32.dll|mso40uiwin32client.dll|mso98win32client.dll|mso.dll|*\" and\n   not  _arraysearch(process.thread.Ext.call_stack, $entry, \n                   $entry.symbol_info : (\"*kernel32.dll!CreateProcess*\", \"*kernel32.dll!GetDateFormatWWorker*\", \n                                         \"*kernel32.dll!WerpLaunchAeDebug*\", \"*kernel32.dll!BaseDllReadWriteIniFile*\", \n                                         \"*kernel32.dll!GlobalReAlloc*\", \"*kernel32.dll!CreateToolhelp32Snapshot*\", \n                                         \"*kernel32.dll!Wow64SetThreadContext*\", \"*kernel32.dll!ExitProcess*\", \"*kernel32.dll!WinExec*\",\n                                         \"*kernel32.dll!CallbackMayRunLong*\", \"*kernel32.dll!BaseGenerateAppCompatData*\", \n                                         \"*mpclient.dll!MpUpdateServicePingRpc*\", \"*chrome.exe!IsSandboxedProcess*\",\n                                         \"*kernel32.dll!CreateActCtxWWorker*\", \"*kernel32.dll!Sleep*\",\n                                         \"*kernel32.dll!BasepCheckAppCompat*\", \"*kernel32.dll!AddAtomW*\",\n                                         \"*\\\\kernel32.dll!lstrlenW*\", \"*\\\\kernel32.dll!FindActCtxSectionGuidWorker*\",\n                                         \"*\\\\kernel32.dll!OpenPrivateNamespaceW*\", \"*\\\\kernel32.dll!DeactivateActCtxWorke*\",\n                                         \"c:\\\\windows\\\\system32\\\\kernel32.dll!QuirkIsEnabled3Worker*\",\n                                         \"C:\\\\Windows\\\\System32\\\\kernel32.dll!GetQueuedCompletionStatus*\",\n                                         \"*\\\\ntdll.dll!RtlFormatMessageEx*\", \"*kernel32.dll!GetQueuedCompletionStatus*\"))\n"
  min_endpoint_version: "8.10.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1036
          name: Masquerading
          reference: "https://attack.mitre.org/techniques/T1036/"
        - id: T1055
          name: Process Injection
          reference: "https://attack.mitre.org/techniques/T1055/"
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
  internal:
    min_endpoint_version: "8.10.0"
