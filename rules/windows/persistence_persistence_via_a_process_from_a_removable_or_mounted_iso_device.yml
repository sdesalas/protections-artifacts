id: "0cdf1d24-b1c3-4952-a400-5ba3c1491087_1.0.22"
type: security-rule
attributes:
  description: |
    Identifies a process running from a mounted ISO or USB device writing to commonly abused persistence locations (registry
    run keys and startup folder). Adversaries may use this technique to maintain persistence on an endpoint.
  rule_id: "0cdf1d24-b1c3-4952-a400-5ba3c1491087"
  license: Elastic License v2
  name: Persistence via a Process from a Removable or Mounted ISO Device
  os_list:
    - windows
  reference:
    - "https://docs.microsoft.com/en-us/previous-versions/technet-magazine/ee851671(v=msdn.10)"
  version: "1.0.22"
  query: "sequence by process.entity_id with maxspan=5m\n [process where event.action == \"start\" and\n  (\n   (process.Ext.device.product_id : (\"Virtual DVD-ROM\", \"Virtual Disk\", \"USB *\") and not process.executable : \"C:\\\\*\") or\n\n   descendant of [process where event.action == \"start\" and\n   process.Ext.device.product_id : (\"Virtual DVD-ROM\", \"Virtual Disk\", \"USB *\") and not process.executable : \"C:\\\\*\"]\n   ) and\n   not process.executable :\n            (\"?:\\\\Program Files\\\\Microsoft Office\\\\root\\\\Integration\\\\Addons\\\\OneDriveSetup.exe\",\n             \"?:\\\\Program Files (x86)\\\\Microsoft Office\\\\root\\\\Integration\\\\Addons\\\\OneDriveSetup.exe\",\n             \"?:\\\\Program Files (x86)\\\\Microsoft OneDrive\\\\*\\\\FileSyncConfig.exe\",\n             \"?:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome.exe\",\n             \"C:\\\\$WINDOWS.~BT\\\\Sources\\\\SetupHost.exe\") and\n   not (process.code_signature.subject_name :\n                              (\"Global Security Center\", \"Fabrice PARISOT\", \"Veeam Software Group GmbH\", \"Esko Software bv\",\n                               \"Google LLC\", \"Sage Software Inc.\", \"Schneider Electric\") and\n        process.code_signature.trusted == true) and\n   not process.hash.sha256 : \"6decdc0e295f2246d684480c10266c067cbd60c03af702505b7b3d045e81df18\"\n ]\n [any where event.category : (\"registry\", \"file\") and event.action != \"deletion\" and\n   (\n    (registry.data.strings != null and\n     registry.path :\n        (\"H*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\*\", \n         \"H*\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\*\", \n         \"H*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run\\\\*\", \n         \"H*\\\\Software\\\\WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run\\\\*\",\n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Windows\\\\Load\", \n         \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\Shell\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\Shell\", \n         \"HKEY_USERS\\\\*\\\\Environment\\\\UserInitMprLogonScript\", \n         \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Winlogon\\\\Userinit\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\Shell\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts\\\\Logoff\\\\Script\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts\\\\Logon\\\\Script\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts\\\\Shutdown\\\\Script\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\\\\System\\\\Scripts\\\\Startup\\\\Script\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Ctf\\\\LangBarAddin\\\\*\\\\FilePath\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Internet Explorer\\\\Extensions\\\\*\\\\Exec\", \n         \"HKEY_USERS\\\\*\\\\SOFTWARE\\\\Microsoft\\\\Command Processor\\\\Autorun\", \n         \"HKEY_USERS\\\\S-1-5-*_Classes\\\\CLSID\\\\*\\\\InprocServer32\\\\\",\n         \"HKEY_USERS\\\\S-1-5-*\\\\Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\RunOnce\\\\*\")) or\n    (file.name != null and file.path : \"?:\\\\*\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\\*\" and\n     not file.name : \"dektop.ini\")\n   )]\n"
  min_endpoint_version: "8.4.0"
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  optional_actions:
    - action: rollback
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1091
          name: Replication Through Removable Media
          reference: "https://attack.mitre.org/techniques/T1091/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1547
          name: Boot or Logon Autostart Execution
          reference: "https://attack.mitre.org/techniques/T1547/"
          subtechnique:
            - id: T1547.001
              name: Registry Run Keys / Startup Folder
              reference: "https://attack.mitre.org/techniques/T1547/001/"
      tactic:
        id: TA0003
        name: Persistence
        reference: "https://attack.mitre.org/tactics/TA0003/"
  internal:
    min_endpoint_version: "8.4.0"
