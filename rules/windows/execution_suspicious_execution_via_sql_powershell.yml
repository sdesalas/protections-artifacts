id: d111e88f-c5d2-41b4-b294-1f9cfea93b6c_1.0.4
type: security-rule
attributes:
  description: Detects attempts to execute suspicious powershell commands using the Microsoft SQL Powershell Helper Tools.
  rule_id: d111e88f-c5d2-41b4-b294-1f9cfea93b6c
  license: Elastic License v2
  name: Suspicious Execution via SQL PowerShell
  os_list:
    - windows
  reference:
    - "https://lolbas-project.github.io/lolbas/OtherMSBinaries/Sqltoolsps/"
  version: "1.0.4"
  query: "process where event.action == \"start\" and \n process.name : (\"SQLToolsPS.exe\", \"sqlps.exe\") and \n process.args : (\"-e\", \"-enc\", \"-ep\", \"-encoded\", \"*;iex\", \"*start-process*\", \"*WebClient*\", \n                \"*DownloadFile*\", \"*DownloadString*\", \"*BitsTransfer*\", \"*Reflection.Assembly*\")\n"
  min_endpoint_version: "7.16.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.001
              name: PowerShell
              reference: "https://attack.mitre.org/techniques/T1059/001/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "7.16.0"
