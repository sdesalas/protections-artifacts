id: "539488cc-baf9-465f-9700-f978b93b3f62_1.0.3"
type: security-rule
attributes:
  description: |
    Detects when Node or NPM is used to install a package or packages using options to hide the installation using the
    following options: "--no-warnings", "--no-progress", and "--loglevel silent". Malicious packages will install required
    dependencies in order to function and will use these options in order to hide it from the user.
  rule_id: "539488cc-baf9-465f-9700-f978b93b3f62"
  license: Elastic License v2
  name: Silent NPM Package Install Command
  os_list:
    - linux
    - macos
  reference:
    - "https://jp.security.ntt/tech_blog/contagious-interview-ottercookie"
  version: "1.0.3"
  query: "process where event.type == \"start\" and process.name in (\"node\", \"npm\", \"npx\") and \n process.args in (\"install\", \"i\", \"in\", \"ins\", \"inst\", \"instal\", \"add\", \"isnt\", \"isnta\", \"isntal\", \"isntall\") and \n process.args == \"--no-save\" and \n process.args == \"--no-progress\" and \n ((process.args == \"--loglevel\" and process.args == \"silent\") or \n  (process.args in (\"-s\", \"--silent\")))\n"
  min_endpoint_version: "8.11.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.entity_id
      state: 0
    - action: kill_process
      field: process.parent.entity_id
      state: 0
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1059
          name: Command and Scripting Interpreter
          reference: "https://attack.mitre.org/techniques/T1059/"
          subtechnique:
            - id: T1059.003
              name: Windows Command Shell
              reference: "https://attack.mitre.org/techniques/T1059/003/"
            - id: T1059.004
              name: Unix Shell
              reference: "https://attack.mitre.org/techniques/T1059/004/"
      tactic:
        id: TA0002
        name: Execution
        reference: "https://attack.mitre.org/tactics/TA0002/"
  internal:
    min_endpoint_version: "8.11.0"
