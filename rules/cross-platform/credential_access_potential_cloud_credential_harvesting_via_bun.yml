id: a8c3e891-4f2d-4b7e-9c1a-6e5d8b2f0a43_1.0.4
type: security-rule
attributes:
  description: |
    Detects execution of common cloud and DevOps CLI commands used to print or export access tokens, often as a child of a
    Bun process. This pattern may indicate supply chain compromise where a malicious npm or Bun package invokes host CLIs to
    harvest cloud credentials during install or runtime scripts.
  rule_id: a8c3e891-4f2d-4b7e-9c1a-6e5d8b2f0a43
  license: Elastic License v2
  name: Potential Cloud Credential Harvesting via Bun
  os_list:
    - linux
    - windows
  reference:
    - "https://futuresearch.ai/blog/litellm-pypi-supply-chain-attack/"
    - "https://socket.dev/blog/sandworm-mode-npm-worm-ai-toolchain-poisoning"
    - "https://securelist.com/shai-hulud-2-0/118214/"
  version: "1.0.4"
  query: "process where event.type == \"start\" and event.action in (\"start\", \"exec\") and\nprocess.parent.name : (\"bun\", \"bun.exe\") and  process.parent.command_line : (\"*.js\", \"*.mjs\", \"*.ts\") and \nprocess.command_line like~ (\n  \"*gcloud config config-helper --format json*\",\n  \"*gh auth token*\",\n  \"*az account get-access-token*\",\n  \"*kubectl*get*secret*\"\n) and \nnot process.args in (\"az account get-access-token --output json --resource https://database.windows.net\", \"az account get-access-token --output json --resource https://storage.azure.com\", \"https://storage.azure.com\")\n"
  min_endpoint_version: "7.15.0"
  optional_actions: []
  actions:
    - action: kill_process
      field: process.parent.entity_id
      state: 0
      tree: true
  threat:
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1195
          name: Supply Chain Compromise
          reference: "https://attack.mitre.org/techniques/T1195/"
          subtechnique:
            - id: T1195.001
              name: Compromise Software Dependencies and Development Tools
              reference: "https://attack.mitre.org/techniques/T1195/001/"
      tactic:
        id: TA0001
        name: Initial Access
        reference: "https://attack.mitre.org/tactics/TA0001/"
    - framework: "MITRE ATT&CK"
      technique:
        - id: T1528
          name: Steal Application Access Token
          reference: "https://attack.mitre.org/techniques/T1528/"
        - id: T1552
          name: Unsecured Credentials
          reference: "https://attack.mitre.org/techniques/T1552/"
          subtechnique:
            - id: T1552.001
              name: Credentials In Files
              reference: "https://attack.mitre.org/techniques/T1552/001/"
      tactic:
        id: TA0006
        name: Credential Access
        reference: "https://attack.mitre.org/tactics/TA0006/"
  internal:
    min_endpoint_version: "7.15.0"
